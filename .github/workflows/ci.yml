# CI - Continuous Integration for the zlib-rs crate
#
# Pure-Cargo pipeline for the C-to-Rust migration of zlib 1.3.2.1 into the
# `zlib-rs` crate (library `zlib_rs`; edition 2024; MSRV 1.85.0;
# crate-type = ["lib", "cdylib", "staticlib"]).
#
# This workflow mirrors the SHAPE of the repository's prior matrix-style CI
# idiom - per-entry `name`, `strategy.fail-fast: false`, and a failure-only
# artifact upload - while replacing every native-toolchain step with its Cargo
# equivalent. The Cargo feature matrix is the Rust analogue of the old C
# preprocessor conditionals (for example GZIP and the solo/core-only build):
# each matrix row exercises a distinct feature set.
#
# Jobs:
#   build-test    build (debug + release) and test across the feature matrix
#   no-std-tests  no_std test suite (blocking gate)
#   lint          rustfmt + clippy (-D warnings)
#   msrv          build + check on the pinned MSRV toolchain (1.85.0)
#   benches       compile-only check of the criterion benchmarks
#   unsafe-boundary  blocking guard that `unsafe` stays inside src/ffi/** and the
#                 src/lib.rs no_std runtime block (User Constraint 3)
#   build-script-tests  build.rs compiled as its own test binary, plus the
#                 generated-table reproducibility and big-endian checks
#   c-abi-linkage  the emitted cdylib/staticlib linked, dynamically linked and
#                 dlopen'd by a C consumer on every std-off feature row
#   cross-targets  cross TYPE-CHECK ONLY (nothing is executed) on the aarch64,
#                 32-bit i686 and big-endian s390x Linux triples (gap D3)
#   bare-metal-no-std  library build for thumbv7em-none-eabihf: the only
#                 configuration in which `mod no_std_support` compiles (gap D10)
#   package-verify  `cargo package --list` checked against Cargo.toml's
#                 `exclude` contract, plus the packaging build AND the unpacked
#                 archive's own `cargo test` run, so the published crate is
#                 proven self-testable and not merely self-buildable (gap D12)
#
# Action versions are standardized on @v4 across this repository's Cargo CI.
# No native toolchain is required: the `flate2` dev-dependency resolves to its
# pure-Rust miniz_oxide backend, so the interop tests compile without any
# native library dependency.
#
# PLATFORM COVERAGE - WHAT EACH NON-UBUNTU ROW ACTUALLY BUYS
# ==========================================================
# Until the rows below were added, every job in this file ran on
# `ubuntu-latest` / x86_64 / little-endian, so the crate's portability claims
# rested on code that had never been compiled. These are the platform-divergent
# sites, each read out of the tree at the line cited, and each is why exactly
# one row exists:
#
#   * `src/ffi/gz.rs` `gzopen_w` - `#[cfg(windows)] #[unsafe(no_mangle)] pub
#     unsafe extern "C" fn gzopen_w(*const u16, *const c_char) -> gzFile`. The
#     ONLY platform-gated, ABI-visible exported symbol in the crate, mirroring
#     C's `#if defined(_WIN32) && !defined(Z_SOLO)` in `zlib.h`. The
#     `windows-latest` row is the only place it is ever compiled, and keeping
#     the public surface whole is what the migration's public-interface
#     preservation directive requires.
#   * `src/ffi/gz.rs` and `src/gz/**` `#[cfg(not(unix))]` arms - five of them,
#     one an ABI-visible `gzdopen` that deliberately fails on non-unix and pairs
#     with the `#[cfg(unix)]` definition of the same symbol. No pre-existing job
#     compiled any of them.
#   * `src/gz/open.rs` `O_NONBLOCK` - `#[cfg(unix)] const O_NONBLOCK: i32 = if
#     cfg!(any(target_os = "linux", target_os = "android")) { 0o4000 } else
#     { 0o0004 };`. Written as a `cfg!()` EXPRESSION, so both arms type-check on
#     every unix target, but only a BSD-family host selects `0o0004`. That makes
#     `macos-latest` value coverage, not merely compile coverage, and it needs
#     the default feature set because the constant lives behind `gz-io`.
#   * `src/util/mod.rs` `OS_CODE` - a `cfg_if!` cascade selecting 10 on Windows,
#     19 on Apple and 3 elsewhere, guarded by a const-evaluated cross-check in
#     the same module. `src/deflate/mod.rs` imports it and writes it into the
#     RFC 1952 header, so this is live behaviour on those two runners, not dead
#     code. See the GZIP `OS` BYTE note below for how the byte-identity gate
#     asserts it per platform.
#   * `src/lib.rs` `MIN_ALIGN` - 16 on 64-bit, 8 on 32-bit, inside
#     `mod no_std_support`. The 8 arm needs a 32-bit target AND the full no_std
#     predicate, so the `bare-metal-no-std` job is the only place it compiles.
#   * `src/checksum/crc32.rs` - selects between the little- and big-endian
#     generated CRC tables with `cfg!(target_endian = "little")` and consumes
#     `CRC_BIG_TABLE` / `CRC_BRAID_BIG_TABLE` in the big-endian arm. The
#     `build-script-tests` job already checks `--lib --profile test` on s390x;
#     `cross-targets` extends the same triple to `--all-targets`.
#
# NATIVE vs CROSS - two different mechanisms, deliberately not conflated:
#
#   * A NATIVE row (`windows-latest`, `macos-latest`) needs only its `os:`
#     value. It builds for the runner's own triple and RUNS the test suite.
#   * A CROSS row installs the triple through the `targets:` input of
#     `dtolnay/rust-toolchain` - never `rustup target add`, and never
#     `rust-toolchain.toml`, which deliberately omits a `targets` key so a
#     contributor's first build cannot be broken by a target their platform
#     cannot install. `cargo check` does not link, so no cross linker, emulator
#     or apt step is required; in exchange a cross row TYPE-CHECKS ONLY and its
#     name says so. A check row is worth having, but it is not test coverage and
#     is never labelled as if it were.
#
# THE GZIP `OS` BYTE ON THE WINDOWS AND macOS ROWS - READ BEFORE "FIXING"
# ---------------------------------------------------------------------------
# `tests/interop.rs`'s `BI_VECTORS_GZIP` bakes 75 reference gzip members whose
# `OS` field (byte 9) is literally `03`, because they were baked on a Unix host.
# `OS_CODE` is 10 on Windows and 19 on Apple, so a naive comparison of that byte
# fails on these two runners - and it did, until the fixture consumer was taught
# the difference. THE LIBRARY WAS ALWAYS CORRECT: byte-identity is defined
# against the reference C library built for the SAME target, and C's `zutil.h`
# selects 10 and 19 there too, so emitting them is parity rather than a
# regression.
#
# The resolution is in `tests/interop.rs`, where the defect was: `check_all`
# retargets byte 9 of the EXPECTED vector to `HOST_GZIP_OS_CODE` - the value
# reference zlib writes on the target being compiled, derived there from raw
# `#[cfg]` attributes independently of `zlib_rs::util::OS_CODE` - and then still
# compares every byte, byte 9 included, with a bare `assert_eq!`. Note what this
# is NOT: it is not `normalise_gzip_os`, which ERASES byte 9 from the produced
# stream and is used only by the platform-neutral tables. Retargeting the
# expectation keeps a positive assertion on that byte on every host, so these
# rows gain coverage rather than losing it. On a Unix host the retargeting is a
# no-op and the 75 rows are compared exactly as baked.
#
# Three tests in `tests/interop.rs::byte_identity` hold that contract, and all
# three run on every row including `ubuntu-latest`, so a regression here is
# caught before a Windows or macOS runner ever sees it:
# `retargeting_the_gzip_os_byte_touches_only_that_byte`,
# `the_gzip_vector_family_holds_for_every_platform_os_code` (replays all 75 rows
# against all three `OS_CODE` values from a single host, so the Windows and
# Apple behaviour is proved rather than assumed), and
# `the_host_gzip_os_code_agrees_with_the_library_cascade`.
#
# So these rows are expected to be GREEN, and they remain deliberately NOT
# feature-scoped, `if:`-guarded or filtered: a platform-specific failure here is
# a real finding, and scoping around one would delete the signal. Do not add
# `test: false` to them - that would silently drop the only execution coverage
# `gzopen_w`, the `cfg(not(unix))` arms and `O_NONBLOCK`'s BSD value ever get.
#
# Also surfaced by the Windows rows and left to their owners: `src/gz/mod.rs`
# and `src/gz/open.rs` emit three dead-code warnings on the Windows targets
# (`validate_mode` and `state::GzFile` are unreachable there). They are
# warnings, not errors, so they do not turn a row red; no job in this file
# promotes warnings to errors outside `lint`, which is ubuntu-only.
#
# TOOLCHAIN SELECTION - EVERY JOB SAYS WHICH COMPILER IT MEANS, TWICE
# ==================================================================
# `rust-toolchain.toml` at the repository root pins `channel = "1.85.0"` (the
# MSRV floor) so that a contributor's FIRST local build exercises the declared
# MSRV instead of whatever stable they happen to have installed.
#
# That pin is a rustup DIRECTORY-FILE override at precedence rank 4, and it
# outranks `rustup default` at rank 5 - which is exactly what
# `dtolnay/rust-toolchain` sets. The action runs
# `rustup toolchain install <ref> --profile minimal --no-self-update` followed by
# `rustup default <ref>`; it does NOT export `RUSTUP_TOOLCHAIN`. So INSTALLING a
# toolchain is not the same as SELECTING it: installing `@stable` leaves a bare
# `cargo build` in this repository resolving to 1.85.0. Measured locally, from
# this repository root:
#
#     rustup default                -> stable-x86_64-unknown-linux-gnu
#     rustup show active-toolchain  -> 1.85.0-x86_64-unknown-linux-gnu
#                                     (overridden by '.../rust-toolchain.toml')
#
# Rank 4 beating rank 5 is observable, not theoretical. Left unaddressed it
# silently demotes `build-test`, `no-std-tests`, `lint`, `benches`,
# `build-script-tests`, and `unsafe-boundary` from current-stable coverage to
# MSRV coverage, duplicating the `msrv` job and leaving current stable untested -
# and `lint` would gate on a clippy release this project does not gate on.
#
# Every job below therefore states its intent TWICE, and the two can never
# disagree because they name the same channel:
#
#   1. A job-level `env: RUSTUP_TOOLCHAIN` (rank 2). This is what reaches NESTED
#      cargo invocations - a subcommand that shells out to `cargo` inherits it -
#      so a step added later cannot quietly fall back to the pin, and it governs
#      the `rustup` and bare-`rustc` calls that carry no `+toolchain` shorthand.
#   2. A `+stable` / `+1.85.0` shorthand on every `cargo` and `rustc` invocation
#      (rank 1, the highest precedence there is). Rank 1 wins over the toolchain
#      file, over any directory override, and over `RUSTUP_TOOLCHAIN` itself, and
#      it is visible in the CI log right next to the command it governs.
#
# Keep both in step with the `@<ref>` the job installs: `@stable` -> `stable` /
# `+stable`, `@1.85.0` -> `1.85.0` / `+1.85.0`.
#
# Each job then ASSERTS the toolchain it got before doing any work, so a future
# change to the pin, the action, or rustup's precedence rules fails loudly
# instead of silently changing what is being tested. Those verification steps
# deliberately invoke BARE `rustc` and `rustup` - never `rustc +stable` - because
# their whole purpose is to observe the AMBIENT resolution that rank 2 produces.
# Prefixing them would make the assertion vacuous. Do NOT "simplify" this by
# deleting the pin from `rust-toolchain.toml` - that reopens the local/CI
# asymmetry the pin exists to close. The rationale is recorded once more, in the
# "VERSION RESOLUTION" section of `rust-toolchain.toml`.
name: CI
on: [push, pull_request]
jobs:
  # Primary build + test job. The `matrix.include` list enumerates the feature
  # combinations that stand in for the old C preprocessor build variants.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    # `rust-toolchain.toml` pins `channel = "1.85.0"` for local builds. A rustup
    # toolchain FILE is overridden by the `RUSTUP_TOOLCHAIN` environment
    # variable, so this job must set it explicitly: installing a toolchain with
    # `dtolnay/rust-toolchain@<channel>` does NOT change which toolchain an
    # unqualified `cargo` resolves to. Without this, every step below would run
    # on 1.85.0 regardless of the label above.
    env:
      RUSTUP_TOOLCHAIN: stable
    # REQUIRED once this matrix stopped being Linux-only. GitHub's default shell
    # for a `run:` step is `bash` on Linux and macOS but `pwsh` on Windows, and
    # the toolchain-verification step below is a bash script - `set -euo
    # pipefail`, `case`/`esac`, `$(...)`. Under `pwsh` it would fail on its first
    # line, on a row whose whole purpose is to compile `gzopen_w`, and the
    # failure would look like a platform defect instead of a shell mismatch.
    # Pinning one shell for the job keeps every row running the SAME script.
    # `bash` is available on the Windows runners (the Git for Windows build) and
    # is already the default on the other two, so no step's text changes. The one
    # nuance: an explicit `shell: bash` adds `-o pipefail`, which is inert for
    # every step here (each is a single command, and the verification step sets
    # `pipefail` itself) and strictly safer for any step added later.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default feature set: std + gzip + gz-io + simd.
          - name: Default features
            os: ubuntu-latest
            features: ''
            test: true
          # Every feature turned on at once.
          - name: All features
            os: ubuntu-latest
            features: '--all-features'
            test: true
          # gzip framing + gz file-I/O layer on top of std.
          - name: gzip + gz-io
            os: ubuntu-latest
            features: '--no-default-features --features std,gzip,gz-io'
            test: true
          # SIMD-accelerated CRC-32 hot path (pulls in crc32fast).
          - name: simd
            os: ubuntu-latest
            features: '--no-default-features --features std,gzip,gz-io,simd'
            test: true
          # Core-only (no_std) LIBRARY build. The library compiles cleanly with
          # no default features; the no_std test suite runs (and passes) in the
          # dedicated `no-std-tests` job below, hence `test: false` here.
          - name: no_std library (build only)
            os: ubuntu-latest
            features: '--no-default-features'
            test: false
          # ---------------------------------------------------------------
          # Platform rows (gap D3). These are ADDITIVE to the feature rows
          # above, not a replacement for them: `runs-on: ${{ matrix.os }}`
          # already carried the platform axis, so every row above keeps its
          # exact feature set and only the host changes here. Both rows are
          # NATIVE - a GitHub-hosted runner building for its own triple - so
          # they need nothing beyond `os:` and they run the real suite.
          #
          # DEFAULT features, deliberately, for two independent reasons.
          # First, `--all-features` turns on the opt-in `c-oracle` feature,
          # whose harness shells out to a gcc-flavoured recipe
          # (`-D_LARGEFILE64_SOURCE=1 -DHAVE_UNISTD_H`, then `ar rcs`); on a
          # runner that ships MSVC or Apple clang a compiler IS found and the
          # recipe is the wrong dialect. Second, the platform-divergent code
          # these rows exist to reach - `gzopen_w`, the `cfg(not(unix))` arms,
          # `O_NONBLOCK`'s BSD value - all sits behind `gz-io`, which the
          # default set enables.
          #
          # Every row `name:` in this matrix must stay UNIQUE: the failure-only
          # upload step below names its artifact `${{ matrix.name }} (ci)`, and
          # `actions/upload-artifact@v4` rejects a duplicate artifact name
          # within a run. With `fail-fast: false` above, several rows can and do
          # fail at once, so a collision would mask the real failure with a 409.
          #
          # Both rows run the real suite (`test: true`) and are expected to pass.
          # See "THE GZIP `OS` BYTE ON THE WINDOWS AND macOS ROWS" in the header
          # for the one byte that legitimately differs per host and how
          # `tests/interop.rs` asserts it per platform instead of assuming Unix.
          # ---------------------------------------------------------------
          # Windows/MSVC. The only runner that compiles `gzopen_w` - the sole
          # platform-gated exported C symbol - and the five `cfg(not(unix))`
          # arms, one of which is an ABI-visible `gzdopen` with different
          # behaviour from its unix twin.
          - name: Windows x86_64 (native, default features)
            os: windows-latest
            features: ''
            test: true
          # macOS on Apple silicon: `macos-latest` is aarch64, so this single
          # row is both the macOS and the native aarch64 coverage, and unlike a
          # cross row it EXECUTES. It is also the only place `O_NONBLOCK` takes
          # its `0o0004` BSD value and the only place `OS_CODE` is 19.
          - name: macOS aarch64 (native, default features)
            os: macos-latest
            features: ''
            test: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Build (debug)
      run: cargo +stable build --verbose ${{ matrix.features }}
    - name: Build (release)
      run: cargo +stable build --release --verbose ${{ matrix.features }}
    - name: Test
      if: ${{ matrix.test }}
      run: cargo +stable test --verbose ${{ matrix.features }}
    # The SHIPPED profile, tested. `[profile.release]` sets `opt-level = 3` and
    # `codegen-units = 1`, neither of which applies to the debug test run above,
    # so a debug-only gate cannot see a defect whose reproduction depends on
    # optimization. That is not hypothetical: a guarantee in
    # `src/ffi/alloc.rs` that delegated its size ceiling to `malloc` held in debug
    # and did not hold here, because at these settings the call was removed and
    # the null test folded away. `cargo build --release` above compiles the
    # library but runs no assertion, so it could not catch it either. This step is
    # the gate that does.
    - name: Test (release profile)
      if: ${{ matrix.test }}
      run: cargo +stable test --release --verbose ${{ matrix.features }}
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ${{ matrix.name }} (ci)
        path: Cargo.lock
        retention-days: 7
        if-no-files-found: ignore

  # no_std test suite. These two steps are mandated by the migration plan and
  # are a BLOCKING gate: the full test suite must PASS under both
  # `--no-default-features` and `--no-default-features --features no-std`.
  #
  # Mechanism: the crate is `#![no_std]` only for the shipped artifact
  # (`cargo build --no-default-features`, which the profiles compile with
  # `panic = "abort"`). Under `cargo test` Cargo forces `panic = "unwind"` for
  # the libtest harness, so the crate stays `std`-linked while every
  # `not(feature = "std")` code path is still compiled and exercised (the `std`
  # feature gates remain off). See the crate-attribute rationale in
  # `src/lib.rs`. The previously tracked "129 errors" open issue is RESOLVED, so
  # `continue-on-error` has been removed and this job now gates the pipeline.
  no-std-tests:
    name: no_std tests
    runs-on: ubuntu-latest
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    # `rust-toolchain.toml` pins `channel = "1.85.0"` for local builds. A rustup
    # toolchain FILE is overridden by the `RUSTUP_TOOLCHAIN` environment
    # variable, so this job must set it explicitly: installing a toolchain with
    # `dtolnay/rust-toolchain@<channel>` does NOT change which toolchain an
    # unqualified `cargo` resolves to. Without this, every step below would run
    # on 1.85.0 regardless of the label above.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Test (no default features)
      run: cargo +stable test --no-default-features
    - name: Test (no-std feature)
      run: cargo +stable test --no-default-features --features no-std
    # Both std-off rows again under the SHIPPED profile. See the rationale on the
    # `build-test` job's release step: `[profile.release]`'s `opt-level = 3` +
    # `codegen-units = 1` can decide whether an assertion holds, so the profile
    # that ships has to be the profile that is tested.
    - name: Test (no default features, release profile)
      run: cargo +stable test --release --no-default-features
    - name: Test (no-std feature, release profile)
      run: cargo +stable test --release --no-default-features --features no-std

  # Formatting and linting. Clippy runs with warnings promoted to errors.
  #
  # This job is the reason the explicit selection below is mandatory rather than
  # merely tidy, and the `+stable` prefixes are what make it a CURRENT-STABLE
  # gate: clippy's lint SET is not stable across releases, so `-D warnings` on an
  # older clippy can reintroduce diagnostics upstream has since withdrawn. This
  # job must therefore run the clippy the project actually gates on, not whatever
  # clippy ships with the MSRV pin in `rust-toolchain.toml`. The MSRV contract
  # this project actually defines is `cargo build` + `cargo check --all-targets`,
  # which is what the `msrv` job below runs - deliberately never clippy.
  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins `channel = "1.85.0"` for local builds. A rustup
    # toolchain FILE is overridden by the `RUSTUP_TOOLCHAIN` environment
    # variable, so this job must set it explicitly: installing a toolchain with
    # `dtolnay/rust-toolchain@<channel>` does NOT change which toolchain an
    # unqualified `cargo` resolves to. Without this, every step below would run
    # on 1.85.0 regardless of the label above.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo fmt --version
        cargo clippy --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Format check
      run: cargo +stable fmt --all -- --check
    # `--all-features` is REQUIRED, not decorative, and it is the gate the rest of
    # the repository already documents: `.cargo/config.toml` states it twice (its
    # "nothing weakening a diagnostic" clause and its "re-observe the gates"
    # list), and it is the migration plan's own standard for this job.
    #
    # Without it clippy never sees the feature-gated surface. Measured on the
    # fingerprint directory: `--all-targets` alone lints 14 units and SKIPS
    # `tests/c_oracle.rs` entirely, because that target carries
    # `required-features = ["c-oracle"]`. Also unlinted without it: the
    # `inflate_strict` arms and the `no_std` runtime block. Those are precisely
    # the places a lint regression would hide longest, since no other job in this
    # file promotes warnings to errors.
    #
    # `--all-features` enables `c-oracle`, but that costs nothing here: clippy
    # only type-checks, and the harness shells out to a C compiler at RUN time,
    # never at lint time. Both spellings were measured exit 0 with zero
    # diagnostics, so widening the gate cannot turn it red on today's tree.
    #
    # `src/lib.rs`'s `the_lint_job_runs_the_documented_clippy_gate` asserts this
    # exact command, so the narrower spelling cannot come back unnoticed.
    - name: Clippy
      run: cargo +stable clippy --all-targets --all-features -- -D warnings

  # Minimum Supported Rust Version gate: pins the toolchain to 1.85.0 (the
  # release that stabilized the 2024 edition) and verifies the crate builds and
  # type-checks across all targets on that exact version.
  #
  # Three places state this version and they must move together: the `@1.85.0`
  # install ref and the `+1.85.0` prefixes here, `channel` in
  # `rust-toolchain.toml`, and `rust-version` in `Cargo.toml`. The prefix is
  # explicit even though the toolchain file happens to select the same compiler,
  # so this job verifies the version it is named after rather than whatever the
  # pin currently says. Note the scope: build and type-check only. Clippy is
  # NOT run here -- see the `lint` job above.
  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    # The ONE job that intentionally runs on the floor. Set explicitly rather
    # than relying on `rust-toolchain.toml` happening to hold the same value:
    # this job's guarantee is "the crate builds on exactly the declared MSRV", so
    # the version it runs must be stated here. The two now corroborate each other
    # rather than one silently standing in for the other, so raising the MSRV means
    # changing three places in the same commit: this value, `channel` in
    # `rust-toolchain.toml`, and `rust-version` in `Cargo.toml`.
    env:
      # Unquoted deliberately: YAML parses this to the same string either way,
      # and the crate-root CI-contract test greps for the literal
      # `RUSTUP_TOOLCHAIN: 1.85.0`.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust 1.85.0 toolchain
      uses: dtolnay/rust-toolchain@1.85.0
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects the pinned MSRV floor here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is 1.85.0
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          1.85.0-*) ;;
          *) echo "::error::expected the 1.85.0 toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Build with MSRV
      run: cargo +1.85.0 build --verbose
    - name: Check all targets with MSRV
      run: cargo +1.85.0 check --verbose --all-targets

  # Benchmark compile check: ensures the three criterion benches
  # (deflate_bench, inflate_bench, checksum_bench; all harness = false) compile
  # without actually running them.
  benches:
    name: Bench compile
    runs-on: ubuntu-latest
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    # `rust-toolchain.toml` pins `channel = "1.85.0"` for local builds. A rustup
    # toolchain FILE is overridden by the `RUSTUP_TOOLCHAIN` environment
    # variable, so this job must set it explicitly: installing a toolchain with
    # `dtolnay/rust-toolchain@<channel>` does NOT change which toolchain an
    # unqualified `cargo` resolves to. Without this, every step below would run
    # on 1.85.0 regardless of the label above.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Compile benchmarks (no run)
      run: cargo +stable bench --no-run

  # Build-script tests - a BLOCKING gate for the generated CRC table contract
  # and the optional cdylib version-script wiring (AAP section 0.3.1 / gap D8).
  #
  # `cargo test` never compiles `build.rs`, so without this job the generator has
  # no test coverage at all and producer/consumer drift can pass every other gate
  # (the finding this job closes). The file is therefore compiled as its own test
  # binary. The edition is read from `Cargo.toml` rather than hard-coded, so the
  # two cannot drift apart.
  build-script-tests:
    name: Build script tests
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Compile and run the build-script test binary
      run: |
        set -euo pipefail
        edition=$(sed -n 's/^edition[[:space:]]*=[[:space:]]*"\([0-9]*\)".*/\1/p' Cargo.toml | head -1)
        if [ -z "$edition" ]; then
          echo "::error file=Cargo.toml::could not read the package edition"
          exit 1
        fi
        echo "compiling build.rs as a test binary (edition $edition)"
        rustc +stable --edition "$edition" --test build.rs -o "$RUNNER_TEMP/buildrs_tests" \
              --deny warnings
        "$RUNNER_TEMP/buildrs_tests" --test-threads 4
    - name: Verify the big-endian table selection compiles
      run: |
        set -euo pipefail
        # `build.rs` always emits both endian forms of every table and the consumer
        # picks between them with `cfg(target_endian)`. On a little-endian runner the
        # big-endian arms are never compiled, so a wrong index or a wrong table in
        # one of them would go unnoticed until somebody built for big-endian
        # hardware. A big-endian `cargo check` of the test profile compiles those
        # arms; the relationship between the two forms is additionally asserted at
        # run time on every target by
        # `checksum::crc32::tests::endian_selected_generated_anchors_are_the_active_target_values`.
        rustup target add --toolchain stable s390x-unknown-linux-gnu
        cargo +stable check --locked --target s390x-unknown-linux-gnu --lib --profile test
    - name: Verify the generated tables are reproducible
      run: |
        set -euo pipefail
        # Two independent builds must emit a byte-identical generated file: the
        # tables are pure constants, so any difference means the generator has
        # become environment-dependent.
        cargo +stable build --locked --quiet
        first=$(find target/debug/build -name crc32_tables.rs -print0 \
                | xargs -0 sha256sum | awk '{print $1}' | sort -u)
        if [ "$(printf '%s\n' "$first" | wc -l)" -ne 1 ]; then
          echo "::error::feature rows disagree on the generated tables"
          exit 1
        fi
        rm -rf target/debug/build
        cargo +stable build --locked --quiet
        second=$(find target/debug/build -name crc32_tables.rs -print0 \
                 | xargs -0 sha256sum | awk '{print $1}' | sort -u)
        if [ "$first" != "$second" ]; then
          echo "::error::generated tables are not reproducible: $first vs $second"
          exit 1
        fi
        echo "generated tables reproducible: sha256 $first"

  # `unsafe`-containment boundary - a BLOCKING gate for User Constraint 3
  # ("zero unsafe blocks in core compression logic") and AAP section 0.6.2 / section 0.7.2
  # standard S2.
  #
  # Two independent layers, deliberately not merged:
  #
  #   1. The in-crate boundary tests. They re-derive the boundary from the source
  #      text - blanking comments and literals, classifying every `unsafe` token,
  #      and treating a bare `unsafe extern "C" fn(..)` *type* as declarative -
  #      then assert that executable `unsafe` appears only under `src/ffi/**` and
  #      inside `mod no_std_support`, and that exactly two narrowly scoped
  #      `#[allow(unsafe_code)]` carve-outs exist. `#![deny(unsafe_code)]` alone
  #      cannot catch a smuggled third carve-out, because such code still
  #      compiles; these tests do.
  #
  #   2. A toolchain-independent shell assertion over the same invariants, so the
  #      gate still bites if the tests themselves are weakened or deleted.
  unsafe-boundary:
    name: Unsafe boundary
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Boundary tests (in-crate)
      run: |
        cargo +stable test --locked --lib -- \
          tests::executable_unsafe_is_confined_to_the_designated_boundary \
          tests::unsafe_code_denial_has_exactly_two_scoped_carve_outs \
          tests::boundary_scanner_classifies_tokens_correctly
    - name: Boundary assertion (source scan)
      run: |
        set -euo pipefail
        status=0

        # The crate root must DENY unsafe_code, and must not FORBID it (forbid
        # cannot be relaxed by the two boundary carve-outs).
        if ! grep -qx '#!\[deny(unsafe_code)\]' src/lib.rs; then
          echo "::error file=src/lib.rs::missing crate-root #![deny(unsafe_code)]"
          status=1
        fi
        if grep -qx '#!\[forbid(unsafe_code)\]' src/lib.rs; then
          echo "::error file=src/lib.rs::#![forbid(unsafe_code)] cannot be relaxed by the boundary carve-outs"
          status=1
        fi

        # Exactly two top-level carve-outs, both in src/lib.rs.
        carve_outs=$(grep -cx '#\[allow(unsafe_code)\]' src/lib.rs || true)
        if [ "$carve_outs" -ne 2 ]; then
          echo "::error file=src/lib.rs::expected exactly 2 #[allow(unsafe_code)] carve-outs, found $carve_outs"
          status=1
        fi

        # No other file may re-enable unsafe_code, at any scope.
        strays=$(grep -rln --include='*.rs' -e '^ *#!\?\[allow(unsafe_code)\]' src/ \
                 | grep -v '^src/lib\.rs$' || true)
        if [ -n "$strays" ]; then
          echo "::error::these files re-enable unsafe_code: $strays"
          status=1
        fi

        # No executable unsafe block in the safe core (comment lines excluded).
        core="src/deflate src/inflate src/checksum src/util src/gz src/error.rs src/constants.rs src/gz_header.rs src/stream.rs"
        # shellcheck disable=SC2086
        hits=$(grep -rn --include='*.rs' 'unsafe {' $core | grep -v ':[[:space:]]*//' || true)
        if [ -n "$hits" ]; then
          echo "::error::executable unsafe found in the safe core:"
          echo "$hits"
          status=1
        fi

        if [ "$status" -eq 0 ]; then
          echo "unsafe boundary intact: core is unsafe-free, 2 scoped carve-outs, crate-root deny in place"
        fi
        exit "$status"

  # C-ABI linkage gate: the emitted `cdylib`/`staticlib` must actually be
  # consumable by a C program in every feature configuration.
  #
  # Why this job has to exist separately from `build-test`: `cargo build --release`
  # succeeding proves only that rustc emitted an archive and a shared object. It
  # does NOT prove either artifact can be linked, because an `rlib`-to-`staticlib`
  # roll-up is allowed to carry unresolved references, and a `cdylib` is allowed to
  # be produced with undefined symbols that only surface when something tries to
  # resolve them. Every std-off row was in exactly that state: the sysroot `core`
  # and `alloc` rlibs carry `.data.DW.ref.rust_eh_personality` LSDA references that
  # `std` normally satisfies, so with `--no-default-features` the artifacts built
  # clean and then failed at `ld` time with `undefined reference to
  # rust_eh_personality` - for a static link, for a dynamic link, and for
  # `dlopen(RTLD_NOW)` alike. `src/lib.rs`'s freestanding runtime block now supplies
  # the symbol; this job is what keeps it supplied.
  #
  # The three link forms are all tested because they fail independently: a static
  # link resolves against the archive's member objects, a dynamic link against the
  # shared object's dynamic symbol table, and `dlopen(RTLD_NOW)` resolves eagerly at
  # load time - which is the only one of the three that a lazily-bound program would
  # not reveal until first call.
  #
  # The personality symbol is asserted on two independent axes, because the two
  # properties fail in different ways and neither implies the other.
  #
  #   * EXACTLY ONE DEFINITION must exist in the artifact, on every row. Both
  #     failure directions are caught by `ld` before this job's assertion is even
  #     reached: zero definitions is the `undefined reference` above, and two - the
  #     `cfg` gate widened so a `std` build also compiles the freestanding block -
  #     is a duplicate-symbol error. Pinning the count to `1` uniformly is what
  #     keeps that guarantee observable, and it is strictly stronger than the
  #     per-row dynamic-table count this job used to compare: because a `std` build
  #     links `std`'s own copy, the artifact defines the symbol on EVERY row, so a
  #     per-row `0`/`1` expectation could only ever have described where the
  #     definition was *visible*, never which crate supplied it.
  #   * IT MUST NEVER BE EXPORTED, on every row. `#[unsafe(no_mangle)]` gives the
  #     definition default ELF visibility, so a std-off `cdylib` published it as
  #     `FUNC GLOBAL DEFAULT` and measured 96 dynamic `T` symbols where the `std`
  #     build measures 95. That both widened the drop-in `libz` ABI with a symbol
  #     no `libz` has and exposed an *aborting* routine to ELF interposition - in a
  #     global symbol scope it can win the process-wide lookup for another Rust
  #     shared object's personality references. `src/lib.rs` therefore emits a
  #     `.hidden` directive beside the definition; the reference it exists to
  #     satisfy is resolved at static-link time, so internal linkage suffices.
  #
  # The export-set step that follows then pins the whole surface rather than that
  # one symbol: every row must publish the same 95 dynamic `T` symbols, cover all
  # 54 `zlib.map` `global:` names, and leak none of the 10 `local:` ones. A symbol
  # set that varies with a Cargo feature is an ABI break, and comparing against
  # `zlib.map` is what makes the check independent of this job's own arithmetic.
  #
  # Each matrix row runs on its own runner, so the "a previous feature row left
  # `target/release/libzlib_rs.a` holding a different feature set" hazard cannot
  # occur here. Feature-crossing artifacts are why that matters: `--no-default-features`
  # turns `gzip` off as well as `std`, so the consumer below deliberately exercises
  # only the always-present surface (checksums, `compressBound`, `compress2` /
  # `uncompress`, `zlibVersion`) and never gzip framing.
  c-abi-linkage:
    name: C ABI linkage (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: std-off
            features: '--no-default-features'
          - name: std-off + no-std
            features: '--no-default-features --features no-std'
          - name: std-off + simd
            features: '--no-default-features --features simd'
          - name: std control
            features: ''
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Build the shipped artifacts (release)
      run: cargo +stable build --release --locked --verbose ${{ matrix.features }}
    - name: Assert the personality symbol is defined exactly once and never exported
      run: |
        set -euo pipefail
        so=target/release/libzlib_rs.so
        test -f "$so" || { echo "::error::$so was not emitted"; exit 1; }
        # Axis 1: exactly one definition, anywhere in the symbol table. `ld` has
        # already rejected zero (undefined reference) and two (duplicate symbol);
        # this makes the surviving guarantee observable.
        defined=$(nm --defined-only "$so" | grep -cE ' [tT] rust_eh_personality' || true)
        # Axis 2: never in the DYNAMIC table. This is the property the `.hidden`
        # directive in `src/lib.rs` exists to enforce.
        exported=$(nm -D --defined-only "$so" | grep -c ' T rust_eh_personality' || true)
        echo "rust_eh_personality: definitions=$defined (want 1), exported=$exported (want 0)"
        if [ "$defined" != "1" ]; then
          echo "::error::expected exactly 1 definition of rust_eh_personality for features" \
               "'${{ matrix.features }}', found $defined. A std-off artifact must supply it" \
               "or nothing can link; a std build must not add a second, because std already" \
               "provides one."
          exit 1
        fi
        if [ "$exported" != "0" ]; then
          echo "::error::rust_eh_personality is exported from the dynamic symbol table for" \
               "features '${{ matrix.features }}'. It must carry internal linkage: exporting" \
               "it widens the drop-in libz ABI with a symbol no libz has, and publishes an" \
               "aborting routine that ELF interposition can select for another Rust shared" \
               "object's unwinds. Check the .hidden directive in src/lib.rs."
          exit 1
        fi
    - name: Assert the dynamic export set matches the zlib.map contract on every row
      run: |
        set -euo pipefail
        so=target/release/libzlib_rs.so
        # A version script is a sequence of `NAME { ... } [parent];` nodes. Inside a
        # node the default visibility is `global`, and `global:`/`local:` switch
        # scope for THAT NODE ONLY - a parser that lets `local:` persist across node
        # boundaries mis-sorts most of the file. `_*` is a pattern, not a name.
        python3 - "$so" <<'PY'
        import re, subprocess, sys, pathlib
        so = sys.argv[1]
        text = pathlib.Path("zlib.map").read_text()
        nodes = re.findall(r'([A-Za-z0-9_.]+)\s*\{(.*?)\}\s*([A-Za-z0-9_.]*)\s*;', text, re.S)
        g, l = set(), set()
        for _name, body, _parent in nodes:
            mode = "g"
            for raw in body.split(";"):
                s = raw.strip()
                while s.startswith("global:") or s.startswith("local:"):
                    mode = "g" if s.startswith("global:") else "l"
                    s = s.split(":", 1)[1].strip()
                for tok in s.split():
                    if tok != "_*" and re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', tok):
                        (g if mode == "g" else l).add(tok)
        assert (len(nodes), len(g), len(l)) == (16, 54, 10), \
            f"zlib.map parsed as {len(nodes)} nodes / {len(g)} global / {len(l)} local, " \
            "expected 16 / 54 / 10 - the version script changed or the parser drifted"
        out = subprocess.run(["nm", "-D", "--defined-only", so],
                             capture_output=True, text=True, check=True).stdout
        T = {p[2] for p in (line.split() for line in out.splitlines())
             if len(p) == 3 and p[1] == "T"}
        missing, leaked = sorted(g - T), sorted(l & T)
        print(f"dynamic T={len(T)}  zlib.map globals {len(g)-len(missing)}/{len(g)}  "
              f"locals leaked {len(leaked)}/{len(l)}")
        failed = False
        # 96 `#[unsafe(no_mangle)]` names minus the `#[cfg(windows)]`-gated
        # `gzopen_w`. Identical on every feature row: `pub mod ffi` is declared
        # unconditionally so the artifact always presents the full C symbol table,
        # and anything inside it that needs `std` is gated in the function body.
        if len(T) != 95:
            print(f"::error::expected 95 dynamic T symbols, found {len(T)}. The exported "
                  "surface must not vary with a Cargo feature - that is an ABI break.")
            failed = True
        if missing:
            print(f"::error::zlib.map global: symbols absent from the artifact: {missing}")
            failed = True
        if leaked:
            print(f"::error::zlib.map local: symbols leaked into the dynamic table: {leaked}")
            failed = True
        sys.exit(1 if failed else 0)
        PY
    - name: Link and load a C consumer against both artifacts
      run: |
        set -euo pipefail
        cat > consumer.c <<'CONSUMER'
        /* Exercises only the surface every feature row provides: no gzip framing,
           because `--no-default-features` turns the `gzip` feature off too. */
        #include <stdio.h>
        #include <string.h>
        #include "zlib.h"
        int main(void) {
            static unsigned char src[8192], comp[16384], back[8192];
            for (unsigned i = 0; i < sizeof src; i++)
                src[i] = (unsigned char)(i * 31u + (i >> 4));
            if (crc32(crc32(0L, Z_NULL, 0), (const Bytef *)"123456789", 9) != 0xcbf43926UL) {
                puts("FAIL crc32"); return 1;
            }
            if (adler32(adler32(0L, Z_NULL, 0), (const Bytef *)"123456789", 9) != 0x091e01deUL) {
                puts("FAIL adler32"); return 1;
            }
            if (compressBound(9) != 22) { puts("FAIL compressBound"); return 1; }
            uLongf clen = sizeof comp;
            if (compress2(comp, &clen, src, sizeof src, 9) != Z_OK) { puts("FAIL compress2"); return 1; }
            uLongf blen = sizeof back;
            if (uncompress(back, &blen, comp, clen) != Z_OK) { puts("FAIL uncompress"); return 1; }
            if (blen != sizeof src || memcmp(back, src, sizeof src) != 0) { puts("FAIL roundtrip"); return 1; }
            printf("PASS ver=%s clen=%lu\n", zlibVersion(), (unsigned long)clen);
            return 0;
        }
        CONSUMER
        cat > loader.c <<'LOADER'
        /* RTLD_NOW resolves every symbol at load time, so an undefined reference
           fails here rather than at first call. */
        #include <dlfcn.h>
        #include <stdio.h>
        #include <string.h>
        int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) { printf("FAIL dlopen: %s\n", dlerror()); return 1; }
            unsigned long (*crc)(unsigned long, const unsigned char *, unsigned) =
                (unsigned long (*)(unsigned long, const unsigned char *, unsigned))dlsym(h, "crc32");
            const char *(*ver)(void) = (const char *(*)(void))dlsym(h, "zlibVersion");
            if (!crc || !ver) { printf("FAIL dlsym: %s\n", dlerror()); return 1; }
            if (crc(crc(0UL, NULL, 0), (const unsigned char *)"123456789", 9) != 0xcbf43926UL) {
                puts("FAIL dlopen crc32"); return 1;
            }
            printf("PASS dlopen ver=%s\n", ver());
            return dlclose(h) == 0 ? 0 : 1;
        }
        LOADER

        echo "--- static link ---"
        gcc -O2 -I. consumer.c target/release/libzlib_rs.a -o consumer_static -lpthread -ldl -lm
        ./consumer_static

        echo "--- dynamic link ---"
        gcc -O2 -I. consumer.c -L"$PWD/target/release" -lzlib_rs \
            -Wl,-rpath,"$PWD/target/release" -o consumer_dyn
        ./consumer_dyn

        echo "--- dlopen(RTLD_NOW) ---"
        gcc -O2 loader.c -o loader -ldl
        ./loader "$PWD/target/release/libzlib_rs.so"

  # Cross-target type-check (gap D3, the half that cannot be run natively).
  #
  # SCOPE, STATED PLAINLY: this job COMPILES the crate and its whole test/bench
  # surface for three foreign triples and executes NOTHING. `cargo check` does
  # not link, which is exactly why no cross linker, no emulator and no apt step
  # is needed - and equally why the result must never be described as those
  # platforms being "tested". What it does catch is the class of defect a
  # single-triple pipeline structurally cannot see: pointer-width and integer
  # assumptions on a 32-bit target, and the big-endian arms of code whose
  # little-endian twin is the only one a x86_64 runner ever compiles.
  #
  # Each triple earns its row, as follows.
  #
  #   * aarch64-unknown-linux-gnu - the aarch64 ELF/glibc flavour. `macos-latest`
  #     covers aarch64 natively and runs the suite, but on Mach-O with Apple's
  #     `target_vendor`, so it does not stand in for this one.
  #   * i686-unknown-linux-gnu - 32-bit `usize`/pointer width across the library,
  #     the integration suite and the benches. `bare-metal-no-std` is also
  #     32-bit but builds only the library with no default features, so it
  #     type-checks none of the test surface.
  #   * s390x-unknown-linux-gnu - big-endian. `build-script-tests` already checks
  #     `--lib --profile test` here; this row widens the same triple to
  #     `--all-targets` so the integration tests and benches are compiled
  #     big-endian too. NOTE for whoever maintains the target lists: s390x is
  #     absent from BOTH `.cargo/config.toml`'s five `[target.<triple>]` tables
  #     and `deny.toml`'s `[graph] targets`, so those two files and this matrix
  #     are not currently aligned on it. Neither file is edited from here; the
  #     divergence is recorded so it is a decision rather than an accident.
  #
  # `--all-targets` on a foreign triple is intentional and is the whole point,
  # because the library alone would leave `tests/**` and `benches/**` unchecked.
  #
  # A NOTE ON THE 2-SPACE COMMENT LINES IN THIS FILE. `src/lib.rs` locates a job
  # block by scanning for the next line that is indented exactly two spaces and
  # ends in a colon, so a comment shaped like `  # something:` reads as a job key
  # and truncates the preceding job's block early. The comments added with these
  # three jobs deliberately avoid ending a 2-space line with a colon.
  cross-targets:
    name: Cross type-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor. It matters more
    # here than anywhere else in this file, because the target below is installed
    # for the toolchain the action selects: if an unqualified `cargo` fell back
    # to 1.85.0, the requested triple would not be installed for it and the
    # check would fail for a reason that has nothing to do with the target.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      # One triple's failure must not hide the other two.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: i686-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # The cross target is installed through this action's `targets:` input. That
    # is the single sanctioned mechanism: `rust-toolchain.toml` deliberately
    # carries no `targets` key (it would force every contributor to download a
    # target before their first build), and a hand-rolled `rustup target add`
    # step would drift from the toolchain the action actually selected.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # Report the properties this row exists to exercise, so the log says what was
    # covered instead of leaving it to be inferred from the triple's name.
    - name: Report the target's compilation properties
      run: |
        set -euo pipefail
        rustc +stable --print cfg --target '${{ matrix.target }}' \
          | grep -E 'target_(arch|endian|pointer_width|env|os|vendor)='
        rustup target list --installed --toolchain stable
    - name: Cross type-check the library, tests and benches
      run: cargo +stable check --locked --all-targets --verbose --target '${{ matrix.target }}'

  # Bare-metal no_std library build (gap D10).
  #
  # WHY A HOSTED `cargo test --no-default-features` CANNOT CLOSE THIS GAP.
  # `src/lib.rs` applies `#![no_std]` and declares its freestanding runtime block
  # under one predicate, spelled identically in both places, namely
  #
  #     all(not(feature = "std"), not(test), panic = "abort")
  #
  # The `not(test)` term is decisive. `cargo test --no-default-features` sets
  # `test`, and Cargo additionally forces `panic = "unwind"` for the libtest
  # harness regardless of the profile setting, so under `cargo test` the
  # predicate fails on TWO of its three terms and `mod no_std_support` is never
  # compiled at all. No number of passing hosted tests can reach the libc
  # `GlobalAlloc`, the `posix_memalign` over-aligned path, the `#[panic_handler]`
  # or the 32-bit `MIN_ALIGN = 8` arm. `cargo build --target <bare-metal-triple>
  # --no-default-features` is the only invocation that compiles them: on that
  # target `not(feature = "std")` holds, `not(test)` holds, and `panic = "abort"`
  # comes from `[profile.dev]` in `Cargo.toml`.
  #
  # `thumbv7em-none-eabihf` is the triple the migration plan names, and
  # `rustc --print cfg` for it reports `target_os = "none"` and
  # `target_pointer_width = "32"` - a genuine no-OS target that is also the only
  # 32-bit configuration in which that `MIN_ALIGN` arm is reachable.
  #
  # FOUR THINGS THAT LOOK WRONG HERE AND ARE NOT. Do not "fix" any of them.
  #
  #   1. `warning: dropping unsupported crate type `cdylib` for target
  #      `thumbv7em-none-eabihf`` is EXPECTED. `[lib] crate-type` lists
  #      `cdylib`, which has no meaning on bare metal, so Cargo drops it and
  #      keeps `lib` + `staticlib`. Do not suppress or filter the warning, do not
  #      pass `--crate-type`, and do not edit `Cargo.toml`.
  #   2. `malloc` / `calloc` / `realloc` / `free` / `posix_memalign` / `abort`
  #      stay UNDEFINED in the emitted archive. A bare-metal target has no libc,
  #      but a library build links no final binary, so unresolved references are
  #      correct - and for four of the six their presence is the positive
  #      evidence asserted below that the block compiled. No libc shim, no
  #      `-nostartfiles`, no `-Z build-std`, no linker flags.
  #   3. The panic strategy is NOT set from here. `panic = "abort"` must keep
  #      coming from the `Cargo.toml` profiles, because it is the predicate's
  #      third term: passing `-C panic=...` from CI would either break the
  #      predicate or mask a genuine misconfiguration.
  #   4. There is no `cargo test` step, and adding one would be actively wrong,
  #      not merely impossible: setting `test` flips `not(test)` false and skips
  #      the very code this job exists to compile.
  #
  # This job is ADDITIVE to the host `no-std-tests` job above, which stays a
  # blocking gate on the hosted std-off test suites. Neither substitutes for the
  # other: that one runs assertions, this one reaches code that one cannot.
  bare-metal-no-std:
    name: Bare-metal no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor - and, as in
    # `cross-targets`, would look for a target that was installed for a
    # different toolchain.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # Installed through the action's `targets:` input, for the same reason as in
    # `cross-targets`: `rust-toolchain.toml` deliberately has no `targets` key.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabihf
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # The gap is "never exercised on no-OS hardware", so the premise has to be
    # checked rather than assumed: a triple that quietly acquired an OS or a
    # 64-bit pointer width would still build and would silently stop covering
    # what this job is here for.
    - name: Verify the target is genuinely bare metal and 32-bit
      run: |
        set -euo pipefail
        cfg="$(rustc +stable --print cfg --target thumbv7em-none-eabihf)"
        echo "$cfg"
        for want in 'target_os="none"' 'target_pointer_width="32"'; do
          case "$cfg" in
            *"$want"*) ;;
            *) echo "::error::thumbv7em-none-eabihf no longer reports $want, so this"\
               " job would stop covering the bare-metal / 32-bit MIN_ALIGN arms."; exit 1 ;;
          esac
        done
    - name: Build the library for bare metal (no default features)
      run: cargo +stable build --locked --verbose --target thumbv7em-none-eabihf --no-default-features
    - name: Build the library for bare metal (no-std feature)
      run: cargo +stable build --locked --verbose --target thumbv7em-none-eabihf --no-default-features --features no-std
    # "It compiled" is weaker than this gap deserves: if the predicate ever
    # stopped holding, both builds above would still succeed and would silently
    # compile nothing of what D10 is about. The symbol assertions below are the
    # difference between compiling the crate and compiling the freestanding
    # runtime block, and each one was picked because it FAILS when run against a
    # hosted build of this same crate - which is the only property that makes an
    # assertion evidence rather than decoration.
    - name: Assert the freestanding runtime block was actually compiled
      run: |
        set -euo pipefail
        lib=target/thumbv7em-none-eabihf/debug/libzlib_rs.a
        test -f "$lib" || { echo "::error::$lib was not emitted"; exit 1; }
        status=0
        # `nm -A` output is written to files rather than piped into `grep -q`:
        # under `set -o pipefail` an early-exiting `grep -q` SIGPIPEs its
        # producer, the pipeline then reports 141, and every symbol below would
        # look absent whether it was there or not.
        defined="$RUNNER_TEMP/bare-metal-defined.syms"
        undefined="$RUNNER_TEMP/bare-metal-undefined.syms"
        nm -A --defined-only "$lib" > "$defined"
        nm -A --undefined-only "$lib" > "$undefined"
        # EVERY assertion below was chosen because it FAILS on a hosted build of
        # this same crate. A check that passes either way proves nothing, and the
        # obvious candidates really do pass either way: std defines both
        # `rust_eh_personality` and the panic handler, and `malloc`/`free` are
        # referenced from a crate object even in a hosted build because
        # `src/ffi/alloc.rs` declares them for the zcalloc/zcfree bridge. Those
        # are excluded here for precisely that reason - hence the symbol choices
        # and the object-file attribution, neither of which is decoration.
        #
        # (1) mod no_std_support compiled at all. Both the legacy and the v0
        #     mangling embed the module path as plain text, so the substring test
        #     is mangling-agnostic.
        block="$(grep -c 'no_std_support' "$defined" || true)"
        echo "symbols defined inside mod no_std_support: $block (want 1 or more)"
        if [ "$block" -lt 1 ]; then
          echo "::error::no symbol in $lib names mod no_std_support, so the"\
               " freestanding allocator and panic handler were not compiled and"\
               " this job covers nothing the host no-std job does not already."
          status=1
        fi
        # (2) the libc entry points that block calls, attributed to a crate
        #     object. All four are absent from a hosted build of this crate.
        for sym in calloc realloc posix_memalign abort; do
          hits="$(grep -E "[[:space:]]U[[:space:]]+${sym}\$" "$undefined" | grep -c ':zlib_rs' || true)"
          echo "undefined reference to $sym from a zlib_rs object: $hits (want 1 or more)"
          if [ "$hits" -lt 1 ]; then
            echo "::error::no zlib_rs object in $lib references the libc entry"\
                 " point '$sym', so mod no_std_support was not compiled."
            status=1
          fi
        done
        # (3) the two symbols that block exists to supply, attributed to a crate
        #     object rather than to std: `rust_eh_personality` is the unwind
        #     personality shim a freestanding artifact must provide, and
        #     `rust_begin_unwind` is the panic handler that terminates through
        #     abort(). The pattern matches a mangled prefix so it holds under
        #     either mangling scheme.
        for sym in rust_eh_personality rust_begin_unwind; do
          owned="$(grep -E "[[:space:]][tT][[:space:]]+[^[:space:]]*${sym}\$" "$defined" | grep -c ':zlib_rs' || true)"
          echo "$sym defined by a zlib_rs object: $owned (want 1 or more)"
          if [ "$owned" -lt 1 ]; then
            echo "::error::$sym is not defined by any zlib_rs object in $lib. In a"\
                 " hosted build std supplies it; on bare metal the crate must, and"\
                 " mod no_std_support is the only thing in this crate that does."
            status=1
          fi
        done
        if [ "$status" -eq 0 ]; then
          echo "freestanding runtime block compiled: crate-supplied allocator, panic handler and personality shim all present"
        fi
        exit "$status"

  # Packaging verification (gap D12).
  #
  # `exclude` in `Cargo.toml` is what keeps the retained C baseline - the
  # cross-validation oracle and the source of the official test vectors - out of
  # the published crate while leaving it present in the tree. Those two
  # requirements only look contradictory: this job is a PACKAGING-time assertion
  # about what a `.crate` contains, and it neither reads, moves nor rewrites a
  # single C source. Nothing verified that list before this job existed, and
  # `Cargo.toml` names `cargo package --list` as its own acceptance gate.
  #
  # THE ASSERTIONS ARE PATTERN-BASED, AND THAT IS NOT A SHORTCUT. A fixed file
  # count, a golden manifest or a diff of the whole listing would all go red the
  # next time a legitimate file is added to the crate or a newly discovered
  # stray is excluded - which is to say, they would fail for the one reason that
  # is not a defect. The absence checks below are monotonic: excluding MORE never
  # breaks them, and only a regression - a C source, an upstream C document or a
  # legacy platform directory reappearing in the package - turns this job red.
  # The presence checks are the other half, because an `exclude` entry broad
  # enough to swallow `src/` or `tests/` would otherwise look like success.
  #
  # `test/**` (the C drivers) is excluded while `tests/**` (the Rust integration
  # suite) ships. That asymmetry is CORRECT and is asserted in both directions
  # below; do not "tidy" it into one pattern.
  #
  # A PACKAGING CHECK IS NOT A PUBLISH. This job runs `--list` and the local
  # verification build only. It holds no registry token, reads no secret, cuts no
  # tag and creates no release, and it must stay that way. It also must not
  # perturb the workspace: the final step asserts both lockfiles are still
  # pristine, because a packaging step that quietly re-resolved dependencies
  # would invalidate every other gate in this file.
  package-verify:
    name: Package verification
    runs-on: ubuntu-latest
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@stable
    # `rust-toolchain.toml` pins this repository to the MSRV floor, and that
    # repository pin OUTRANKS the `rustup default` that the toolchain action
    # above sets. The job-level `RUSTUP_TOOLCHAIN` env var is a higher-priority
    # override, so it is what actually selects current stable here. This step fails the
    # job if that override is ever lost, rather than letting the gate silently
    # run on the wrong compiler.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Check the packaged file list against Cargo.toml's exclude contract
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/package.list"
        cargo +stable package --locked --list > "$list"
        echo "--- cargo package --list ($(wc -l < "$list") entries) ---"
        cat "$list"
        status=0

        # MUST NOT SHIP. Each entry is `<extended-regex>::<what it is>`. The
        # separator is `::` and NOT `|`, because several patterns use regex
        # alternation and would be split through the middle. Every pattern is
        # anchored so a legitimate neighbour cannot be caught by accident:
        # `README` is the upstream C readme and is matched exactly, which is why
        # `README.md` (the crate's own `readme =` target, asserted present below)
        # is unaffected, and `^test/` cannot match `tests/`. `cargo` injects
        # `Cargo.toml.orig` and `.cargo_vcs_info.json` into every listing; both
        # are expected and are matched by nothing here.
        forbidden='
        \.c$::retained C source
        \.h$::retained C header
        \.map$::linker version script
        \.in$::autotools or CMake input template
        \.cmakein$::CMake input template (NOT caught by *.in)
        ^zlib\.3::upstream C man page or its PDF
        ^ChangeLog$::upstream C change log
        ^FAQ$::upstream C FAQ
        ^INDEX$::upstream C index
        ^README$::upstream C readme (distinct from README.md)
        ^README-cmake\.md$::upstream CMake readme
        ^\.cmake-format\.yaml$::CMake formatter config for the C build
        crc-doc\.1\.0\.pdf$::CRC monograph (heavy binary)
        ^doc/(algorithm|txtvsbin|rfc19(50|51|52))\.txt$::normative reference text
        ^(contrib|examples|test)/::third-party bindings, C samples or C test drivers
        ^(amiga|msdos|os400|qnx|watcom|win32)/::legacy platform build tree
        ^(blitzy|blitzy-deck)/::migration engagement material
        ^(CMakeLists\.txt|Makefile|configure|make_vms\.com|treebuild\.xml)$::C build descriptor
        ^(BUILD\.bazel|MODULE\.bazel)$::Bazel build descriptor
        '
        while read -r entry; do
          [ -n "$entry" ] || continue
          pattern="${entry%%::*}"
          description="${entry#*::}"
          if hits="$(grep -E "$pattern" "$list")"; then
            echo "::error file=Cargo.toml::packaged but must be excluded ($description):"\
                 "$(printf '%s' "$hits" | tr '\n' ' ')"
            status=1
          fi
        done <<< "$forbidden"

        # MUST SHIP. Deliberately limited to what the crate cannot be published
        # without, so that adding a new root file never requires editing this
        # list. Directory entries are prefix-matched because the listing is
        # per-file.
        for required in '^src/' '^tests/' '^benches/' '^build\.rs$' '^Cargo\.toml$' \
                        '^Cargo\.lock$' '^README\.md$' '^LICENSE$'; do
          if ! grep -qE "$required" "$list"; then
            echo "::error file=Cargo.toml::nothing matching '$required' is packaged."\
                 " An exclude entry has become broad enough to remove part of the crate."
            status=1
          fi
        done

        if [ "$status" -eq 0 ]; then
          echo "package contents match the exclude contract: no C baseline, no upstream C docs,"\
               "no legacy platform trees, no engagement material; crate sources, tests, benches,"\
               "build script, manifests, README.md and LICENSE all present"
        fi
        exit "$status"
    # `--list` proves WHAT would ship; this proves the result is BUILDABLE from
    # only those files. It is the check that catches an `exclude` entry which
    # removed something the build actually reads - a failure mode the listing
    # alone cannot see. Deliberately `cargo package` rather than
    # `cargo publish --dry-run`: `package` performs the same archive-and-verify
    # work while staying entirely off the publishing path, so the job cannot
    # acquire a registry interaction, a token requirement or an upload by
    # accident. Note it is run WITHOUT `--allow-dirty`, which makes it assert a
    # second property for free: no earlier step left the tree modified.
    - name: Verify the packaged crate builds from its own contents
      run: cargo +stable package --locked --verbose
    # `cargo package --verbose` COMPILES the packaged crate but does not TEST
    # it, and those are different properties: a downstream consumer or distro
    # packager who unpacks the `.crate` and runs `cargo test` is running a suite
    # whose fixtures include files the `exclude` contract deliberately removed.
    # That is not hypothetical - it was measured. `src/ffi/mod.rs` reconciles the
    # exported symbol surface against `zlib.map`, which is REFERENCE-only and is
    # excluded by the `\.map$` pattern asserted above, so inside the archive both
    # reconciliation tests used to panic with `zlib.map must be readable: No such
    # file or directory`: 681 passed, 2 failed. They now degrade to a printed
    # skip notice for that one condition (file absent) and stay hard failures for
    # every other (present but unreadable, or present but malformed), which is
    # the same contract `tests/c_oracle.rs` uses for a missing C compiler.
    #
    # This step is what keeps that true. It extracts the tarball rather than
    # reusing the `target/package/<name>-<version>/` directory `cargo package`
    # leaves behind, because the tarball is what a consumer actually downloads,
    # so this also proves the archive is self-sufficient. It runs entirely inside
    # `RUNNER_TEMP` with its own `CARGO_TARGET_DIR`, so it cannot perturb the
    # workspace or either lockfile - the step below still gets to assert that.
    - name: Run the packaged crate's own test suite
      run: |
        set -euo pipefail
        shopt -s nullglob
        crates=(target/package/*.crate)
        if [ "${#crates[@]}" -ne 1 ]; then
          echo "::error::expected exactly one .crate in target/package, found"\
               "${#crates[@]}: ${crates[*]-none}"
          exit 1
        fi
        crate="${crates[0]}"
        echo "packaged archive: $crate ($(wc -c < "$crate") bytes)"

        unpacked="$RUNNER_TEMP/packaged"
        rm -rf "$unpacked"
        mkdir -p "$unpacked"
        tar -xzf "$crate" -C "$unpacked"
        roots=("$unpacked"/*/)
        if [ "${#roots[@]}" -ne 1 ]; then
          echo "::error::expected exactly one top-level directory in the archive,"\
               "found ${#roots[@]}: ${roots[*]-none}"
          exit 1
        fi
        root="${roots[0]%/}"
        echo "unpacked to: $root"

        # Precondition, not a nicety: if the script were present the run below
        # would prove nothing about the degradation path. The `--list` gate above
        # forbids `\.map$` outright, so this is the second, independent check
        # that the two suites really do execute without it.
        if [ -e "$root/zlib.map" ]; then
          echo "::error::zlib.map is inside the packaged crate; the exclude contract"\
               " has regressed and the skip path below is untested"
          exit 1
        fi

        cd "$root"
        # The consumer gate: every suite, zero failures, zero ignored. Not
        # `--no-fail-fast`; a single failure here is a broken published crate.
        CARGO_TARGET_DIR="$RUNNER_TEMP/packaged-target" \
          cargo +stable test --locked
        # Belt and braces: prove the two suites PASSED BY DEGRADING rather than
        # by having been silently filtered out or renamed away. `--nocapture` is
        # required because a passing test's stdout is swallowed by default.
        CARGO_TARGET_DIR="$RUNNER_TEMP/packaged-target" \
          cargo +stable test --locked --lib -- --nocapture \
          ffi::tests::every_zlib_map_global_symbol_has_a_compile_time_signature_guard \
          ffi::tests::no_zlib_map_local_symbol_is_exported_or_guarded \
          > "$RUNNER_TEMP/packaged-skip.log" 2>&1 || {
            cat "$RUNNER_TEMP/packaged-skip.log"
            echo "::error::the zlib.map reconciliation tests did not pass inside the"\
                 " packaged crate"
            exit 1
          }
        notices="$(grep -c 'ffi: SKIPPED — zlib.map is not present' \
          "$RUNNER_TEMP/packaged-skip.log" || true)"
        selected="$(grep -c '^test result: ok\. 2 passed' \
          "$RUNNER_TEMP/packaged-skip.log" || true)"
        if [ "$notices" -ne 2 ] || [ "$selected" -ne 1 ]; then
          cat "$RUNNER_TEMP/packaged-skip.log"
          echo "::error::expected both zlib.map reconciliation tests to run and print the"\
               " skip notice; saw $notices notice(s) and $selected matching result line(s)"
          exit 1
        fi
        echo "the packaged crate is self-testable: full suite green, and both zlib.map"\
             "reconciliation tests degraded to a printed skip notice as designed"
    # A packaging step that re-resolved dependencies would invalidate every
    # `--locked` gate in this file, and `fuzz/Cargo.lock` belongs to a detached
    # workspace that nothing here should be touching at all.
    - name: Assert both lockfiles are unchanged
      run: |
        set -euo pipefail
        dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
        if [ -n "$dirty" ]; then
          echo "::error::packaging modified a lockfile, which would silently change what"\
               " every other job resolves: $dirty"
          exit 1
        fi
        echo "Cargo.lock and fuzz/Cargo.lock are unchanged"
