# CI - Continuous Integration for the zlib-rs crate
#
# Pure-Cargo pipeline for the C-to-Rust migration of zlib 1.3.2.1 into the
# `zlib-rs` crate (library `zlib_rs`; edition 2024; MSRV 1.85.0;
# crate-type = ["lib", "cdylib", "staticlib"]).
#
# The Cargo feature matrix is the Rust analogue of the old C preprocessor
# conditionals (for example GZIP and the solo/core-only build): each matrix row
# exercises a distinct feature set.
#
# Jobs:
#   build-test    build (debug + release) and test across the feature matrix
#   no-std-tests  no_std test suite (blocking gate)
#   lint          rustfmt + clippy (-D warnings), plus the zero-ignored-tests scan
#   docs          rustdoc with warnings denied + `mkdocs build --strict`, the two
#                 documentation gates this project documents as blocking
#   msrv          build + check on the pinned MSRV toolchain (1.85.0)
#   benches       compile-only check of the criterion benchmarks
#   unsafe-boundary  blocking guard that `unsafe` stays inside src/ffi/** and the
#                 src/lib.rs no_std runtime block (User Constraint 3)
#   build-script-tests  build.rs compiled as its own test binary, plus the
#                 generated-table reproducibility and big-endian checks
#   c-abi-linkage  the emitted cdylib/staticlib linked, dynamically linked and
#                 dlopen'd by a C consumer on every std-off feature row
#   cross-targets  cross TYPE-CHECK + CLIPPY ONLY (nothing is executed) on FOUR
#                 foreign triples: the aarch64, 32-bit i686 and big-endian s390x
#                 Linux triples, plus x86_64-pc-windows-msvc cross-checked FROM
#                 Linux. That fourth row is not redundant with the native
#                 `windows-latest` row in `build-test`: this one is cross and
#                 wide (`--all-features`), that one is native and narrow, and
#                 neither links (gap D3)
#   bare-metal-no-std  library build for thumbv7em-none-eabihf: the only
#                 configuration that compiles `mod no_std_support` for
#                 `target_os = "none"` and reaches its 32-bit `MIN_ALIGN = 8`
#                 arm (gap D10). The block itself also compiles in any std-off
#                 LIBRARY build, including on the host - see the note on the
#                 `no_std library (build only)` row.
#   package-verify  `cargo package --list` checked against Cargo.toml's
#                 `exclude` contract, plus the packaging build AND the unpacked
#                 archive's own `cargo test` run, so the published crate is
#                 self-testable and not merely self-buildable (gap D12)
#
# Action references are pinned to full commit SHAs, with the release each SHA
# corresponds to in a trailing comment; `audit.yml` carries the repository-wide
# rationale, the pin table and the upgrade procedure under "ACTION PINNING".
# No native toolchain is required: the `flate2` dev-dependency resolves to its
# pure-Rust miniz_oxide backend, so the interop tests compile without any
# native library dependency.
#
# PLATFORM COVERAGE - WHAT EACH NON-UBUNTU ROW BUYS
# ==========================================
# `--locked` ON EVERY DEPENDENCY-RESOLVING COMMAND - a requirement, not a habit
# ---------------------------------------------------------------------------
# Every `cargo build`, `test`, `check`, `clippy`, `doc`, `bench` and `package`
# invocation in this file passes `--locked`. Two distinct properties depend on it,
# and neither is cosmetic:
#
#   1. THE VERDICT DESCRIBES THE COMMITTED PINS. Without `--locked`, cargo is free
#      to re-resolve and REWRITE `Cargo.lock` on the runner whenever the manifest
#      and the lockfile have drifted - and it does so while reporting success. Every
#      gate downstream then describes a dependency set that no commit contains. This
#      crate commits its lockfile deliberately, because it ships `cdylib` and
#      `staticlib` distributables whose reproducibility is the point
#      (`.gitignore` records the reason), so a silently re-resolved graph
#      invalidates the artifact claims as well as the test results.
#   2. A DRIFTED MANIFEST FAILS LOUDLY. `--locked` turns "manifest and lockfile
#      disagree" into an immediate error at the first command, instead of a
#      lockfile diff nobody looks at. That is the only signal that distinguishes a
#      deliberate dependency change - which must arrive WITH its lockfile update -
#      from an accidental one.
#
# Several steps additionally assert `git status --porcelain` is empty, which proves
# the outcome rather than trusting the flag: `--locked` states the intent, the
# assertion keeps holding even if a future cargo stops honouring it.
#
# `cargo fmt` is the ONE deliberate exemption. It parses sources and resolves no
# dependency graph at all, so `--locked` is not merely unnecessary there, it is not
# a flag `cargo fmt` accepts. `rustc`, `rustup` and the `--version` probes are
# likewise not dependency-resolving. Any NEW cargo step added to this file that
# touches the graph must carry `--locked`; `src/lib.rs`'s
# `the_lint_job_runs_the_documented_clippy_gate` asserts the spelling for the one
# command the rest of the repository quotes verbatim.
#
# PLATFORM COVERAGE - WHAT EACH NON-UBUNTU ROW ACTUALLY BUYS
# ==========================================================
# Until the rows below were added, every job in this file ran on
# `ubuntu-latest` / x86_64 / little-endian, so the crate's portability claims
# rested on code that had never been compiled. These are the platform-divergent
# sites, each read out of the tree at the line cited, and each is why exactly
# one row exists:
#
#   * `src/ffi/gz.rs` `gzopen_w` - `#[cfg(windows)] #[unsafe(no_mangle)] pub
#     unsafe extern "C" fn gzopen_w(*const u16, *const c_char) -> gzFile`. The
#     ONLY platform-gated, ABI-visible exported symbol in the crate, mirroring
#     C's `#if defined(_WIN32) && !defined(Z_SOLO)` in `zlib.h`. The
#     `windows-latest` row is the only place it is ever compiled, and keeping
#     the public surface whole is what the migration's public-interface
#     preservation directive requires. That row also EXECUTES it: the
#     `#[cfg(windows)]` test `ffi::gz::tests::wide_path_open_round_trip` opens,
#     writes, reopens and reads back a UTF-16 path through `gzopen_w`, and a
#     dedicated step on that row runs it by name so the coverage is legible in
#     the log rather than inferred from a total.
#   * `src/ffi/gz.rs` and `src/gz/**` `#[cfg(not(unix))]` arms - five of them,
#     one an ABI-visible `gzdopen` that deliberately fails on non-unix and pairs
#     with the `#[cfg(unix)]` definition of the same symbol. No pre-existing job
#     compiled any of them.
#   * `src/gz/open.rs` `O_NONBLOCK` - `#[cfg(unix)] const O_NONBLOCK: i32 = if
#     cfg!(any(target_os = "linux", target_os = "android")) { 0o4000 } else
#     { 0o0004 };`. Written as a `cfg!()` EXPRESSION, so both arms type-check on
#     every unix target, but only a BSD-family host selects `0o0004`. That makes
#     `macos-latest` value coverage, not merely compile coverage, and it needs
#     the default feature set because the constant lives behind `gz-io`.
#   * `src/util/mod.rs` `OS_CODE` - a `cfg_if!` cascade selecting 10 on Windows,
#     19 on Apple and 3 elsewhere. `src/deflate/mod.rs` writes it into the RFC 1952
#     header, so this is live behaviour on those runners. See the GZIP `OS` BYTE
#     note below.
#   * `src/lib.rs` `MIN_ALIGN` - 16 on 64-bit, 8 on 32-bit, inside
#     `mod no_std_support`. The 8 arm needs a 32-bit target AND the full no_std
#     predicate, so `bare-metal-no-std` is the only place it compiles.
#   * `src/checksum/crc32.rs` - picks between the little- and big-endian generated
#     CRC tables with `cfg!(target_endian = "little")`. `build-script-tests` checks
#     `--lib --profile test` on s390x and `cross-targets` widens the same triple to
#     `--all-targets`, but neither EXECUTES on big-endian hardware, so that arm
#     stays type-checked rather than measured.
#
# NATIVE vs CROSS - two different mechanisms, deliberately not conflated. A NATIVE
# row (`windows-latest`, `macos-latest`) needs only its `os:` value; it builds for
# the runner's own triple and RUNS the suite. A CROSS row installs its triple
# through the `targets:` input of `dtolnay/rust-toolchain` - never `rustup target
# add`, and never `rust-toolchain.toml`, which omits a `targets` key so a
# contributor's first build cannot be broken by a target their platform cannot
# install. `cargo check` does not link, so no cross linker, emulator or apt step is
# needed; in exchange a cross row TYPE-CHECKS ONLY and its name says so.
# CONTRIBUTING.md ("Platform honesty") carries the same executed-vs-checked split
# for contributors.
#
#     That rule is EXCEPTIONLESS, and it binds every job that names a triple -
#     not only the rows inside `cross-targets`. `build-script-tests` cross-checks
#     the big-endian table arms on `s390x-unknown-linux-gnu` and therefore
#     declares that triple the same way, in the `targets:` input of its own
#     toolchain step. A hand-rolled `rustup target add --toolchain <channel>`
#     step is the specific thing to avoid: it names a channel a SECOND time, so
#     it can disagree with both the `@<ref>` the action installed and the
#     rank-2 `RUSTUP_TOOLCHAIN` the job set, and the disagreement surfaces as a
#     missing-target error attributed to the wrong step.
#
# THE GZIP `OS` BYTE ON THE WINDOWS AND macOS ROWS - READ BEFORE "FIXING"
# ---------------------------------------------------------------------------
# `tests/interop.rs`'s `BI_VECTORS_GZIP` bakes 75 reference gzip members whose `OS`
# field (byte 9) is `03`, because they were baked on a Unix host. `OS_CODE` is 10 on
# Windows and 19 on Apple, so a naive comparison of that byte fails on these two
# runners. THE LIBRARY IS CORRECT: byte-identity is defined against the reference C
# library built for the SAME target, and C's `zutil.h` selects 10 and 19 there too.
#
# `check_all` therefore retargets byte 9 of the EXPECTED vector to
# `HOST_GZIP_OS_CODE` - derived from raw `#[cfg]` attributes, independently of
# `zlib_rs::util::OS_CODE` - and still compares every byte, byte 9 included. That is
# NOT `normalise_gzip_os`, which ERASES byte 9 and is used only by the
# platform-neutral tables. Three tests in `tests/interop.rs::byte_identity` hold the
# contract on every row. One of them replays all 75 rows against all three `OS_CODE`
# values from a single host, which validates the fixture helper and shows no other
# byte moves with the substitution; none of them executes the platform `cfg` cascade
# for a foreign target, so the evidence that it selects correctly on Windows and
# Apple is these NATIVE rows running there.
#
# These rows are expected to be GREEN and are deliberately NOT feature-scoped,
# `if:`-guarded or filtered. Do not add `test: false` to them: that would drop the
# only execution coverage `gzopen_w`, the `cfg(not(unix))` arms and `O_NONBLOCK`'s
# BSD value ever get. The dead-code warnings the Windows rows emit for
# `validate_mode` and `state::GzFile` are expected and do not turn a row red,
# because no job outside `lint` promotes warnings to errors.
#
# TOOLCHAIN SELECTION - EVERY JOB SAYS WHICH COMPILER IT MEANS, TWICE
# ==================================================================
# `rust-toolchain.toml` at the repository root pins `channel = "1.85.0"` (the
# MSRV floor) so that a contributor's FIRST local build exercises the declared
# MSRV instead of whatever stable they happen to have installed.
#
# That pin is a rustup DIRECTORY-FILE override at precedence rank 4, and it
# outranks `rustup default` at rank 5 - which is exactly what
# `dtolnay/rust-toolchain` sets. The action runs
# `rustup toolchain install <channel> --profile minimal --no-self-update` followed
# by `rustup default <channel>`, where `<channel>` comes from the explicit
# `toolchain:` input every call site here passes - the action's own ref is a
# pinned SHA, so that input is the only thing naming a channel. It does NOT export
# `RUSTUP_TOOLCHAIN`. So INSTALLING a toolchain is not the same as SELECTING it:
# installing `stable` leaves a bare
# `cargo build` in this repository resolving to 1.85.0. Measured locally, from
# this repository root:
#
#     rustup default                -> stable-x86_64-unknown-linux-gnu
#     rustup show active-toolchain  -> 1.85.0-x86_64-unknown-linux-gnu
#                                     (overridden by '.../rust-toolchain.toml')
#
# Rank 4 beating rank 5 is observable, not theoretical. Left unaddressed it
# silently demotes `build-test`, `no-std-tests`, `lint`, `benches`,
# `build-script-tests`, and `unsafe-boundary` from current-stable coverage to
# MSRV coverage, duplicating the `msrv` job and leaving current stable untested -
# and `lint` would gate on a clippy release this project does not gate on.
#
# Every job below therefore states its intent TWICE, and the two can never
# disagree because they name the same channel:
#
#   1. A job-level `env: RUSTUP_TOOLCHAIN` (rank 2). This is what reaches NESTED
#      cargo invocations - a subcommand that shells out to `cargo` inherits it -
#      so a step added later cannot quietly fall back to the pin, and it governs
#      the `rustup` and bare-`rustc` calls that carry no `+toolchain` shorthand.
#   2. A `+stable` / `+1.85.0` shorthand on every `cargo` and `rustc` invocation
#      (rank 1, the highest precedence there is). Rank 1 wins over the toolchain
#      file, over any directory override, and over `RUSTUP_TOOLCHAIN` itself, and
#      it is visible in the CI log right next to the command it governs.
#
# Keep both in step with the `@<ref>` the job installs. Note that ref is a pinned
# commit SHA, which names no channel, so every call site ALSO passes an explicit
# `with: toolchain:` input - the SHA pins the action's code, the input picks the
# compiler. `@stable` -> `stable` / `+stable`, `@1.85.0` -> `1.85.0` / `+1.85.0`.
#
# Each job then ASSERTS the toolchain it got before doing any work, so a future
# change to the pin, the action, or rustup's precedence rules fails loudly
# instead of silently changing what is being tested. Those verification steps
# deliberately invoke BARE `rustc` and `rustup` - never `rustc +stable` - because
# their whole purpose is to observe the AMBIENT resolution that rank 2 produces.
# Prefixing them would make the assertion vacuous. Do NOT "simplify" this by
# deleting the pin from `rust-toolchain.toml` - that reopens the local/CI
# asymmetry the pin exists to close. The rationale is recorded once more, in the
# "THIS FILE IS NOT A STRAITJACKET" section of `rust-toolchain.toml`.
#
# ASCII PUNCTUATION - THIS FILE CONTAINS NO NON-ASCII BYTE
# =======================================================
# Every character in this workflow, comments included, is ASCII: hyphens and
# `->` rather than en/em dashes and arrows, and no box-drawing characters. That
# is a hard convention, not a preference, and it is shared with `audit.yml` and
# `fuzz.yml`, which are likewise byte-ASCII. The reason is that this file is read
# and edited by tooling and diffed in contexts with no guaranteed encoding, and a
# stray U+2014 in a shell string is invisible in review while being a distinct
# byte sequence to `grep`.
#
# The one place where that rule meets a non-ASCII REQUIREMENT is the
# `package-verify` job, which has to match a notice printed by
# `src/ffi/mod.rs` whose text genuinely contains a U+2014 EM DASH. The needle is
# therefore assembled at run time from an octal escape - `printf
# '\342\200\224'` - so the byte sequence the grep looks for is exact while the
# file itself stays ASCII. Use that pattern for any future case; do NOT paste the
# character in, and do NOT "fix" the producer's message, which is user-facing
# prose.
#
# Verify with: `grep -cP '[^\x00-\x7F]' .github/workflows/ci.yml` -> 0.
name: CI
on: [push, pull_request]

# PRINCIPLE OF LEAST PRIVILEGE
# ============================
# Every job in this workflow only ever READS the repository: it checks the tree
# out, builds it, tests it, and - on failure only - uploads an artifact. None of
# them pushes a commit, opens or comments on an issue or pull request, publishes
# a package, or touches a deployment. Declaring the token scope explicitly caps
# the `GITHUB_TOKEN` at `contents: read` for the whole file, so a step added
# later cannot inherit a write scope from the repository's default-permissions
# setting without that widening being visible in this diff.
#
# This is stated at WORKFLOW level rather than per job on purpose: a job-level
# block would have to be repeated eleven times and would silently omit the
# twelfth. The sibling `audit.yml` and `fuzz.yml` declare the same single key, so
# all three workflows now agree.
permissions:
  contents: read


# Collapse superseded runs: a newer commit on the same ref cancels any CI run
# still in flight for that ref. Every job in this workflow is stateless and
# idempotent - no corpus to grow, no cache to seed, no artifact another run
# depends on - so a cancelled run loses nothing that the superseding run does not
# redo from scratch, and the tree it would have tested is no longer the tip.
# `github.ref` keys the group, so independent branches and pull requests never
# cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary build + test job. The `matrix.include` list enumerates the feature
  # combinations that stand in for the old C preprocessor build variants.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    env:
      RUSTUP_TOOLCHAIN: stable
    # REQUIRED once this matrix stopped being Linux-only. GitHub defaults a `run:`
    # step to `bash` on Linux and macOS but `pwsh` on Windows, and the steps below
    # are bash scripts (`set -euo pipefail`, `case`/`esac`). Pinning one shell keeps
    # every row running the SAME script instead of failing on Windows in a way that
    # would look like a platform defect.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # THREE FIELDS BEYOND `os:` AND `features:`, AND WHY EACH IS PER-ROW.
        #
        #   host:       the target triple `rustc -vV` must report on this runner.
        #               `runs-on:` labels are MUTABLE - `macos-latest` moved from
        #               x86_64 to aarch64, and `windows-latest`/`ubuntu-latest`
        #               advance with each image generation - so a row named after
        #               a platform proves nothing unless the platform is asserted.
        #               Without this a silent label remap turns the two native
        #               rows into duplicate coverage of a third platform while
        #               still reporting green (finding TEST-03).
        #   arch:       the `runner.arch` value GitHub reports (X64 / ARM64). It
        #               is an INDEPENDENT witness of the same fact: `host:` is
        #               what the compiler believes, `arch:` is what the runner
        #               platform believes, and a mismatch between them is exactly
        #               the condition a single source could not reveal.
        #   min_tests:  the floor for the summed `passed` count of this row's test
        #               run. `cargo test` exits 0 when tests are silently LOST - a
        #               `#[cfg]` that stops matching, an integration target
        #               dropped from the build - and AAP directive D-5 fixes the
        #               suite at "preserved and only ever increased, zero
        #               ignored", so the count is asserted rather than assumed
        #               (finding TEST-08).
        #
        # THE FLOORS ARE NOT ALL EXACT, ON PURPOSE. The five ubuntu rows carry
        # their exact measured totals, because they are reproducible on the
        # development host: the two rows whose feature set includes `gz-io`
        # (`Default features` and `gzip + gz-io`) share one total; `All features`
        # is that total plus the 13 `c-oracle` tests; `std + simd` is LOWER than
        # either, because that row deliberately runs with `gzip`/`gz-io` off (see
        # the row's own note) so `tests/gzip_compat.rs` and the gzip-gated unit
        # tests are absent; and the build-only row carries 0 because it runs no
        # test step at all.
        #
        # The two native rows carry a deliberately conservative 988, below the
        # Linux total, because their totals differ from it by
        # platform-conditional tests (every `#[cfg(unix)]` test is absent on
        # Windows; `#[cfg(windows)]` adds the `gzopen_w` round trip plus its
        # guards) and CANNOT be measured from a Linux host, so an exact floor
        # there would be a guess that breaks the build. The value is DERIVED
        # rather than guessed: it is the 944 previously carried plus the 44 of
        # the 56 tests added since that carry no `#[cfg(unix)]` gate and
        # therefore run on every platform - the remaining 12 are
        # `#[cfg(unix)]`-gated, so Windows cannot run them and macOS runs more
        # than the shared floor demands. 988 still catches the failure this gate
        # exists for: a whole target or suite disappearing. Raise any floor when
        # the suite grows; never lower one to make a red row green.
        include:
          # Default feature set: std + gzip + gz-io + simd.
          - name: Default features
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            arch: X64
            features: ''
            test: true
            min_tests: 1015
          # Every feature turned on at once.
          - name: All features
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            arch: X64
            features: '--all-features'
            test: true
            min_tests: 1028
          # gzip framing + gz file-I/O layer on top of std.
          - name: gzip + gz-io
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            arch: X64
            features: '--no-default-features --features std,gzip,gz-io'
            test: true
            min_tests: 1015
          # simd-enabled CRC-32 on top of std, with the gzip framing and gz
          # file-I/O layers OFF. That combination is what makes this row distinct
          # rather than a second copy of another one: `Default features` already
          # resolves to std + gzip + gz-io + simd, so a row selecting the same four
          # features by name would repeat this job's debug build, release build and
          # both test runs while covering nothing new (finding PERF-03). Dropping
          # `gzip`/`gz-io` here is the only place the suite runs with `crc32fast`
          # compiled in and no gzip consumer of CRC-32 present, which is what pins
          # `simd` as independent of `gzip` - the checksum surface
          # (`crc32`/`crc32_z`/`crc32_combine` and their FFI exports) is
          # always-present, unlike the gzip framing that normally drives it.
          # `c-abi-linkage`'s `std-off + simd` row is a different claim again: it has
          # no `std`, so `crc32fast` gets a compile-time feature test instead of the
          # run-time probe this row exercises, and that job only links a C consumer
          # rather than running the suite. Whether `crc32fast`'s accelerated code is
          # actually selected remains a target/CPU question that `crc32_backend()`
          # reports; this row exercises the feature wiring, not a guaranteed
          # speed-up.
          - name: std + simd
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            arch: X64
            features: '--no-default-features --features std,simd'
            test: true
            # Measured on this feature row specifically, and well below the other
            # ubuntu rows because `gz-io` is off: `tests/gzip_compat.rs`
            # contributes nothing and the `cfg(feature = "gzip")` /
            # `cfg(feature = "gz-io")` unit tests do not exist.
            min_tests: 721
          # Core-only (no_std) LIBRARY build. `test: false` is what makes this row
          # distinct rather than redundant: `mod no_std_support` in `src/lib.rs` is
          # gated on `all(not(feature = "std"), not(test), panic = "abort")`, so a
          # std-off LIBRARY build compiles it - including here, on the host - while
          # a std-off `cargo test` never does, because the `test` cfg is set. The
          # std-off test suites run in `no-std-tests`; `bare-metal-no-std` adds what
          # this row cannot reach, `target_os = "none"` and `MIN_ALIGN = 8`.
          - name: no_std library (build only)
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
            arch: X64
            features: '--no-default-features'
            test: false
            # This row runs no test step, so no floor applies. The key is still
            # declared: `min_tests` is interpolated into the test steps' shell
            # text, and a matrix row that omits it would substitute an empty
            # string there if `test:` were ever flipped to true.
            min_tests: 0
          # ---------------------------------------------------------------
          # Platform rows (gap D3). These are ADDITIVE to the feature rows
          # above, not a replacement for them: `runs-on: ${{ matrix.os }}`
          # already carried the platform axis, so every row above keeps its
          # exact feature set and only the host changes here. Both rows are
          # NATIVE - a GitHub-hosted runner building for its own triple - so
          # they need no cross tooling, and they run the real suite. What they
          # DO need beyond `os:` is the `host:`/`arch:` pair asserted below,
          # because a row named after a platform is only as trustworthy as the
          # mutable runner label behind it.
          #
          # DEFAULT features, deliberately. `--all-features` would enable the
          # opt-in `c-oracle` feature, whose harness shells out to a
          # gcc-flavoured recipe that is the wrong dialect on MSVC and Apple
          # clang; and the platform-divergent code these rows exist to reach
          # (`gzopen_w`, the `cfg(not(unix))` arms, `O_NONBLOCK`'s BSD value)
          # all sits behind `gz-io`, which the default set enables.
          #
          # Every row `name:` in this matrix must stay UNIQUE: the failure-only
          # upload step below names its artifact `${{ matrix.name }} (ci)`, and
          # `actions/upload-artifact` v4 rejects a duplicate artifact name
          # within a run. With `fail-fast: false` above, several rows can and do
          # fail at once, so a collision would mask the real failure with a 409.
          #
          # See "THE GZIP `OS` BYTE ON THE WINDOWS AND macOS ROWS" in the header
          # for the one byte that legitimately differs per host.
          # ---------------------------------------------------------------
          # Windows/MSVC. The only runner that compiles `gzopen_w` - the sole
          # platform-gated exported C symbol - and the five `cfg(not(unix))`
          # arms, one of which is an ABI-visible `gzdopen` with different
          # behaviour from its unix twin. It also EXECUTES that symbol rather
          # than merely compiling it: `ffi::gz::tests::wide_path_open_round_trip`
          # is `#[cfg(windows)]`, so this row is the only place a UTF-16 path is
          # actually opened, written, reopened and read back through `gzopen_w`.
          # The dedicated step after the test steps below runs it BY NAME, so the
          # coverage claim is visible in the log instead of being inferred from a
          # total (finding TEST-01).
          - name: Windows x86_64 (native, default features)
            os: windows-latest
            host: x86_64-pc-windows-msvc
            arch: X64
            features: ''
            test: true
            # 988 = the 944 previously carried on this row plus the 44
            # platform-unconditional tests added since. Of the 56 tests added, 44
            # carry no `#[cfg(unix)]` gate - 25 are gated only on
            # `feature = "gzip"`, which this row's default feature set enables, and
            # 19 carry no platform or feature gate at all - so every row that runs
            # the suite gains the same 44. The other 12 are `#[cfg(unix)]`-gated
            # and cannot run here. The row stays BELOW the ubuntu floor on
            # purpose. If a future change legitimately excludes a test here, lower
            # THIS row with a note rather than loosening the ubuntu rows.
            min_tests: 988
          # Native macOS: builds for the runner's own triple and, unlike a cross
          # row, EXECUTES the suite. This row PINS both that triple
          # (`aarch64-apple-darwin`) and the architecture GitHub reports
          # (`ARM64`), and the "Verify the host triple and runner architecture
          # match the row" step below checks them against two independent
          # witnesses: `rustc -vV`'s `host:` line and `runner.arch`. The aarch64
          # claim for this row is therefore asserted, not assumed -- if GitHub
          # ever re-provisions the `macos-latest` label onto a different
          # architecture this job fails loudly rather than silently changing what
          # is covered. `cross-targets` type-checks `aarch64-unknown-linux-gnu`,
          # a different triple, and remains its own separate claim. What this row
          # uniquely provides is Apple/BSD behaviour: the only place
          # `O_NONBLOCK` takes its `0o0004` value and the only place `OS_CODE`
          # is 19.
          - name: macOS (native, default features)
            os: macos-latest
            host: aarch64-apple-darwin
            arch: ARM64
            features: ''
            test: true
            # 988, derived exactly as the Windows row above: 944 plus the 44
            # platform-unconditional tests added since. macOS is a unix target, so
            # the `#[cfg(unix)]` tests DO run here and the true total is higher
            # still; the shared, Windows-safe value is deliberately the lower of
            # the two, and the 944 base reflects the non-unix-specific exclusions
            # both native rows share.
            min_tests: 988
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS. Every verdict below describes ONE
    # commit, and a log that does not name that commit is unattributable evidence:
    # it cannot be told apart from a run against a different tree, a different
    # clone, or artifacts that predate the commit under review. That is not
    # hypothetical - a checkpoint review found the retained runtime logs for this
    # project pointing at another clone, which left the commit actually under
    # assessment with no build, test, lint, MSRV, symbol or oracle proof at all
    # (finding M8-01). Naming the commit FIRST is what makes every line that
    # follows self-describing.
    #
    # THREE WITNESSES, deliberately, because they can disagree and each
    # disagreement means something different. `github.sha` is what the EVENT
    # named; `git rev-parse HEAD` is what the CHECKOUT actually produced; the tree
    # hash is what the FILES actually contain. Only the tree hash moves if a later
    # step edits the working tree, and only the first two can reveal a checkout
    # that resolved somewhere else entirely.
    #
    # The assertion accepts the pull-request head sha as well as `github.sha`,
    # because on a `pull_request` event the two legitimately differ: `github.sha`
    # names the ephemeral merge commit, so a checkout configured for the branch
    # tip would land on the head sha instead. Both are attributable. A third
    # value is not, and is what fails the job.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        components: clippy, rustfmt
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # The step above proves WHICH COMPILER ran; this one proves WHICH PLATFORM it
    # ran on. Both are needed, and neither implies the other: the toolchain check
    # is satisfied by stable on any host, so on its own it cannot tell that a
    # runner label was remapped underneath a row named after a platform. That is
    # not hypothetical - `macos-latest` moved from x86_64 to aarch64, and had this
    # matrix existed then, the "macOS aarch64" row would have been silently
    # covering x86_64 while reporting green (finding TEST-03).
    #
    # TWO INDEPENDENT WITNESSES, deliberately. `rustc -vV`'s `host:` line is what
    # the COMPILER resolved; `runner.arch` is what the RUNNER platform reports.
    # A disagreement between them - a 64-bit runner label serving a compiler
    # installed for another architecture, say - is precisely the condition a
    # single source cannot reveal, so both are asserted against the row's own
    # declared expectation.
    #
    # `rustc` is invoked BARE, with no `+stable`, for the same reason as the
    # toolchain check above: the property under test is the AMBIENT resolution.
    - name: Verify the host triple and runner architecture match the row
      run: |
        set -euo pipefail
        expected_host='${{ matrix.host }}'
        expected_arch='${{ matrix.arch }}'
        actual_host="$(rustc -vV | sed -n 's/^host: //p')"
        actual_arch='${{ runner.arch }}'
        echo "row '${{ matrix.name }}' on '${{ matrix.os }}'"
        echo "  expected host=${expected_host} arch=${expected_arch}"
        echo "  actual   host=${actual_host} arch=${actual_arch}"
        if [ -z "$actual_host" ]; then
          echo "::error::could not read the host triple from 'rustc -vV'."\
               " The output format changed and this assertion has gone blind."
          exit 1
        fi
        if [ "$actual_host" != "$expected_host" ]; then
          echo "::error::row '${{ matrix.name }}' expects host triple ${expected_host},"\
               " but rustc reports ${actual_host}. The '${{ matrix.os }}' label no longer"\
               " maps to the platform this row claims to cover: update the row (and the"\
               " platform-coverage notes in this file's header) or fix the label."
          exit 1
        fi
        if [ "$actual_arch" != "$expected_arch" ]; then
          echo "::error::row '${{ matrix.name }}' expects runner.arch ${expected_arch},"\
               " but the runner reports ${actual_arch}."
          exit 1
        fi
        echo "host triple and runner architecture both match the row"
    - name: Build (debug)
      run: cargo +stable build --locked --verbose ${{ matrix.features }}
    - name: Build (release)
      run: cargo +stable build --locked --release --verbose ${{ matrix.features }}
    # WARNINGS ARE DENIED ON THE NON-LINUX ROWS, WHERE NOTHING ELSE DENIED THEM.
    #
    # `cargo build` above prints a warning and exits 0, and the `lint` job - the
    # only other place `-D warnings` appears - runs on `ubuntu-latest` alone. So
    # every diagnostic reachable only under a non-Linux `cfg` was advisory: the
    # Windows row really did carry three of them (two unused `pub(crate) use`
    # re-exports in `src/gz/mod.rs` and a `validate_mode` dead on that target,
    # since `gzdopen` adopts a raw `int` descriptor only on Unix) and the row
    # still went green.
    #
    # `if: runner.os != 'Linux'` is a division of labour, not a carve-out: on
    # Linux this exact gate already runs in `lint`, with `--all-features`, so
    # repeating it here would only lengthen every Linux row. What is NOT repeated
    # anywhere is this row's own feature selection on this row's own OS, which is
    # why the step passes `${{ matrix.features }}` rather than `--all-features` -
    # the wider Windows surface is covered from Linux by `cross-targets`, which
    # cross-lints `x86_64-pc-windows-msvc` with every feature on. The two lanes
    # are deliberately different: this one is native and narrow, that one is
    # cross and wide, and a regression has to evade both.
    #
    # `--all-targets` is required for the same reason it is in `lint`: without it
    # the test and bench units are never linted, and a `cfg`-divergent cast or an
    # unused platform import in a test module is exactly the kind of thing that
    # only a non-host target sees.
    - name: Clippy (warnings denied, native non-Linux row)
      if: ${{ runner.os != 'Linux' }}
      run: cargo +stable clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
    # THE TEST COUNT IS ASSERTED, NOT ASSUMED (finding TEST-08).
    #
    # `cargo test` exits 0 when tests are silently LOST. A `#[cfg]` predicate that
    # stops matching, an integration target dropped from the build, a
    # `#[ignore]` added "temporarily" - each of those still prints
    # `test result: ok` and each still returns 0. AAP directive D-5 fixes this
    # suite at "preserved and only ever increased, with zero ignored", which is a
    # property about a NUMBER, so a gate that never reads the number cannot
    # enforce it.
    #
    # The parser sums EVERY `test result:` line, one per unit / integration /
    # doctest target, and checks four things: at least one summary line was
    # produced at all (a zero-block run means the harness never ran), zero failed,
    # zero ignored, and `passed` at or above this row's `min_tests` floor.
    #
    # It is written out at each test step rather than factored into a helper for
    # the same reason `audit.yml` keeps four separately named cargo-deny steps:
    # each row's floor stays next to the command it governs, and a step added
    # later cannot silently inherit a gate that does not apply to it.
    - name: Test
      if: ${{ matrix.test }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-logs"
        log="$RUNNER_TEMP/ci-logs/test-debug.log"
        cargo +stable test --locked --verbose ${{ matrix.features }} 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=${{ matrix.min_tests }}"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge ${{ matrix.min_tests }} ] || { echo "::error::only $2 tests ran on row"\
          " '${{ matrix.name }}', below its floor of ${{ matrix.min_tests }} - tests were"\
          " lost, not merely skipped"; exit 1; }
    # The SHIPPED profile, tested. `[profile.release]`'s `opt-level = 3` and
    # `codegen-units = 1` do not apply to the debug test run above, so a debug-only
    # gate cannot see a defect whose reproduction depends on optimization - and
    # `cargo build --release` compiles the library but runs no assertion. One
    # `src/ffi/alloc.rs` size-ceiling guarantee that held in debug did not hold here.
    - name: Test (release profile)
      if: ${{ matrix.test }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-logs"
        log="$RUNNER_TEMP/ci-logs/test-release.log"
        cargo +stable test --locked --release --verbose ${{ matrix.features }} 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=${{ matrix.min_tests }}"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge ${{ matrix.min_tests }} ] || { echo "::error::only $2 tests ran on row"\
          " '${{ matrix.name }}', below its floor of ${{ matrix.min_tests }} - tests were"\
          " lost, not merely skipped"; exit 1; }
    # The Windows row's reason for existing, run BY NAME (finding TEST-01).
    #
    # `gzopen_w` is the only platform-gated exported C symbol in the crate, and
    # `ffi::gz::tests::wide_path_open_round_trip` is the only test that calls it:
    # both are `#[cfg(windows)]`, so on the other six rows this step is skipped
    # and the test does not exist. Running it by name here makes the coverage
    # legible in the log - a total of N passing tests cannot show that THIS one
    # ran - and `--exact` plus the `1 passed` assertion means a rename or a lost
    # `cfg` fails the row instead of quietly matching nothing.
    - name: Execute the Windows-only gzopen_w round trip
      if: ${{ runner.os == 'Windows' }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/ci-logs"
        log="$RUNNER_TEMP/ci-logs/gzopen-w-round-trip.log"
        cargo +stable test --locked --lib -- --exact --nocapture \
          ffi::gz::tests::wide_path_open_round_trip 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { p += $4; f += $6 } END { printf "%d %d", p, f }' "$log")
        echo "gzopen_w round trip: passed=$1 failed=$2"
        [ "$2" -eq 0 ] || { echo "::error::the gzopen_w round trip failed"; exit 1; }
        [ "$1" -eq 1 ] || { echo "::error::expected exactly 1 test to run, saw $1."\
          " ffi::gz::tests::wide_path_open_round_trip was renamed, removed, or its"\
          " cfg(windows) gate no longer matches - gzopen_w would then be compiled but"\
          " never executed anywhere"; exit 1; }
    # Failure diagnostics for THIS row. The name says "build logs", so it uploads
    # build logs: the three test steps above tee into `$RUNNER_TEMP/ci-logs`
    # precisely so there is something to collect here. Previously this step's only
    # `path` was `Cargo.lock`, which is not a log - on a red row it produced an
    # artifact that could not explain the failure, and the honest reading of its own
    # name was unavailable.
    #
    # `Cargo.lock` is still uploaded, because it IS the evidence for the one failure
    # mode that leaves no test log: a `--locked` command rewriting the lockfile,
    # asserted by the step that follows. `retention-days: 7` and
    # `if-no-files-found: ignore` are kept - a row that fails before any test step
    # runs (a compile error, say) legitimately has no log to attach, and that must
    # not turn into a second, misleading failure.
    #
    # Logs live under `$RUNNER_TEMP`, never in the checkout, so they cannot dirty
    # the working tree that the `Cargo.lock` assertion below inspects.
    - name: Upload build logs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: failure()
      with:
        name: ${{ matrix.name }} (ci)
        path: |
          ${{ runner.temp }}/ci-logs/
          Cargo.lock
        retention-days: 7
        if-no-files-found: ignore

  # no_std test suite - a BLOCKING gate: the full suite must PASS under both
  # `--no-default-features` and `--no-default-features --features no-std`.
  #
  # Mechanism, because the name overpromises: under `cargo test` Cargo forces
  # `panic = "unwind"` for the libtest harness, so the crate stays `std`-linked
  # here while every `not(feature = "std")` code path is still compiled and
  # exercised. The one thing these rows do NOT compile is `mod no_std_support`,
  # whose predicate includes `not(test)`; the std-off LIBRARY builds cover that.

    # A resolving job must PROVE it honoured the committed resolution, not merely
    # state the intent: a rewritten lockfile is the one build-input change that
    # leaves no other trace in the log. `!cancelled()` keeps this verified on the
    # failure path too, where a stray rewrite would otherwise hide behind an
    # unrelated red result.
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."
  no-std-tests:
    name: no_std tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    #
    # STD_OFF_FLOOR is the SINGLE SOURCE OF TRUTH for all four std-off test steps
    # below: each one interpolates it into the summary it logs, the comparison it
    # enforces, and the message it prints on failure. It is declared here, once, at
    # job scope because the floor is the same for every one of the four - and because
    # the alternative had already failed: the steps used to log `floor=633` while
    # enforcing `-ge 629`, with the error text saying 629 twice and 633 twice, so
    # four tests could disappear with CI green and the log reassuring (P3-F1).
    # `the_ci_test_floors_are_internally_consistent` in `src/lib.rs` asserts that no
    # bare numeric floor comes back.
    env:
      RUSTUP_TOOLCHAIN: stable
      STD_OFF_FLOOR: 713
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS. Every verdict below describes ONE
    # commit, and a log that does not name that commit is unattributable evidence:
    # it cannot be told apart from a run against a different tree, a different
    # clone, or artifacts that predate the commit under review. That is not
    # hypothetical - a checkpoint review found the retained runtime logs for this
    # project pointing at another clone, which left the commit actually under
    # assessment with no build, test, lint, MSRV, symbol or oracle proof at all
    # (finding M8-01). Naming the commit FIRST is what makes every line that
    # follows self-describing.
    #
    # THREE WITNESSES, deliberately, because they can disagree and each
    # disagreement means something different. `github.sha` is what the EVENT
    # named; `git rev-parse HEAD` is what the CHECKOUT actually produced; the tree
    # hash is what the FILES actually contain. Only the tree hash moves if a later
    # step edits the working tree, and only the first two can reveal a checkout
    # that resolved somewhere else entirely.
    #
    # The assertion accepts the pull-request head sha as well as `github.sha`,
    # because on a `pull_request` event the two legitimately differ: `github.sha`
    # names the ephemeral merge commit, so a checkout configured for the branch
    # tip would land on the head sha instead. Both are attributable. A third
    # value is not, and is what fails the job.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # Each of the four std-off runs asserts its own count, for the reason spelled
    # out above the `build-test` job's `Test` step: `cargo test` exits 0 when
    # tests are silently lost, and AAP directive D-5 fixes the suite at
    # "preserved and only ever increased, zero ignored" (finding TEST-08).
    #
    # The floor is STD_OFF_FLOOR (713) on all four, the measured std-off total. It is
    # LOWER than the default-feature total by design: `gz-io` is off, so the
    # `tests/gzip_compat.rs` target contributes nothing and several
    # `cfg(feature = "gz-io")` unit tests do not exist. That gap is the reason
    # this job has its own floor instead of reusing `build-test`'s.
    #
    # THE FLOOR IS NAMED ONCE FOR ALL FOUR BRANCHES, in the job-scoped
    # `STD_OFF_FLOOR` above, which the summary line, the predicate and the failure
    # diagnostic of every branch all read. That is not style. When the number is
    # typed out three times per branch a branch can - and did - end up announcing
    # one floor while enforcing a lower one, which is strictly worse than having no
    # floor at all: the log looks like a gate and the predicate is not one. One
    # declaration makes the announced floor and the enforced floor the same value by
    # construction, for every branch at once, and `package-verify` follows the same
    # rule with its own `PACKAGED_FLOOR`.
    - name: Test (no default features)
      run: |
        set -euo pipefail
        # The floor is the job-scoped `STD_OFF_FLOOR` declared once in this job's
        # `env:` - read by the summary echoed below, by the predicate that enforces
        # it, and by the failure message, so the three cannot disagree.
        log="$(mktemp)"
        cargo +stable test --locked --no-default-features 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=$STD_OFF_FLOOR"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge "$STD_OFF_FLOOR" ] || { echo "::error::only $2 std-off tests ran, below the floor"\
          " of $STD_OFF_FLOOR - tests were lost, not merely skipped"; exit 1; }
    - name: Test (no-std feature)
      run: |
        set -euo pipefail
        # The floor is the job-scoped `STD_OFF_FLOOR` declared once in this job's
        # `env:` - read by the summary echoed below, by the predicate that enforces
        # it, and by the failure message, so the three cannot disagree.
        log="$(mktemp)"
        cargo +stable test --locked --no-default-features --features no-std 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=$STD_OFF_FLOOR"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge "$STD_OFF_FLOOR" ] || { echo "::error::only $2 no-std tests ran, below the floor"\
          " of $STD_OFF_FLOOR - tests were lost, not merely skipped"; exit 1; }
    # Both std-off rows again under the SHIPPED profile. See the rationale on the
    # `build-test` job's release step: `[profile.release]`'s `opt-level = 3` +
    # `codegen-units = 1` can decide whether an assertion holds, so the profile
    # that ships has to be the profile that is tested.
    - name: Test (no default features, release profile)
      run: |
        set -euo pipefail
        # The floor is the job-scoped `STD_OFF_FLOOR` declared once in this job's
        # `env:` - read by the summary echoed below, by the predicate that enforces
        # it, and by the failure message, so the three cannot disagree.
        log="$(mktemp)"
        cargo +stable test --locked --release --no-default-features 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=$STD_OFF_FLOOR"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge "$STD_OFF_FLOOR" ] || { echo "::error::only $2 std-off release tests ran, below the"\
          " floor of $STD_OFF_FLOOR - tests were lost, not merely skipped"; exit 1; }
    - name: Test (no-std feature, release profile)
      run: |
        set -euo pipefail
        # The floor is the job-scoped `STD_OFF_FLOOR` declared once in this job's
        # `env:` - read by the summary echoed below, by the predicate that enforces
        # it, and by the failure message, so the three cannot disagree.
        log="$(mktemp)"
        cargo +stable test --locked --release --no-default-features --features no-std 2>&1 \
          | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=$STD_OFF_FLOOR"
        [ "$1" -ge 1 ] || { echo "::error::no 'test result:' line was produced -"\
          " the harness never ran, so nothing was verified"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed"; exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored; AAP directive D-5"\
          " requires zero ignored tests"; exit 1; }
        [ "$2" -ge "$STD_OFF_FLOOR" ] || { echo "::error::only $2 no-std release tests ran, below the"\
          " floor of $STD_OFF_FLOOR - tests were lost, not merely skipped"; exit 1; }

    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Formatting and linting. Clippy runs with warnings promoted to errors.
  #
  # This job is the reason the explicit selection below is mandatory rather than
  # merely tidy, and the `+stable` prefixes are what make it a CURRENT-STABLE
  # gate: clippy's lint SET is not stable across releases, so `-D warnings` on an
  # older clippy can reintroduce diagnostics upstream has since withdrawn. This
  # job must therefore run the clippy the project actually gates on, not whatever
  # clippy ships with the MSRV pin in `rust-toolchain.toml`. The MSRV contract
  # this project actually defines is `cargo build` + `cargo check --all-targets`,
  # which is what the `msrv` job below runs - deliberately never clippy.
  lint:
    name: Lint (clippy + rustfmt + rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS. Every verdict below describes ONE
    # commit, and a log that does not name that commit is unattributable evidence:
    # it cannot be told apart from a run against a different tree, a different
    # clone, or artifacts that predate the commit under review. That is not
    # hypothetical - a checkpoint review found the retained runtime logs for this
    # project pointing at another clone, which left the commit actually under
    # assessment with no build, test, lint, MSRV, symbol or oracle proof at all
    # (finding M8-01). Naming the commit FIRST is what makes every line that
    # follows self-describing.
    #
    # THREE WITNESSES, deliberately, because they can disagree and each
    # disagreement means something different. `github.sha` is what the EVENT
    # named; `git rev-parse HEAD` is what the CHECKOUT actually produced; the tree
    # hash is what the FILES actually contain. Only the tree hash moves if a later
    # step edits the working tree, and only the first two can reveal a checkout
    # that resolved somewhere else entirely.
    #
    # The assertion accepts the pull-request head sha as well as `github.sha`,
    # because on a `pull_request` event the two legitimately differ: `github.sha`
    # names the ephemeral merge commit, so a checkout configured for the branch
    # tip would land on the head sha instead. Both are attributable. A third
    # value is not, and is what fails the job.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        components: clippy, rustfmt
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo fmt --version
        cargo clippy --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Format check
      run: cargo +stable fmt --all -- --check
    # `--all-features` is REQUIRED, not decorative. `--all-targets` alone SKIPS
    # `tests/c_oracle.rs`, which carries `required-features = ["c-oracle"]`, and
    # leaves the `inflate_strict` arms unlinted - precisely where a lint regression
    # would hide longest, since no other job here promotes warnings to errors.
    # Enabling `c-oracle` costs nothing at lint time: clippy only type-checks, and
    # that harness shells out to a C compiler at RUN time.
    #
    # What `--all-features` CANNOT reach is `src/lib.rs`'s `no_std_support` block:
    # enabling every feature turns `std` on, and that block requires
    # `not(feature = "std")`. It is compiled by the std-off library builds instead
    # (the `no_std library (build only)` matrix row and `bare-metal-no-std`), and
    # neither of those promotes warnings to errors - an accepted gap, not a claim
    # this job covers.
    #
    # `--locked` is part of the gate for the same reason as in every other job:
    # clippy resolves the graph before it lints, so without it a lint-clean run
    # can be a run against a resolution no commit contains. It sits before the
    # `--` separator because everything after it is passed to the lint driver,
    # not to Cargo.
    #
    # `src/lib.rs`'s `the_lint_job_runs_the_documented_clippy_gate` asserts this
    # exact command, so the narrower spelling cannot come back unnoticed. That
    # test also asserts the same string in `.cargo/config.toml`, so the two move
    # together by construction.
    - name: Clippy
      run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
    # ZERO IGNORED TESTS, ENFORCED AT THE SOURCE (finding TEST-08).
    #
    # The count assertions on the test jobs catch an `#[ignore]` only where the
    # ignored test would otherwise have run: `ignored=0` is read from a summary
    # line, so a test ignored behind a `cfg` this row does not compile is
    # invisible there. This scan closes that hole from the other side, over the
    # whole source tree at once, and it is the cheaper half of the gate - no
    # compilation, one grep.
    #
    # THE PATTERN IS ANCHORED, and that is what makes it usable. Six files in this
    # repository DISCUSS `#[ignore]` in prose (`src/ffi/mod.rs`,
    # `tests/regression.rs`, `tests/c_oracle.rs` among them), because "this suite
    # has no ignored tests" is itself a documented property. An unanchored grep
    # would match every one of those sentences and the gate would be permanently
    # red, so it matches only a line whose first non-whitespace is the attribute
    # itself. `#[ignore = "..."]` and `#[ ignore ]` are both caught; a mention
    # inside a doc comment or a string is not.
    #
    # `cfg_attr` CANNOT BE CHECKED WITH A GREP, and is delegated to the crate in
    # the step below. `#[cfg_attr(<pred>, ignore)]` is an `#[ignore]` that only
    # shows itself under one configuration - the exact failure mode the
    # summary-line check cannot see - but a line-oriented regex cannot recognise
    # it. The pattern used here previously,
    # `#\[[[:space:]]*cfg_attr\([^)]*[^a-z_]ignore`, missed the two forms most
    # likely to be written by accident, and both were verified to slip through:
    #
    #   * a NESTED predicate. `[^)]*` cannot cross a `)`, so in
    #     `cfg_attr(all(unix, target_pointer_width = "64"), ignore)` the class
    #     stops at the `)` closing `all(..)` and never reaches the `ignore`.
    #   * a MULTILINE attribute, which rustfmt produces whenever the predicate is
    #     long. `grep` matches within one line and cannot see it at all.
    #
    # Recognising those needs Rust's nesting, so the check lives in the crate,
    # where it blanks comments and literals first and then reads each attribute as
    # a BALANCED bracket group spanning any number of lines.
    - name: 'Assert no test is disabled with #[ignore]'
      run: |
        set -euo pipefail
        roots='src tests benches build.rs fuzz/fuzz_targets'
        status=0
        if hits="$(grep -rnE '^[[:space:]]*#\[[[:space:]]*ignore' $roots)"; then
          echo "::error::an #[ignore] attribute was added; AAP directive D-5 requires the"\
               " suite to be preserved and only ever increased, with zero ignored tests:"
          echo "$hits"
          status=1
        fi
        if [ "$status" -eq 0 ]; then
          echo "no unconditional #[ignore] attribute anywhere in $roots"
        fi
        exit "$status"

    # The `cfg_attr` half of the same gate, delegated to the crate for the reasons
    # given above. Run by name so the coverage is legible in the log, and the
    # summary line is ASSERTED rather than trusted: a renamed or deleted test makes
    # a filter match nothing, and `cargo test` reports "0 passed" and exits 0, so
    # the count is the only thing standing between this step and silent vacuity.
    #
    #   * `no_test_in_the_repository_is_disabled_with_ignore` is the balanced,
    #     comment-aware scan over the same `roots` as the grep above.
    #   * `the_conditional_ignore_scanner_catches_simple_nested_and_multiline_forms`
    #     is the scanner's own fixture set, including the nested and multiline forms
    #     the old regex missed - it proves the scan still BITES, not merely that it
    #     runs.
    #   * `the_ignore_scan_covers_the_same_roots_as_ci` asserts that the `roots`
    #     list above and the crate's `IGNORE_SCAN_ROOTS` are the same set, so a root
    #     added to one and not the other cannot become a silently unscanned tree.
    - name: 'Assert no test is disabled with #[cfg_attr(..., ignore)]'
      run: |
        set -euo pipefail
        log="$(mktemp)"
        cargo +stable test --locked --lib -- \
          tests::no_test_in_the_repository_is_disabled_with_ignore \
          tests::the_conditional_ignore_scanner_catches_simple_nested_and_multiline_forms \
          tests::the_ignore_scan_covers_the_same_roots_as_ci 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { p += $4; f += $6; i += $8 } END { printf "%d %d %d", p, f, i }' "$log")
        if [ "$2" -ne 0 ] || [ "$3" -ne 0 ]; then
          echo "::error::conditional-ignore scan reported $2 failed and $3 ignored; both must be 0"
          exit 1
        fi
        if [ "$1" -ne 3 ]; then
          echo "::error::expected exactly 3 conditional-ignore scan tests to run, got $1;"\
               " a test was renamed or removed and the filter silently matched nothing"
          exit 1
        fi
        echo "conditional-ignore scan: $1 passed, 0 failed, 0 ignored"

  # Documentation gates (finding TEST-02). README.md, CONTRIBUTING.md and
  # `doc/technical-specifications.md` all describe rustdoc-with-warnings-denied
  # and `mkdocs build --strict` as BLOCKING gates of this project, and until this
  # job existed neither was run anywhere in CI - the claim rested entirely on
  # someone remembering to run both locally. AAP standard S10 requires the
  # documented gates to be the gates that actually run.
  #
  # TWO GATES, ONE JOB, because they fail for unrelated reasons and both are
  # cheap. Keeping them in one job means the "documentation is broken" signal is
  # one red square rather than two, while the two named steps below still
  # attribute the failure to the right half without opening the log.
  #
  #   rustdoc  `-D warnings` promotes rustdoc's own diagnostics to errors, which
  #            is what makes a broken intra-doc link or an undocumented public
  #            item fail rather than warn. `--all-features` is required for the
  #            same reason the `lint` job needs it: the feature-gated surface
  #            (`c-oracle`, `inflate_strict`) is otherwise never documented, and
  #            `#![warn(missing_docs)]` cannot speak about code that was not
  #            compiled. What `--all-features` CANNOT reach is the freestanding
  #            `no_std_support` runtime block: enabling every feature turns
  #            `std` on, and that block's predicate requires
  #            `not(feature = "std")`, so this gate never documents it and no
  #            spelling of this job could. The std-off library builds are what
  #            compile it - the `no_std library (build only)` row in
  #            `build-test` and the `bare-metal-no-std` job. `--no-deps` keeps
  #            the gate about THIS crate: a warning in a dependency's
  #            documentation is not this repository's defect and must not be
  #            able to fail its CI.
  #   MkDocs   `--strict` turns a nav entry pointing at a missing page, a broken
  #            relative link and an unrecognised config key into errors. That is
  #            the check that would have caught `docs/index.md` being orphaned
  #            from the published site, and it is the only gate here that reads
  #            `mkdocs.yml` at all.
  #
  # THE PYTHON SIDE IS PINNED, exactly like the cargo-deny and cargo-fuzz pins in
  # the other two workflows: an unpinned `pip install mkdocs` would let an
  # upstream release decide, on a schedule nobody controls, whether this
  # repository's documentation builds. The three versions below are the ones the
  # site was authored and measured against.

    # A resolving job must PROVE it honoured the committed resolution, not merely
    # state the intent: a rewritten lockfile is the one build-input change that
    # leaves no other trace in the log. `!cancelled()` keeps this verified on the
    # failure path too, where a stray rewrite would otherwise hide behind an
    # unrelated red result.
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."
  docs:
    name: Documentation gates (rustdoc + MkDocs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header. rustdoc's diagnostic set moves with
    # the compiler, so this gate has to name the channel it gates on: `-D
    # warnings` on the MSRV floor's rustdoc is a different gate, and it is not
    # the one this project documents.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS. Every verdict below describes ONE
    # commit, and a log that does not name that commit is unattributable evidence:
    # it cannot be told apart from a run against a different tree, a different
    # clone, or artifacts that predate the commit under review. That is not
    # hypothetical - a checkpoint review found the retained runtime logs for this
    # project pointing at another clone, which left the commit actually under
    # assessment with no build, test, lint, MSRV, symbol or oracle proof at all
    # (finding M8-01). Naming the commit FIRST is what makes every line that
    # follows self-describing.
    #
    # THREE WITNESSES, deliberately, because they can disagree and each
    # disagreement means something different. `github.sha` is what the EVENT
    # named; `git rev-parse HEAD` is what the CHECKOUT actually produced; the tree
    # hash is what the FILES actually contain. Only the tree hash moves if a later
    # step edits the working tree, and only the first two can reveal a checkout
    # that resolved somewhere else entirely.
    #
    # The assertion accepts the pull-request head sha as well as `github.sha`,
    # because on a `pull_request` event the two legitimately differ: `github.sha`
    # names the ephemeral merge commit, so a checkout configured for the branch
    # tip would land on the head sha instead. Both are attributable. A third
    # value is not, and is what fails the job.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Same rank-2-over-rank-4 argument as every other job here: installing a
    # toolchain does not select it, so the override is asserted before any gate
    # runs rather than trusted.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Build the API documentation with warnings denied
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo +stable doc --locked --no-deps --all-features --verbose
    # Proving the gate produced something is not paranoia: `RUSTDOCFLAGS` is read
    # from the environment, so a typo in the key above would silently disable the
    # denial while `cargo doc` still exited 0. If the crate root page is missing,
    # rustdoc did not document this crate and the step above proved nothing.
    - name: Assert rustdoc produced the crate documentation
      run: |
        set -euo pipefail
        page='target/doc/zlib_rs/index.html'
        [ -s "$page" ] || { echo "::error::rustdoc exited 0 but produced no ${page}."\
          " The gate above did not document this crate."; exit 1; }
        echo "rustdoc produced ${page} with warnings denied"
    # A FULL PATCH RELEASE, not the `3.12` series. A series request resolves to
    # whatever patch the runner's tool cache happens to hold on the day, so the
    # interpreter running the docs gate would change without a commit - the same
    # defect `--locked` exists to prevent on the Rust side. It also has a concrete
    # consequence here: the hash-pinned closure in the next step carries `cp312`
    # wheel digests, so the interpreter minor version is part of what that lock is
    # a lock FOR.
    #
    # Refreshing the patch is ordinary maintenance: bump it here and in the
    # assertion in the next step, in the same commit.
    - name: Install Python for the documentation site
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12.13'
    # THE PYTHON GRAPH IS HASH-LOCKED, for the same reason every cargo invocation
    # in this file carries `--locked`.
    #
    # Naming the three direct requirements pinned three packages and floated the
    # other forty-three, every one of which executes on the runner with read
    # access to the checkout. A new compatible release of any of them - or a
    # compromised maintainer account - changed what CI ran with no diff in this
    # repository and no review. `==` alone would not close it either: a version
    # binds a name to a release, a digest binds it to the exact bytes.
    #
    # `--require-hashes` does two things, and the second is the one that makes
    # this a gate rather than a gesture: it verifies every artifact against the
    # committed digest, AND it refuses to resolve any requirement that is not
    # pinned - so a dependency that appears in a later release cannot enter the
    # install unnoticed, it fails the job. `--only-binary=:all:` keeps that
    # airtight, because building a source distribution would pull unhashed
    # build-time dependencies that `--require-hashes` cannot cover.
    #
    # The interpreter and the three direct versions are asserted AFTER the
    # install, so the log states what actually landed instead of what was asked
    # for.
    #
    # THE CLOSURE IS INLINE, in the heredoc inside the step below, and it is
    # written to `$RUNNER_TEMP` rather than kept as a checked-in requirements
    # file. This workflow is the authorized home for the docs gate, so the gate's
    # data lives here with the gate rather than in a separate path; and writing it
    # outside the checkout keeps the tree clean for the `git status --porcelain`
    # assertions in this file, which must fail only for a real regression.
    #
    # TARGET ENVIRONMENT: CPython 3.12 on 64-bit Linux (`ubuntu-latest`), which is
    # why `python-version` above pins a FULL patch release rather than the `3.12`
    # series. Each entry carries the digests of every artifact CPython 3.12 on
    # manylinux-x86_64 can legitimately select: the pure-Python `py3`/`py2.py3`
    # wheel, plus the `cp312-cp312` manylinux x86_64 wheel where the project
    # publishes compiled artifacts. Source distributions are deliberately NOT
    # listed and the install passes `--only-binary=:all:`, because building an
    # sdist under `--require-hashes` would need unhashed build-time dependencies.
    # A different interpreter minor version or a non-x86_64 runner fails the
    # install rather than silently installing something else; regenerate for the
    # new target instead of relaxing the gate.
    #
    # HOW TO REGENERATE (do this; never hand-edit a digest):
    #
    #   1. python -m pip download -d /tmp/docs-wheels --only-binary=:all: \
    #        --python-version 3.12 --implementation cp --abi cp312 \
    #        --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 \
    #        --platform manylinux_2_28_x86_64 --platform any \
    #        'mkdocs==1.6.1' 'mkdocs-techdocs-core==1.7.0' \
    #        'mkdocs-mermaid2-plugin==1.2.3'
    #   2. Record the sha256 digests PyPI publishes for each resolved name's
    #      CPython-3.12-compatible wheels (`pip hash <file>` also works on the
    #      downloaded artifacts).
    #   3. Verify, which must exit 0 — extract the heredoc below to a file first:
    #        python -m pip download -d /tmp/docs-verify --require-hashes \
    #          --only-binary=:all: --python-version 3.12 --implementation cp \
    #          --abi cp312 --platform manylinux_2_17_x86_64 \
    #          --platform manylinux2014_x86_64 --platform manylinux_2_28_x86_64 \
    #          --platform any -r <extracted-file>
    #   4. Bump the three direct versions ONLY in a deliberate commit, keeping the
    #      read-back assertion in this step in step with them.
    #
    # The three DIRECT requirements are `mkdocs`, `mkdocs-techdocs-core` and
    # `mkdocs-mermaid2-plugin`; every other entry is transitive. The comment above
    # each entry names the artifacts its digests cover.
    - name: Install the pinned MkDocs toolchain
      run: |
        set -euo pipefail
        python -VV
        want_python='3.12.13'
        got_python="$(python -c 'import platform; print(platform.python_version())')"
        [ "$got_python" = "$want_python" ] || { echo "::error::the docs job resolved"\
          " CPython $got_python, not the pinned $want_python. The setup-python input"\
          " above and the cp312 wheel digests in the closure below no longer"\
          " describe the same interpreter"; exit 1; }
        # `$RUNNER_TEMP`, not the checkout: the closure is job input, not a
        # tracked artifact, and the tree must stay clean for the
        # `git status --porcelain` assertions in this workflow. The heredoc is
        # quoted (`<<'REQS'`) so no `$` or `\` in a digest line is expanded.
        reqs="$RUNNER_TEMP/docs-requirements.txt"
        cat > "$reqs" <<'REQS'
