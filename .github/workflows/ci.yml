            return {os.path.basename(p)[:-3] for p in TESTS} - {"c_oracle"}


        def decomp_blobs(body):
            """Every per-suite integration decomposition in `body`, as (offset, text).

            Recognised by its first and last suite as published: one opens at a
            `checksum <n>` mention and closes at the `round_trip <n>` ending the same
            parenthetical. Returning the raw span lets the caller parse whatever
            separator that document happens to use - commas in the prose files, middle
            dots in the Project Guide - without this gate having to know which.
            """
            out = []
            for m in re.finditer(r"`?checksum`? \d+", body):
                window = body[m.start():m.start() + 500]
                end = re.search(r"`?round_trip`? \d+", window)
                if end:
                    out.append((m.start(), window[:end.end()]))
            return out


        def check_decompositions():
            """Assert every published per-suite decomposition is complete and consistent.

            Two properties, neither of which needs a test run:

            * COMPLETE - it names every suite that runs by default, each exactly once.
              This is the check that would have caught three public documents printing
              six suites while claiming a seven-suite total, their visible lists summing
              to 132 against a stated 143.
            * CONSISTENT - all default-feature decompositions agree suite by suite, and
              each sums to the total published immediately beside it. Cross-document
              agreement is what catches one document drifting alone, which is how
              `round_trip` came to read 19 in three files and 20 in two others.

            A span is treated as a decomposition only once it names at least four default
            suites, so an incidental `checksum <n>` mention elsewhere in the prose cannot
            be mistaken for one.
            """
            want = default_suites()
            bad = 0
            profiles = {}
            for f in DECOMP_FILES:
                with open(os.path.join(ROOT, f), encoding="utf-8") as fh:
                    body = fh.read()
                for off, blob in decomp_blobs(body):
                    pairs = [(n, int(v)) for n, v in SUITE_PAIR.findall(blob) if n in want]
                    named = [n for n, _ in pairs]
                    if len(set(named)) < 4:
                        continue
                    line = body[:off].count("\n") + 1
                    missing = sorted(want - set(named))
                    dupes = sorted({n for n in named if named.count(n) > 1})
                    if missing or dupes:
                        print("::error::%s:%d: the integration decomposition is not a"
                              " census of the suites that run by default - missing %s,"
                              " duplicated %s. Every suite in tests/ except the opt-in"
                              " c_oracle must appear exactly once."
                              % (f, line, missing or "nothing", dupes or "nothing"))
                        bad += 1
                        continue
                    total = sum(v for _, v in pairs)
                    before = re.findall(r"\d[\d,]*", body[max(0, off - 160):off])
                    stated = int(before[-1].replace(",", "")) if before else 0
                    if stated >= 100 and stated != total:
                        print("::error::%s:%d: the integration decomposition sums to %d,"
                              " but the total published beside it is %d."
                              % (f, line, total, stated))
                        bad += 1
                        continue
                    counts = dict(pairs)
                    # Only default-feature rows are comparable across documents; the
                    # std-off row legitimately has a different shape (gzip_compat 0).
                    if counts.get("gzip_compat", 0) > 0:
                        key = (total, tuple(sorted(counts.items())))
                        profiles.setdefault(key, []).append("%s:%d" % (f, line))
            if not profiles:
                print("::error::no default-feature integration decomposition was found"
                      " across %s. Move the wording if it changed; do not drop it."
                      % DECOMP_FILES)
                bad += 1
            elif len(profiles) > 1:
                print("::error::published default-feature integration decompositions"
                      " disagree with one another: %s. They all describe one command, so"
                      " they must be identical."
                      % "; ".join("%s at %s" % (dict(k[1]), ", ".join(v))
                                  for k, v in sorted(profiles.items())))
                bad += 1
            # The unanimous default integration total identifies the default feature
            # row for check_cross_run, so no row total has to be hardcoded there.
            integ = next(iter(profiles))[0] if len(profiles) == 1 else None
            return bad, integ


        CROSS_RUN = re.compile(
            r"Measured: (\d+) library tests here against (\d+) on the two LP64")
        CROSS_PAIR_DOC = re.compile(
            r"measured \*\*(\d+)\*\* library tests on 32-bit i686 against"
            r" \*\*(\d+)\*\* on the two LP64")
        UNIT_TOTAL = [
            re.compile(r"\*{0,2}(\d+)\*{0,2} in-crate unit tests, \*{0,2}(\d+)\*{0,2}"),
            re.compile(r"\((\d+) unit, (\d+) integration"),
            re.compile(r"(\d+) unit \+ (\d+) integration"),
        ]
        UNIT_FILES = ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
                      PG, TS, BPG]


        def published_unit_totals():
            """Bucket every published (unit, integration) test pair by its row.

            Returns {integration_total: {unit_total: ["<file>:<line>", ...]}}.

            Bucketing matters because the documents publish the same shape for more
            than one feature row - the default row and the two std-off rows - and a
            flat scan conflates them. The integration half identifies the row, so no
            row total has to be hardcoded here.

            The unit count itself cannot be recomputed by this gate, which never
            runs cargo. Statically re-deriving it would mean hand-evaluating `cfg`
            predicates plus module-level gates; that drifts on innocent refactors
            and would be a worse hazard than the staleness it prevents. What IS
            checkable, and what actually failed in practice, is agreement: the
            figure is published in seven documents, so any single copy going stale
            is caught by unanimity within its bucket.
            """
            seen = {}
            for rel in UNIT_FILES:
                path = os.path.join(ROOT, rel)
                if not os.path.exists(path):
                    continue
                with open(path, encoding="utf-8") as fh:
                    body = fh.read()
                for pat in UNIT_TOTAL:
                    for m in pat.finditer(body):
                        line = body[:m.start()].count("\n") + 1
                        unit, integ = int(m.group(1)), int(m.group(2))
                        (seen.setdefault(integ, {}).setdefault(unit, [])
                         .append("%s:%d" % (rel, line)))
            return seen


        def check_cross_run(measured, integ_total):
            """Assert the ILP32-vs-LP64 library-test commentary is self-consistent.

            Three independent invariants, because the first one alone proved too
            weak - a pair that was stale in BOTH numbers preserved the difference
            and slipped through:

            1. DELTA. The i686 row is lower by exactly the number of tests gated to
               LP64 non-Windows targets, and that gate count IS measurable here.
            2. ABSOLUTE. The LP64 half must equal the in-crate unit-test total
               published across the seven documents that name it, which pins the
               pair to a figure the rest of the tree already agrees on. `integ_total`
               selects the default feature row, so no row total is hardcoded.
            3. AGREEMENT. Every document that publishes the pair must publish the
               same pair. This is the invariant that the original drift violated:
               the workflow comment went stale while the prose stayed current.

            Self-match note: these patterns are applied to the file they live in,
            but every literal above holds `(\\d+)` rather than digits, so none can
            match its own source line. Any pattern added here must preserve that.
            """
            want = measured["lp64_only_tests"]
            bad = 0
            pairs = []
            with open(os.path.join(ROOT, WORKFLOWS[0]), encoding="utf-8") as fh:
                body = fh.read()
            for m in CROSS_RUN.finditer(body):
                pairs.append((WORKFLOWS[0], body[:m.start()].count("\n") + 1,
                              int(m.group(1)), int(m.group(2))))
            for rel in UNIT_FILES:
                path = os.path.join(ROOT, rel)
                if not os.path.exists(path):
                    continue
                with open(path, encoding="utf-8") as fh:
                    doc = fh.read()
                for m in CROSS_PAIR_DOC.finditer(doc):
                    pairs.append((rel, doc[:m.start()].count("\n") + 1,
                                  int(m.group(1)), int(m.group(2))))
            if not pairs:
                print("::error::the ILP32-vs-LP64 library-test sentence was not found"
                      " in %s or any document. Move these patterns with the wording;"
                      " do not drop them." % WORKFLOWS[0])
                return bad + 1

            # (1) delta
            for rel, line, lo, hi in pairs:
                if hi - lo != want:
                    print("::error::%s:%d: publishes %d ILP32 against %d LP64 library"
                          " tests, a delta of %d, but %d test(s) under src/ are gated to"
                          " LP64 non-Windows targets."
                          % (rel, line, lo, hi, hi - lo, want))
                    bad += 1

            # (2) absolute, against the unit total the rest of the tree publishes
            buckets = published_unit_totals()
            for integ, units in sorted(buckets.items()):
                if len(units) > 1:
                    print("::error::the in-crate unit-test total for the row with %d"
                          " integration tests is published inconsistently: %s. Every"
                          " copy must name the same number."
                          % (integ, "; ".join("%d at %s" % (v, ", ".join(s))
                                              for v, s in sorted(units.items()))))
                    bad += 1
            default_units = None
            if integ_total is not None and len(buckets.get(integ_total, {})) == 1:
                default_units = next(iter(buckets[integ_total]))
            if default_units is None:
                print("::error::could not identify the default-row in-crate unit-test"
                      " total (integration total %s, buckets %s). The cross-run pair"
                      " cannot be pinned without it."
                      % (integ_total, sorted(buckets)))
                bad += 1
            else:
                for rel, line, lo, hi in pairs:
                    if hi != default_units:
                        print("::error::%s:%d: publishes %d LP64 library tests, but the"
                              " default-row in-crate unit-test total published across the"
                              " tree is %d. These are the same quantity and must agree."
                              % (rel, line, hi, default_units))
                        bad += 1

            # (3) agreement between every document that names the pair
            distinct = {(lo, hi) for _, _, lo, hi in pairs}
            if len(distinct) > 1:
                print("::error::the ILP32-vs-LP64 pair is published inconsistently:"
                      " %s. Every copy must name the same pair."
                      % "; ".join("%s:%d says %d/%d" % p for p in sorted(pairs)))
                bad += 1
            return bad


        def main():
            measured = {}
            for k, fn in MEASURE.items():
                measured[k] = fn()

            print("== measured counters ==")
            for k in sorted(measured):
                print("   %-22s %s" % (k, measured[k]))
            print()

            bad = 0
            checked = 0
            for files, pattern, key, min_hits in CLAIMS:
                want = measured[key]
                hits = 0
                rx = re.compile(pattern, re.M)
                for f in files:
                    with open(os.path.join(ROOT, f), encoding="utf-8") as fh:
                        body = fh.read()
                    for m in rx.finditer(body):
                        hits += 1
                        got = int(m.group(1).replace(",", ""))
                        if got != want:
                            line = body[:m.start()].count("\n") + 1
                            print("::error::%s:%d: publishes %s for `%s`, but the tree measures %s."
                                  % (f, line, m.group(1), key, want))
                            bad += 1
                if hits < min_hits:
                    print("::error::claim for `%s` matched %d time(s) across %s, expected at least %d."
                          " Either the documentation dropped the figure or its wording changed and this"
                          " gate's pattern must move with it." % (key, hits, files, min_hits))
                    bad += 1
                checked += hits

            # Shape and arithmetic, which a single-number claim cannot express.
            decomp_bad, integ_total = check_decompositions()
            bad += decomp_bad
            bad += check_cross_run(measured, integ_total)

            print("checked %d published figure(s) across %d claim group(s), plus the"
                  " integration-decomposition census and the cross-run ILP32/LP64"
                  " delta, absolute and cross-document agreement"
                  % (checked, len(CLAIMS)))
            if bad:
                print("::error::%d documented metric(s) disagree with the tree." % bad)
                return 1
            print("every documented tree metric matches the tree")
            return 0


        if __name__ == "__main__":
            sys.exit(main())
        DOCMETRICS

    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Minimum Supported Rust Version gate: pins the toolchain to 1.85.0 (the
  # release that stabilized the 2024 edition) and verifies the crate builds and
  # type-checks across all targets on that exact version.
  #
  # Three places state this version and they must move together: the
  # `toolchain: 1.85.0` install input and the `+1.85.0` prefixes here, `channel`
  # in `rust-toolchain.toml`, and `rust-version` in `Cargo.toml`. The prefix is
  # explicit even though the toolchain file happens to select the same compiler,
  # so this job verifies the version it is named after rather than whatever the
  # pin currently says. Note the scope: build and type-check only. Clippy is
  # NOT run here -- see the `lint` job above.
  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ONE job that intentionally runs on the floor. Set explicitly rather
    # than relying on `rust-toolchain.toml` happening to hold the same value:
    # this job's guarantee is "the crate builds on exactly the declared MSRV", so
    # the version it runs must be stated here. The two now corroborate each other
    # rather than one silently standing in for the other, so raising the MSRV means
    # changing three places in the same commit: this value, `channel` in
    # `rust-toolchain.toml`, and `rust-version` in `Cargo.toml`.
    env:
      # Unquoted deliberately: YAML parses this to the same string either way,
      # and the crate-root CI-contract test greps for the literal
      # `RUSTUP_TOOLCHAIN: 1.85.0`.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust 1.85.0 toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: 1.85.0
    # Fails the job if the `RUSTUP_TOOLCHAIN` override above is ever lost, rather
    # than letting this gate report a version it did not actually run on.
    - name: Verify the resolved toolchain is 1.85.0
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          1.85.0-*) ;;
          *) echo "::error::expected the 1.85.0 toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # `--locked` matters most here. The MSRV claim is a claim about the COMMITTED
    # resolution: a dependency that re-resolves to a newer release can raise its
    # own `rust-version` and turn this job red - or, worse, hide a genuine MSRV
    # break behind a resolution nobody ships.
    - name: Build with MSRV
      run: cargo +1.85.0 build --locked --verbose
    # `--all-features` is what makes this job's verdict cover the WHOLE manifest.
    # The build step above compiles the default feature set; without this flag the
    # optional rows would never see the floor compiler, and `Cargo.toml` would be
    # claiming MSRV evidence for features nothing on 1.85.0 had ever compiled:
    # `inflate_strict`'s arms in `src/inflate/{fast,mod}.rs` and the `c-oracle`
    # `[[test]]` target (`tests/c_oracle.rs`, `required-features = ["c-oracle"]`)
    # are both invisible to a default-feature check. `--all-targets` widens the
    # same check to the test, bench and example targets, so the two flags are
    # complementary rather than redundant. What neither can reach is the
    # freestanding `no_std_support` block, whose predicate needs
    # `not(feature = "std")`; the std-off rows own that surface.
    - name: Check all targets and all features with MSRV
      run: cargo +1.85.0 check --locked --verbose --all-targets --all-features
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Benchmark compile check: ensures the three criterion benches
  # (deflate_bench, inflate_bench, checksum_bench; all harness = false) compile
  # without actually running them.
  benches:
    name: Bench compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Current stable, not the MSRV floor pinned by rust-toolchain.toml. See
    # "TOOLCHAIN SELECTION" in the header.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Compile benchmarks (no run)
      run: cargo +stable bench --locked --no-run
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Build-script tests - a BLOCKING gate for the generated CRC table contract
  # and the optional cdylib version-script wiring (AAP section 0.3.1 / gap D8).
  #
  # `cargo test` never compiles `build.rs`, so without this job the generator has
  # no test coverage at all and producer/consumer drift can pass every other gate
  # (the finding this job closes). The file is therefore compiled as its own test
  # binary. The edition is read from `Cargo.toml` rather than hard-coded, so the
  # two cannot drift apart.
  build-script-tests:
    name: Build script tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    # `s390x-unknown-linux-gnu` is declared through this action's `targets:` input,
    # the single sanctioned mechanism for naming a triple in this file (see
    # "NATIVE vs CROSS" in the header). The big-endian step below only `cargo
    # check`s, so no cross linker or emulator is needed - just the target's rustlib.
    # Do NOT reintroduce a `rustup target add` step: it would name a channel a
    # second time and could disagree with both the pinned action ref installed here
    # and the rank-2 `RUSTUP_TOOLCHAIN` set above.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        targets: s390x-unknown-linux-gnu
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # Assert the target the step above was asked to install is actually present,
    # so a silent action-input change surfaces here rather than as a puzzling
    # build error inside the big-endian check.
    - name: Verify the big-endian cross target is installed
      run: |
        set -euo pipefail
        installed="$(rustup target list --installed --toolchain stable)"
        echo "$installed"
        case "$installed" in
          *s390x-unknown-linux-gnu*) ;;
          # The backticks below are escaped on purpose. Inside a double-quoted
          # shell string an unescaped pair is command substitution, so bash would
          # try to run `targets:`, print "command not found", and *delete* the word
          # from the diagnostic - corrupting the message at the moment an operator
          # most needs it. `actionlint` does not flag this class.
          *) echo "::error::s390x-unknown-linux-gnu is not installed on the stable"\
             " toolchain. The \`targets:\` input on the install step above was lost."; exit 1 ;;
        esac
    - name: Compile and run the build-script test binary
      run: |
        set -euo pipefail
        edition=$(sed -n 's/^edition[[:space:]]*=[[:space:]]*"\([0-9]*\)".*/\1/p' Cargo.toml | head -1)
        if [ -z "$edition" ]; then
          echo "::error file=Cargo.toml::could not read the package edition"
          exit 1
        fi
        echo "compiling build.rs as a test binary (edition $edition)"
        rustc +stable --edition "$edition" --test build.rs -o "$RUNNER_TEMP/buildrs_tests" \
              --deny warnings
        # THE SUMMARY IS ASSERTED, NOT TRUSTED. A harness that ran no test at all
        # prints "0 passed" and exits 0, so the exit status alone cannot distinguish
        # "every build-script test passed" from "the tests were deleted" or "a filter
        # matched nothing". The floor below is the measured population of `build.rs`'s
        # own `#[cfg(test)]` module; it is a FLOOR, so adding tests never breaks it,
        # while removing them does.
        log="$(mktemp)"
        "$RUNNER_TEMP/buildrs_tests" --test-threads 4 2>&1 | tee "$log"
        summaries="$(grep -c '^test result:' "$log" || true)"
        if [ "$summaries" -ne 1 ]; then
          echo "::error::expected exactly 1 summary line from the build-script test"\
               " binary, got $summaries; the harness did not run to completion"
          exit 1
        fi
        set -- $(awk '/^test result:/ { printf "%d %d %d", $4, $6, $8 }' "$log")
        if [ "$2" -ne 0 ] || [ "$3" -ne 0 ]; then
          echo "::error::build-script tests reported $2 failed and $3 ignored; AAP"\
               " directive D-5 requires both to be 0"
          exit 1
        fi
        if [ "$1" -lt 30 ]; then
          echo "::error::expected at least 30 build-script tests, got $1; tests were"\
               " removed, or the harness silently filtered them out"
          exit 1
        fi
        echo "build-script tests: $1 passed, 0 failed, 0 ignored"
    - name: Verify the big-endian table selection compiles
      run: |
        set -euo pipefail
        # `build.rs` always emits both endian forms of every table and the consumer
        # picks between them with `cfg(target_endian)`. On a little-endian runner the
        # big-endian arms are never compiled, so a wrong index or a wrong table in
        # one of them would go unnoticed until somebody built for big-endian
        # hardware. A big-endian `cargo check` of the test profile compiles those
        # arms; the relationship between the two forms is additionally asserted at
        # run time on every target by
        # `checksum::crc32::tests::endian_selected_generated_anchors_are_the_active_target_values`.
        #
        # The target itself is installed by the `targets:` input on this job's
        # toolchain step and asserted present before this point - deliberately NOT
        # by a `rustup target add` here. See the comment on that step.
        cargo +stable check --locked --target s390x-unknown-linux-gnu --lib --profile test
    - name: Verify the generated tables are reproducible
      run: |
        set -euo pipefail
        # Two independent builds must emit a byte-identical generated file: the
        # tables are pure constants, so any difference means the generator has
        # become environment-dependent.
        #
        # THE FILE LIST IS MATERIALIZED AND ASSERTED NON-EMPTY BEFORE ANYTHING IS
        # HASHED, because the obvious spelling of this check passes VACUOUSLY when
        # there is nothing to hash. `find ... -print0 | xargs -0 sha256sum` over
        # zero matches does not fail: `xargs` still runs `sha256sum` once with no
        # operands, `sha256sum` then reads stdin, and stdin is empty - so the
        # pipeline prints the canonical empty-input digest
        # e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 as a
        # single line. One line satisfies the "feature rows agree" check, and the
        # second build prints the identical constant, so the reproducibility
        # comparison succeeds as well. Both guards would then be green over a table
        # that was never generated at all. `-r` stops `xargs` invoking the command
        # on empty input, and the explicit count assertion is what turns "no tables"
        # into a red step instead of a false green one. That is also exactly what a
        # renamed output file or a moved `OUT_DIR` produces, which is why the count
        # is reported per phase and carried back out for the cross-build comparison
        # below.
        hash_tables() {
          phase="$1"
          count_out="$2"
          if [ ! -d target/debug/build ]; then
            echo "::error::the ${phase} build produced no target/debug/build"\
                 " directory, so no build script ran and there is nothing to hash" >&2
            return 1
          fi
          list="$(mktemp)"
          find target/debug/build -name crc32_tables.rs -print0 > "$list"
          count="$(tr -cd '\0' < "$list" | wc -c | tr -d '[:space:]')"
          echo "${phase} build: ${count} generated crc32_tables.rs file(s)" >&2
          # The count leaves through a file rather than a variable: the caller reads
          # this function through `$(...)`, which runs it in a subshell, so an
          # assignment made here would not survive the return.
          printf '%s' "$count" > "$count_out"
          if [ "$count" -lt 1 ]; then
            echo "::error::the ${phase} build produced no crc32_tables.rs under"\
                 " target/debug/build. Either build.rs did not run or it no longer"\
                 " writes that file, so this check has nothing to compare and must"\
                 " not report success" >&2
            return 1
          fi
          xargs -0 -r sha256sum < "$list" | awk '{print $1}' | sort -u
        }
        # BOTH HALVES START FROM THE SAME CLEAN STATE. `target/debug/build`
        # accumulates one directory per build-script invocation, so earlier steps in
        # this job (the big-endian `--profile test` check in particular) leave
        # directories behind. Wiping only before the second build would compare an
        # inherited directory set against a fresh one and the counts could never be
        # expected to agree - measured locally as 14 then 1. Wiping before both makes
        # the comparison deterministic and the count assertion meaningful.
        rm -rf target/debug/build
        cargo +stable build --locked --quiet
        first_count="$(mktemp)"
        first="$(hash_tables first "$first_count")"
        first_n="$(cat "$first_count")"
        if [ "$(printf '%s\n' "$first" | wc -l)" -ne 1 ]; then
          echo "::error::feature rows disagree on the generated tables"
          exit 1
        fi
        echo "first build: $first_n generated file(s), sha256 $first"
        rm -rf target/debug/build
        cargo +stable build --locked --quiet
        second_count="$(mktemp)"
        second="$(hash_tables second "$second_count")"
        second_n="$(cat "$second_count")"
        if [ "$(printf '%s\n' "$second" | wc -l)" -ne 1 ]; then
          echo "::error::the second build emitted more than one distinct table digest"
          exit 1
        fi
        if [ "$second_n" -ne "$first_n" ]; then
          echo "::error::the two builds emitted a different number of generated"\
               " files ($first_n then $second_n); the generator is"\
               " environment-dependent"
          exit 1
        fi
        if [ "$first" != "$second" ]; then
          echo "::error::generated tables are not reproducible: $first vs $second"
          exit 1
        fi
        echo "generated tables reproducible across $first_n file(s): sha256 $first"
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # `unsafe`-containment boundary - a BLOCKING gate for User Constraint 3
  # ("zero unsafe blocks in core compression logic") and AAP section 0.6.2 / section 0.7.2
  # standard S2.
  #
  # Two independent layers, deliberately not merged.
  #
  #   1. The in-crate boundary tests. They re-derive the boundary from the source
  #      text - blanking comments and literals, classifying every `unsafe` token,
  #      and treating a bare `unsafe extern "C" fn(..)` *type* as declarative -
  #      then assert that executable `unsafe` appears only under `src/ffi/**` and
  #      inside `mod no_std_support`, and that exactly two narrowly scoped
  #      `#[allow(unsafe_code)]` carve-outs exist. `#![deny(unsafe_code)]` alone
  #      cannot catch a smuggled third carve-out, because such code still
  #      compiles; these tests do.
  #
  #   2. A toolchain-independent shell assertion over the same invariants, so the
  #      gate still bites if the tests themselves are weakened or deleted.
  unsafe-boundary:
    name: Unsafe boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Boundary tests (in-crate)
      run: |
        set -euo pipefail
        # THE COUNT IS ASSERTED, NOT INFERRED FROM THE EXIT STATUS. These three
        # tests are selected by name, and a name filter that matches nothing is not
        # an error: `cargo test` prints "0 passed" and exits 0. So renaming or
        # deleting any one of them would silently reduce this gate - a BLOCKING gate
        # for User Constraint 3 - to a no-op that still reports success. Asserting
        # the exact population is what keeps that from happening, and the number is
        # exact rather than a floor because the filters name exactly three tests.
        log="$(mktemp)"
        cargo +stable test --locked --lib -- \
          tests::executable_unsafe_is_confined_to_the_designated_boundary \
          tests::unsafe_code_denial_has_exactly_two_scoped_carve_outs \
          tests::boundary_scanner_classifies_tokens_correctly 2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { p += $4; f += $6; i += $8 } END { printf "%d %d %d", p, f, i }' "$log")
        if [ "$2" -ne 0 ] || [ "$3" -ne 0 ]; then
          echo "::error::unsafe-boundary tests reported $2 failed and $3 ignored;"\
               " both must be 0"
          exit 1
        fi
        if [ "$1" -ne 3 ]; then
          echo "::error::expected exactly 3 unsafe-boundary tests to run, got $1;"\
               " a test was renamed or removed and the name filter matched nothing"
          exit 1
        fi
        echo "unsafe-boundary tests: $1 passed, 0 failed, 0 ignored"
    - name: Boundary assertion (source scan)
      run: |
        set -euo pipefail
        status=0

        # The crate root must DENY unsafe_code, and must not FORBID it (forbid
        # cannot be relaxed by the two boundary carve-outs).
        if ! grep -qx '#!\[deny(unsafe_code)\]' src/lib.rs; then
          echo "::error file=src/lib.rs::missing crate-root #![deny(unsafe_code)]"
          status=1
        fi
        if grep -qx '#!\[forbid(unsafe_code)\]' src/lib.rs; then
          echo "::error file=src/lib.rs::#![forbid(unsafe_code)] cannot be relaxed by the boundary carve-outs"
          status=1
        fi

        # Exactly two top-level carve-outs, both in src/lib.rs.
        carve_outs=$(grep -cx '#\[allow(unsafe_code)\]' src/lib.rs || true)
        if [ "$carve_outs" -ne 2 ]; then
          echo "::error file=src/lib.rs::expected exactly 2 #[allow(unsafe_code)] carve-outs, found $carve_outs"
          status=1
        fi

        # No other file may re-enable unsafe_code, at any scope.
        strays=$(grep -rln --include='*.rs' -e '^ *#!\?\[allow(unsafe_code)\]' src/ \
                 | grep -v '^src/lib\.rs$' || true)
        if [ -n "$strays" ]; then
          echo "::error::these files re-enable unsafe_code: $strays"
          status=1
        fi

        # No executable unsafe block in the safe core (comment lines excluded).
        core="src/deflate src/inflate src/checksum src/util src/gz src/error.rs src/constants.rs src/gz_header.rs src/stream.rs"
        # shellcheck disable=SC2086
        hits=$(grep -rn --include='*.rs' 'unsafe {' $core | grep -v ':[[:space:]]*//' || true)
        if [ -n "$hits" ]; then
          echo "::error::executable unsafe found in the safe core:"
          echo "$hits"
          status=1
        fi

        if [ "$status" -eq 0 ]; then
          echo "unsafe boundary intact: core is unsafe-free, 2 scoped carve-outs, crate-root deny in place"
        fi
        exit "$status"
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # C-ABI linkage gate: the emitted `cdylib`/`staticlib` must actually be
  # consumable by a C program in every feature configuration.
  #
  # Why this is separate from `build-test`: `cargo build --release` succeeding proves
  # only that rustc emitted an archive and a shared object, not that either can be
  # LINKED. An `rlib`-to-`staticlib` roll-up may carry unresolved references, and a
  # `cdylib` may be produced with undefined symbols that surface only when something
  # resolves them. Concretely, the sysroot `core`/`alloc` rlibs carry
  # `.data.DW.ref.rust_eh_personality` LSDA references that `std` normally satisfies;
  # under `--no-default-features` `src/lib.rs`'s freestanding runtime block supplies
  # the symbol instead, and this job is what keeps it supplied.
  #
  # All three link forms are tested because they fail independently: a static link
  # resolves against the archive's member objects, a dynamic link against the shared
  # object's dynamic symbol table, and `dlopen(RTLD_NOW)` resolves eagerly at load
  # time - the only one a lazily-bound program would not reveal until first call.
  #
  # The personality symbol is asserted on two independent axes; neither implies the
  # other.
  #
  #   * EXACTLY ONE DEFINITION, on every row. Zero is an `undefined reference`; two
  #     (the `cfg` gate widened so a `std` build also compiles the freestanding
  #     block) is a duplicate-symbol error. A `std` build links `std`'s own copy, so
  #     the count is 1 uniformly and a per-row expectation would describe only where
  #     the definition is VISIBLE, never which crate supplied it.
  #   * NEVER EXPORTED, on every row. `#[unsafe(no_mangle)]` gives default ELF
  #     visibility, which would both widen the drop-in `libz` ABI with a symbol no
  #     `libz` has and expose an *aborting* routine to ELF interposition. `src/lib.rs`
  #     emits a `.hidden` directive beside the definition; the reference it satisfies
  #     is resolved at static-link time, so internal linkage suffices.
  #
  # The export-set step then pins the whole surface: every row must publish the same
  # 95 dynamic `T` symbols, cover all 54 `zlib.map` `global:` names and leak none of
  # the 10 `local:` ones. A symbol set that varies with a Cargo feature is an ABI
  # break, and comparing against `zlib.map` keeps the check independent of this job's
  # own arithmetic.
  #
  # `--no-default-features` turns `gzip` off as well as `std`, so the C consumer
  # below deliberately exercises only the always-present surface (checksums,
  # `compressBound`, `compress2` / `uncompress`, `zlibVersion`) and never gzip
  # framing.
  c-abi-linkage:
    name: C ABI linkage (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: std-off
            features: '--no-default-features'
          - name: std-off + no-std
            features: '--no-default-features --features no-std'
          - name: std-off + simd
            features: '--no-default-features --features simd'
          - name: std control
            features: ''
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Build the shipped artifacts (release)
      run: cargo +stable build --release --locked --verbose ${{ matrix.features }}
    # `[profile.release]` sets `strip = "symbols"`, so the SHIPPED cdylib carries no
    # `.symtab` at all. That is the hardening this step pins in place: a release
    # artifact that grew a static symbol table back would mean the profile key was
    # dropped or overridden, and nothing else in this workflow would notice.
    #
    # WHY IT IS PINNED HERE rather than in a manifest test. The key is only
    # observable in its effect, and the effect is a property of the linked output --
    # a manifest scan can prove the key is present but not that the linker honoured
    # it, and an `RUSTFLAGS`/`CARGO_PROFILE_RELEASE_STRIP` override in a consumer's
    # environment defeats the key without touching the file. Measured on this tree
    # for the default row: `strip = "none"` emits 4,578,272 bytes with 6 `.debug_*`
    # sections; `strip = "debuginfo"` (cargo's own release default, and what this
    # tree emitted before the key was added) emits 666,400 bytes with a 1,221-entry
    # `.symtab`; `strip = "symbols"` emits 551,760 bytes with no `.symtab`.
    - name: Assert the shipped cdylib carries no static symbol table
      run: |
        set -euo pipefail
        so=target/release/libzlib_rs.so
        test -f "$so" || { echo "::error::$so was not emitted"; exit 1; }
        symtab=$(readelf -S "$so" | grep -c '\.symtab' || true)
        echo "shipped cdylib .symtab sections: $symtab (want 0), size: $(stat -c %s "$so") bytes"
        if [ "$symtab" != "0" ]; then
          echo "::error::the shipped release cdylib for features '${{ matrix.features }}'"\
               " carries a static symbol table. \`[profile.release] strip = \"symbols\"\`"\
               " in Cargo.toml is what removes it, so either that key was dropped or the"\
               " environment overrode it (RUSTFLAGS, CARGO_PROFILE_RELEASE_STRIP). Restore"\
               " the key, or delete this assertion in the same commit that deliberately"\
               " retires the hardening."
          exit 1
        fi
    # Axis 1 of the personality contract lives in `.symtab`, which the step above
    # has just proved absent from the shipped artifact -- so it cannot be read
    # there. A SECOND release build, identical except that `strip` stops at
    # debuginfo, supplies a symbol-retaining copy in its own CARGO_TARGET_DIR so it
    # cannot clobber the shipped one (all three artifacts share a single path per
    # target dir, and the steps below inspect the shipped `target/release` copy).
    #
    # `debuginfo` rather than `none` on purpose: it isolates the one variable under
    # test -- `.symtab` presence -- instead of also pulling 3.9 MB of DWARF into a
    # CI build. And the two artifacts are then compared: if stripping changed
    # anything a linker or loader can see, the dynamic export sets would differ.
    # Measured: both sets hold the same 95 `T` names on every row.
    - name: Assert the personality symbol is defined exactly once and never exported
      run: |
        set -euo pipefail
        so=target/release/libzlib_rs.so
        test -f "$so" || { echo "::error::$so was not emitted"; exit 1; }
        probe_dir="$RUNNER_TEMP/symbol-probe"
        CARGO_TARGET_DIR="$probe_dir" CARGO_PROFILE_RELEASE_STRIP=debuginfo \
          cargo +stable build --release --locked --verbose ${{ matrix.features }}
        probe="$probe_dir/release/libzlib_rs.so"
        test -f "$probe" || { echo "::error::$probe was not emitted"; exit 1; }
        probe_symtab=$(readelf -S "$probe" | grep -c '\.symtab' || true)
        if [ "$probe_symtab" = "0" ]; then
          echo "::error::the symbol-retaining probe build has no .symtab either, so"\
               " CARGO_PROFILE_RELEASE_STRIP=debuginfo did not take effect and axis 1"\
               " below would pass vacuously. Check the cargo version's handling of the"\
               " profile override."
          exit 1
        fi
        # Axis 1: exactly one definition, anywhere in the symbol table. `ld` has
        # already rejected zero (undefined reference) and two (duplicate symbol);
        # this makes the surviving guarantee observable.
        defined=$(nm --defined-only "$probe" | grep -cE ' [tT] rust_eh_personality' || true)
        # Axis 2: never in the DYNAMIC table. This is the property the `.hidden`
        # directive in `src/lib.rs` exists to enforce. `.dynsym` survives stripping,
        # so this axis is asserted on the SHIPPED artifact -- the one consumers link.
        exported=$(nm -D --defined-only "$so" | grep -c ' T rust_eh_personality' || true)
        probe_exported=$(nm -D --defined-only "$probe" | grep -c ' T rust_eh_personality' || true)
        echo "rust_eh_personality: definitions=$defined (want 1), exported=$exported (want 0)"
        if [ "$probe_exported" != "$exported" ]; then
          echo "::error::the stripped and symbol-retaining builds disagree on whether"\
               " rust_eh_personality is exported ($exported vs $probe_exported), which"\
               " would mean stripping is not ABI-neutral."
          exit 1
        fi
        nm -D --defined-only "$so"    | awk '$2=="T"{print $3}' | sort > "$RUNNER_TEMP/dyn-shipped.txt"
        nm -D --defined-only "$probe" | awk '$2=="T"{print $3}' | sort > "$RUNNER_TEMP/dyn-probe.txt"
        if ! diff -u "$RUNNER_TEMP/dyn-shipped.txt" "$RUNNER_TEMP/dyn-probe.txt"; then
          echo "::error::the shipped (stripped) and symbol-retaining builds export"\
               " different dynamic symbol sets for features '${{ matrix.features }}'."\
               " Stripping must remove only .symtab/.strtab, never anything a linker"\
               " or loader resolves against."
          exit 1
        fi
        echo "dynamic export sets identical across strip modes: $(wc -l < "$RUNNER_TEMP/dyn-shipped.txt") T symbols"
        if [ "$defined" != "1" ]; then
          echo "::error::expected exactly 1 definition of rust_eh_personality for features" \
               "'${{ matrix.features }}', found $defined. A std-off artifact must supply it" \
               "or nothing can link; a std build must not add a second, because std already" \
               "provides one."
          exit 1
        fi
        if [ "$exported" != "0" ]; then
          echo "::error::rust_eh_personality is exported from the dynamic symbol table for" \
               "features '${{ matrix.features }}'. It must carry internal linkage: exporting" \
               "it widens the drop-in libz ABI with a symbol no libz has, and publishes an" \
               "aborting routine that ELF interposition can select for another Rust shared" \
               "object's unwinds. Check the .hidden directive in src/lib.rs."
          exit 1
        fi
    - name: Assert the dynamic export set matches the zlib.map contract on every row
      run: |
        set -euo pipefail
        so=target/release/libzlib_rs.so
        # A version script is a sequence of `NAME { ... } [parent];` nodes. Inside a
        # node the default visibility is `global`, and `global:`/`local:` switch
        # scope for THAT NODE ONLY - a parser that lets `local:` persist across node
        # boundaries mis-sorts most of the file. `_*` is a pattern, not a name.
        python3 - "$so" <<'PY'
        import re, subprocess, sys, pathlib
        so = sys.argv[1]
        text = pathlib.Path("zlib.map").read_text()
        nodes = re.findall(r'([A-Za-z0-9_.]+)\s*\{(.*?)\}\s*([A-Za-z0-9_.]*)\s*;', text, re.S)
        g, l = set(), set()
        for _name, body, _parent in nodes:
            mode = "g"
            for raw in body.split(";"):
                s = raw.strip()
                while s.startswith("global:") or s.startswith("local:"):
                    mode = "g" if s.startswith("global:") else "l"
                    s = s.split(":", 1)[1].strip()
                for tok in s.split():
                    if tok != "_*" and re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', tok):
                        (g if mode == "g" else l).add(tok)
        EXPECTED_MAP_SHAPE = (16, 54, 10)   # nodes / global: / local:, declared once
        assert (len(nodes), len(g), len(l)) == EXPECTED_MAP_SHAPE, \
            f"zlib.map parsed as {len(nodes)} nodes / {len(g)} global / {len(l)} local, " \
            f"expected {EXPECTED_MAP_SHAPE[0]} / {EXPECTED_MAP_SHAPE[1]} / " \
            f"{EXPECTED_MAP_SHAPE[2]} - the version script changed or the parser drifted"
        out = subprocess.run(["nm", "-D", "--defined-only", so],
                             capture_output=True, text=True, check=True).stdout
        T = {p[2] for p in (line.split() for line in out.splitlines())
             if len(p) == 3 and p[1] == "T"}
        missing, leaked = sorted(g - T), sorted(l & T)
        print(f"dynamic T={len(T)}  zlib.map globals {len(g)-len(missing)}/{len(g)}  "
              f"locals leaked {len(leaked)}/{len(l)}")
        failed = False
        # 96 `#[unsafe(no_mangle)]` names minus the `#[cfg(windows)]`-gated
        # `gzopen_w`. Identical on every feature row: `pub mod ffi` is declared
        # unconditionally so the artifact always presents the full C symbol table,
        # and anything inside it that needs `std` is gated in the function body.
        #
        # Declared ONCE and read by both the predicate and its message, for the
        # same reason the test floors are: a number written out twice is a number
        # that can drift, and an error message advertising a count the check does
        # not enforce reports confidence it has not earned.
        EXPECTED_EXPORTS = 95
        if len(T) != EXPECTED_EXPORTS:
            print(f"::error::expected {EXPECTED_EXPORTS} dynamic T symbols, found {len(T)}. "
                  "The exported surface must not vary with a Cargo feature - that is an "
                  "ABI break.")
            failed = True
        if missing:
            print(f"::error::zlib.map global: symbols absent from the artifact: {missing}")
            failed = True
        if leaked:
            print(f"::error::zlib.map local: symbols leaked into the dynamic table: {leaked}")
            failed = True
        sys.exit(1 if failed else 0)
        PY
    # Every file this step generates - two C sources and three executables - is
    # written under `$RUNNER_TEMP`, never into the checkout.
    #
    # WHY THAT MATTERS HERE SPECIFICALLY, beyond general tidiness. This job's whole
    # subject is the SHIPPED artifact surface, and two other jobs assert properties
    # of the working tree: `package-verify` gates `cargo package --list` against the
    # `exclude` contract, and several steps assert `git status --porcelain` is empty
    # to prove no lockfile was rewritten. Untracked `consumer.c`, `loader.c`,
    # `consumer_static`, `consumer_dyn` and `loader` sitting in the repository root
    # are exactly the shape of debris that makes those assertions ambiguous - and a
    # stray `.c` file in the root of a crate that deliberately RETAINS the C
    # baseline as its oracle is worse than ambiguous, because it looks like part of
    # that baseline. `Cargo.toml`'s `exclude` list carries `*.c`, so a future
    # reordering that ran this job before `cargo package` would also have handed
    # these files to the packager to filter.
    #
    # `RUNNER_TEMP` is per-job and reclaimed by the runner, so nothing needs
    # deleting; the step after this one asserts the tree really is unchanged rather
    # than trusting that it is.
    - name: Link and load a C consumer against both artifacts
      run: |
        set -euo pipefail
        # All generated files live here, outside the checkout.
        work="$RUNNER_TEMP/c-abi"
        rm -rf "$work"
        mkdir -p "$work"
        # `zlib.h` is read from the checkout, which is exactly the point: a C
        # consumer of the drop-in replacement compiles against the RETAINED C
        # header and links the RUST artifact. `-I"$PWD"` names it explicitly rather
        # than relying on `-I.` resolving to the repository root.
        include="$PWD"
        artifacts="$PWD/target/release"

        cat > "$work/consumer.c" <<'CONSUMER'
        /* Exercises only the surface every feature row provides: no gzip framing,
           because `--no-default-features` turns the `gzip` feature off too. */
        #include <stdio.h>
        #include <string.h>
        #include "zlib.h"
        int main(void) {
            static unsigned char src[8192], comp[16384], back[8192];
            for (unsigned i = 0; i < sizeof src; i++)
                src[i] = (unsigned char)(i * 31u + (i >> 4));
            if (crc32(crc32(0L, Z_NULL, 0), (const Bytef *)"123456789", 9) != 0xcbf43926UL) {
                puts("FAIL crc32"); return 1;
            }
            if (adler32(adler32(0L, Z_NULL, 0), (const Bytef *)"123456789", 9) != 0x091e01deUL) {
                puts("FAIL adler32"); return 1;
            }
            if (compressBound(9) != 22) { puts("FAIL compressBound"); return 1; }
            uLongf clen = sizeof comp;
            if (compress2(comp, &clen, src, sizeof src, 9) != Z_OK) { puts("FAIL compress2"); return 1; }
            uLongf blen = sizeof back;
            if (uncompress(back, &blen, comp, clen) != Z_OK) { puts("FAIL uncompress"); return 1; }
            if (blen != sizeof src || memcmp(back, src, sizeof src) != 0) { puts("FAIL roundtrip"); return 1; }
            printf("PASS ver=%s clen=%lu\n", zlibVersion(), (unsigned long)clen);
            return 0;
        }
        CONSUMER
        cat > "$work/loader.c" <<'LOADER'
        /* RTLD_NOW resolves every symbol at load time, so an undefined reference
           fails here rather than at first call. */
        #include <dlfcn.h>
        #include <stdio.h>
        #include <string.h>
        int main(int argc, char **argv) {
            void *h = dlopen(argv[1], RTLD_NOW);
            if (!h) { printf("FAIL dlopen: %s\n", dlerror()); return 1; }
            unsigned long (*crc)(unsigned long, const unsigned char *, unsigned) =
                (unsigned long (*)(unsigned long, const unsigned char *, unsigned))dlsym(h, "crc32");
            const char *(*ver)(void) = (const char *(*)(void))dlsym(h, "zlibVersion");
            if (!crc || !ver) { printf("FAIL dlsym: %s\n", dlerror()); return 1; }
            if (crc(crc(0UL, NULL, 0), (const unsigned char *)"123456789", 9) != 0xcbf43926UL) {
                puts("FAIL dlopen crc32"); return 1;
            }
            printf("PASS dlopen ver=%s\n", ver());
            return dlclose(h) == 0 ? 0 : 1;
        }
        LOADER

        echo "--- static link ---"
        gcc -O2 -I"$include" "$work/consumer.c" "$artifacts/libzlib_rs.a" \
            -o "$work/consumer_static" -lpthread -ldl -lm
        "$work/consumer_static"

        echo "--- dynamic link ---"
        gcc -O2 -I"$include" "$work/consumer.c" -L"$artifacts" -lzlib_rs \
            -Wl,-rpath,"$artifacts" -o "$work/consumer_dyn"
        "$work/consumer_dyn"

        echo "--- dlopen(RTLD_NOW) ---"
        gcc -O2 "$work/loader.c" -o "$work/loader" -ldl
        "$work/loader" "$artifacts/libzlib_rs.so"

        echo "--- generated files (all outside the checkout) ---"
        ls -l "$work"
    # The assertion that makes the claim above verifiable rather than aspirational.
    # `--porcelain` covers modified AND untracked paths, so this catches both a
    # rewritten lockfile and any generated file that found its way back into the
    # tree. `target/` is ignored by `.gitignore`, so the release artifacts this job
    # built do not register - only debris that should not exist does.
    #
    # `if: ${{ !cancelled() }}` so the invariant is still checked when a step above
    # FAILS: that is precisely the run in which a half-finished build would have
    # left files behind, and the job being red for another reason is no reason to
    # stop looking. This guard cannot turn a failure into a pass.
    - name: Assert the C-consumer harness left the working tree clean
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        # The lockfile is checked first and on its own, so a rewritten resolution
        # gets a precise diagnostic instead of being reported as "the harness
        # modified the checkout". Every `cargo` command in this job passes
        # `--locked`, so a change here means one of them lost the flag.
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
               " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        # Then the broader assertion, which is strictly stronger: `--porcelain`
        # with no pathspec covers modified AND untracked paths, so it also proves
        # no generated C source or binary was left behind in the checkout.
        dirty="$(git status --porcelain)"
        if [ -n "$dirty" ]; then
          echo "::error::the C-consumer harness modified the checkout. Every"\
               " generated source and binary must be written under \$RUNNER_TEMP,"\
               " and no cargo command in this job may rewrite a lockfile:"
          printf '%s\n' "$dirty"
          exit 1
        fi
        echo "working tree clean: no generated C sources, binaries or lockfile changes"

  # Cross-target type-check (gap D3, the half that cannot be run natively).
  #
  # SCOPE: this job COMPILES the crate and its whole test/bench surface for four
  # foreign triples and executes NOTHING. `cargo check` does not link, which is why
  # no cross linker, emulator or apt step is needed - and equally why the result
  # must never be described as those platforms being "tested". `--all-targets` is
  # the point: the library alone would leave `tests/**` and `benches/**` unchecked.
  #
  #   * aarch64-unknown-linux-gnu - the aarch64 ELF/glibc flavour. It is
  #     type-checked here, not executed. This is NOT the project's only aarch64
  #     triple, nor its only aarch64 coverage: `build-test`'s macOS row runs
  #     natively on `aarch64-apple-darwin`, which that row PINS (its `host:` and
  #     `arch:` keys) and which its "Verify the host triple and runner
  #     architecture match the row" step ASSERTS against two independent
  #     witnesses, `rustc -vV`'s host line and `runner.arch`. This row is still
  #     not redundant with that one, for the reason that matters to the code -
  #     Apple's aarch64 is Mach-O with Apple's `target_vendor`, not this
  #     ELF/glibc combination, so the two reach different `cfg` surfaces.
  #   * i686-unknown-linux-gnu - 32-bit `usize`/pointer width across the library,
  #     the integration suite and the benches. `bare-metal-no-std` is also 32-bit
  #     but builds only the library, so it type-checks none of the test surface.
  #   * s390x-unknown-linux-gnu - big-endian. `build-script-tests` already checks
  #     `--lib --profile test` here; this row widens the same triple to
  #     `--all-targets`. NOTE for whoever maintains the target lists: s390x has no
  #     `[target.s390x-unknown-linux-gnu]` table in `.cargo/config.toml`, so that
  #     file and this matrix are not aligned on it. It needs none - the tables
  #     there carry per-platform rustflags and linker settings, and this row only
  #     type-checks - but the asymmetry is recorded so it reads as a decision
  #     rather than an omission.
  #
  #     `deny.toml` is NOT part of that asymmetry and must not be added to it.
  #     Its `[graph] targets` is deliberately EMPTY, which in cargo-deny means
  #     "no target filter": every package in the graph is evaluated on every
  #     platform, s390x included, with nothing pruned. That key's own `[graph]`
  #     section records the measured cost of every alternative - an empty list
  #     governs the whole graph, while any non-empty list prunes packages that a
  #     triple it omits would have reached. There is therefore no s390x-shaped hole
  #     in the supply-chain policy to align, and adding triples back to that key
  #     would OPEN one.
  #   * x86_64-pc-windows-msvc - the whole `cfg(windows)` surface, cross-checked
  #     FROM Linux, which is why no MSVC linker is needed to reach it. Its
  #     rationale runs longer than a bullet and is stated on the matrix entry
  #     itself, beside the row it justifies.
  #
  # `--all-features` IS PART OF THAT CLAIM, not decoration. `--all-targets` alone
  # silently omits `tests/c_oracle.rs`, which declares
  # `required-features = ["c-oracle"]`, and the `inflate_strict` arms - which would
  # make the phrase "the whole test/bench surface" false by exactly the targets most
  # likely to carry an endian or pointer-width assumption. With `--all-features` the
  # cross checks compile `c_oracle` (it appears in `--verbose` output); without it
  # that target is skipped entirely. Enabling `c-oracle` costs nothing here because
  # `cargo check` never links and the oracle harness shells out to a C compiler at
  # RUN time only, so all four triples stay clean under both `check` and
  # `clippy -D warnings`.
  #
  # A NOTE ON THE 2-SPACE COMMENT LINES IN THIS FILE. `src/lib.rs` locates a job
  # block by scanning for the next line indented exactly two spaces and ending in a
  # colon, so a comment shaped like `  # something:` reads as a job key and
  # truncates the preceding job's block early. Never end a 2-space comment line
  # with a colon.
  cross-targets:
    name: Cross type-check + clippy (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor. It matters more
    # here than anywhere else in this file, because the target below is installed
    # for the toolchain the action selects: if an unqualified `cargo` fell back
    # to 1.85.0, the requested triple would not be installed for it and the
    # check would fail for a reason that has nothing to do with the target.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      # One triple's failure must not hide the others.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: i686-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
          # Windows, cross-checked FROM Linux, which is the point: the native
          # `windows-latest` row in `build-test` runs on one OS with one feature
          # selection, so a diagnostic reachable only with `--all-features` under
          # `target_os = "windows"` had no gate at all. Neither `check` nor
          # `clippy` links, so no MSVC linker is needed to reach the whole
          # `cfg(windows)` surface from an Ubuntu runner - including the
          # `#[cfg(windows)]` `gzopen_w` and the `OS_CODE = 10` arm.
          #
          # This row is also the reason the clippy step below is not redundant
          # with the native one: `c_ulong` is 32-bit here and 64-bit on LP64, so
          # `uLong as u32` is a real truncation on Linux and an identity cast
          # here. `unnecessary_cast` fires on exactly one of those two, and no
          # Linux-host lane can see which.
          - target: x86_64-pc-windows-msvc
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    # The cross target is installed through this action's `targets:` input. That
    # is the single sanctioned mechanism: `rust-toolchain.toml` deliberately
    # carries no `targets` key (it would force every contributor to download a
    # target before their first build), and a hand-rolled `rustup target add`
    # step would drift from the toolchain the action actually selected.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
        components: clippy
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # Report the properties this row exists to exercise, so the log says what was
    # covered instead of leaving it to be inferred from the triple's name.
    - name: Report the target's compilation properties
      run: |
        set -euo pipefail
        rustc +stable --print cfg --target '${{ matrix.target }}' \
          | grep -E 'target_(arch|endian|pointer_width|env|os|vendor)='
        rustup target list --installed --toolchain stable
    - name: Cross type-check the library, tests and benches
      run: |
        cargo +stable check --locked --all-targets --all-features --verbose \
          --target '${{ matrix.target }}'
    # THE TYPE-CHECK ABOVE EXITS 0 ON A WARNING. THIS STEP DOES NOT.
    #
    # `cargo check` reports a `cfg`-divergent diagnostic and still succeeds, so
    # before this step every lint reachable only under a non-host `cfg` was
    # advisory - and this job's whole reason to exist is non-host `cfg`s. Three
    # separate real defects were invisible to a `check`-only gate:
    #
    #   * `uLong as u32` is a truncation where `c_ulong` is 64-bit and an identity
    #     cast where it is 32-bit, so `unnecessary_cast` fires on Windows and i686
    #     but never on x86_64 Linux;
    #   * `*mut c_char as *mut u8` is a sign change where `c_char` is `i8` and an
    #     identity cast on aarch64 and s390x, where it is `u8`;
    #   * a `pub(crate) use` consumed only from a `#[cfg(unix)]` shim is dead code
    #     on Windows and perfectly live everywhere else.
    #
    # Each is a one-line fix and none is detectable from the host, which is the
    # argument for spending a clippy run per triple rather than trusting review.
    #
    # `--all-features` and `--all-targets` match the `lint` job's gate for the
    # reasons documented there; the only difference is `--target`. `--locked`
    # keeps the linted graph the pinned one, exactly as in the step above.
    - name: Cross clippy with warnings denied
      run: |
        cargo +stable clippy --locked --all-targets --all-features --verbose \
          --target '${{ matrix.target }}' -- -D warnings

    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Cross RUNTIME execution under qemu-user (gap D3, the execution half).
  #
  # `cross-targets` above proves the non-host `cfg` arms COMPILE and lint clean.
  # It cannot prove they COMPUTE THE RIGHT ANSWER, and for this crate that gap has
  # a name: `src/checksum/crc32.rs` picks `CRC_BIG_TABLE` / `CRC_BRAID_BIG_TABLE`
  # with `cfg!(target_endian)`, so on every little-endian runner the big-endian
  # braid arms are type-checked and then never executed. A wrong index in one of
  # them survives `check`, `clippy` and the whole hosted suite. This job closes
  # that by RUNNING the suite for the target, which is what makes the portability
  # claim in `README.md` a measurement rather than an inference.
  #
  # HOW, in one sentence: `qemu-user-static` supplies a user-mode emulator, the
  # matching `gcc-<arch>-linux-gnu` supplies the cross linker and sysroot, and
  # Cargo is pointed at both through the two per-target environment variables it
  # reads for exactly this purpose - `CARGO_TARGET_<TRIPLE>_LINKER` and
  # `CARGO_TARGET_<TRIPLE>_RUNNER`. Nothing about the crate changes: no feature,
  # no `cfg`, no `.cargo/config.toml` table. That file stays deliberately inert
  # (gap D7), because a `runner` key committed there would silently apply to
  # every contributor's `cargo test --target`, including those without qemu
  # installed.
  #
  # THREE ROWS, one per property that only execution can check, and each row
  # DECLARES the property it covers so the declaration can be asserted:
  #
  #   * `s390x-unknown-linux-gnu` - the only BIG-ENDIAN configuration anywhere in
  #     this workflow, and therefore the row that exists to execute the big-endian
  #     braid. `crc32fast` ships no accelerated backend for s390x, so the scalar
  #     braid is what serves every bulk call there even on this SIMD-enabled row:
  #     `CRC_BIG_TABLE` and `CRC_BRAID_BIG_TABLE` are not merely compiled, they are
  #     the arms under test.
  #   * `aarch64-unknown-linux-gnu` - a second 64-bit little-endian ISA whose
  #     `c_char` is unsigned and whose `crc32fast` backend is the AArch64 CRC
  #     instruction path rather than x86 `pclmulqdq`, so it executes a different
  #     accelerated arm than any other row in this file.
  #   * `i686-unknown-linux-gnu` - 32-bit `usize`/`isize`, the only row on which the
  #     narrow-pointer arms run at all: every `usize` bound in the window and table
  #     sizing, and the `u64`-vs-`usize` narrowing in `compressBound`/`deflateBound`,
  #     are width-sensitive. EXPECT A LOWER TEST TOTAL HERE, and do not read it as a
  #     row that silently skipped something: exactly five library tests are
  #     `#[cfg(target_pointer_width = "64")]` because they mirror LP64 C struct
  #     offsets, so they cannot mean anything on ILP32 -
  #     `deflate::state::tests::c_layout_{mirror_reproduces_every_c_deflate_state_offset,
  #     size_matches_the_measured_c_deflate_state}`, the two `inflate::state`
  #     counterparts, and `ffi::types::tests::abi_exact_field_offsets_lp64` (whose
  #     name says so). Measured: 862 library tests here against 867 on the two LP64
  #     rows, and the endian-critical assertion below passes on all three.
  #
  # Between them the three rows retire the whole of gap D3's execution half: after
  # this job, no cross triple named by `cross-targets` is type-checked without also
  # being run.
  #
  # WHAT IS DELIBERATELY NOT RUN HERE, and why - do not "fix" this by widening the
  # feature flags. `--all-features` enables `c-oracle`, whose harness self-tests in
  # `tests/c_oracle.rs` classify a compiler probe by the ERROR KIND that
  # `std::process::Command` reports: a genuinely missing command must surface
  # `ErrorKind::NotFound` (read as `Probe::Absent`), and a present-but-unrunnable
  # one must surface a different kind (read as `Probe::Unusable`, which can never
  # become a skip). qemu-user emulates `execve` inside the guest, so BOTH
  # conditions collapse into a child that exits 127, and four of those self-tests
  # fail for a reason that has nothing to do with this crate's behaviour on the
  # target. Measured under `qemu-s390x`: the default row, `--no-default-features`
  # and `--no-default-features --features no-std` all pass in full, and the live
  # oracle sweep itself passes; only the probe-classification self-tests fail.
  # The classification is correct for real hosts and must not be weakened to suit
  # an emulator, so the emulated rows stop short of `--all-features` instead.
  #
  # ADDITIVE to `cross-targets`, never a replacement: that job still owns
  # `--all-features --all-targets` type-checking and clippy for these triples,
  # which is the coverage this job stops short of for the reason above.
  cross-run:
    name: Cross runtime suite under qemu-user (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin, for
    # the same reason `cross-targets` carries it - the target below is installed
    # for the toolchain the action selects, so a silent fall back to the MSRV
    # floor would fail on a missing target rather than on anything real.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      # A big-endian failure must not hide an aarch64 or 32-bit one, or the
      # reverse. Each row answers a different question, so each verdict is wanted
      # even when a sibling row is already red.
      fail-fast: false
      matrix:
        include:
          # THE BIG-ENDIAN ROW. `endian` and `pointer_width` are both asserted
          # against `rustc --print cfg` below, so a triple swapped in here without
          # its declared properties being updated fails the job instead of quietly
          # reporting a little-endian run as big-endian coverage.
          - target: s390x-unknown-linux-gnu
            cross_gcc: gcc-s390x-linux-gnu
            linker: s390x-linux-gnu-gcc
            qemu: qemu-s390x
            sysroot: /usr/s390x-linux-gnu
            endian: big
            pointer_width: 64
          - target: aarch64-unknown-linux-gnu
            cross_gcc: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            qemu: qemu-aarch64
            sysroot: /usr/aarch64-linux-gnu
            endian: little
            pointer_width: 64
          # THE 32-BIT ROW. `qemu-i386` rather than the host's own 32-bit support,
          # deliberately: it needs only the same `qemu-user-static` package the
          # other rows install and the same cross sysroot, so all three rows are
          # provisioned identically instead of this one needing `gcc-multilib` and
          # a working `linux32` personality.
          - target: i686-unknown-linux-gnu
            cross_gcc: gcc-i686-linux-gnu
            linker: i686-linux-gnu-gcc
            qemu: qemu-i386
            sysroot: /usr/i686-linux-gnu
            endian: little
            pointer_width: 32
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS - the contract every job in this
    # file holds to, asserted by `src/lib.rs`. Three witnesses, checked against
    # each other, so a log that reports a green cross-architecture run can be
    # attributed to one commit.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    # The cross target arrives through this action's `targets:` input, the same
    # single sanctioned mechanism `cross-targets` uses.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # The emulators are statically linked, which is what makes them usable as a
    # plain `runner` without registering binfmt handlers; the cross gcc brings the
    # linker AND the target sysroot the emulator loads shared objects from.
    #
    # TWO PACKAGE NAMES ON PURPOSE. `qemu-user-static` is the name on the Ubuntu
    # release GitHub currently labels `ubuntu-latest`. On newer Ubuntu it is a PURE
    # VIRTUAL package - `apt-cache showpkg qemu-user-static` reports no versions at
    # all - and the same statically linked emulators ship inside `qemu-user`
    # instead, whose own description is "QEMU user mode emulation (static
    # binaries)". Pinning either name alone makes this job fail on a runner-image
    # bump for a reason that has nothing to do with the crate, so try the
    # historical name and fall back. Verified on Ubuntu 25.10, where the virtual
    # package is what a bare install resolves against.
    - name: Install the user-mode emulator and the cross linker
      run: |
        set -euo pipefail
        sudo apt-get update
        if ! sudo apt-get install --no-install-recommends -y qemu-user-static; then
          echo "qemu-user-static did not resolve here; falling back to qemu-user"
          sudo apt-get install --no-install-recommends -y qemu-user
        fi
        sudo apt-get install --no-install-recommends -y '${{ matrix.cross_gcc }}'
        '${{ matrix.linker }}' --version | head -n 1
    # Point Cargo at both halves. The variable names are the triple upper-cased
    # with `-` turned into `_`, which is why they are derived rather than written
    # out: a hand-written name that drifts from the triple is silently ignored,
    # and the run would then fail on a missing host linker instead.
    - name: Point cargo at the cross linker and the qemu runner
      run: |
        set -euo pipefail
        # The emulator is `qemu-<arch>-static` when it came from
        # `qemu-user-static` and plain `qemu-<arch>` when it came from `qemu-user`.
        # Resolve which one exists instead of assuming: a hardcoded name that the
        # runner image stops shipping would surface three steps later as a test
        # binary that cannot be executed, which reads like a crate failure.
        emulator=""
        for candidate in '${{ matrix.qemu }}-static' '${{ matrix.qemu }}'; do
          if command -v "$candidate" >/dev/null 2>&1; then
            emulator="$candidate"
            break
          fi
        done
        if [ -z "$emulator" ]; then
          echo "::error::neither ${{ matrix.qemu }}-static nor ${{ matrix.qemu }} is on"\
            " PATH, so nothing here can execute ${{ matrix.target }} binaries."
          exit 1
        fi
        "$emulator" --version | head -n 1
        key="$(printf '%s' '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')"
        echo "CARGO_TARGET_${key}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_${key}_RUNNER=$emulator -L ${{ matrix.sysroot }}" >> "$GITHUB_ENV"
        echo "derived variable prefix: CARGO_TARGET_${key}_ / emulator: $emulator"
    # The row's own claims about its target, asserted rather than assumed. This is
    # the step that keeps `endian: big` and `pointer_width: 32` honest: a row that
    # silently stopped covering the property it names would otherwise still report
    # green, which is the exact failure this whole job exists to retire.
    - name: Report and assert the target's compilation properties
      run: |
        set -euo pipefail
        rustc +stable --print cfg --target '${{ matrix.target }}' \
          | grep -E 'target_(arch|endian|pointer_width|env|os|vendor)='
        for property in endian pointer_width; do
          case "$property" in
            endian) declared='${{ matrix.endian }}' ;;
            pointer_width) declared='${{ matrix.pointer_width }}' ;;
          esac
          actual="$(rustc +stable --print cfg --target '${{ matrix.target }}' \
            | sed -n "s/^target_$property=\"\(.*\)\"\$/\1/p")"
          echo "declared target_$property: $declared / reported: $actual"
          if [ "$actual" != "$declared" ]; then
            echo "::error::matrix row claims target_$property=$declared but"\
              " ${{ matrix.target }} reports $actual, so this row is not covering"\
              " what it says it covers."
            exit 1
          fi
        done
    # THE GATE THIS JOB EXISTS FOR: the whole default-feature suite, executed on
    # the target rather than type-checked for it.
    - name: Run the default-feature test suite on the target
      run: |
        cargo +stable test --locked --target '${{ matrix.target }}' --verbose
    # std-off and `no-std`, executed too: `--no-default-features` also drops
    # `simd`, so on these two rows the braided scalar CRC path is the ONLY thing
    # that can serve a bulk call - `crc32fast` is not even linked. (On the s390x
    # row the braid serves every bulk call on the default row as well, because
    # `crc32fast` has no accelerated backend for that architecture; on aarch64 and
    # i686 it does, which is what makes these two rows add coverage there.)
    - name: Run the std-off test suites on the target
      run: |
        set -euo pipefail
        cargo +stable test --locked --target '${{ matrix.target }}' --no-default-features
        cargo +stable test --locked --target '${{ matrix.target }}' \
          --no-default-features --features no-std
    # A passing suite is necessary but not sufficient evidence: it does not say
    # that the endian-critical tests were among the ones that ran. Naming them and
    # asserting the count is what stops this row from degrading into "the suite
    # happened to be green" - the same shape as the Windows `gzopen_w` assertion
    # in `build-test`.
    - name: Assert the endian-critical CRC tests actually executed
      run: |
        set -euo pipefail
        log="$(cargo +stable test --locked --target '${{ matrix.target }}' --lib -- --exact \
          checksum::crc32::tests::endian_selected_generated_anchors_are_the_active_target_values \
          checksum::crc32::tests::the_selected_backend_agrees_with_the_braid_for_every_length \
          checksum::crc32::tests::the_braid_reproduces_the_canonical_vectors_independently \
          checksum::crc32::tests::generated_big_endian_tables_are_byte_swapped_companions 2>&1)"
        printf '%s\n' "$log"
        if ! printf '%s\n' "$log" | grep -qE '^test result: ok\. 4 passed; 0 failed'; then
          echo "::error::expected exactly 4 endian-critical CRC tests to run and pass"\
            " on ${{ matrix.target }}. Either a test was renamed, or this row stopped"\
            " executing the arms it exists to execute."
          exit 1
        fi
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Bare-metal no_std library build (gap D10).
  #
  # `src/lib.rs` gates its freestanding runtime block on
  # `all(not(feature = "std"), not(test), panic = "abort")`. A hosted
  # `cargo test --no-default-features` fails TWO of those three terms - it sets
  # `test`, and Cargo forces `panic = "unwind"` for the libtest harness - so no
  # number of passing hosted TESTS reaches the libc `GlobalAlloc`, the
  # `posix_memalign` over-aligned path or the `#[panic_handler]`.
  #
  # A std-off LIBRARY build does compile the block: the `no_std library (build
  # only)` row above satisfies all three terms on the host. What that row cannot
  # reach is the platform half, and that is this job's reason to exist.
  # `rustc --print cfg` for `thumbv7em-none-eabihf` reports `target_os = "none"`
  # and `target_pointer_width = "32"` - a genuine no-OS target, and the only
  # configuration in CI that reaches the 32-bit `MIN_ALIGN = 8` arm.
  #
  # FOUR THINGS THAT LOOK WRONG HERE AND ARE NOT. Do not "fix" any of them.
  #
  #   1. `warning: dropping unsupported crate type `cdylib`` is EXPECTED,
  #      because `[lib] crate-type` lists `cdylib`, meaningless on bare metal, so
  #      Cargo drops it and keeps `lib` + `staticlib`. Do not suppress it, do not
  #      pass `--crate-type`, and do not edit `Cargo.toml`.
  #   2. `malloc` / `calloc` / `realloc` / `free` / `posix_memalign` / `abort` stay
  #      UNDEFINED in the emitted archive. A library build links no final binary,
  #      so unresolved references are correct - and for four of the six their
  #      presence is the positive evidence asserted below that the block compiled.
  #      No libc shim, no `-nostartfiles`, no `-Z build-std`, no linker flags.
  #   3. The panic strategy is NOT set from here. `panic = "abort"` must keep
  #      coming from the `Cargo.toml` profiles, because it is the predicate's third
  #      term; `-C panic=...` from CI would break it or mask a misconfiguration.
  #   4. There is no `cargo test` step, and adding one would be actively wrong -
  #      setting `test` flips `not(test)` false and skips the very code this job
  #      exists to compile.
  #
  # ADDITIVE to the host `no-std-tests` job, which stays a blocking gate on the
  # hosted std-off suites. Neither substitutes for the other.
  bare-metal-no-std:
    name: Bare-metal no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor - and, as in
    # `cross-targets`, would look for a target that was installed for a
    # different toolchain.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    # Installed through the action's `targets:` input, for the same reason as in
    # `cross-targets`: `rust-toolchain.toml` deliberately has no `targets` key.
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        targets: thumbv7em-none-eabihf
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # The gap is "never exercised on no-OS hardware", so the premise has to be
    # checked rather than assumed: a triple that quietly acquired an OS or a
    # 64-bit pointer width would still build and would silently stop covering
    # what this job is here for.
    - name: Verify the target is genuinely bare metal and 32-bit
      run: |
        set -euo pipefail
        cfg="$(rustc +stable --print cfg --target thumbv7em-none-eabihf)"
        echo "$cfg"
        for want in 'target_os="none"' 'target_pointer_width="32"'; do
          case "$cfg" in
            *"$want"*) ;;
            *) echo "::error::thumbv7em-none-eabihf no longer reports $want, so this"\
               " job would stop covering the bare-metal / 32-bit MIN_ALIGN arms."; exit 1 ;;
          esac
        done
    - name: Build the library for bare metal (no default features)
      run: cargo +stable build --locked --verbose --target thumbv7em-none-eabihf --no-default-features
    - name: Build the library for bare metal (no-std feature)
      run: cargo +stable build --locked --verbose --target thumbv7em-none-eabihf --no-default-features --features no-std
    # "It compiled" is weaker than this gap deserves: if the predicate ever
    # stopped holding, both builds above would still succeed and would silently
    # compile nothing of what D10 is about. The symbol assertions below are the
    # difference between compiling the crate and compiling the freestanding
    # runtime block, and each one was picked because it FAILS when run against a
    # hosted build of this same crate - which is the only property that makes an
    # assertion evidence rather than decoration.
    - name: Assert the freestanding runtime block was actually compiled
      run: |
        set -euo pipefail
        lib=target/thumbv7em-none-eabihf/debug/libzlib_rs.a
        test -f "$lib" || { echo "::error::$lib was not emitted"; exit 1; }
        status=0
        # `nm -A` output is written to files rather than piped into `grep -q`:
        # under `set -o pipefail` an early-exiting `grep -q` SIGPIPEs its
        # producer, the pipeline then reports 141, and every symbol below would
        # look absent whether it was there or not.
        defined="$RUNNER_TEMP/bare-metal-defined.syms"
        undefined="$RUNNER_TEMP/bare-metal-undefined.syms"
        nm -A --defined-only "$lib" > "$defined"
        nm -A --undefined-only "$lib" > "$undefined"
        # EVERY assertion below was chosen because it FAILS on a hosted build of
        # this same crate. A check that passes either way proves nothing, and the
        # obvious candidates really do pass either way: std defines both
        # `rust_eh_personality` and the panic handler, and `malloc`/`free` are
        # referenced from a crate object even in a hosted build because
        # `src/ffi/alloc.rs` declares them for the zcalloc/zcfree bridge. Those
        # are excluded here for precisely that reason - hence the symbol choices
        # and the object-file attribution, neither of which is decoration.
        #
        # (1) mod no_std_support compiled at all. Both the legacy and the v0
        #     mangling embed the module path as plain text, so the substring test
        #     is mangling-agnostic.
        block="$(grep -c 'no_std_support' "$defined" || true)"
        echo "symbols defined inside mod no_std_support: $block (want 1 or more)"
        if [ "$block" -lt 1 ]; then
          echo "::error::no symbol in $lib names mod no_std_support, so the"\
               " freestanding allocator and panic handler were not compiled and"\
               " this job covers nothing the host no-std job does not already."
          status=1
        fi
        # (2) the libc entry points that block calls, attributed to a crate
        #     object. All four are absent from a hosted build of this crate.
        for sym in calloc realloc posix_memalign abort; do
          hits="$(grep -E "[[:space:]]U[[:space:]]+${sym}\$" "$undefined" | grep -c ':zlib_rs' || true)"
          echo "undefined reference to $sym from a zlib_rs object: $hits (want 1 or more)"
          if [ "$hits" -lt 1 ]; then
            echo "::error::no zlib_rs object in $lib references the libc entry"\
                 " point '$sym', so mod no_std_support was not compiled."
            status=1
          fi
        done
        # (3) the two symbols that block exists to supply, attributed to a crate
        #     object rather than to std: `rust_eh_personality` is the unwind
        #     personality shim a freestanding artifact must provide, and
        #     `rust_begin_unwind` is the panic handler that terminates through
        #     abort(). The pattern matches a mangled prefix so it holds under
        #     either mangling scheme.
        for sym in rust_eh_personality rust_begin_unwind; do
          owned="$(grep -E "[[:space:]][tT][[:space:]]+[^[:space:]]*${sym}\$" "$defined" | grep -c ':zlib_rs' || true)"
          echo "$sym defined by a zlib_rs object: $owned (want 1 or more)"
          if [ "$owned" -lt 1 ]; then
            echo "::error::$sym is not defined by any zlib_rs object in $lib. In a"\
                 " hosted build std supplies it; on bare metal the crate must, and"\
                 " mod no_std_support is the only thing in this crate that does."
            status=1
          fi
        done
        if [ "$status" -eq 0 ]; then
          echo "freestanding runtime block compiled: crate-supplied allocator, panic handler and personality shim all present"
        fi
        exit "$status"
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Bare-metal no_std EXECUTION under qemu-system-arm (gap D10, execution half).
  #
  # `bare-metal-no-std` above proves the freestanding runtime block COMPILES and
  # that its symbols are present and crate-owned. It cannot prove the block WORKS,
  # and the distinction is not academic: `mod no_std_support` hands `core`'s
  # allocator over to libc `malloc`/`calloc`/`realloc`/`free`/`posix_memalign`, and
  # a wrong size, a wrong alignment predicate or a mismatched free would produce a
  # library that links perfectly and corrupts the heap on first use. No hosted test
  # can reach it, because `cargo test` sets `test` and forces `panic = "unwind"`,
  # which fails two of the three terms in that block's own `cfg`.
  #
  # WHAT THIS JOB ADDS, precisely: it links the bare-metal staticlib into a real
  # firmware image for a Cortex-M4 with no operating system, runs it under
  # `qemu-system-arm`, and reads the results back over ARM semihosting. The
  # 32-bit `MIN_ALIGN = 8` arm, the libc-backed `GlobalAlloc` and the fallible
  # allocation path all execute for real.
  #
  # THE ASSERTION THAT MATTERS MOST is the heap-exhaustion one. zlib-rs allocates
  # FALLIBLY - `AllocBuffer::try_zeroed` returns `Option`, and an exhausted heap
  # must surface as `Z_MEM_ERROR` to the caller. On a device with no OOM killer
  # and no swap that is the difference between a recoverable error and a dead
  # board, and it is the single property an embedded consumer most needs to hold.
  # The job drains the heap, asserts `deflateInit2` returns -4 rather than
  # aborting, releases the memory and asserts the engine initialises again.
  #
  # THE HARNESS IS WRITTEN AT RUN TIME, ON PURPOSE. A linker script, a vector
  # table, a semihosting write path and a `posix_memalign` shim (newlib ships
  # `memalign` but not the POSIX form this crate calls) are all build-system
  # scaffolding for ONE job. Committing them as repository files would add four
  # artifacts that nothing else in the tree reads, that no other job builds, and
  # that would silently rot. They live in heredocs below instead, so the whole
  # gate is reviewable in one place and the repository gains no orphan files.
  #
  # TWO FEATURE ROWS, and the pair is the point. `--no-default-features` drops the
  # `gzip` feature, and `deflate.c` lines 428-433 gate the `windowBits > 15` ->
  # gzip conversion behind `#ifdef GZIP`, so that row must REJECT `windowBits=31`
  # with `Z_STREAM_ERROR` exactly as a C zlib compiled without GZIP does. Only the
  # `--features gzip` row can check the RFC 1952 OS byte, which on a target that is
  # neither Windows nor Apple must be 3 - the `#ifndef OS_CODE` fallback in
  # `zutil.h` line 188. Asserting both directions is what makes the feature gate
  # itself covered rather than merely present.
  #
  # NOT REAL HARDWARE, and the documentation says so. `qemu-system-arm` reproduces
  # the ISA, the memory map and the absence of an OS; it does not reproduce a
  # device. Gap D10 asks for real-hardware validation and stays open on that point.
  bare-metal-run:
    name: Bare-metal no_std execution under qemu-system-arm (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rank-2 override, for the same reason every other target-bearing job carries
    # it - the bare-metal target is installed for the toolchain the action selects.
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      # A gzip-off failure must not hide a gzip-on one; the rows assert opposite
      # things about the same entry point.
      fail-fast: false
      matrix:
        include:
          - features: --no-default-features
            expect_gzip: 0
          - features: --no-default-features --features gzip
            expect_gzip: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    # PROVENANCE, EMITTED BEFORE ANY GATE RUNS - the contract every job in this
    # file holds to, asserted by `src/lib.rs`.
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
        targets: thumbv7em-none-eabihf
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    # `libnewlib-arm-none-eabi` is what supplies libc for a no-OS target; without
    # it the link fails on `malloc`, which is precisely the symbol under test.
    - name: Install the ARM bare-metal toolchain and the system emulator
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
        arm-none-eabi-gcc --version | head -n 1
        qemu-system-arm --version | head -n 1
    - name: Assert the target is genuinely bare metal and 32-bit
      run: |
        set -euo pipefail
        cfg="$(rustc +stable --print cfg --target thumbv7em-none-eabihf)"
        printf '%s\n' "$cfg" | grep -E 'target_(arch|os|pointer_width|abi|endian)='
        printf '%s\n' "$cfg" | grep -qx 'target_os="none"' || {
          echo "::error::thumbv7em-none-eabihf no longer reports target_os=none,"\
            " so this job is not covering a no-OS target."; exit 1; }
        printf '%s\n' "$cfg" | grep -qx 'target_pointer_width="32"' || {
          echo "::error::thumbv7em-none-eabihf no longer reports a 32-bit pointer"\
            " width, so the MIN_ALIGN = 8 arm is not the one being exercised."; exit 1; }
    - name: Build the bare-metal staticlib
      run: |
        set -euo pipefail
        cargo +stable build --locked --release --verbose --lib \
          --target thumbv7em-none-eabihf ${{ matrix.features }}
        ls -l target/thumbv7em-none-eabihf/release/libzlib_rs.a
    # Scaffolding, written to the runner temp dir so nothing lands in the tree.
    - name: Write the firmware harness
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bm"
        cat > "$RUNNER_TEMP/bm/mps2.ld" <<'LDEOF'
        MEMORY
        {
          FLASH (rx)  : ORIGIN = 0x00000000, LENGTH = 4M
          RAM   (rwx) : ORIGIN = 0x20000000, LENGTH = 4M
        }
        ENTRY(Reset_Handler)
        SECTIONS
        {
          .isr_vector : { KEEP(*(.isr_vector)) } > FLASH
          .text   : { *(.text*) *(.rodata*) *(.glue_7) *(.glue_7t) *(.eh_frame) } > FLASH
          .ARM.exidx : { __exidx_start = .; *(.ARM.exidx*) __exidx_end = .; } > FLASH
          _sidata = LOADADDR(.data);
          .data   : { _sdata = .; *(.data*) . = ALIGN(8); _edata = .; } > RAM AT > FLASH
          .bss    : { _sbss = .; *(.bss*) *(COMMON) . = ALIGN(8); _ebss = .; } > RAM
          . = ALIGN(8);
          _heap_start = .;
          _heap_end   = ORIGIN(RAM) + LENGTH(RAM) - 0x8000;
          _estack     = ORIGIN(RAM) + LENGTH(RAM);
        }
        LDEOF
        cat > "$RUNNER_TEMP/bm/rt.c" <<'RTEOF'
        /* Vector table, reset handler, semihosting output, a heap for newlib
         * malloc, and the posix_memalign newlib omits but this crate calls. */
        #include <stddef.h>
        #include <stdint.h>
        #include <errno.h>
        extern uint32_t _sidata, _sdata, _edata, _sbss, _ebss, _estack, _heap_start, _heap_end;
        extern int main(void);
        static inline int semihost(int op, void *arg) {
            register int r0 __asm__("r0") = op;
            register void *r1 __asm__("r1") = arg;
            __asm__ volatile("bkpt 0xAB" : "+r"(r0) : "r"(r1) : "memory");
            return r0;
        }
        static void sh_write0(const char *s) { semihost(0x04, (void *)s); }
        static void sh_exit(int code) {
            uint32_t block[2] = { 0x20026u, (uint32_t)code };
            semihost(0x18, code == 0 ? (void *)0x20026u : (void *)block);
            for (;;) { }
        }
        void *_sbrk(ptrdiff_t incr) {
            static char *brk = 0;
            if (brk == 0) brk = (char *)&_heap_start;
            char *prev = brk;
            if (brk + incr > (char *)&_heap_end) { errno = ENOMEM; return (void *)-1; }
            brk += incr; return prev;
        }
        int _write(int fd, const char *buf, int len) {
            (void)fd; char tmp[129]; int done = 0;
            while (done < len) {
                int n = len - done; if (n > 128) n = 128;
                for (int i = 0; i < n; i++) tmp[i] = buf[done + i];
                tmp[n] = '\0'; sh_write0(tmp); done += n;
            }
            return len;
        }
        int _close(int fd) { (void)fd; return -1; }
        int _fstat(int fd, void *st) { (void)fd; (void)st; return 0; }
        int _isatty(int fd) { (void)fd; return 1; }
        long _lseek(int fd, long o, int w) { (void)fd; (void)o; (void)w; return 0; }
        int _read(int fd, char *b, int l) { (void)fd; (void)b; (void)l; return 0; }
        void _exit(int code) { sh_exit(code); }
        int _kill(int p, int s) { (void)p; (void)s; errno = EINVAL; return -1; }
        int _getpid(void) { return 1; }
        extern void *memalign(size_t, size_t);
        int posix_memalign(void **out, size_t align, size_t size) {
            if (align == 0 || (align & (align - 1)) != 0 || align % sizeof(void *) != 0)
                return EINVAL;
            void *p = memalign(align, size);
            if (p == NULL) return ENOMEM;
            *out = p; return 0;
        }
        void Reset_Handler(void) {
            uint32_t *src = &_sidata, *dst = &_sdata;
            while (dst < &_edata) *dst++ = *src++;
            for (dst = &_sbss; dst < &_ebss; dst++) *dst = 0;
            /* CPACR CP10/CP11: this target emits hard-float instructions. */
            *(volatile uint32_t *)0xE000ED88 |= (0xFu << 20);
            __asm__ volatile("dsb; isb");
            sh_exit(main());
        }
        void Default_Handler(void) { sh_write0("FAULT: unexpected exception\n"); sh_exit(97); }
        __attribute__((section(".isr_vector"), used))
        void *const g_vectors[] = {
            (void *)&_estack, (void *)Reset_Handler,
            (void *)Default_Handler, (void *)Default_Handler, (void *)Default_Handler,
            (void *)Default_Handler, (void *)Default_Handler, 0, 0, 0, 0,
            (void *)Default_Handler, (void *)Default_Handler, 0,
            (void *)Default_Handler, (void *)Default_Handler,
        };
        RTEOF
        cat > "$RUNNER_TEMP/bm/main.c" <<'MAINEOF'
        /* Drives the zlib-rs C ABI on a Cortex-M4 with no operating system. */
        #include <stdio.h>
        #include <string.h>
        #include <stdlib.h>
        #include "zlib.h"
        extern void *__real_malloc(size_t);
        extern void *__real_calloc(size_t, size_t);
        extern void *__real_realloc(void *, size_t);
        extern void  __real_free(void *);
        extern void *__real_memalign(size_t, size_t);
        static int armed = 0;
        static unsigned n_malloc, n_calloc, n_realloc, n_free, n_memalign;
        static unsigned long bytes_alloc;
        void *__wrap_malloc(size_t n) { if (armed) { n_malloc++; bytes_alloc += n; } return __real_malloc(n); }
        void *__wrap_calloc(size_t a, size_t b) { if (armed) { n_calloc++; bytes_alloc += (unsigned long)a * b; } return __real_calloc(a, b); }
        void *__wrap_realloc(void *p, size_t n) { if (armed) n_realloc++; return __real_realloc(p, n); }
        void __wrap_free(void *p) { if (armed) n_free++; __real_free(p); }
        void *__wrap_memalign(size_t a, size_t n) { if (armed) n_memalign++; return __real_memalign(a, n); }
        static int failures = 0;
        #define CHECK(c, fmt, ...) do { \
            if (c) printf("PASS " fmt "\n", ##__VA_ARGS__); \
            else { printf("FAIL " fmt "\n", ##__VA_ARGS__); failures++; } } while (0)
        #define N 50000u
        static unsigned char SRC[N];
        static unsigned char DEC[N];
        int main(void) {
            const char *nine = "123456789";
            printf("=== zlib-rs on bare metal: thumbv7em-none-eabihf, no OS ===\n");
            printf("sizeof_void_p=%u sizeof_size_t=%u sizeof_uLong=%u\n",
                   (unsigned)sizeof(void *), (unsigned)sizeof(size_t), (unsigned)sizeof(uLong));
            CHECK(sizeof(void *) == 4, "the target is 32-bit, so MIN_ALIGN = 8 is the live arm");
            const char *ver = zlibVersion();
            printf("zlibVersion=%s\n", ver);
            CHECK(strcmp(ver, "1.3.2.1-motley") == 0, "version is 1.3.2.1-motley");
            uLong c = crc32(0L, (const Bytef *)nine, 9);
            uLong a = adler32(1L, (const Bytef *)nine, 9);
            printf("crc32=%08lx adler32=%08lx\n", (unsigned long)c, (unsigned long)a);
            CHECK(c == 0xcbf43926UL, "crc32(\"123456789\") == cbf43926");
            CHECK(a == 0x091e01deUL, "adler32(\"123456789\") == 091e01de");
            CHECK(compressBound(9) == 22UL, "compressBound(9) == 22");
            for (unsigned i = 0; i < N; i++) SRC[i] = (unsigned char)((i * 31u + (i >> 3)) & 0xff);
            uLong whole = crc32(0L, SRC, N), step = 0L;
            for (unsigned i = 0; i < N; i += 7u) {
                unsigned k = (N - i) < 7u ? (N - i) : 7u;
                step = crc32(step, SRC + i, k);
            }
            CHECK(whole == step, "chunked CRC equals one-shot CRC (%08lx)", (unsigned long)whole);
            uLong clen = compressBound(N);
            Bytef *comp = (Bytef *)malloc(clen);
            CHECK(comp != NULL, "harness allocated a %lu-byte buffer", (unsigned long)clen);
            n_malloc = n_calloc = n_realloc = n_free = n_memalign = 0; bytes_alloc = 0;
            armed = 1;
            int rc = compress2(comp, &clen, SRC, N, 9);
            uLong dlen = N;
            int rc2 = uncompress(DEC, &dlen, comp, clen);
            armed = 0;
            CHECK(rc == Z_OK, "compress2 returns Z_OK (rc=%d)", rc);
            CHECK(rc2 == Z_OK, "uncompress returns Z_OK (rc=%d)", rc2);
            CHECK(dlen == N && memcmp(SRC, DEC, N) == 0, "%u-byte round trip is byte-exact", N);
            printf("compressed_len=%lu crc_of_compressed=%08lx\n",
                   (unsigned long)clen, (unsigned long)crc32(0L, comp, (uInt)clen));
            printf("ALLOC malloc=%u calloc=%u realloc=%u free=%u memalign=%u bytes=%lu\n",
                   n_malloc, n_calloc, n_realloc, n_free, n_memalign, bytes_alloc);
            CHECK(n_malloc + n_calloc + n_memalign > 0,
                  "the crate's libc-backed GlobalAlloc served the engines");
            CHECK(n_free >= n_malloc + n_calloc + n_memalign,
                  "every block the crate took from the C heap was returned");
            uLong glen = compressBound(N) + 64;
            Bytef *gz = (Bytef *)malloc(glen);
            z_stream probe; memset(&probe, 0, sizeof probe);
            int prc = deflateInit2(&probe, 6, Z_DEFLATED, 31, 8, Z_DEFAULT_STRATEGY);
            printf("deflateInit2(windowBits=31) rc=%d [gzip %s]\n", prc, EXPECT_GZIP ? "ON" : "OFF");
        #if EXPECT_GZIP
            CHECK(prc == Z_OK, "gzip wrapping is accepted when the feature is on (rc=%d)", prc);
            probe.next_in = SRC; probe.avail_in = N;
            probe.next_out = gz; probe.avail_out = (uInt)glen;
            rc = deflate(&probe, Z_FINISH);
            CHECK(rc == Z_STREAM_END, "deflate(Z_FINISH) returns Z_STREAM_END (rc=%d)", rc);
            deflateEnd(&probe);
            printf("gzip magic=%02x %02x os_byte=%02x\n", gz[0], gz[1], gz[9]);
            CHECK(gz[0] == 0x1f && gz[1] == 0x8b, "gzip magic is 1f 8b");
            CHECK(gz[9] == 3, "RFC 1952 OS byte is 3 on a no-OS target (saw %u)", (unsigned)gz[9]);
        #else
            CHECK(prc == Z_STREAM_ERROR,
                  "windowBits=31 is rejected with Z_STREAM_ERROR when gzip is off, matching"
                  " a C zlib built without GZIP (rc=%d)", prc);
            z_stream s; memset(&s, 0, sizeof s);
            rc = deflateInit2(&s, 6, Z_DEFLATED, 15, 8, Z_DEFAULT_STRATEGY);
            CHECK(rc == Z_OK, "deflateInit2(windowBits=15) returns Z_OK (rc=%d)", rc);
            s.next_in = SRC; s.avail_in = N; s.next_out = gz; s.avail_out = (uInt)glen;
            rc = deflate(&s, Z_FINISH);
            CHECK(rc == Z_STREAM_END, "deflate(Z_FINISH) returns Z_STREAM_END (rc=%d)", rc);
            deflateEnd(&s);
            CHECK((gz[0] & 0x0f) == 8, "zlib CMF names the deflate method (CM=%u)", (unsigned)(gz[0] & 0x0f));
            CHECK(((unsigned)gz[0] * 256u + gz[1]) % 31u == 0, "zlib header FCHECK is valid");
        #endif
            free(gz); free(comp);
            /* THE EMBEDDED-CRITICAL PATH: an exhausted heap must be REPORTED. */
            void *hog[512]; unsigned held = 0;
            while (held < 512) { void *p = malloc(64u * 1024u); if (p == NULL) break; hog[held++] = p; }
            printf("heap drained: held %u x 64KiB blocks\n", held);
            CHECK(held > 0, "the harness was able to drain the heap");
            z_stream m; memset(&m, 0, sizeof m);
            int mrc = deflateInit2(&m, 9, Z_DEFLATED, 15, 8, Z_DEFAULT_STRATEGY);
            printf("deflateInit2 under exhaustion rc=%d (Z_MEM_ERROR=%d)\n", mrc, Z_MEM_ERROR);
            CHECK(mrc == Z_MEM_ERROR, "an exhausted heap yields Z_MEM_ERROR, not an abort");
            if (mrc == Z_OK) deflateEnd(&m);
            for (unsigned i = 0; i < held; i++) free(hog[i]);
            z_stream r; memset(&r, 0, sizeof r);
            int rrc = deflateInit2(&r, 9, Z_DEFLATED, 15, 8, Z_DEFAULT_STRATEGY);
            CHECK(rrc == Z_OK, "the engine initialises again once memory is returned (rc=%d)", rrc);
            if (rrc == Z_OK) CHECK(deflateEnd(&r) == Z_OK, "deflateEnd after recovery returns Z_OK");
            printf("TOTAL_FAILURES=%d\n", failures);
            return failures == 0 ? 0 : 1;
        }
        MAINEOF
        sed -i 's/^        //' "$RUNNER_TEMP/bm/mps2.ld" "$RUNNER_TEMP/bm/rt.c" "$RUNNER_TEMP/bm/main.c"
        wc -l "$RUNNER_TEMP/bm/mps2.ld" "$RUNNER_TEMP/bm/rt.c" "$RUNNER_TEMP/bm/main.c"
    - name: Link the firmware image
      run: |
        set -euo pipefail
        arm-none-eabi-gcc \
          -mcpu=cortex-m4 -mthumb -mfpu=fpv4-sp-d16 -mfloat-abi=hard \
          -O2 -Wall -ffunction-sections -fdata-sections \
          -DEXPECT_GZIP=${{ matrix.expect_gzip }} -I. \
          -nostartfiles -T "$RUNNER_TEMP/bm/mps2.ld" -Wl,--gc-sections \
          -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=memalign \
          -o "$RUNNER_TEMP/bm/fw.elf" \
          "$RUNNER_TEMP/bm/main.c" "$RUNNER_TEMP/bm/rt.c" \
          target/thumbv7em-none-eabihf/release/libzlib_rs.a -lc -lm
        arm-none-eabi-size "$RUNNER_TEMP/bm/fw.elf"
        file "$RUNNER_TEMP/bm/fw.elf"
    # THE GATE THIS JOB EXISTS FOR. `mps2-an386` is QEMU's Cortex-M4 MPS2 image,
    # whose 4 MiB SSRAM banks are what let a level-9 deflate state (about 256 KiB)
    # and its buffers fit; the 128 KiB-class STM32 boards QEMU also offers cannot
    # hold one, which would turn a real gate into a permanent Z_MEM_ERROR.
    - name: Execute the firmware under qemu-system-arm
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/bm/run.log"
        set +e
        timeout 600 qemu-system-arm -M mps2-an386 -cpu cortex-m4 -m 16M \
          -nographic -semihosting -kernel "$RUNNER_TEMP/bm/fw.elf" > "$log" 2>&1
        rc=$?
        set -e
        cat "$log"
        if [ "$rc" -ne 0 ]; then
          echo "::error::the firmware did not exit cleanly under qemu (exit $rc)."
          exit 1
        fi
        passes="$(grep -c '^PASS' "$log" || true)"
        fails="$(grep -c '^FAIL' "$log" || true)"
        echo "bare-metal assertions: $passes passed, $fails failed"
        if ! grep -qx 'TOTAL_FAILURES=0' "$log"; then
          echo "::error::the bare-metal harness reported failures, so the freestanding"\
            " runtime does not behave correctly on a no-OS target."
          exit 1
        fi
        if [ "$fails" -ne 0 ] || [ "$passes" -lt 12 ]; then
          echo "::error::expected at least 12 passing assertions and zero failures,"\
            " saw $passes/$fails. Either the harness stopped running what it claims"\
            " to run, or its output format changed."
          exit 1
        fi
        grep -q 'FAULT: unexpected exception' "$log" && {
          echo "::error::the firmware took an unexpected exception."; exit 1; }
        echo "freestanding runtime EXECUTED on a no-OS Cortex-M4:"\
          "allocator, fallible allocation and the compression engines"\
          "all behaved correctly ($passes assertions)."
    - name: Assert Cargo.lock is unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        if [ -n "$(git status --porcelain Cargo.lock)" ]; then
          echo "::error::Cargo.lock was modified by this job. A --locked command"\
            " cannot rewrite it, so a command is missing the flag."
          git --no-pager diff -- Cargo.lock
          exit 1
        fi
        echo "Cargo.lock unchanged."

  # Packaging verification (gap D12).
  #
  # `exclude` in `Cargo.toml` keeps the retained C baseline - the cross-validation
  # oracle and the source of the official test vectors - out of the published crate
  # while leaving it present in the tree. This job is a PACKAGING-time assertion
  # about what a `.crate` contains; it neither reads, moves nor rewrites a C source.
  #
  # THE ASSERTIONS ARE PATTERN-BASED, DELIBERATELY. A fixed file count or a golden
  # manifest would go red the next time a legitimate file is added - the one reason
  # that is not a defect. The absence checks are monotonic: excluding MORE never
  # breaks them, and only a C source, upstream C document or legacy platform
  # directory reappearing turns this job red. The presence checks are the other half,
  # since an `exclude` broad enough to swallow `src/` or `tests/` would otherwise
  # look like success.
  #
  # `test/**` (the C drivers) is excluded while `tests/**` (the Rust integration
  # suite) ships. That asymmetry is CORRECT and is asserted in both directions below;
  # do not "tidy" it into one pattern.
  #
  # A PACKAGING CHECK IS NOT A PUBLISH: `--list` plus the local verification build
  # only, with no registry token, no secret, no tag and no release, and it must stay
  # that way. The final step asserts both lockfiles are still pristine, because a
  # packaging step that quietly re-resolved dependencies would invalidate every other
  # gate in this file.
  package-verify:
    name: Package verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Rank-2 override: beats the rank-4 `rust-toolchain.toml` repository pin,
    # which would otherwise force this job onto the MSRV floor.
    #
    # PACKAGED_FLOOR is the SINGLE SOURCE OF TRUTH for the packaged suite's count,
    # interpolated into the logged summary, the enforced comparison and the failure
    # message alike - for the same reason `no-std-tests` declares `STD_OFF_FLOOR`
    # once: a number typed out separately in each of those three places can
    # disagree with itself, and a row that logs one floor while enforcing a lower
    # one lets tests vanish from the published archive while reporting green. The
    # value is the measured default-feature total, because a packaged `cargo test`
    # runs exactly the default features - `tests/c_oracle.rs` ships in the archive
    # but contributes nothing, since `c-oracle` is not a default feature.
    env:
      RUSTUP_TOOLCHAIN: stable
      PACKAGED_FLOOR: 1039
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Record the commit under test
      run: |
        set -euo pipefail
        head="$(git rev-parse HEAD)"
        echo "event sha : ${{ github.sha }}"
        echo "head sha  : $head"
        echo "tree hash : $(git rev-parse 'HEAD^{tree}')"
        echo "ref       : ${{ github.ref }}"
        echo "job       : ${{ github.workflow }} / ${{ github.job }}"
        case "$head" in
          "${{ github.sha }}"|"${{ github.event.pull_request.head.sha }}") ;;
          *) echo "::error::checked-out HEAD $head is neither the event sha nor the"\
             " pull-request head sha, so this job's verdict would describe a commit"\
             " nobody asked about."; exit 1 ;;
        esac
    - name: Install Rust stable toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
      with:
        toolchain: stable
    # Fails the job if the rank-2 `RUSTUP_TOOLCHAIN` override above is ever lost,
    # rather than letting the gate silently run on the MSRV floor.
    - name: Verify the resolved toolchain is stable
      run: |
        set -euo pipefail
        rustc --version --verbose
        cargo --version
        active="$(rustup show active-toolchain)"
        echo "active toolchain: $active"
        case "$active" in
          stable-*) ;;
          *) echo "::error::expected the stable toolchain, but resolved '$active'."\
             " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
        esac
    - name: Check the packaged file list against Cargo.toml's exclude contract
      run: |
        set -euo pipefail
        list="$RUNNER_TEMP/package.list"
        cargo +stable package --locked --list > "$list"
        echo "--- cargo package --list ($(wc -l < "$list") entries) ---"
        cat "$list"
        status=0

        # MUST NOT SHIP. Each entry is `<extended-regex>::<what it is>`. The
        # separator is `::` and NOT `|`, because several patterns use regex
        # alternation and would be split through the middle. Every pattern is
        # anchored so a legitimate neighbour cannot be caught by accident:
        # `README` is the upstream C readme and is matched exactly, which is why
        # `README.md` (the crate's own `readme =` target, asserted present below)
        # is unaffected, and `^test/` cannot match `tests/`. `cargo` injects
        # `Cargo.toml.orig` and `.cargo_vcs_info.json` into every listing; both
        # are expected and are matched by nothing here.
        forbidden='
        \.c$::retained C source
        \.h$::retained C header
        \.map$::linker version script
        \.in$::autotools or CMake input template
        \.cmakein$::CMake input template (NOT caught by *.in)
        ^zlib\.3::upstream C man page or its PDF
        ^ChangeLog$::upstream C change log
        ^FAQ$::upstream C FAQ
        ^INDEX$::upstream C index
        ^README$::upstream C readme (distinct from README.md)
        ^README-cmake\.md$::upstream CMake readme
        ^\.cmake-format\.yaml$::CMake formatter config for the C build
        crc-doc\.1\.0\.pdf$::CRC monograph (heavy binary)
        ^doc/(algorithm|txtvsbin|rfc19(50|51|52))\.txt$::normative reference text
        ^(contrib|examples|test)/::third-party bindings, C samples or C test drivers
        ^(amiga|msdos|os400|qnx|watcom|win32)/::legacy platform build tree
        ^(blitzy|blitzy-deck)/::migration engagement material
        ^(CMakeLists\.txt|Makefile|configure|make_vms\.com|treebuild\.xml)$::C build descriptor
        ^(BUILD\.bazel|MODULE\.bazel)$::Bazel build descriptor
        '
        while read -r entry; do
          [ -n "$entry" ] || continue
          pattern="${entry%%::*}"
          description="${entry#*::}"
          if hits="$(grep -E "$pattern" "$list")"; then
            echo "::error file=Cargo.toml::packaged but must be excluded ($description):"\
                 "$(printf '%s' "$hits" | tr '\n' ' ')"
            status=1
          fi
        done <<< "$forbidden"

        # MUST SHIP. Limited to what the crate cannot be published without, so
        # that adding an incidental new root file never requires editing this
        # list. Directory entries are prefix-matched because the listing is
        # per-file.
        #
        # THE SECOND GROUP IS NOT DOCUMENTATION POLISH. Every entry there is
        # load-bearing for the packaged crate, and the two steps after this one are
        # what make that concrete: they unpack the archive and run its OWN
        # `cargo test`, so a file this crate's tests read has to be inside the
        # archive or that run fails on a missing path rather than on a defect.
        #
        #   rust-toolchain.toml   read by `the_toolchain_pin_documents_no_clippy_
        #                         failure_that_does_not_exist`, and it is what
        #                         selects the compiler for the unpacked crate
        #   .cargo/config.toml    read by `the_lint_job_runs_the_documented_
        #                         clippy_gate`
        #   .github/workflows/    `ci.yml` is read by that same test and by
        #                         `every_toolchain_specific_ci_job_pins_and_
        #                         asserts_its_toolchain` and
        #                         `every_graph_resolving_ci_command_is_locked`
        #   clippy.toml           lint configuration; absent, the unpacked crate
        #   rustfmt.toml          lints and formats to tool defaults instead of to
        #                         this project's pinned configuration, so a
        #                         downstream `-D warnings` run is not the gate
        #                         this repository actually passes
        #   deny.toml             the supply-chain policy `audit.yml` enforces;
        #                         shipping it is what lets a distro packager or
        #                         auditor reproduce the verdict from the crate
        #                         alone
        #   CHANGELOG.md          the release history a consumer needs to tell
        #                         which published version they hold
        #   SECURITY.md           the disclosure route; a memory-safety
        #                         replacement for libz that ships without one is
        #                         the wrong artifact to be silent about
        #   CONTRIBUTING.md       the quality gates and MSRV policy, referenced
        #                         from README.md
        for required in '^src/' '^tests/' '^benches/' '^build\.rs$' '^Cargo\.toml$' \
                        '^Cargo\.lock$' '^README\.md$' '^LICENSE$' \
                        '^rust-toolchain\.toml$' '^\.cargo/config\.toml$' \
                        '^\.github/workflows/ci\.yml$' '^clippy\.toml$' '^rustfmt\.toml$' \
                        '^deny\.toml$' '^CHANGELOG\.md$' '^SECURITY\.md$' \
                        '^CONTRIBUTING\.md$'; do
          if ! grep -qE "$required" "$list"; then
            echo "::error file=Cargo.toml::nothing matching '$required' is packaged."\
                 " An exclude entry has become broad enough to remove part of the crate."
            status=1
          fi
        done

        # THE PACKAGED ENTRY COUNT IS DOCUMENTED, SO IT IS ASSERTED HERE.
        #
        # Three prose sites quote this number, and they were quoting 75 while the
        # archive held 76 - the drift arrived with `tests/ffi_alloc_balance.rs` and
        # nothing recomputed it. The count is derived from the listing this step
        # already produced rather than hardcoded, so this assertion cannot itself go
        # stale; what it catches is the prose falling behind the archive.
        #
        # The tracked/synthesised split is asserted alongside the total because the
        # total alone is ambiguous: a reader comparing it against `git ls-files`
        # finds a mismatch and cannot tell whether files leaked in or the delta is
        # cargo's own doing. Exactly two entries are synthesised - `Cargo.toml.orig`
        # (the pre-normalisation manifest) and `.cargo_vcs_info.json` (the commit
        # stamp) - and naming them is what makes the arithmetic checkable.
        # `Cargo.toml` and `Cargo.lock` are NOT in that set: both are tracked, and
        # only the manifest's *content* is rewritten on the way in.
        packaged_total="$(wc -l < "$list")"
        packaged_synth=0
        packaged_tracked=0
        while read -r entry; do
          if git ls-files --error-unmatch "$entry" >/dev/null 2>&1; then
            packaged_tracked=$((packaged_tracked + 1))
          else
            packaged_synth=$((packaged_synth + 1))
            case "$entry" in
              Cargo.toml.orig|.cargo_vcs_info.json) ;;
              *) echo "::error::'$entry' is packaged but tracked nowhere, and it is not one of"\
                      " the two entries cargo is known to synthesise (Cargo.toml.orig,"\
                      " .cargo_vcs_info.json). Either a build artifact leaked into the archive"\
                      " or cargo's packaging behaviour changed and the documented split must"\
                      " move with it."; status=1 ;;
            esac
          fi
        done < "$list"
        echo "packaged entries: ${packaged_total} = ${packaged_tracked} tracked"\
             "+ ${packaged_synth} synthesised by cargo"
        if [ "$((packaged_tracked + packaged_synth))" -ne "$packaged_total" ]; then
          echo "::error::packaged entry arithmetic does not close:"\
               " ${packaged_tracked} + ${packaged_synth} != ${packaged_total}."; status=1
        fi
        # Each documented claim is checked against the measured value, and a claim
        # that matches zero times fails just as loudly as one that disagrees -
        # otherwise rewording the prose would silently retire the check. Note the
        # file set: `doc/project-guide.md` ships in the crate, the engagement guide
        # does not, but both are present in this checkout and both publish the
        # figure, so both are arbitrated here.
        for claim in \
          "doc/project-guide.md:cargo package --locked --list\` yields \*\*${packaged_total}\*\* entries" \
          "doc/project-guide.md:cargo package --locked --list\` reports \*\*${packaged_total}\*\* entries" \
          "blitzy/documentation/Project Guide.md:resolves to \*\*${packaged_total}\*\* files" \
          "blitzy/documentation/Project Guide.md:\*\*${packaged_tracked}\*\* of the ${packaged_total} are git-tracked"; do
          claim_file="${claim%%:*}"
          claim_pat="${claim#*:}"
          if ! grep -qE "$claim_pat" "$claim_file"; then
            echo "::error file=${claim_file}::does not publish the measured packaged-entry"\
                 " figure. Expected a line matching '${claim_pat}'. The archive now holds"\
                 " ${packaged_total} entries (${packaged_tracked} tracked +"\
                 " ${packaged_synth} synthesised); update the prose, or move this pattern if"\
                 " the wording changed."
            status=1
          fi
        done

        if [ "$status" -eq 0 ]; then
          echo "package contents match the exclude contract: no C baseline, no upstream C docs,"\
               "no legacy platform trees, no engagement material; crate sources, tests, benches,"\
               "build script, manifests, README.md and LICENSE all present, and so are the"\
               "toolchain, lint, format, supply-chain and governance files the packaged"\
               "crate's own test suite and gates read; and the documented packaged-entry count"\
               "matches the archive"
        fi
        exit "$status"
    # `--list` proves WHAT would ship; this proves the result is BUILDABLE from
    # only those files. It is the check that catches an `exclude` entry which
    # removed something the build actually reads - a failure mode the listing
    # alone cannot see. Deliberately `cargo package` rather than
    # `cargo publish --dry-run`: `package` performs the same archive-and-verify
    # work while staying entirely off the publishing path, so the job cannot
    # acquire a registry interaction, a token requirement or an upload by
    # accident. Note it is run WITHOUT `--allow-dirty`, which makes it assert a
    # second property for free: no earlier step left the tree modified.
    - name: Verify the packaged crate builds from its own contents
      run: cargo +stable package --locked --verbose
    # `cargo package --verbose` COMPILES the packaged crate but does not TEST it, and
    # those are different properties: a consumer or distro packager who unpacks the
    # `.crate` and runs `cargo test` runs a suite whose fixtures include files the
    # `exclude` contract deliberately removed. `src/ffi/mod.rs` reconciles the
    # exported symbol surface against `zlib.map`, which is REFERENCE-only and matches
    # the `\.map$` exclusion asserted above, so inside the archive those tests
    # degrade to a printed skip notice for that one condition (file absent) and stay
    # hard failures for every other (present but unreadable, or malformed) - the same
    # contract `tests/c_oracle.rs` uses for a missing C compiler. This step keeps
    # that true.
    #
    # This step is what keeps that true. It extracts the tarball rather than
    # reusing the `target/package/<name>-<version>/` directory `cargo package`
    # leaves behind, because the tarball is what a consumer actually downloads,
    # so this also proves the archive is self-sufficient. It runs entirely inside
    # `RUNNER_TEMP` with its own build directory, passed as `--target-dir` on the
    # command line, so it cannot perturb the workspace or either lockfile - the
    # step below still gets to assert that. `--target-dir` rather than a
    # `CARGO_TARGET_DIR` environment variable: this workflow sets no `CARGO_*`
    # variable anywhere, so the redirection stays visible beside the command it
    # governs instead of becoming ambient state that a later step could inherit.
    - name: Run the packaged crate's own test suite
      run: |
        set -euo pipefail
        shopt -s nullglob
        crates=(target/package/*.crate)
        if [ "${#crates[@]}" -ne 1 ]; then
          echo "::error::expected exactly one .crate in target/package, found"\
               "${#crates[@]}: ${crates[*]-none}"
          exit 1
        fi
        crate="${crates[0]}"
        echo "packaged archive: $crate ($(wc -c < "$crate") bytes)"

        unpacked="$RUNNER_TEMP/packaged"
        rm -rf "$unpacked"
        mkdir -p "$unpacked"
        tar -xzf "$crate" -C "$unpacked"
        roots=("$unpacked"/*/)
        if [ "${#roots[@]}" -ne 1 ]; then
          echo "::error::expected exactly one top-level directory in the archive,"\
               "found ${#roots[@]}: ${roots[*]-none}"
          exit 1
        fi
        root="${roots[0]%/}"
        echo "unpacked to: $root"

        # Precondition, not a nicety: if the script were present the run below
        # would prove nothing about the degradation path. The `--list` gate above
        # forbids `\.map$` outright, so this is the second, independent check
        # that the two suites really do execute without it.
        if [ -e "$root/zlib.map" ]; then
          echo "::error::zlib.map is inside the packaged crate; the exclude contract"\
               " has regressed and the skip path below is untested"
          exit 1
        fi

        cd "$root"
        # The consumer gate: every suite, zero failures, zero ignored, and the
        # count read rather than assumed. The packaged suite is exactly where a lost
        # target is hardest to notice, because an `exclude` entry can delete a whole
        # fixture and `cargo test` will still report `ok` over what remains. Not
        # `--no-fail-fast`; a single failure here is a broken published crate.
        #
        # The floor is the measured default-feature total, which is exactly what the
        # unpacked archive runs - `.github/workflows/*.yml` IS packaged, so even the
        # workflow-parsing tests are present and the packaged count equals the
        # `Default features` row rather than sitting below it. `tests/c_oracle.rs`
        # contributes nothing to it by design, since `c-oracle` is not a default
        # feature. Both the summary echoed below and the predicate that enforces it
        # read THIS variable, the job-scoped `PACKAGED_FLOOR` declared once in this
        # job's `env:`, so the announced floor and the enforced floor are the same
        # value by construction. The `no-std-tests` job's four branches follow the
        # same single-source rule, for the same reason: a gate that announces one
        # floor while enforcing a lower one reads as a gate in the log without
        # being one, which is worse than no floor at all.
        log="$RUNNER_TEMP/packaged-full.log"
        cargo +stable test --locked --target-dir "$RUNNER_TEMP/packaged-target" \
          2>&1 | tee "$log"
        set -- $(awk '/^test result:/ { b += 1; p += $4; f += $6; i += $8 }
                      END { printf "%d %d %d %d", b, p, f, i }' "$log")
        echo "packaged test summary: blocks=$1 passed=$2 failed=$3 ignored=$4 floor=$PACKAGED_FLOOR"
        [ "$1" -ge 1 ] || { echo "::error::the packaged crate produced no 'test result:'"\
          " line - its harness never ran"; exit 1; }
        [ "$3" -eq 0 ] || { echo "::error::$3 test(s) failed inside the packaged crate";
          exit 1; }
        [ "$4" -eq 0 ] || { echo "::error::$4 test(s) were ignored inside the packaged"\
          " crate; AAP directive D-5 requires zero ignored tests"; exit 1; }
        [ "$2" -ge "$PACKAGED_FLOOR" ] || { echo "::error::only $2 tests ran inside the"\
          " packaged crate, below the floor of $PACKAGED_FLOOR - the archive is missing"\
          " part of the suite, so an exclude entry removed a test target or a fixture"\
          " it needs"; exit 1; }
        # Belt and braces: prove the two suites PASSED BY DEGRADING rather than
        # by having been silently filtered out or renamed away. `--nocapture` is
        # required because a passing test's stdout is swallowed by default.
        cargo +stable test --locked --target-dir "$RUNNER_TEMP/packaged-target" \
          --lib -- --nocapture \
          ffi::tests::every_zlib_map_global_symbol_has_a_compile_time_signature_guard \
          ffi::tests::no_zlib_map_local_symbol_is_exported_or_guarded \
          > "$RUNNER_TEMP/packaged-skip.log" 2>&1 || {
            cat "$RUNNER_TEMP/packaged-skip.log"
            echo "::error::the zlib.map reconciliation tests did not pass inside the"\
                 " packaged crate"
            exit 1
          }
        # The notice this grep looks for is emitted by `src/ffi/mod.rs`, and its
        # text contains a U+2014 EM DASH. This workflow is ASCII-ONLY by
        # convention (see "ASCII PUNCTUATION" in the header), so the em dash is
        # SPELLED OUT as its three UTF-8 bytes in octal rather than pasted in:
        # `\342\200\224`. POSIX `printf` interprets `\ooo`, so this is portable
        # across the runner shells. `grep -cF` because the needle is a fixed
        # string, not a pattern - the `.` in `zlib.map` should match a literal
        # dot and nothing else.
        em_dash="$(printf '\342\200\224')"
        skip_notice="ffi: SKIPPED ${em_dash} zlib.map is not present"
        notices="$(grep -cF "$skip_notice" \
          "$RUNNER_TEMP/packaged-skip.log" || true)"
        selected="$(grep -c '^test result: ok\. 2 passed' \
          "$RUNNER_TEMP/packaged-skip.log" || true)"
        if [ "$notices" -ne 2 ] || [ "$selected" -ne 1 ]; then
          cat "$RUNNER_TEMP/packaged-skip.log"
          echo "::error::expected both zlib.map reconciliation tests to run and print the"\
               " skip notice; saw $notices notice(s) and $selected matching result line(s)"
          exit 1
        fi
        echo "the packaged crate is self-testable: full suite green, and both zlib.map"\
             "reconciliation tests degraded to a printed skip notice as designed"
    # A packaging step that re-resolved dependencies would invalidate every
    # `--locked` gate in this file, and `fuzz/Cargo.lock` belongs to a detached
    # workspace that nothing here should be touching at all.
    - name: Assert both lockfiles are unchanged
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
        if [ -n "$dirty" ]; then
          echo "::error::packaging modified a lockfile, which would silently change what"\
               " every other job resolves: $dirty"
          exit 1
        fi
        echo "Cargo.lock and fuzz/Cargo.lock are unchanged"
