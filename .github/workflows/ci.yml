        REQS
        # `--require-hashes` verifies every artifact against its digest AND
        # refuses to resolve any requirement that is not pinned, so a dependency
        # appearing in a later release fails the job rather than entering
        # unnoticed. Asserting the entry count first catches a truncated or
        # mangled heredoc, which would otherwise install a smaller closure and
        # still exit 0.
        want_reqs=46
        got_reqs="$(grep -cE '^[A-Za-z0-9._-]+==' "$reqs")"
        [ "$got_reqs" = "$want_reqs" ] || { echo "::error::the inline MkDocs closure"\
          " holds $got_reqs pinned requirements, not the expected $want_reqs. The"\
          " heredoc above was truncated or edited without updating this count";
          exit 1; }
        python -m pip install --disable-pip-version-check --no-input \
          --require-hashes --only-binary=:all: -r "$reqs"
        # The lock is the source of truth for the whole closure; these three are
        # the requirements this project chose deliberately, so they are read back
        # by name. A lock edit that moved one of them without a decision fails
        # here instead of quietly changing the published site.
        for pin in 'mkdocs==1.6.1' 'mkdocs-techdocs-core==1.7.0' \
                   'mkdocs-mermaid2-plugin==1.2.3'; do
          name="${pin%%==*}"
          want="${pin##*==}"
          got="$(python -m pip show "$name" 2>/dev/null | sed -n 's/^Version: //p' || true)"
          [ "$got" = "$want" ] || { echo "::error::$name resolved to ${got:-nothing},"\
            " not the pinned $want. The closure heredoc above and this assertion"\
            " have drifted apart"; exit 1; }
          echo "pinned and verified: $name $got"
        done
        mkdocs --version
    # `--site-dir` points OUTSIDE the checkout on purpose. A default `mkdocs
    # build` writes 60 generated files into `<repo>/site`, which `.gitignore` does
    # NOT cover - so an unqualified build leaves 60 untracked files behind and the
    # unscoped `git status --porcelain` assertion in the packaging job fails on a
    # stray build artifact rather than on a real regression. Widening `.gitignore`
    # would be the wrong fix twice over: an ignore rule only hides an artifact, it
    # does not avoid creating it, and hiding it is precisely what would let a real
    # regression through. Building outside the checkout leaves the tree untouched
    # rather than merely unstaged, which is what keeps every `git status
    # --porcelain` assertion in this workflow honest.
    # The documented reproduce commands in `README.md`, `CONTRIBUTING.md`, and
    # `doc/technical-specifications.md` pass `--site-dir` for the same reason.
    - name: Build the documentation site in strict mode
      run: |
        set -euo pipefail
        site="$RUNNER_TEMP/site"
        mkdocs build --strict --site-dir "$site"
        for page in index.html project-guide/index.html technical-specifications/index.html; do
          [ -s "$site/$page" ] || { echo "::error::mkdocs built no ${page}."\
            " Every entry in mkdocs.yml's nav must produce a page, or the published site"\
            " has a dead link that --strict did not catch."; exit 1; }
        done
        echo "documentation site built in strict mode; every nav entry produced a page"

    # THE MEASURED COUNTERS ARE A GATE, NOT A CONVENTION.
    #
    # Fourteen documentation sites quoted a stale `src/` line count, five quoted a
    # stale `tests/` count, and the AAP-citation census was stale in five figures
    # at once - population, citing files, total citations, distinct-as-written and
    # distinct-normalised - because nothing recomputed any of them. Every one of
    # those figures is derived from the tree by a one-line command, so leaving them
    # to be re-typed by hand is a defect generator: the figure and the tree drift
    # apart silently, and a reader who spots the disagreement cannot tell which
    # side is wrong.
    #
    # This step closes that loop. It recomputes each counter from the working tree
    # and then asserts that the documentation actually carries the recomputed
    # value, naming the file, line, published figure and measured figure on a
    # mismatch. Note the direction: nothing here hardcodes an expected number, so
    # the gate cannot itself go stale the way the prose did.
    #
    # WHY IT LIVES IN THIS JOB. `docs` is already the documentation-accuracy gate -
    # it is where rustdoc runs with warnings denied and where MkDocs runs in strict
    # mode. A figure that contradicts the tree is the same class of defect as a
    # dead link, and it belongs beside it. The interpreter is the hash-pinned
    # Python installed above, and the script is standard library only: no pip
    # install, no new repository file, nothing for `package-verify` to arbitrate.
    #
    # WHEN THIS STEP FAILS, READ THE MESSAGE BEFORE EDITING EITHER SIDE. Two
    # different failures print differently and want opposite fixes:
    #   * "publishes X ... but the tree measures Y" - the prose is stale. Update
    #     the documentation to Y. This is the ordinary case after adding code.
    #   * "claim for `k` matched 0 time(s)" - the prose was reworded and the
    #     pattern no longer finds it. Move the pattern, do not delete the claim;
    #     deleting it is how the figure becomes unverified again.
    #
    # THREE `unsafe` COUNTS ARE IN CIRCULATION AND THEY ARE NOT INTERCHANGEABLE,
    # which is why they are gated separately rather than folded together:
    #   * `unsafe { .. }` blocks, comment-stripped              -> 1,270 crate-wide
    #   * `\bunsafe\b` construct lines, comment-stripped        -> 1,667 in src/ffi
    #   * `\bunsafe\b` construct lines, whole-line strip only   -> differs from the
    #     stripped scan by exactly two lines, and only in `src/lib.rs`, where the
    #     boundary test carries the string literals "// unsafe" and "//! unsafe"
    #     as fixtures for its own classifier.
    # Each figure is checked against the command the document publishing it prints,
    # so `SECURITY.md` reading 51 and the specification reading 49 for the same
    # file is correct rather than contradictory.
    #
    # THIS SCRIPT IS EMBEDDED IN A FILE IT MEASURES, so any pattern it applies to a
    # workflow can match its own source text. `checkouts_pc` is anchored as a YAML
    # key line (`^ +persist-credentials: false *$`) for exactly that reason: an
    # unanchored substring search matched the pattern literal on its own definition
    # line and over-counted by one. Any new workflow-shape counter added below must
    # be anchored the same way, or verified against this file's own body.
    #
    # PER-FILE LENGTHS ARE GATED TOO, because they are the fastest-drifting figures
    # in the tree. The repository-layout tree in `technical-specifications.md`
    # annotates every root file with a `wc -l`, and the D1-D12 gap register beneath
    # it restates several of them in prose - so a single commit touching
    # `CONTRIBUTING.md` can stale four published figures at once. Each is derived
    # here, and the patterns are anchored on the filename plus its trailing gloss
    # rather than on the box-drawing glyphs, which is what keeps this file ASCII.
    #
    # WHAT IS DELIBERATELY NOT GATED, in three distinct categories:
    #   1. Any figure a page states about ITSELF. A page cannot stably quote its own
    #      length, because the edit that publishes the figure changes it. Both long
    #      doc/ pages are therefore excluded from the aggregate line-count rows, and
    #      `technical-specifications.md` publishes no length for itself. The
    #      asymmetric case IS gated because it is stable: that file publishes the
    #      length of `doc/project-guide.md`, and nothing publishes the length of
    #      `technical-specifications.md`, so the dependency is a chain, not a cycle.
    #   2. Release artifact byte sizes. They move with the compiler, the feature row
    #      and the profile with no source change at all, so the documentation labels
    #      them a dated observation beside a reproduce command; asserting them would
    #      fail this job on an unrelated toolchain bump.
    #   3. Anything derived from commit history, such as the pinned-range diffstat in
    #      section 8.1 of the project guide. This job checks out at the default
    #      shallow depth, so the baseline commit is not present. That table pins BOTH
    #      endpoints to a hash instead, which is what keeps it honest without a gate.
    - name: Assert every documented tree metric matches the tree
      run: |
        set -euo pipefail
        python3 - <<'DOCMETRICS'
        #!/usr/bin/env python3
        """Recompute every measured counter the documentation publishes, then assert the
        documentation actually carries the recomputed value.

        WHY THIS EXISTS
            Fourteen documentation sites quoted a stale `src/` line count, five quoted a
            stale `tests/` count, and the AAP-citation census was stale in five figures at
            once, because nothing recomputed them. Every one of those numbers is derived
            from the tree by a one-line command, so leaving them to be re-typed by hand is
            a defect generator: the figure and the tree drift apart silently and a reader
            cannot tell which is wrong.

        HOW IT WORKS
            Two tables. MEASURE names each counter and the callable that derives it from
            the working tree -- so the expected value is never hardcoded here either.
            CLAIMS names each place a counter is published, as (files, pattern, key). The
            pattern must contain exactly one capture group holding the number. Every match
            across every named file must equal the measured value, and at least `min_hits`
            matches must exist, so deleting a claim fails as loudly as staling one.

        WHAT IT DELIBERATELY DOES NOT GATE
            1. Figures a page states about ITSELF. A page cannot stably quote its own
               length: the edit that publishes the figure changes it. So neither long
               doc/ page appears in the aggregate rows, and `technical-specifications.md`
               publishes no length for itself. The asymmetric case IS gated, because it is
               stable: `technical-specifications.md` publishes the length of
               `doc/project-guide.md`, and nothing publishes the length of
               `technical-specifications.md`, so the dependency is a chain, not a cycle.
            2. Release artifact byte sizes. Those move with the compiler, the feature row
               and the profile with no source change at all, so the documentation labels
               them a dated observation next to a reproduce command instead, and asserting
               them here would fail CI on an unrelated toolchain bump.
            3. Anything derived from commit history, such as the pinned-range diffstat in
               project-guide.md section 8.1. CI checks out at the default shallow depth,
               so the baseline commit is not present; that table pins BOTH endpoints to a
               hash instead, which is what keeps it honest without a gate.
        """

        import os
        import re
        import subprocess
        import sys

        ROOT = os.getcwd()


        def sh(cmd):
            return subprocess.run(cmd, shell=True, cwd=ROOT, capture_output=True, text=True,
                                  check=True).stdout


        def rs_under(*dirs):
            """Git-tracked *.rs files under the given directories."""
            out = sh("git ls-files %s" % " ".join(dirs)).split()
            return [p for p in out if p.endswith(".rs")]


        def lines_of(paths):
            n = 0
            for p in paths:
                with open(os.path.join(ROOT, p), encoding="utf-8") as fh:
                    n += sum(1 for _ in fh)
            return n


        def wc(path):
            return lines_of([path])


        def strip_trailing(text):
            """The `sed 's://.*::'` convention: drop from the first // to end of line."""
            return "\n".join(re.sub(r"//.*$", "", ln) for ln in text.split("\n"))


        def drop_whole_comment_lines(text):
            """The looser `grep -v -E '^[[:space:]]*(//|/\\*|\\*)'` convention."""
            return "\n".join(ln for ln in text.split("\n")
                             if not re.match(r"^[ \t]*(//|/\*|\*)", ln))


        def token_count(paths, transform, pattern):
            n = 0
            for p in paths:
                with open(os.path.join(ROOT, p), encoding="utf-8") as fh:
                    body = transform(fh.read())
                n += sum(1 for ln in body.split("\n") if re.search(pattern, ln))
            return n


        WORKFLOWS = [".github/workflows/ci.yml", ".github/workflows/audit.yml",
                     ".github/workflows/fuzz.yml"]
        JOB_KEY = re.compile(r"^  ([A-Za-z0-9_][A-Za-z0-9_-]*):[ \t]*$")


        def job_count(path):
            """Count top-level keys under `jobs:`.

            This duplicates, on purpose, the shape of the census in audit.yml's
            policy-integrity job. That census asserting a job count is what went stale and
            turned the audit workflow permanently red; a second, independent derivation
            guarding the figure the repository-layout tree publishes is cheap, and the two
            disagreeing would itself be the signal.
            """
            n, inside = 0, False
            with open(os.path.join(ROOT, path), encoding="utf-8") as fh:
                for line in fh:
                    if line.rstrip("\n").rstrip() == "jobs:":
                        inside = True
                        continue
                    if inside:
                        if line.strip() and not line.startswith(" "):
                            break
                        if JOB_KEY.match(line.rstrip("\n")):
                            n += 1
            return n


        def prefixed(path, tool, chan=r"(?:stable|1\.85\.0|nightly[^ ]*)"):
            """Count `<tool> +<toolchain>` invocations on non-comment lines."""
            rx = re.compile(r"%s \+%s" % (tool, chan))
            n = 0
            with open(os.path.join(ROOT, path), encoding="utf-8") as fh:
                for line in fh:
                    if line.lstrip().startswith("#"):
                        continue
                    n += len(rx.findall(line))
            return n


        def grep_count(paths, pattern):
            rx = re.compile(pattern)
            n = 0
            for p in paths:
                with open(os.path.join(ROOT, p), encoding="utf-8") as fh:
                    n += sum(1 for line in fh if rx.search(line))
            return n


        SRC = rs_under("src")
        TESTS = rs_under("tests")
        BENCHES = rs_under("benches")
        FUZZ = rs_under("fuzz/fuzz_targets")
        FFI = [p for p in SRC if p.startswith("src/ffi/")]

        ARCH_CONFIG = ["Cargo.toml", "build.rs", "rust-toolchain.toml", "deny.toml",
                       "clippy.toml", "rustfmt.toml", ".cargo/config.toml", ".gitignore"]
        DOC_FILES = ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
                     "doc/index.md", "docs/index.md"]

        # The AAP-citation census population, defined exactly as the published script does.
        CITE_POP = rs_under("src", "tests", "benches", "fuzz/fuzz_targets") + [
            "build.rs", "Cargo.toml", "fuzz/Cargo.toml", "README.md", "CHANGELOG.md",
            "CONTRIBUTING.md", "SECURITY.md", "doc/index.md", "doc/project-guide.md",
            "docs/index.md"]
        CITE_RE = re.compile(r"\u00a70(\.[0-9]+)+")


        def all_cites():
            out = []
            for p in CITE_POP:
                with open(os.path.join(ROOT, p), encoding="utf-8") as fh:
                    out += [m.group(0) for m in CITE_RE.finditer(fh.read())]
            return out


        _ALL = all_cites()


        def component(name):
            if name == "root":
                return lines_of([p for p in SRC if p.count("/") == 1])
            return lines_of([p for p in SRC if p.startswith("src/%s/" % name)])


        # The cfg gate that makes a test LP64-and-not-Windows only. `cross-run`'s
        # commentary depends on how many tests carry it, because the i686 row's library
        # total is lower than the LP64 rows' by exactly that many tests, and that
        # sentence went stale by 70 tests before anything checked it.
        LP64_GATE = r'#\[cfg\(all\(target_pointer_width = "64", not\(windows\)\)\)\]'


        def lp64_only_tests():
            """`#[test]` functions that exist only on 64-bit non-Windows targets.

            Counted structurally, not by eye. An occurrence qualifies only when the
            contiguous attribute block it belongs to also carries `#[test]` and the item
            that block introduces is a `fn`. Both halves matter: the block scan runs in
            BOTH directions because this tree writes the gate above `#[test]` in
            `src/ffi/types.rs` and below it in the two `state.rs` pairs, and the `fn`
            requirement is what excludes the `const _` layout assertion in
            `src/ffi/types.rs` that carries the very same gate.
            """
            n = 0
            for p in SRC:
                with open(os.path.join(ROOT, p), encoding="utf-8") as fh:
                    lines = fh.read().split("\n")
                for i, ln in enumerate(lines):
                    if not re.search(LP64_GATE, ln):
                        continue
                    lo = i
                    while lo > 0 and lines[lo - 1].lstrip().startswith("#["):
                        lo -= 1
                    hi = i
                    while hi + 1 < len(lines) and lines[hi + 1].lstrip().startswith("#["):
                        hi += 1
                    block = lines[lo:hi + 1]
                    item = lines[hi + 1] if hi + 1 < len(lines) else ""
                    if (any(a.lstrip().startswith("#[test]") for a in block)
                            and item.lstrip().startswith("fn ")):
                        n += 1
            return n


