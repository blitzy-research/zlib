# Audit - supply-chain audit gate for the zlib-rs crate
#
# Pure-Cargo pipeline for the C-to-Rust migration of zlib 1.3.2.1 into the
# `zlib-rs` crate (library `zlib_rs`; edition 2024; MSRV 1.85.0;
# crate-type = ["lib", "cdylib", "staticlib"]).
#
# This workflow is the only thing in the repository that watches the dependency
# closure. Two independent tools run here, because they answer two different
# questions:
#
#   * `cargo-audit` reads a LOCKFILE and matches its packages against the
#     RustSec advisory database. It is the only mechanism anywhere in this
#     repository that checks `fuzz/Cargo.lock` for advisories.
#   * `cargo-deny` evaluates the root `deny.toml` POLICY - permitted licences,
#     advisory severity, banned crates and permitted sources - over the resolved
#     root crate graph.
#
# Neither tool is, or may become, a manifest dependency. Both are installed by
# the jobs below, exactly as `fuzz.yml` installs `cargo-fuzz`. This file is the
# ONLY place either tool runs: `fuzz.yml` builds and fuzzes the harnesses and
# nothing else, so the supply-chain gate has exactly one home.
#
# Every job and step here is BLOCKING and none may be marked advisory: a gate that
# reports without failing is indistinguishable from no gate. Nothing here suppresses
# a finding either - no advisory id on a command line, no tool-local suppression
# file. A warranted exception belongs in `deny.toml`'s `[advisories] ignore` as a
# reviewable entry; that list is deliberately empty, and its companion
# `unused-ignored-advisory = "deny"` makes a stale entry an error in its own right.
#
# Jobs:
#   policy-integrity   structural self-assertion over `deny.toml`, the single
#                      policy file; needs no Rust toolchain
#   cargo-audit        RustSec advisory scan of BOTH lockfiles (89 + 13 = 102
#                      packages); the only cargo-audit run in the repository
#   cargo-deny         root `deny.toml` policy over the root graph: licenses,
#                      advisories, bans and sources, one named step each
#   cargo-deny-fuzz    the SAME root `deny.toml`, aimed at the detached fuzz graph
#                      with `--manifest-path`; the sole enforcement point for that
#                      half of the closure
#
# All four jobs are independent - none declares `needs:` - so they run in
# parallel and a red build points at one tool, one policy, or one graph without
# waiting on the others.
#
# Every action is pinned to a verified commit SHA; see "ACTION PINNING" below.
# No native toolchain is required: both tools resolve a dependency graph and
# read lockfiles, and neither compiles this crate or any C source. No step in
# this file reads, writes, moves or compiles the retained C baseline (`*.c`,
# `*.h`, `test/*.c`, `zlib.map`), and no step creates or modifies a tracked
# file.
#
# CONVENTIONS - THIS FILE DELIBERATELY MIXES THE TWO IN-REPO WORKFLOW IDIOMS
# =========================================================================
# The HEADER block and the `# Jobs:` index above follow `ci.yml`, this
# repository's Cargo-CI pattern: a hyphenated title line, bare `#` separators
# between paragraphs, ALL-CAPS section banners, and a WHY comment above every
# job key.
#
# The BODY follows `fuzz.yml`: blank lines between top-level keys, a
# `# Triggers:` index, `concurrency:`, and numbered `# 1.` step comments over a
# six-space step-sequence indent. `ci.yml` now carries `concurrency:` too, but has no
# `schedule:` trigger to copy from, and it indents step sequences at four spaces
# rather than six. (`permissions: contents: read` is now common to all three
# files; it was absent from `ci.yml` when this note was first written.)
#
# The two parents genuinely disagree on those points, so the split is recorded
# here on purpose rather than left to be rediscovered. Do not "normalise" this
# file toward either parent without reading both: an unexplained reformat here
# is how one of the two idioms quietly gets lost.
#
# TOOLCHAIN SELECTION - WHY EVERY JOB SAYS `stable` TWICE
# ======================================================
# `rust-toolchain.toml` pins `channel = "1.85.0"`, and a rustup toolchain FILE
# outranks the `rustup default` that `dtolnay/rust-toolchain` sets - so INSTALLING
# a toolchain is not SELECTING it, and an unprefixed `cargo install` here would
# build on the MSRV floor. Both audit tools are ordinary Rust programs whose own
# MSRV is their business, not this project's.
#
# Each job therefore states `stable` twice - a job-level
# `env: RUSTUP_TOOLCHAIN: stable` (which also reaches nested cargo invocations)
# and a `+stable` prefix on every cargo call - and then ASSERTS what it resolved,
# using BARE `rustc` and `rustup` so the assertion observes the ambient resolution
# rather than restating its own prefix. Do not "simplify" this by deleting the
# repository pin. Precedence details are in CONTRIBUTING.md ("The toolchain pin,
# and the one thing it will surprise you with").
#
# SCOPE - 102 PACKAGES ACROSS TWO LOCKFILES, AND WHO CHECKS WHICH
# ==============================================================
# The governed closure spans two lockfiles, because `fuzz/Cargo.toml` carries an
# empty `[workspace]` table. That table DETACHES the fuzz crate, so root-level
# `cargo build`, `test`, `clippy`, `fmt`, `deny` and `audit` never reach it. The
# detachment is load-bearing and must not be "fixed": attaching the fuzz crate
# to the root would pull the nightly-only `libfuzzer-sys` into the root
# dependency graph and break the stable jobs in `ci.yml` at a stroke.
#
#   * root `Cargo.lock` - 89 packages. The runtime closure is just `cfg-if` plus
#     the optional `crc32fast`; every other package is dev-only.
#   * `fuzz/Cargo.lock` - 13 packages, reachable only by naming the file.
#
# ADVISORIES over both lockfiles are covered here by two `cargo audit` steps; the
# second names `--file fuzz/Cargo.lock`, which is the whole reason it is separate.
# `cargo-audit` reads a lockfile directly and consults no policy file, so scoping
# it that way carries no configuration-resolution question.
#
# POLICY over the fuzz graph is covered by the `cargo-deny-fuzz` job, and the
# nuance matters. What would be wrong is aiming the ROOT policy at the fuzz graph:
# root `deny.toml` bans `cc` outright because the crate proper takes no
# C-toolchain build dependency, while the fuzz graph legitimately contains `cc`,
# `jobserver`, `shlex` and `find-msvc-tools` for the libFuzzer runtime shim plus an
# NCSA-licensed `libfuzzer-sys`. That is an argument against `--config deny.toml`,
# not against scanning the graph. It is also exactly why `--config deny.toml` is
# MANDATORY on the fuzz invocation: `cargo-deny` resolves its configuration from the
# TARGET manifest's workspace root, so `--manifest-path fuzz/Cargo.toml` without
# `--config` would look for a `fuzz/deny.toml`, find none, and silently fall back to
# built-in defaults - a result indistinguishable from a pass. `-L info` prints which
# config was actually used, which is the positive evidence that the reviewed root
# policy was in force.
#
# BOTH graphs are governed by the single root `deny.toml`, and the fuzz job says
# so explicitly with `--config deny.toml`. That is a deliberate change from an
# earlier arrangement in which a sibling `fuzz/deny.toml` was DISCOVERED (not
# named) because cargo-deny resolves configuration from the target manifest's
# workspace root. The sibling file was deleted: a blocking supply-chain verdict
# must be produced by a policy that is reviewed as part of this repository's
# normal review surface, and a second policy file governing a blocking gate is a
# second place for the standard to drift and a place a reviewer can miss.
#
# The fuzz graph legitimately contains `cc`, `jobserver`, `shlex` and
# `find-msvc-tools` for the libFuzzer runtime shim, plus an NCSA-licensed
# `libfuzzer-sys` - all of which the crate proper must never acquire. The root
# policy accommodates exactly those, narrowly and reviewably: the `cc` ban is
# scoped with `wrappers = ["libfuzzer-sys"]` rather than relaxed, and NCSA is
# granted through a crate-scoped `[[licenses.exceptions]]` entry rather than
# added to the global allow list. See "THE FOUR PLACES THIS FILE ACCOMMODATES THE
# FUZZ GRAPH" in `deny.toml`.
#
# `-L info` still prints the resolved configuration path in both jobs, which is
# the positive evidence that the ROOT policy is in force rather than a
# rediscovered sibling or a silent built-in default.
#
# Why that job has to live HERE, and ONLY here: THIS FILE IS THE SUPPLY-CHAIN
# GATE. The gate is one deliverable with one home - `deny.toml` is the single
# policy and this workflow is what evaluates it, once per graph. An
# earlier revision of `fuzz.yml` carried its own `cargo-deny` job over the fuzz
# graph; it has been removed, because a second copy of the gate is not defence in
# depth but a second place for the tool pin, the `--locked` discipline and the
# lockfile assertion to drift out of step. `fuzz.yml` now builds and fuzzes and
# nothing else, and it must not reacquire a policy job.
#
# `cargo-deny-fuzz` therefore has SOLE ownership of the fuzz graph's licence, ban
# and source evaluation, and its trigger surface strictly contains the one the
# removed job had:
#
#   * this job          - push, PR, DAILY 05:00, manual.
#   * the removed job   - PR, WEEKLY (Mondays 03:00), manual. No `push` trigger
#                         at all, so a direct push touching `fuzz/Cargo.toml` or
#                         `fuzz/Cargo.lock` got advisory
#                         coverage from the `--file fuzz/Cargo.lock` step above
#                         and NO licence, ban or source evaluation for up to
#                         seven days.
#
# The one thing genuinely given up is intra-run SEQUENCING: `fuzz.yml`'s
# `cargo-fuzz` job can no longer `needs:` the policy verdict, because a job in
# another workflow cannot be a `needs:` predecessor. That is a deliberate,
# recorded trade. Both checks are blocking and both run on every pull request, so
# a policy regression still fails the same PR - it fails as a sibling check
# rather than as an upstream job. Do NOT "restore the sequencing" by adding a
# policy job back to `fuzz.yml`, and do NOT give `fuzz.yml` a `push:` trigger to
# compensate: a fuzzing campaign is a ~50-minute affair that has no business
# running on every branch push, for a verdict this job produces in under a minute.
#
# WHAT A FAILURE HERE MEANS
# =========================
# A red job in this file is a finding to ESCALATE. It is never silenced, and it
# is never repaired from inside this workflow:
#
#   * A licence or advisory outcome that warrants a policy change belongs in
#     `deny.toml`, which this workflow only ever READS.
#   * A version change belongs in `Cargo.toml` and `Cargo.lock`. No step here
#     re-resolves dependencies, or does anything else whose side effect is
#     regenerating a lockfile, and each of the three tool jobs ends by asserting
#     that neither lockfile moved. (`policy-integrity` runs no cargo command, so
#     it has nothing to assert.)
#   * `cargo deny check bans` reports the three ACKNOWLEDGED duplicate majors as
#     `note[skipped]` lines, because root `deny.toml` lists each under `skip` with
#     an exact `crate@version` pin; those notes are the designed behaviour. Any
#     OTHER duplicate is a hard `error[duplicate]` and fails the step, because the
#     policy sets `multiple-versions = "deny"`. Nothing in this file escalates or
#     downgrades anything - no `-D`, `-W` or `-A` on any command line, and no
#     duplicate detection of its own. The severity lives in `deny.toml`, where a
#     reviewer reads it.
#
# The specific drift this gate is shaped to catch: two `rand` majors coexist in
# the root graph. `rand 0.9.4` is the DIRECT dev-dependency and carries the
# manifest's advisory-driven version floor. `rand 0.10.2` arrives TRANSITIVELY
# through `quickcheck 1.1.0` and is governed by no declared floor of its own -
# a floor on the direct requirement says nothing about the transitive one. The
# same split then propagates down `rand_core`, `getrandom` and `r-efi`. Only a
# gate that resolves the real graph, on a schedule, can tell those apart, which
# is what the jobs below do.
#
# THE SCANNERS ARE PART OF THE SUPPLY CHAIN THEY SCAN
# ===================================================
# A gate that audits this project's dependencies while installing its own
# scanners from an unverified, unaudited graph is auditing the wrong half of the
# problem. Three properties are therefore pinned for every CI-installed tool,
# and they are genuinely different properties:
#
#   WHICH TOOL. `cargo install <tool>` with no `--version` resolves the newest
#   publish at run time. That is a reproducibility hole in a gate whose rulebook
#   declares a schema version - `deny.toml`'s "SCHEMA VERSION" section states
#   that every key in it "was probed against 0.20.2 and accepted with zero schema
#   errors and zero deprecation diagnostics", and warns not to assume the file
#   still parses cleanly after an upgrade. A floating install could turn a
#   policy-parse regression into a hard failure or, far worse, into a silently
#   different interpretation of the same policy text. Every install below names
#   an exact version and the following step ASSERTS what resolved:
#
#       cargo-deny   0.20.2   <- the version `deny.toml`, the one policy in
#                                was authored and probed against
#       cargo-audit  0.22.2   <- current at the time this gate was validated
#
#   WHAT BYTES. The tarball is fetched from static.crates.io by hand, so Cargo's
#   internal registry-checksum verification does not apply. Each install
#   therefore reads the `cksum` for that exact version out of the sparse index
#   and checks the download against it with `sha256sum -c` before unpacking. A
#   scanner installed on trust-on-first-use would undercut every verdict below.
#
#   WHICH DEPENDENCY GRAPH GETS BUILT. This is the property that `--version` plus
#   `--locked` does NOT give, and the one that was missing. cargo-audit 0.22.2's
#   PUBLISHED lockfile fails its own advisory policy - measured here as
#   `2 vulnerabilities found! 2 denied warnings found!`, from quinn-proto
#   (RUSTSEC-2026-0185), anyhow 1.0.102 (RUSTSEC-2026-0190), memmap2 0.9.10
#   (RUSTSEC-2026-0186) and crossbeam-epoch 0.9.18 (RUSTSEC-2026-0204). A plain
#   `--locked` install thus BUILT a vulnerable scanner in order to look for
#   vulnerabilities, and since 0.22.2 is the newest published release there is no
#   version bump that fixes it. The remedy is a fixed, annotated list of
#   `--precise` dependency overrides applied to the verified tree, followed by
#   `cargo install --path ... --locked` so the audited resolution is the built
#   one. `--precise` rather than a blanket `cargo update`, because the latter
#   resolves against whatever the registry serves at that instant and is neither
#   reviewable nor reproducible. cargo-deny 0.20.2's published lock is clean and
#   needs no override.
#
#   Each job then makes its scanner audit ITS OWN graph before that scanner's
#   verdict on this project is trusted. That step is what keeps the override
#   lists honest: a new advisory against a pinned tool graph fails the job and
#   names the crate.
#
# TO UPGRADE EITHER TOOL, in this order:
#   1. bump the version in every install step here (and in `fuzz.yml`, which
#      pins cargo-deny too), keeping the `--precise` overrides only for as long
#      as the new release still needs them,
#   2. run `cargo deny --locked check all` and `cargo deny --locked
#      --manifest-path fuzz/Cargo.toml check` locally and READ STDERR - a new
#      major may deprecate or re-scope a key,
#   3. update `deny.toml`'s SCHEMA VERSION note to the version you validated,
#   4. keep the two files in step. A pin that disagrees with the note it points
#      at is worse than no pin, because it reads as verified when it is not.
# `cargo-fuzz` in `fuzz.yml` is pinned to 0.13.2 and installed the same way -
# sparse-index sha256 on a hand-fetched tarball, `--precise` overrides, then
# `--path ... --locked` - documented there, next to that install.
#
# WHY THREE STEPS CARRY AN `if:` - AND WHY THAT IS NOT A MASKING CONSTRUCT
# =======================================================================
# GitHub skips every remaining step in a job once one step fails. Where the steps
# are four INDEPENDENT policy questions that turns a licence rejection into silence
# about whether the graph is also vulnerable, which is a coverage defect. The
# `if: ${{ !cancelled() }}` guards are its fix. Read them precisely, because `if:`
# is also the shape a genuine gate-neutralisation takes:
#
#   * WHAT THEY DO: run the step even when an EARLIER step in the same job failed.
#   * WHAT THEY DO NOT DO: they do not touch the guarded step's own exit code. A
#     guarded step that fails still fails and still turns the job red.
#   * WHY `!cancelled()` AND NOT `always()`: a cancelled run must stop, rather than
#     grinding through the remaining checks after `cancel-in-progress` killed it.
#   * WHAT REMAINS FORBIDDEN: `continue-on-error`, `|| true`, `set +e`, a trailing
#     `exit 0`, `2>/dev/null` on a tool invocation, and the weakening flags
#     `--stale`, `-n` / `--no-fetch`, `--ignore` and `-A`. None appears in this
#     file. Any `if:` other than the exact `${{ !cancelled() }}` form is a defect.
#
# ACTION PINNING - ACCEPTED RESIDUAL RISK
# =======================================
# Every `uses:` here names a TAG or BRANCH, not a commit SHA, and a tag can be
# moved while a branch advances by design. In a workflow whose purpose is
# supply-chain assurance that is worth stating plainly rather than leaving
# implicit: this file trusts `actions/checkout` and `dtolnay/rust-toolchain` at
# tag/branch granularity, and that is accepted residual risk.
#
# Two notes for whoever converts them, neither of which makes the conversion
# all-or-nothing. Each `uses:` can be pinned INDEPENDENTLY - a SHA-pinned step
# works alongside tag-referenced ones, so there is no atomicity requirement
# across steps, jobs or workflows, and converting a few at a time is a valid path.
#
# ACTION PINNING - A DELIBERATE, REPOSITORY-WIDE CONVENTION
# ========================================================
# Every `uses:` in this file names a full 40-hex commit SHA, with the release that
# SHA corresponds to in a trailing comment so the pin stays reviewable by eye. A
# tag can be moved and a branch advances by design, so a tag or branch ref is a
# mutable dependency - and in a workflow whose whole purpose is supply-chain
# assurance that is the one dependency that must not be left implicit. It is a
# convention shared with `ci.yml` and `fuzz.yml`: across the three files there are
# 41 `uses:` references and all 41 are SHA-pinned, with zero mutable refs -
# 17 `actions/checkout` (4 here, 12 in `ci.yml`, 1 in `fuzz.yml`),
# 16 `dtolnay/rust-toolchain` (3 here - `policy-integrity` needs no Rust toolchain
# at all - 12 in `ci.yml`, 1 in `fuzz.yml`), 5 `actions/cache` (all in `fuzz.yml`,
# for the per-target corpora), 2 `actions/upload-artifact` (1 in `ci.yml`, 1 in
# `fuzz.yml`, both failure-only) and 1 `actions/setup-python` (`ci.yml`'s `docs`
# job).
#
# THOSE FIGURES ARE ASSERTED, NOT ASSERTED-TO. Counts written into a comment rot
# the moment a job is added or removed, and this paragraph had in fact already
# rotted once. The `policy-integrity` job below therefore RE-DERIVES the census
# from the three workflow files on every run and fails if it disagrees with the
# numbers above, so the prose cannot silently drift from the tree again. If you
# add or remove a job, update both the sentence and that job's expectation table
# in the same reviewable diff - which is the point.
#
# It is a convention shared with `ci.yml` and `fuzz.yml`, and it was converted
# across all three files in one change because a partial conversion does not work:
#
#   * `dtolnay/rust-toolchain` derives its DEFAULT toolchain from
#     `github.action_ref` - that is precisely how `@stable`, `@nightly` and
#     `@1.85.0` selected what they selected. Once the ref is a commit SHA the
#     requested toolchain would be the SHA itself, so all 17 call sites across the
#     three workflows pass an explicit `with: toolchain:` naming the channel, and
#     every toolchain-sensitive job additionally ASSERTS the resolved channel via
#     `rustup show active-toolchain` (the three jobs here pin `stable`).
#   * Every SHA was verified against the upstream repository at the moment of
#     pinning. A SHA copied from anywhere else is a worse trust root than the tag
#     it replaces, because it looks authoritative and cannot be eyeballed.
#
# The pins in force across the three workflows, with their use counts:
#
#   actions/checkout         11d5960a326750d5838078e36cf38b85af677262  v4.4.0  18x
#   dtolnay/rust-toolchain   2c7215f132e9ebf062739d9130488b56d53c060c  master  17x
#   actions/cache            0057852bfaa89a56745cba8c7296529d2fc39830  v4.3.0   5x
#   actions/upload-artifact  ea165f8d65b6e75b540449e92b4886f43607fa02  v4.6.2   2x
#   actions/setup-python     ece7cb06caefa5fff74198d8649806c4678c61a1  v6.3.0   1x
#
# UPGRADING: resolve the new SHA from the upstream repository, change every
# occurrence in all three workflows in a single commit, and move the trailing
# version comment with it. A SHA and a comment that disagree are worse than no
# comment at all, because the comment is what a reviewer actually reads.
#
# `dtolnay/rust-toolchain` publishes no release tags, so `master` is the only
# upstream ref it has; the SHA is what turns that branch into a fixed dependency,
# and the trailing comment records the date the SHA was resolved.
#
# NO TOOL OR DATABASE CACHING - INTENTIONAL, DO NOT "OPTIMISE" IT IN
# =================================================================
# There is no `actions/cache` step anywhere in this file, and that is a decision
# rather than an omission. Both tools are compiled from source and the RustSec
# database is fetched fresh on every run, at a real cost of two `cargo install`
# builds per run on a daily schedule. What it buys is that neither a stale tool nor
# a stale advisory database can ever produce a verdict here: a cached advisory DB is
# the classic way a security gate degrades into one that always passes, which is the
# failure root `deny.toml`'s `maximum-db-staleness = "P7D"` backstops, and a cached
# tool binary would defeat the `--version` pins, which are enforced at install time.
#
# If build minutes ever become the binding constraint, cache the CARGO REGISTRY
# INDEX (which is content-addressed and cannot go stale in a way that changes a
# verdict) - never the tool binaries and never `~/.cargo/advisory-db`.

name: Audit

# Triggers. `push` and `pull_request` catch a dependency, lockfile or policy change
# as it lands and again before it merges; `workflow_dispatch` allows a re-run right
# after a new advisory is published.
#
# The DAILY 05:00 UTC `schedule` is what makes this workflow able to do its job at
# all: the RustSec database changes with no commit to this repository, so a
# push/PR-only audit is structurally incapable of noticing a new advisory. Daily
# also keeps `deny.toml`'s `maximum-db-staleness = "P7D"` comfortably satisfied.
# The 05:00 offset from `fuzz.yml`'s Monday 03:00 UTC slot REDUCES the likelihood of
# the two overlapping without guaranteeing it - GitHub schedules are best-effort and
# may start late, and a long campaign can still be running. That slot belongs to
# `fuzz.yml` and is not moved from here.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

# Principle of least privilege: this workflow only needs read access to the
# repository contents, in order to check out the tree and read the two lockfiles
# and `deny.toml`. It reports exclusively through the build status - it opens no
# issue, writes no comment, creates no tag and pushes no commit - so no write
# scope of any kind belongs here, and no secret or token is referenced.
permissions:
  contents: read

# Avoid piling up redundant audit runs: a newer commit on the same ref cancels any
# still-running audit for that ref. Unlike a fuzzing campaign a cancelled audit
# loses nothing - all four jobs are short and stateless, and the superseding run
# re-reads the same lockfiles against an at-least-as-fresh advisory database.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural self-assertion over the single cargo-deny policy.
  #
  # WHY THIS JOB EXISTS. `cargo deny` evaluates what it finds and does not require
  # the policy file to contain anything: with `deny.toml` present but its `[bans]`
  # table deleted, `cargo deny check bans` exits 0 with no diagnostic, and `-L info`
  # still prints a reassuring `using config from .../deny.toml`. The same holds for
  # `[sources]`, structurally - the `unused-allowed-source` and `unused-allowed-org`
  # guards live INSIDE the very table whose deletion they would have to catch.
  # Deleting the WHOLE file is caught, because the licence check then fails against
  # built-in defaults; section-level erosion was not.
  #
  # So this job asserts the POLICY TEXT independently of the tool that consumes
  # it - every governed table present, every load-bearing key still holding its
  # reviewed value. It needs no Rust toolchain and no network, so it is the fastest signal
  # here and cannot be blocked by a registry or advisory-database problem.
  #
  # WHEN YOU LEGITIMATELY CHANGE A POLICY VALUE: change the expectation here in
  # the same commit. That coupling is the point - a policy relaxation becomes a
  # two-file diff a reviewer cannot miss, instead of a one-word edit.
  #
  # This job ALSO asserts that `fuzz/deny.toml` does not exist. There used to be
  # one, and it silently governed a blocking verdict from outside the reviewed
  # surface; `deny.toml` is now the only policy and both graphs are checked
  # against it with an explicit `--config deny.toml`. If a sibling file ever
  # reappears, the fuzz job's explicit `--config` keeps ignoring it while a
  # reader would reasonably assume otherwise - so its mere presence is a defect.
  policy-integrity:
    name: policy integrity (deny.toml self-assertion)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1. Fetch the tree. `deny.toml`, `Cargo.toml` and `fuzz/Cargo.toml` are the
      #    only inputs; nothing is resolved, installed, compiled or fetched.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do NOT leave the `GITHUB_TOKEN` behind in `.git/config`. By default
          # `actions/checkout` writes it there as an `http.extraheader`, where it
          # survives this step and stays readable to every later step in the job -
          # including anything a build script or third-party action runs. Nothing
          # here pushes, tags or authenticates, so the credential has no reader.
          # This is separate from the top-level `permissions:` ceiling: that bounds
          # what the token MAY DO, this bounds how long it EXISTS on disk.
          persist-credentials: false

      # 2. Parse the policy with `tomllib` (Python 3.11+, present on
      #    ubuntu-latest) and assert the governed structure. TOML parsing rather
      #    than grep is deliberate: a grep for `multiple-versions = "deny"` would
      #    be satisfied by a commented-out line, by an occurrence in the wrong
      #    table, or by prose, and this file is heavily commented.
      #
      #    The expectations below are the values the QA-verified policy holds.
      #    Anything missing, or weakened, fails with a `::error::` naming the
      #    exact key.
      - name: Assert the cargo-deny policy is structurally intact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              print("::error::python >= 3.11 is required for tomllib; got "
                    f"{sys.version.split()[0]}")
              raise SystemExit(1)

          import os
          import tomllib

          # Every governed table must exist. A missing table is the
          # silent-vacuous-pass case this job exists to catch.
          REQUIRED_TABLES = ("graph", "advisories", "licenses", "bans", "sources")

          # (table, key, expected) triples that must hold. These are the settings
          # whose weakening would quietly reduce coverage.
          EXPECTED = [
              ("graph", "all-features", True),
              # An EMPTY target list is load-bearing, not an oversight: it makes
              # cargo-deny evaluate every crate for every platform, which is the
              # only setting under which all 89 root crates - including the
              # `spirv`-only and `uefi`-only leaves - reach the licence and ban
              # checks at all. Naming triples here PRUNES the graph and silently
              # drops crates from review. See "[graph]" in `deny.toml`.
              ("graph", "targets", []),
              ("advisories", "db-urls", ["https://github.com/rustsec/advisory-db"]),
              ("advisories", "unmaintained", "all"),
              ("advisories", "unsound", "all"),
              ("advisories", "yanked", "deny"),
              ("advisories", "disable-yank-checking", False),
              ("advisories", "maximum-db-staleness", "P7D"),
              ("advisories", "ignore", []),
              ("advisories", "unused-ignored-advisory", "deny"),
              ("licenses", "include-dev", True),
              ("licenses", "include-build", True),
              ("licenses", "unused-allowed-license", "deny"),
              ("licenses", "allow", ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]),
              ("bans", "multiple-versions", "deny"),
              ("bans", "multiple-versions-include-dev", True),
              ("bans", "wildcards", "deny"),
              ("bans", "skip-tree", []),
              # Scoped to path dependencies of UNPUBLISHED crates only, which is
              # `zlib-rs-fuzz` (`publish = false`) and nothing else. A wildcard in
              # the publishable root crate is still rejected. See "[bans]" in
              # `deny.toml`.
              ("bans", "allow-wildcard-paths", True),
              ("sources", "unknown-registry", "deny"),
              ("sources", "unknown-git", "deny"),
              ("sources", "allow-registry",
               ["https://github.com/rust-lang/crates.io-index"]),
              ("sources", "allow-git", []),
              ("sources", "required-git-spec", "rev"),
              ("sources", "unused-allowed-source", "deny"),
              ("sources", "unused-allowed-org", "deny"),
          ]

          # The ONLY per-crate licence carve-out this policy grants. `libfuzzer-sys
          # 0.4.13` declares `(MIT OR Apache-2.0) AND NCSA` - a CONJUNCTION, so
          # NCSA is mandatory and no allow-list alternative can satisfy it. Granting
          # it crate-scoped keeps NCSA out of `licenses.allow`, so no other crate in
          # either graph inherits it.
          EXPECTED_EXCEPTIONS = [{"crate": "libfuzzer-sys", "allow": ["NCSA"]}]

          # Architectural bans that must be denied by name. These encode project
          # scope boundaries: no unscoped C toolchain, no C zlib linked back in, no
          # competing codec, no TLS stack.
          REQUIRED_DENIES = [
              "cc", "bindgen", "pkg-config",
              "libz-sys", "libz-ng-sys", "cloudflare-zlib-sys",
              "bzip2", "bzip2-sys", "lzma-sys", "xz2",
              "zstd", "zstd-sys", "brotli", "brotli-decompressor",
              "openssl", "openssl-sys",
          ]

          # The four ACKNOWLEDGED duplicate majors, each pinned to an exact
          # version so the acknowledgement expires on the next bump. Asserting the
          # SET, not just the shape, is what stops a fifth duplicate being waved
          # through by adding one line to `deny.toml`.
          EXPECTED_SKIPS = {
              "rand@0.10.2", "rand_core@0.10.1", "getrandom@0.4.3", "r-efi@6.0.0",
          }

          POLICY = "deny.toml"
          failures = []

          def check(path, table, key, expected, actual_holder):
              if key not in actual_holder:
                  failures.append(f"{path}: [{table}] is missing the key "
                                  f"`{key}` (expected {expected!r})")
                  return
              actual = actual_holder[key]
              if isinstance(expected, list):
                  ok = sorted(map(str, actual)) == sorted(map(str, expected))
              else:
                  ok = actual == expected and type(actual) is type(expected)
              if not ok:
                  failures.append(f"{path}: [{table}] {key} = {actual!r}, "
                                  f"expected {expected!r}")

          # A sibling fuzz policy must never come back. `cargo-deny` resolves its
          # configuration from the TARGET manifest's workspace root, so a
          # `fuzz/deny.toml` would be DISCOVERED by any invocation that forgot
          # `--config deny.toml` - governing a blocking verdict from outside the
          # reviewed surface. Both invocations now name this file explicitly, which
          # makes a reappeared sibling inert AND misleading.
          if os.path.exists("fuzz/deny.toml"):
              failures.append("fuzz/deny.toml exists again. `deny.toml` is the only "
                              "cargo-deny policy in this repository and governs BOTH "
                              "graphs via an explicit `--config deny.toml`; delete "
                              "the sibling file, or if it is genuinely wanted, wire "
                              "it up and re-review this job.")

          policy = None
          try:
              with open(POLICY, "rb") as handle:
                  policy = tomllib.load(handle)
          except FileNotFoundError:
              failures.append(f"{POLICY}: the policy file is missing entirely")
          except tomllib.TOMLDecodeError as exc:
              failures.append(f"{POLICY}: is not valid TOML: {exc}")

          if policy is not None:
              for table in REQUIRED_TABLES:
                  if table not in policy:
                      failures.append(f"{POLICY}: the [{table}] table is absent, so "
                                      f"`cargo deny check {table}` would evaluate "
                                      f"nothing and pass vacuously")

              for table, key, expected in EXPECTED:
                  if table in policy:
                      check(POLICY, table, key, expected, policy[table])

              # The licence carve-out set, compared exactly. A second exception is a
              # policy change and must be a visible two-file diff.
              exceptions = policy.get("licenses", {}).get("exceptions", None)
              if exceptions is None:
                  failures.append(f"{POLICY}: [licenses] is missing `exceptions`; it "
                                  f"must be exactly {EXPECTED_EXCEPTIONS!r}")
              else:
                  got = sorted(
                      (str(e.get("crate")), tuple(e.get("allow", [])))
                      for e in exceptions if isinstance(e, dict)
                  )
                  want = sorted(
                      (str(e["crate"]), tuple(e["allow"]))
                      for e in EXPECTED_EXCEPTIONS
                  )
                  if got != want or len(exceptions) != len(EXPECTED_EXCEPTIONS):
                      failures.append(f"{POLICY}: [licenses] exceptions = "
                                      f"{exceptions!r}, expected "
                                      f"{EXPECTED_EXCEPTIONS!r}")

              # `[licenses.private] ignore` may exempt unpublished workspace
              # members, so it must stay scoped to that and nothing else.
              private = policy.get("licenses", {}).get("private", {})
              if private.get("registries", None) != []:
                  failures.append(f"{POLICY}: [licenses.private] registries must be "
                                  f"an empty list; got "
                                  f"{private.get('registries')!r}")

              # No organisation-wide git trust on any forge.
              for forge in ("github", "gitlab", "bitbucket"):
                  granted = policy.get("sources", {}).get("allow-org", {}).get(forge, [])
                  if granted != []:
                      failures.append(f"{POLICY}: [sources.allow-org] {forge} must be "
                                      f"empty; got {granted!r}")

              # Architectural bans, by crate name.
              deny_entries = [entry for entry in policy.get("bans", {}).get("deny", [])
                              if isinstance(entry, dict) and "crate" in entry]
              denied = {entry["crate"] for entry in deny_entries}
              for crate in REQUIRED_DENIES:
                  if crate not in denied:
                      failures.append(f"{POLICY}: [bans] deny no longer lists "
                                      f"`{crate}`")

              # `cc` is BANNED, and stays banned. The fuzz graph needs it only as
              # `libfuzzer-sys`'s build dependency, so the entry is SCOPED with
              # `wrappers` rather than removed: any other path to `cc` - including
              # one the crate proper might acquire - is still an error. Every other
              # architectural ban must remain unscoped.
              for entry in deny_entries:
                  wrappers = entry.get("wrappers")
                  if entry["crate"] == "cc":
                      if wrappers != ["libfuzzer-sys"]:
                          failures.append(
                              f"{POLICY}: [bans] the `cc` entry must be scoped with "
                              f"wrappers = [\"libfuzzer-sys\"] so the ban still "
                              f"applies to every other path; got {wrappers!r}")
                  elif wrappers:
                      failures.append(
                          f"{POLICY}: [bans] `{entry['crate']}` must be denied "
                          f"outright, but carries wrappers = {wrappers!r}")

              # Every duplicate-version acknowledgement must be pinned to an exact
              # version, carry a reason, and be one of the four reviewed entries.
              seen_skips = set()
              for entry in policy.get("bans", {}).get("skip", []):
                  spec = entry.get("crate", "") if isinstance(entry, dict) else str(entry)
                  seen_skips.add(spec)
                  if "@" not in spec:
                      failures.append(f"{POLICY}: [bans] skip entry `{spec}` is not "
                                      f"pinned to an exact version")
                  if isinstance(entry, dict) and not entry.get("reason"):
                      failures.append(f"{POLICY}: [bans] skip entry `{spec}` carries "
                                      f"no reason")
              if seen_skips != EXPECTED_SKIPS:
                  added = sorted(seen_skips - EXPECTED_SKIPS)
                  dropped = sorted(EXPECTED_SKIPS - seen_skips)
                  failures.append(f"{POLICY}: [bans] skip set changed; unexpected "
                                  f"{added!r}, missing {dropped!r}. A new duplicate "
                                  f"major is a policy decision, not a formality.")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              print(f"{len(failures)} policy-integrity assertion(s) failed. Either "
                    "the policy was weakened, or this job's expectations are out of "
                    "date -- update whichever is actually wrong, in the same commit.")
              raise SystemExit(1)

          print("deny.toml declares every governed table, holds every load-bearing "
                "key at its reviewed value, and is the only cargo-deny policy in "
                "the tree")
          PY

      # 3. Re-derive the workflow census that this file's ACTION PINNING section
      #    states in prose, and fail if the two disagree.
      #
      #    WHY THIS EXISTS. That paragraph names exact counts - how many
      #    `actions/checkout@v4` uses there are across the three workflows, how
      #    many `dtolnay/rust-toolchain@*` call sites a future SHA-pinning change
      #    would have to convert, and so on. Counts in a comment rot the instant a
      #    job is added or removed, and these had in fact already rotted: they were
      #    written when the three files held 13 and 12 respectively. A stale
      #    migration instruction is worse than none, because it tells whoever
      #    performs the conversion that they are finished when they are not.
      #
      #    This step belongs in THIS job for the same reason step 2 does: it needs
      #    no Rust toolchain, no network and no dependency resolution, only the
      #    checked-out files. It counts `uses:` occurrences textually rather than
      #    with a YAML parser, because no third-party Python package is installed
      #    on the runner and `uses:` is unambiguous on its own line.
      #
      #    The ASCII assertion rides along here for the same reason. All three
      #    workflows are byte-ASCII by convention (see "ASCII PUNCTUATION" in
      #    `ci.yml`'s header); a stray U+2014 inside a shell string is invisible in
      #    review yet is a distinct byte sequence to `grep`, so it once made a
      #    packaging assertion depend on an unstated encoding.
      #
      #    WHEN YOU ADD OR REMOVE A JOB: update the expectation below and the
      #    prose above in the same commit. That coupling is the whole point.
      - name: Assert the workflow census matches this file's documented counts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re

          WORKFLOWS = (
              ".github/workflows/ci.yml",
              ".github/workflows/audit.yml",
              ".github/workflows/fuzz.yml",
          )

          # Expected job count per workflow. Keep in step with each file's own
          # `# Jobs:` index.
          EXPECTED_JOBS = {
              ".github/workflows/ci.yml": 12,
              ".github/workflows/audit.yml": 4,
              ".github/workflows/fuzz.yml": 1,
          }

          # Expected `uses:` census: action prefix -> {workflow: count}. The totals
          # quoted in the ACTION PINNING section are the sums of these rows:
          # 17 checkout, 16 rust-toolchain, 5 cache, 2 upload-artifact,
          # 1 setup-python -- 41 `uses:` references in total.
          #
          # The keys name the action only, NOT a version: every ref in this
          # repository is a 40-hex commit SHA, so a version-bearing prefix such as
          # `actions/checkout@v4` would match nothing at all and the census would
          # silently pass on zero. The SHA-pinning convention itself is asserted
          # separately, below.
          EXPECTED_USES = {
              "actions/checkout@": {
                  ".github/workflows/ci.yml": 12,
                  ".github/workflows/audit.yml": 4,
                  ".github/workflows/fuzz.yml": 1,
              },
              "dtolnay/rust-toolchain@": {
                  ".github/workflows/ci.yml": 12,
                  # `policy-integrity` deliberately installs no toolchain.
                  ".github/workflows/audit.yml": 3,
                  ".github/workflows/fuzz.yml": 1,
              },
              "actions/cache@": {
                  ".github/workflows/ci.yml": 0,
                  ".github/workflows/audit.yml": 0,
                  # One rolling-key entry per fuzz target.
                  ".github/workflows/fuzz.yml": 5,
              },
              "actions/upload-artifact@": {
                  ".github/workflows/ci.yml": 1,
                  ".github/workflows/audit.yml": 0,
                  ".github/workflows/fuzz.yml": 1,
              },
              "actions/setup-python@": {
                  # The `docs` job's version-pinned MkDocs environment.
                  ".github/workflows/ci.yml": 1,
                  ".github/workflows/audit.yml": 0,
                  ".github/workflows/fuzz.yml": 0,
              },
          }

          JOB_KEY = re.compile(r"^  ([A-Za-z][A-Za-z0-9_-]*):\s*$")
          # `(\S+?)` plus an optional trailing comment: every `uses:` line here is
          # `uses: <action>@<sha> # <release>`, so a pattern anchored straight to
          # end-of-line would match none of them.
          USES = re.compile(r"^\s*-?\s*uses:\s*(\S+?)\s*(?:#.*)?$", re.MULTILINE)
          SHA_PINNED = re.compile(r"^[^@]+@[0-9a-f]{40}$")

          def job_names(text):
              lines = text.split("\n")
              if "jobs:" not in lines:
                  return []
              names = []
              for line in lines[lines.index("jobs:") + 1:]:
                  # A new column-0 key other than a comment ends the jobs block.
                  if line and not line.startswith((" ", "\t", "#")):
                      break
                  found = JOB_KEY.match(line)
                  if found:
                      names.append(found.group(1))
              return names

          failures = []
          census = {prefix: 0 for prefix in EXPECTED_USES}

          for path in WORKFLOWS:
              raw = open(path, "rb").read()
              non_ascii = [b for b in raw if b > 0x7F]
              if non_ascii:
                  failures.append(f"{path}: contains {len(non_ascii)} non-ASCII "
                                  "byte(s); all three workflows are byte-ASCII by "
                                  "convention")

              text = raw.decode("utf-8")
              names = job_names(text)
              if len(names) != EXPECTED_JOBS[path]:
                  failures.append(f"{path}: expected {EXPECTED_JOBS[path]} job(s), "
                                  f"found {len(names)}: {names}")

              for prefix, per_file in EXPECTED_USES.items():
                  seen = sum(1 for u in USES.findall(text) if u.startswith(prefix))
                  census[prefix] += seen
                  if seen != per_file[path]:
                      failures.append(f"{path}: expected {per_file[path]} "
                                      f"`{prefix}` use(s), found {seen}")

              # The header claims every `uses:` in all three workflows names a full
              # 40-hex commit SHA. Assert exactly that, with no exemption: a tag or
              # branch ref is mutable, and `dtolnay/rust-toolchain` is pinned too --
              # which is why each of its call sites also passes an explicit
              # `with: toolchain:` input naming the channel the SHA no longer implies.
              for used in USES.findall(text):
                  if not SHA_PINNED.match(used):
                      failures.append(f"{path}: `{used}` is not pinned to a 40-hex "
                                      "commit SHA, contrary to the documented "
                                      "convention")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              print(f"{len(failures)} workflow-census assertion(s) failed. Either a "
                    "workflow changed, or the ACTION PINNING section of audit.yml is "
                    "out of date -- update whichever is actually wrong, in the same "
                    "commit.")
              raise SystemExit(1)

          summary = ", ".join(f"{n} {p.rstrip('@')}" for p, n in census.items())
          print(f"workflow census matches the documented counts: {summary}; "
                "all three workflows are byte-ASCII")
          PY

  # RustSec advisory scan of both lockfiles. This is the only `cargo-audit` run
  # in the repository, and the only place `fuzz/Cargo.lock` is checked for
  # advisories. It carries no `needs:` on any other job, so all four run in
  # parallel and a red build points at one tool without waiting on the others.
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Current stable, not the MSRV floor pinned by `rust-toolchain.toml`. See
    # "TOOLCHAIN SELECTION" in the header: the toolchain FILE outranks the
    # `rustup default` that the action below sets, so this override is what
    # actually selects stable for every step in the job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. Nothing is built from it: the job reads `Cargo.lock`,
      #    `fuzz/Cargo.lock` and the git index, and nothing else.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do NOT leave the `GITHUB_TOKEN` behind in `.git/config`. By default
          # `actions/checkout` writes it there as an `http.extraheader`, where it
          # survives this step and stays readable to every later step in the job -
          # including anything a build script or third-party action runs. Nothing
          # here pushes, tags or authenticates, so the credential has no reader.
          # This is separate from the top-level `permissions:` ceiling: that bounds
          # what the token MAY DO, this bounds how long it EXISTS on disk.
          persist-credentials: false

      # 2. Install current stable. `cargo-audit` is an ordinary Rust program and
      #    has no reason to be built by this crate's MSRV floor.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          # The channel MUST be named here. Pinning this action to a commit means
          # the `@<ref>` no longer selects a toolchain: the pinned tree is the
          # `stable` branch, whose `toolchain` input merely DEFAULTS to `stable`,
          # so relying on the default would silently install stable wherever
          # another channel was intended.
          toolchain: stable

      # 3. Fail loudly if the stable override is ever lost, instead of
      #    discovering it as an opaque compile error part-way through the
      #    `cargo install` below. Deliberately BARE `rustc` and `rustup`: the
      #    point is to observe the AMBIENT resolution, which a `+stable` prefix
      #    would hide and thereby make the assertion vacuous.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install the cargo-audit subcommand, PINNED, CHECKSUM-VERIFIED and with
      #    its OWN dependency graph refreshed off known advisories.
      #
      #    Three distinct properties, and `--version` plus `--locked` only give
      #    the first two:
      #      * WHICH tool - 0.22.2, the release this gate was validated against.
      #      * WHAT BYTES - the tarball is fetched by hand, so Cargo's built-in
      #        registry checksum verification does not apply; the sparse index's
      #        `cksum` for this exact version is therefore checked explicitly.
      #      * WHICH GRAPH gets built - and this is the property that was missing.
      #        cargo-audit 0.22.2's PUBLISHED lockfile does not pass its own
      #        advisory policy: measured on this repository it reports
      #        `2 vulnerabilities found! 2 denied warnings found!` - quinn-proto
      #        (RUSTSEC-2026-0185, remote memory exhaustion), anyhow 1.0.102
      #        (RUSTSEC-2026-0190, unsound `downcast_mut`), memmap2 0.9.10
      #        (RUSTSEC-2026-0186, out-of-bounds) and crossbeam-epoch 0.9.18
      #        (RUSTSEC-2026-0204, invalid pointer dereference). A `--locked`
      #        install therefore BUILT a vulnerable scanner in order to scan this
      #        project for vulnerabilities. 0.22.2 is the newest published
      #        release, so no version bump fixes it.
      #
      #    The remedy is a fixed list of `--precise` dependency overrides, each
      #    annotated with the advisory it answers, applied to a checksum-verified
      #    tree and then installed with `--path ... --locked` so the audited
      #    resolution IS the built resolution. `--precise` is deliberate: a blanket
      #    `cargo update` resolves against whatever the registry serves at that
      #    instant, which is neither reviewable nor reproducible. Measured: two
      #    independent runs of this recipe produce a byte-identical `Cargo.lock`,
      #    and step 5a below re-audits it on every run so a NEW advisory against
      #    this graph fails the job rather than shipping in the scanner.
      #
      #    cargo-audit remains a CI-installed tool and must never become a
      #    manifest dependency.
      - name: Install cargo-audit 0.22.2 from an integrity-verified, refreshed tree
        run: |
          set -euo pipefail
          name=cargo-audit
          version=0.22.2
          # Sparse-index path layout: names of four or more characters live under
          # `<first two>/<next two>/<name>`.
          cksum="$(curl -fsSL "https://index.crates.io/${name:0:2}/${name:2:2}/$name" \
            | python3 -c "import json,sys; print(next(e['cksum'] for e in map(json.loads, sys.stdin) if e['vers'] == '$version'))")"
          test -n "$cksum"
          work="$RUNNER_TEMP/tools"
          mkdir -p "$work"
          curl -fsSL -o "$work/$name-$version.crate" \
            "https://static.crates.io/crates/$name/$name-$version.crate"
          echo "$cksum  $work/$name-$version.crate" | sha256sum -c -
          tar xzf "$work/$name-$version.crate" -C "$work"
          cd "$work/$name-$version"
          # `--precise` takes a single spec per invocation, hence one call each.
          cargo update -p crossbeam-epoch --precise 0.9.20  # RUSTSEC-2026-0204
          cargo update -p quinn-proto --precise 0.11.15     # RUSTSEC-2026-0185
          cargo update -p anyhow --precise 1.0.103          # RUSTSEC-2026-0190
          cargo update -p memmap2 --precise 0.9.11          # RUSTSEC-2026-0186
          cargo +stable install --path . --locked

      # 5. ASSERT the version, do not merely print it: an unchecked pin is a comment,
      #    and a cached or pre-installed binary would otherwise evaluate the closure
      #    with a different tool, silently. The version still appears in the log, so
      #    the run - not this file - is the record of what ran.
      - name: Assert the pinned cargo-audit version
        run: |
          set -euo pipefail
          expected='0.22.2'
          cargo +stable audit --version
          actual="$(cargo +stable audit --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-audit ${expected} but resolved ${actual}."\
                 " The --version pin on the install step above did not take effect."
            exit 1
          fi
          echo "cargo-audit ${actual} matches the pin"

      # 5a. The scanner audits ITSELF before its verdict on this project is
      #     trusted. This is what keeps the `--precise` list above honest: if a new
      #     advisory lands against the refreshed graph, or an override is dropped,
      #     the job fails here and names the crate, instead of the tool quietly
      #     becoming the least-audited component in the pipeline. `--deny warnings`
      #     matches the posture used for the project graph below.
      - name: Audit cargo-audit's own dependency graph
        run: |
          set -euo pipefail
          cargo +stable audit --deny warnings \
            --file "$RUNNER_TEMP/tools/cargo-audit-0.22.2/Cargo.lock"

      # 6. Root closure: the 89 packages in `Cargo.lock`. `--deny warnings`
      #    escalates unmaintained, unsound and yanked notices to failures, which
      #    aligns this step with the posture root `deny.toml` already takes over
      #    the same graph (`unmaintained = "all"`, `unsound = "all"`,
      #    `yanked = "deny"`); leaving it off here would make cargo-audit the
      #    laxer of the two gates for no stated reason. A vulnerability or an
      #    escalated notice exits non-zero and fails the job, which is the
      #    entire purpose of the step.
      #
      #    This step reaches the network: cargo-audit fetches the RustSec
      #    advisory database and consults the registry index for yank status. An
      #    offline run is INCONCLUSIVE rather than passing, and it fails here
      #    rather than reporting a false clean.
      - name: Audit the root dependency graph
        run: cargo +stable audit --deny warnings

      # 7. Fuzz closure. MANDATORY and not foldable into the step above: `fuzz/` is a
      #    detached workspace, so the root invocation never resolves these packages and
      #    naming the lockfile is the only way to reach them. cargo-audit consults no
      #    policy file, so the libFuzzer C-driver chain that legitimately lives in this
      #    graph is simply scanned like any other package - the ban that applies to the
      #    crate proper is a cargo-deny matter and does not arise here. The `if:` guard
      #    keeps one advisory in the root graph from hiding the state of this one; see
      #    "WHY THREE STEPS CARRY AN `if:`" in the header.
      - name: Audit the detached fuzz dependency graph
        if: ${{ !cancelled() }}
        run: cargo +stable audit --deny warnings --file fuzz/Cargo.lock

      # 8. Neither invocation above has any business writing a lockfile, and a
      #    rewritten lock would silently change what every `--locked` gate in `ci.yml`
      #    resolves - so assert the invariant rather than assume it. Guarded because
      #    the run where a scan FAILED is exactly the run where you most want to know
      #    whether a lockfile moved.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the advisory scan modified a lockfile, which would silently"\
                 " change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"

  # Policy evaluation against the ROOT `deny.toml`, over the root crate graph. The
  # four checks run as four separately-named steps rather than one `cargo deny
  # check`, so the log attributes a failure to a policy section without anyone
  # reading the output to find out which. The detached fuzz graph is governed by
  # this SAME policy, evaluated a second time by the `cargo-deny-fuzz` job below;
  # see "SCOPE" in the header for why one file must be aimed at both graphs
  # explicitly rather than rediscovered per workspace.
  cargo-deny:
    name: cargo-deny (licenses / advisories / bans / sources)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Current stable, not the MSRV floor pinned by `rust-toolchain.toml`. See
    # "TOOLCHAIN SELECTION" in the header; cargo-deny's own MSRV is its
    # business, not this project's.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. `deny.toml`, `Cargo.toml` and `Cargo.lock` are the
      #    inputs. Nothing is compiled: cargo-deny resolves the dependency graph,
      #    which is why no cross-compilation target needs installing even though
      #    `deny.toml` sets `[graph] targets = []` and therefore evaluates every
      #    crate for every platform.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do NOT leave the `GITHUB_TOKEN` behind in `.git/config`. By default
          # `actions/checkout` writes it there as an `http.extraheader`, where it
          # survives this step and stays readable to every later step in the job -
          # including anything a build script or third-party action runs. Nothing
          # here pushes, tags or authenticates, so the credential has no reader.
          # This is separate from the top-level `permissions:` ceiling: that bounds
          # what the token MAY DO, this bounds how long it EXISTS on disk.
          persist-credentials: false

      # 2. Install current stable, for the same reason as the audit job above.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          # The channel MUST be named here. Pinning this action to a commit means
          # the `@<ref>` no longer selects a toolchain: the pinned tree is the
          # `stable` branch, whose `toolchain` input merely DEFAULTS to `stable`,
          # so relying on the default would silently install stable wherever
          # another channel was intended.
          toolchain: stable

      # 3. The same ambient-resolution assertion as the audit job, and for the
      #    same reason: a lost override would quietly route this gate onto the
      #    MSRV floor. Bare `rustc`/`rustup` on purpose.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install cargo-deny, PINNED to the version both policy files were probed
      #    against. This is the pin that matters most here: cargo-deny 0.20 removed
      #    and re-scoped whole families of `[advisories]` and `[licenses]` keys, and a
      #    future major could do the same - the dangerous outcome being not a parse
      #    failure but a silently different reading of the same policy text.
      #    `deny.toml`'s SCHEMA VERSION section is the other half of this pin;
      #    keep the two in step. Like cargo-audit, cargo-deny is a CI-installed
      #    tool and must never become a manifest dependency.
      #
      #    The tarball is fetched by hand and its sha256 checked against the
      #    sparse index, because a hand download bypasses the checksum
      #    verification `cargo install` performs internally. Unlike cargo-audit
      #    and cargo-fuzz, cargo-deny 0.20.2's PUBLISHED lockfile is advisory-clean
      #    (measured: `advisories ok` with unsound/unmaintained/yanked promoted to
      #    errors), so no `--precise` override is needed and `--locked` keeps the
      #    graph exactly the one upstream released and tested. Step 5a re-proves
      #    that on every run; if a future advisory lands on it, add the override
      #    there rather than dropping `--locked`.
      - name: Install cargo-deny 0.20.2 from an integrity-verified source tree
        run: |
          set -euo pipefail
          name=cargo-deny
          version=0.20.2
          cksum="$(curl -fsSL "https://index.crates.io/${name:0:2}/${name:2:2}/$name" \
            | python3 -c "import json,sys; print(next(e['cksum'] for e in map(json.loads, sys.stdin) if e['vers'] == '$version'))")"
          test -n "$cksum"
          work="$RUNNER_TEMP/tools"
          mkdir -p "$work"
          curl -fsSL -o "$work/$name-$version.crate" \
            "https://static.crates.io/crates/$name/$name-$version.crate"
          echo "$cksum  $work/$name-$version.crate" | sha256sum -c -
          tar xzf "$work/$name-$version.crate" -C "$work"
          cargo +stable install --path "$work/$name-$version" --locked

      # 5. ASSERT the pinned version, and log it. This is what makes the claim in
      #    `deny.toml` ("every key was probed against 0.20.2") true of the binary
      #    that actually evaluates the file, rather than true of whatever the
      #    author happened to have installed.
      - name: Assert the pinned cargo-deny version
        run: |
          set -euo pipefail
          expected='0.20.2'
          cargo +stable deny --version
          actual="$(cargo +stable deny --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-deny ${expected} but resolved ${actual}."\
                 " deny.toml's SCHEMA VERSION note was validated against ${expected};"\
                 " re-validate the policy before changing the pin."
            exit 1
          fi
          echo "cargo-deny ${actual} matches the pin and deny.toml's SCHEMA VERSION note"

      # 5a. The scanner audits ITSELF before its verdict on this project is
      #     trusted. `-D unsound -D unmaintained -D yanked` promotes the three
      #     advisory classes that default to warnings, so this is stricter than a
      #     bare `check advisories`. These flags are scoped to the TOOL's own graph
      #     only - the project checks below deliberately carry no CLI override, so
      #     that the reviewed `deny.toml` remains the single policy for this
      #     repository's dependencies.
      - name: Audit cargo-deny's own dependency graph
        run: |
          set -euo pipefail
          cargo +stable deny --locked \
            --manifest-path "$RUNNER_TEMP/tools/cargo-deny-0.20.2/Cargo.toml" \
            check advisories -D unsound -D unmaintained -D yanked

      # 6. The four checks below share two flags, explained once here:
      #
      #      `--locked`  asserts that `Cargo.lock` will not change during graph
      #                  resolution, so a policy run can never itself be the
      #                  thing that moves the lock.
      #      `--config deny.toml`
      #                  names the policy EXPLICITLY rather than relying on
      #                  cargo-deny's discovery. There is exactly one policy file
      #                  in this repository and both graphs are governed by it,
      #                  so both invocations state it the same way; discovery
      #                  falls back to built-in defaults when it finds nothing,
      #                  and a silent fallback looks exactly like a pass.
      #      `-L info`   makes cargo-deny print the configuration path it
      #                  resolved ("using config from .../deny.toml"). With
      #                  `--config` that is a confirmation rather than the only
      #                  evidence, and it is cheap to keep.
      #      `-A unused-wrapper`
      #      `-A license-exception-not-encountered`
      #                  TWO shape artifacts, and nothing else. `deny.toml` is
      #                  one policy over two graphs, so its two fuzz-graph
      #                  accommodations -- the `cc` ban's
      #                  `wrappers = ["libfuzzer-sys"]` scope and the
      #                  `libfuzzer-sys` NCSA licence exception -- are
      #                  legitimately UNUSED here, because neither crate is in
      #                  the root graph. Both codes stay at full severity on the
      #                  `cargo-deny-fuzz` invocation below, which is the graph
      #                  where they mean something: if `libfuzzer-sys` ever stops
      #                  needing `cc`, or leaves the graph, that job reports it.
      #                  Nothing capable of hiding a real finding is suppressed --
      #                  `rejected`, `denied`, `duplicate`, `vulnerability`,
      #                  `unmaintained`, `unsound`, `yanked`, `unknown-registry`
      #                  and `unknown-git` are all untouched. Do not add any
      #                  other override here; the policy lives in `deny.toml`.
      #
      #    Every step after this one carries `if: ${{ !cancelled() }}`, so all
      #    four policy questions are answered by every run instead of the first
      #    failure silencing the rest. That guard does NOT weaken any step - each
      #    still fails the job on a non-zero exit. Read "WHY THREE STEPS CARRY AN
      #    `if:`" in the header before touching it.
      #
      #    Licences first, because it is the check least likely to depend on
      #    anything outside the tree: it reads `deny.toml`'s allow-list against
      #    the resolved graph. (Order no longer decides what gets reported, but it
      #    still decides what a reader sees first.)
      - name: Check licenses
        run: cargo +stable deny --locked --config deny.toml -L info check licenses
               -A unused-wrapper -A license-exception-not-encountered

      # 7. Advisories. Reaches the NETWORK for the RustSec database named by
      #    `deny.toml`'s `db-urls`, where `maximum-db-staleness` makes a database too
      #    old to trust an error rather than a quiet pass - so an offline run fails
      #    here instead of reporting a false clean. Severity comes entirely from the
      #    file, whose `ignore` list is empty. This is the step the guard exists for:
      #    without it a licence rejection above would leave a run red for a licensing
      #    reason while saying nothing about whether the graph is vulnerable.
      - name: Check advisories
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked --config deny.toml -L info check advisories
               -A unused-wrapper -A license-exception-not-encountered

      # 8. Bans. Two distinct policies are enforced by this one step, both from
      #    `deny.toml`: the architectural bans (no C-toolchain build dependency
      #    for the crate proper, no C zlib linked back in, no competing
      #    compression codec) and duplicate-version detection.
      #
      #    The four ACKNOWLEDGED duplicate majors do not fail this step: each has
      #    an exact-version `skip` entry in `deny.toml`, so the dev-only `rand` /
      #    `rand_core` / `getrandom` / `r-efi` chains surface as `note[skipped]`
      #    lines with their inclusion paths. Any duplicate those entries do not
      #    name IS a failure, because that policy sets
      #    `multiple-versions = "deny"`. The two `-A` flags above cannot change
      #    either outcome: neither `unused-wrapper` nor
      #    `license-exception-not-encountered` is a duplicate-detection code.
      - name: Check bans
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked --config deny.toml -L info check bans
               -A unused-wrapper -A license-exception-not-encountered

      # 9. Sources. `deny.toml` denies unknown registries and unknown git
      #    sources and allows only crates.io, so this step is what would catch a
      #    dependency quietly re-pointed at a git revision or a private
      #    registry.
      - name: Check sources
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked --config deny.toml -L info check sources
               -A unused-wrapper -A license-exception-not-encountered

      # 10. The same lockfile-immutability assertion as the audit job. `--locked`
      #     above already asserts it inside cargo-deny; this re-checks it from
      #     the outside, so a tool that ever stopped honouring the flag cannot
      #     take the invariant down with it. Guarded, because a failed policy run
      #     is precisely when you want to know whether the lockfile also moved.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the policy check modified a lockfile, which would silently"\
                 " change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"

  # Policy evaluation over the DETACHED fuzz crate graph, against the SAME root
  # `deny.toml` the job above uses. This is the job that closes the
  # trigger-coverage gap: `fuzz.yml`'s `supply-chain` job runs the same command
  # but only on pull_request, weekly cron and manual dispatch, so before this job
  # existed a direct push touching `fuzz/Cargo.toml` or `fuzz/Cargo.lock` got
  # advisory coverage from the cargo-audit job above and NO licence, ban or source
  # evaluation for up to seven days. Both jobs are kept: this one gives cadence,
  # the one in `fuzz.yml` gates the fuzzing campaign. See "SCOPE" in the header.
  cargo-deny-fuzz:
    name: cargo-deny (fuzz graph, root policy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Current stable, for the same reason as every other job here.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. `deny.toml`, `fuzz/Cargo.toml` and
      #    `fuzz/Cargo.lock` are the inputs. Nothing is compiled, and in
      #    particular the nightly-only `libfuzzer-sys` is resolved but never
      #    built - cargo-deny reads the graph, it does not build it, which is why
      #    this job runs happily on stable.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do NOT leave the `GITHUB_TOKEN` behind in `.git/config`. By default
          # `actions/checkout` writes it there as an `http.extraheader`, where it
          # survives this step and stays readable to every later step in the job -
          # including anything a build script or third-party action runs. Nothing
          # here pushes, tags or authenticates, so the credential has no reader.
          # This is separate from the top-level `permissions:` ceiling: that bounds
          # what the token MAY DO, this bounds how long it EXISTS on disk.
          persist-credentials: false

      # 2. Install current stable.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master, 2026-07-16
        with:
          # The channel MUST be named here. Pinning this action to a commit means
          # the `@<ref>` no longer selects a toolchain: the pinned tree is the
          # `stable` branch, whose `toolchain` input merely DEFAULTS to `stable`,
          # so relying on the default would silently install stable wherever
          # another channel was intended.
          toolchain: stable

      # 3. The same ambient-resolution assertion as the other jobs. Bare
      #    `rustc`/`rustup` on purpose.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install cargo-deny at the same pin as the root policy job. The two
      #    pins must never diverge: BOTH jobs evaluate the SAME root `deny.toml`,
      #    one file aimed at two graphs, and evaluating it with different
      #    cargo-deny versions would make "the 102-package closure is governed"
      #    a statement about two different rulebooks.
      #
      #    Same integrity-verified install as the root policy job: sparse-index
      #    sha256 on a hand-fetched tarball (Cargo's own checksum check does not
      #    apply to a curl download), then `--path ... --locked` so the build uses
      #    0.20.2's published, measured-clean lockfile.
      - name: Install cargo-deny 0.20.2 from an integrity-verified source tree
        run: |
          set -euo pipefail
          name=cargo-deny
          version=0.20.2
          cksum="$(curl -fsSL "https://index.crates.io/${name:0:2}/${name:2:2}/$name" \
            | python3 -c "import json,sys; print(next(e['cksum'] for e in map(json.loads, sys.stdin) if e['vers'] == '$version'))")"
          test -n "$cksum"
          work="$RUNNER_TEMP/tools"
          mkdir -p "$work"
          curl -fsSL -o "$work/$name-$version.crate" \
            "https://static.crates.io/crates/$name/$name-$version.crate"
          echo "$cksum  $work/$name-$version.crate" | sha256sum -c -
          tar xzf "$work/$name-$version.crate" -C "$work"
          cargo +stable install --path "$work/$name-$version" --locked

      # 5. Assert the pin, as above.
      - name: Assert the pinned cargo-deny version
        run: |
          set -euo pipefail
          expected='0.20.2'
          cargo +stable deny --version
          actual="$(cargo +stable deny --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-deny ${expected} but resolved ${actual}."\
                 " deny.toml's SCHEMA VERSION note was validated against ${expected}."
            exit 1
          fi
          echo "cargo-deny ${actual} matches the pin"

      # 5a. The scanner audits its OWN graph before its verdict on the fuzz
      #     closure is trusted, exactly as in the root policy job. Scoped `-D`
      #     flags apply to the tool's graph only; the fuzz policy below stays
      #     override-free so the root `deny.toml` remains the single rulebook.
      - name: Audit cargo-deny's own dependency graph
        run: |
          set -euo pipefail
          cargo +stable deny --locked \
            --manifest-path "$RUNNER_TEMP/tools/cargo-deny-0.20.2/Cargo.toml" \
            check advisories -D unsound -D unmaintained -D yanked

      # 6. All four categories in ONE invocation, and that differs from the root
      #    job on purpose. `cargo deny check` with no category runs advisories,
      #    bans, licenses and sources and prints every verdict even when one of
      #    them fails - measured against a deliberately failing licence fixture:
      #    `advisories ok, bans ok, licenses FAILED, sources ok`, exit 4. For a
      #    13-package graph that single summary line is clearer than four steps.
      #
      #    Five flags, each load-bearing:
      #
      #      `--manifest-path fuzz/Cargo.toml`
      #                  points cargo-deny at the detached workspace, whose own
      #                  empty `[workspace]` table keeps it out of the root graph.
      #      `--config deny.toml`
      #                  MANDATORY, and the reason this job is trustworthy.
      #                  cargo-deny resolves configuration from the TARGET
      #                  manifest's workspace root, so WITHOUT this flag it would
      #                  look for `fuzz/deny.toml` and fall back to built-in
      #                  DEFAULTS if it found none. A sibling policy file used to
      #                  live there and used to be picked up that way; it was
      #                  deleted because a blocking supply-chain verdict must come
      #                  from a policy reviewed on this repository's normal review
      #                  surface, not from a second file governing a blocking gate.
      #                  This flag is what makes the reviewed root policy govern
      #                  all 102 packages. The `policy-integrity` job fails if a
      #                  `fuzz/deny.toml` ever reappears.
      #      `--locked`  MANDATORY. Without it cargo-deny re-resolves and will
      #                  REWRITE `fuzz/Cargo.lock` when manifest and lock have
      #                  drifted, then report `ok` on the graph it just invented
      #                  rather than on the committed pins. Measured: a loose
      #                  `libc = "0.2"` added to `fuzz/Cargo.toml` alone made the
      #                  un-`--locked` command rewrite the lockfile and still
      #                  print all four `ok` lines; with `--locked` the same
      #                  fixture fails and the lockfile is untouched.
      #      `-L info`   prints `using config from <root>/deny.toml`, which is the
      #                  positive evidence that the ROOT policy is in force rather
      #                  than a rediscovered sibling or a built-in default.
      #      `-A license-not-encountered`
      #      `-A unmatched-skip -A unnecessary-skip`
      #                  THREE shape artifacts of evaluating one policy against a
      #                  13-package SUBSET, and nothing else. `Unicode-3.0` is
      #                  required by `unicode-ident`, a root-graph crate, so the
      #                  allowance is unused here; and the four `[bans] skip`
      #                  entries name root-graph duplicates, so `rand` /
      #                  `rand_core` are unmatched and `getrandom` / `r-efi`
      #                  unnecessary here. All three codes stay at FULL severity on
      #                  the root invocation above, which is where they mean
      #                  something -- `unused-allowed-license = "deny"` and the
      #                  "a stale skip is a prompt to re-review" property are both
      #                  still enforced there. Nothing capable of hiding a real
      #                  finding is suppressed: `rejected`, `denied`, `duplicate`,
      #                  `vulnerability`, `unmaintained`, `unsound`, `yanked`,
      #                  `unknown-registry` and `unknown-git` are untouched.
      #                  Measured on this tree: `advisories ok, bans ok, licenses
      #                  ok, sources ok` over `gathered 13 crates`, zero warnings.
      - name: Check the detached fuzz graph against the root deny.toml
        run: cargo +stable deny --locked --manifest-path fuzz/Cargo.toml
               --config deny.toml -L info check
               -A license-not-encountered -A unmatched-skip -A unnecessary-skip

      # 7. Lockfile immutability, from the outside, exactly as the two jobs above
      #    do it. `fuzz/Cargo.lock` is the one this job could plausibly disturb,
      #    and it is a file no job in this workflow has any business writing.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the fuzz policy check modified a lockfile, which would"\
                 " silently change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"
