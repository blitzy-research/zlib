# Audit - supply-chain audit gate for the zlib-rs crate
#
# Pure-Cargo pipeline for the C-to-Rust migration of zlib 1.3.2.1 into the
# `zlib-rs` crate (library `zlib_rs`; edition 2024; MSRV 1.85.0;
# crate-type = ["lib", "cdylib", "staticlib"]).
#
# This workflow exists because nothing else in the repository watches the
# dependency closure. Before it, no job ran `cargo-audit` at all, and no job
# evaluated the ROOT `deny.toml` policy, while the manifest already carried a
# version floor placed there for a named RustSec advisory - so advisory pressure
# was real and unmonitored. Two independent tools run here, because they answer
# two different questions:
#
#   * `cargo-audit` reads a LOCKFILE and matches its packages against the
#     RustSec advisory database. It is the only mechanism anywhere in this
#     repository that checks `fuzz/Cargo.lock` for advisories.
#   * `cargo-deny` evaluates the root `deny.toml` POLICY - permitted licences,
#     advisory severity, banned crates and permitted sources - over the resolved
#     root crate graph.
#
# Neither tool is, or may become, a manifest dependency. Both are installed by
# the jobs below, exactly as `fuzz.yml` installs `cargo-fuzz` and `cargo-deny`.
#
# Every job and every step here is BLOCKING, and none may ever be marked
# advisory or allowed to fail: a supply-chain gate that reports without failing
# is indistinguishable from no gate at all. Nothing here suppresses a finding
# either - no advisory id is silenced on a command line, and no tool-local
# suppression file is introduced under `.cargo/`. An advisory exception that is
# genuinely warranted belongs in `deny.toml`'s `[advisories] ignore` as an
# explicit, reviewable entry; that list is deliberately empty, and
# `unused-ignored-advisory = "deny"` alongside it means an entry that has
# outlived its reason becomes an error in its own right.
#
# Jobs:
#   policy-integrity   structural self-assertion over `deny.toml` and
#                      `fuzz/deny.toml`; needs no Rust toolchain
#   cargo-audit        RustSec advisory scan of BOTH lockfiles (89 + 13 = 102
#                      packages); the only cargo-audit run in the repository
#   cargo-deny         root `deny.toml` policy over the root graph: licenses,
#                      advisories, bans and sources, one named step each
#   cargo-deny-fuzz    `fuzz/deny.toml` policy over the detached fuzz graph, so
#                      that half of the closure gets the same trigger coverage
#
# All four jobs are independent - none declares `needs:` - so they run in
# parallel and a red build points at one tool, one policy, or one graph without
# waiting on the others.
#
# Action versions are standardized on @v4 across this repository's Cargo CI.
# No native toolchain is required: both tools resolve a dependency graph and
# read lockfiles, and neither compiles this crate or any C source. No step in
# this file reads, writes, moves or compiles the retained C baseline (`*.c`,
# `*.h`, `test/*.c`, `zlib.map`), and no step creates or modifies a tracked
# file.
#
# CONVENTIONS - THIS FILE DELIBERATELY MIXES THE TWO IN-REPO WORKFLOW IDIOMS
# =========================================================================
# The HEADER block and the `# Jobs:` index above follow `ci.yml`, this
# repository's Cargo-CI pattern: a hyphenated title line, bare `#` separators
# between paragraphs, ALL-CAPS section banners, and a WHY comment above every
# job key.
#
# The BODY follows `fuzz.yml`: blank lines between top-level keys, a
# `# Triggers:` index, `permissions:`, `concurrency:`, and numbered `# 1.` step
# comments over a six-space step-sequence indent. None of those structures
# exists in `ci.yml` to copy from - it has no `permissions:`, no `concurrency:`
# and no `schedule:` trigger, and it indents step sequences at four spaces
# rather than six.
#
# The two parents genuinely disagree on those points, so the split is recorded
# here on purpose rather than left to be rediscovered. Do not "normalise" this
# file toward either parent without reading both: an unexplained reformat here
# is how one of the two idioms quietly gets lost.
#
# TOOLCHAIN SELECTION - WHY EVERY JOB SAYS `stable` TWICE
# ======================================================
# `rust-toolchain.toml` at the repository root pins `channel = "1.85.0"`, the
# MSRV floor, so that a contributor's first local build exercises the declared
# MSRV. That pin is a rustup DIRECTORY-FILE override at precedence rank 4, and
# it outranks the `rustup default` that `dtolnay/rust-toolchain` sets at rank 5.
# INSTALLING a toolchain is therefore not the same as SELECTING it. Measured
# from this repository root:
#
#     rustup default                -> stable-x86_64-unknown-linux-gnu (default)
#     rustup show active-toolchain  -> 1.85.0-x86_64-unknown-linux-gnu
#                                     (overridden by '.../rust-toolchain.toml')
#     rustc --version               -> rustc 1.85.0
#
# So an install written without the `+stable` prefix - however carefully its
# `--version` and `--locked` flags are chosen - would still build on 1.85.0. Both
# audit tools are ordinary Rust programs whose own MSRV is their business, not
# this project's; there is no reason for this crate's MSRV floor to constrain
# which advisory scanner can be built.
#
# Each job below therefore states its intent TWICE, and the two can never
# disagree because they name the same channel:
#
#   1. A job-level `env: RUSTUP_TOOLCHAIN: stable` (rank 2), which beats the
#      directory file and is inherited by nested cargo invocations.
#   2. A `+stable` shorthand on every `cargo` call (rank 1, the highest
#      precedence there is), visible in the run log next to the command it
#      governs.
#
# Each job then ASSERTS the toolchain it resolved before doing any work, using
# BARE `rustc` and `rustup` - never `rustc +stable` - because the whole purpose
# of the assertion is to observe the AMBIENT resolution that rank 2 produces.
# Prefixing those two calls would make the assertion vacuous. This mirrors
# `ci.yml` and `fuzz.yml`, which record the same rationale against the same
# measurement. Do not "simplify" it by deleting the pin from
# `rust-toolchain.toml`: that reopens the local/CI asymmetry the pin closes.
#
# SCOPE - 102 PACKAGES ACROSS TWO LOCKFILES, AND WHO CHECKS WHICH
# ==============================================================
# The governed closure spans two lockfiles, because `fuzz/Cargo.toml` carries an
# empty `[workspace]` table. That table DETACHES the fuzz crate, so root-level
# `cargo build`, `test`, `clippy`, `fmt`, `deny` and `audit` never reach it. The
# detachment is load-bearing and must not be "fixed": attaching the fuzz crate
# to the root would pull the nightly-only `libfuzzer-sys` into the root
# dependency graph and break the stable jobs in `ci.yml` at a stroke.
#
#   * root `Cargo.lock` - 89 packages. The runtime closure is just `cfg-if` plus
#     the optional `crc32fast`; every other package is dev-only.
#   * `fuzz/Cargo.lock` - 13 packages, reachable only by naming the file.
#
# ADVISORIES over both lockfiles are covered HERE, by the two `cargo audit`
# steps; the second names `--file fuzz/Cargo.lock`, which is the entire reason
# it exists as a separate step. `cargo-audit` reads a lockfile directly and
# consults no policy file, so scoping it to the fuzz lock is unambiguous and
# carries no configuration-resolution question.
#
# POLICY over the fuzz graph is covered here too, by the `cargo-deny-fuzz` job,
# and getting the nuance right matters because an earlier revision of this file
# deliberately omitted it and was wrong to.
#
# The thing that would genuinely be wrong is aiming the ROOT policy at the fuzz
# graph. Root `deny.toml` bans `cc` OUTRIGHT, because the crate proper takes no
# C-toolchain build dependency and `build.rs` is pure `std`. The fuzz graph, by
# contrast, legitimately contains `cc`, `jobserver`, `shlex` and
# `find-msvc-tools` for the libFuzzer runtime shim, plus an NCSA-licensed
# `libfuzzer-sys`. `fuzz/deny.toml` permits precisely those and the root policy
# does not, by design; pointing the root rulebook at the fuzz graph would report
# a policy mismatch as though it were a supply-chain defect.
#
# But that is an argument against `--config deny.toml`, not against scanning the
# fuzz graph at all. `cargo-deny` resolves its configuration from the TARGET
# manifest's workspace root, so `--manifest-path fuzz/Cargo.toml` discovers
# `fuzz/deny.toml` automatically - the sibling policy, not this one. Verified in
# the run log by `-L info`, which prints `using config from fuzz/deny.toml`.
#
# Why that job has to live HERE, even though `fuzz.yml`'s `supply-chain` job runs
# the same command: TRIGGER COVERAGE. `fuzz.yml` fires on `pull_request`,
# `workflow_dispatch` and a WEEKLY cron (Mondays 03:00 UTC) - it has no `push`
# trigger, and it should not acquire one, because its `cargo-fuzz` job `needs:`
# the policy job and a fuzzing campaign is a ~50-minute affair that has no
# business running on every branch push. Without `cargo-deny-fuzz` here, a direct
# push touching `fuzz/Cargo.toml`, `fuzz/Cargo.lock` or `fuzz/deny.toml` would
# get advisory coverage from the `--file fuzz/Cargo.lock` step above, and NO
# licence, ban, or source evaluation for up to seven days.
#
# The two invocations are therefore complementary, not redundant, and neither may
# be deleted as a duplicate:
#
#   * `audit.yml` / `cargo-deny-fuzz` - push, PR, DAILY, manual. Answers "is the
#     fuzz graph still policy-clean?" on the same cadence as the root graph.
#   * `fuzz.yml` / `supply-chain`     - PR, weekly, manual. GATES fuzzing, so no
#     harness is ever built from an unaudited graph.
#
# WHAT A FAILURE HERE MEANS
# =========================
# A red job in this file is a finding to ESCALATE. It is never silenced, and it
# is never repaired from inside this workflow:
#
#   * A licence or advisory outcome that warrants a policy change belongs in
#     `deny.toml`, which this workflow only ever READS.
#   * A version change belongs in `Cargo.toml` and `Cargo.lock`. No step here
#     re-resolves dependencies, or does anything else whose side effect is
#     regenerating a lockfile, and both jobs end by asserting that neither
#     lockfile moved.
#   * `cargo deny check bans` reports the three ACKNOWLEDGED duplicate majors as
#     `note[skipped]` lines, because root `deny.toml` lists each of them
#     individually under `skip` with an exact `crate@version` pin. Those notes
#     are the designed behaviour. Any OTHER duplicate is a hard `error[duplicate]`
#     and fails the step, because that policy now sets
#     `multiple-versions = "deny"` - it previously said `warn`, which meant an
#     unapproved duplicate major on the 89-package root graph exited 0 and
#     reported GREEN while the 13-package fuzz graph blocked on the same class of
#     drift. Nothing in this file escalates or downgrades anything: no `-D`, `-W`
#     or `-A` appears on any command line, and no step here performs duplicate
#     detection of its own. The severity lives in `deny.toml`, where a reviewer
#     reads it.
#
# The specific drift this gate is shaped to catch: two `rand` majors coexist in
# the root graph. `rand 0.9.4` is the DIRECT dev-dependency and carries the
# manifest's advisory-driven version floor. `rand 0.10.2` arrives TRANSITIVELY
# through `quickcheck 1.1.0` and is governed by no declared floor of its own -
# a floor on the direct requirement says nothing about the transitive one. The
# same split then propagates down `rand_core`, `getrandom` and `r-efi`. Only a
# gate that resolves the real graph, on a schedule, can tell those apart, which
# is what the jobs below do.
#
# TOOL VERSIONS ARE PINNED, AND THE PIN IS ASSERTED
# =================================================
# `cargo install <tool> --locked` pins the TOOL'S OWN lockfile. It does NOT pin
# which version of the tool you get: `cargo install` resolves the newest publish
# on crates.io at run time. That is a reproducibility hole in a gate whose
# rulebook declares a schema version - `deny.toml`'s "SCHEMA VERSION" section
# states that every key in it "was probed against 0.20.2 and accepted with zero
# schema errors and zero deprecation diagnostics", and warns not to assume the
# file still parses cleanly after an upgrade. A floating install could therefore
# turn a policy-parse regression into a hard CI failure or, far worse, into a
# silently different interpretation of the same policy text.
#
# So both installs below name an exact `--version`, and the following step
# ASSERTS the version that actually resolved instead of merely printing it. The
# two numbers are:
#
#     cargo-deny   0.20.2   <- the version `deny.toml` and `fuzz/deny.toml` were
#                              authored and probed against
#     cargo-audit  0.22.2   <- current at the time this gate was validated
#
# TO UPGRADE EITHER TOOL, in this order:
#   1. bump the `--version` here (and in `fuzz.yml`, which pins cargo-deny too),
#   2. run `cargo deny --locked check all` and `cargo deny --locked
#      --manifest-path fuzz/Cargo.toml check` locally and READ STDERR - a new
#      major may deprecate or re-scope a key,
#   3. update `deny.toml`'s SCHEMA VERSION note to the version you validated,
#   4. keep the two files in step. A pin that disagrees with the note it points
#      at is worse than no pin, because it reads as verified when it is not.
# `cargo-fuzz` in `fuzz.yml` is deliberately NOT pinned; the reason is recorded
# there, next to that install.
#
# WHY THREE STEPS CARRY AN `if:` - AND WHY THAT IS NOT A MASKING CONSTRUCT
# =======================================================================
# GitHub skips every remaining step in a job once one step fails. In a job whose
# steps are four INDEPENDENT policy questions, that turns a failure in the first
# question into silence about the other three: a licence rejection used to
# prevent the ADVISORY step from running at all, so the run told you nothing
# about whether the graph was vulnerable. That is a coverage defect, and the
# `if: ${{ !cancelled() }}` guards below are its fix.
#
# Read those guards precisely, because `if:` is also the shape a genuine
# gate-neutralisation takes:
#
#   * WHAT THEY DO: run the step even when an EARLIER step in the same job has
#     already failed.
#   * WHAT THEY DO NOT DO: they do not touch the guarded step's own exit code.
#     A guarded step that fails still fails, and still turns the job red. Nothing
#     here converts a non-zero exit into a pass.
#   * WHY `!cancelled()` AND NOT `always()`: a cancelled run must stop. With
#     `always()` a superseded run would keep grinding through the remaining
#     checks after `cancel-in-progress` had already killed it.
#   * WHAT REMAINS FORBIDDEN, absolutely: `continue-on-error` at job or step
#     level, `|| true`, `set +e`, a trailing `exit 0`, `2>/dev/null` on a tool
#     invocation, and the weakening flags `--stale`, `-n` / `--no-fetch`,
#     `--ignore` and `-A`. None appears anywhere in this file. Any `if:` here
#     other than the exact `${{ !cancelled() }}` form should be read as a defect.
#
# The alternative was to collapse the four steps into one `cargo deny check`,
# which does run all four categories in a single invocation and reports every
# verdict even when one fails (measured against a deliberately failing licence
# fixture: `advisories ok, bans ok, licenses FAILED, sources ok`, exit 4). That
# was rejected because the four named steps are what let the GitHub UI attribute
# a failure to one policy section without anyone opening the log. The guards keep
# the attribution AND get the full pass.
#
# ACTION PINNING - A DELIBERATE, REPOSITORY-WIDE CONVENTION
# ========================================================
# `actions/checkout@v4` and `dtolnay/rust-toolchain@stable` are MUTABLE refs: a
# tag can be moved and a branch advances by design. In a workflow whose whole
# purpose is supply-chain assurance that deserves to be stated rather than left
# implicit. It is a convention shared with `ci.yml` and `fuzz.yml` - across the
# three files there are 13 `actions/checkout@v4`, 12 `dtolnay/rust-toolchain@*`,
# 5 `actions/cache@v4` and 2 `actions/upload-artifact@v4` uses, none SHA-pinned -
# so this file is consistent with the repository rather than uniquely lax.
#
# Moving to SHA pins is a bigger change than it looks, and must be done to all
# three workflows at once or not at all:
#
#   * `dtolnay/rust-toolchain` derives its DEFAULT toolchain from
#     `github.action_ref` - that is precisely how `@stable`, `@nightly` and
#     `@1.85.0` select what they select. Replacing the ref with a commit SHA
#     makes the requested toolchain the SHA itself, so every one of the 12 call
#     sites must simultaneously gain an explicit `with: toolchain:` input. A
#     partial conversion breaks the build.
#   * Every SHA must be verified against the upstream repository at the moment of
#     pinning. A SHA copied from anywhere else is a worse trust root than the tag
#     it replaced, because it looks authoritative and cannot be eyeballed.
#
# Until that is done as one reviewed change, the residual exposure is recorded
# here honestly: this workflow trusts `actions/checkout` and
# `dtolnay/rust-toolchain` at tag/branch granularity.
#
# NO TOOL OR DATABASE CACHING - INTENTIONAL, DO NOT "OPTIMISE" IT IN
# =================================================================
# There is no `actions/cache` step anywhere in this file, and that is a decision
# rather than an omission. Both tools are compiled from source on every run and
# the RustSec database is fetched fresh on every run. The cost is real: two
# `cargo install` builds per run, on a schedule that fires daily.
#
# What it buys is that neither a stale tool nor a stale advisory database can
# ever produce a verdict here. A cached advisory DB is the classic way a security
# gate degrades into a gate that always passes, and root `deny.toml`'s
# `maximum-db-staleness = "P7D"` is the backstop for exactly that failure - a
# backstop that a cache would be constantly pressing against. A cached tool
# binary would additionally defeat the `--version` pins above, since the pin is
# enforced at install time.
#
# If build minutes ever become the binding constraint, cache the CARGO REGISTRY
# INDEX (which is content-addressed and cannot go stale in a way that changes a
# verdict) - never the tool binaries and never `~/.cargo/advisory-db`.

name: Audit

# Triggers:
#   * push              - catch a dependency, lockfile or policy change the
#                         moment it lands on a branch.
#   * pull_request      - gate the same change before it merges.
#   * workflow_dispatch - let a maintainer re-run the audit on demand, for
#                         instance right after a new advisory is published.
#   * schedule          - a DAILY run at 05:00 UTC. This trigger is what makes
#                         the workflow able to do its job at all: the RustSec
#                         advisory database changes without any commit to this
#                         repository, so a push/pull_request-only audit is
#                         structurally incapable of noticing a newly published
#                         advisory. Daily matches the cadence at which
#                         advisories actually appear, and it keeps root
#                         `deny.toml`'s `maximum-db-staleness = "P7D"`
#                         comfortably satisfied. 05:00 UTC deliberately avoids
#                         `fuzz.yml`'s Mondays 03:00 UTC slot so the two
#                         scheduled workflows never contend for runners; that
#                         slot belongs to `fuzz.yml` and is not moved from here.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

# Principle of least privilege: this workflow only needs read access to the
# repository contents, in order to check out the tree and read the two lockfiles
# and `deny.toml`. It reports exclusively through the build status - it opens no
# issue, writes no comment, creates no tag and pushes no commit - so no write
# scope of any kind belongs here, and no secret or token is referenced.
permissions:
  contents: read

# Avoid piling up redundant audit runs: a newer commit on the same ref cancels
# any still-running audit for that ref. Unlike a fuzzing campaign, a cancelled
# audit loses nothing whatsoever - both jobs are short and stateless, and the
# superseding run re-reads the same lockfiles against an at-least-as-fresh
# advisory database. So `cancel-in-progress` is unambiguously correct here.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Structural self-assertion over both cargo-deny policies.
  #
  # WHY THIS JOB EXISTS - a measured hole, not a theoretical one.
  # `cargo deny` reads a policy file and evaluates what it finds. It does NOT
  # require the file to contain anything. Measured on this repository: with
  # `deny.toml` PRESENT but its `[bans]` table deleted, `cargo deny check bans`
  # returns exit 0 with `0 errors, 0 warnings, 0 notes` and NO diagnostic
  # whatsoever, and `-L info` still prints the reassuring `using config from
  # .../deny.toml`. The same is true of `[sources]`. The reason is structural: the
  # `unused-allowed-source` and `unused-allowed-org` guards that would notice an
  # eroded source policy live INSIDE the very table whose deletion they would have
  # to catch. Deleting the whole file IS caught, because the licence check then
  # fails against built-in defaults - but section-level erosion was a silent
  # vacuous pass, and a supply-chain gate that can be disarmed by deleting four
  # lines of TOML is not a gate.
  #
  # So this job asserts the POLICY TEXT independently of the tool that consumes
  # it: every governed table must be present, and every load-bearing key must
  # still hold the value it was reviewed with. It deliberately needs no Rust
  # toolchain and no network, so it is the fastest signal in the workflow and
  # cannot be blocked by a registry or advisory-database problem.
  #
  # WHEN YOU LEGITIMATELY CHANGE A POLICY VALUE: change the expectation here in
  # the same commit. That coupling is the point - a policy relaxation becomes a
  # two-file diff a reviewer cannot miss, instead of a one-word edit.
  policy-integrity:
    name: policy integrity (deny.toml self-assertion)
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch the tree. `deny.toml` and `fuzz/deny.toml` are the only inputs;
      #    nothing is resolved, installed, compiled or fetched.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Parse both policies with `tomllib` (Python 3.11+, present on
      #    ubuntu-latest) and assert the governed structure. TOML parsing rather
      #    than grep is deliberate: a grep for `multiple-versions = "deny"` would
      #    be satisfied by a commented-out line, by an occurrence in the wrong
      #    table, or by prose, and this file is heavily commented.
      #
      #    The expectations below are the values the QA-verified policy holds.
      #    Anything missing, or weakened, fails with a `::error::` naming the
      #    exact key.
      - name: Assert both cargo-deny policies are structurally intact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          if sys.version_info < (3, 11):
              print("::error::python >= 3.11 is required for tomllib; got "
                    f"{sys.version.split()[0]}")
              raise SystemExit(1)

          import tomllib

          # Every governed table must exist in BOTH policies. A missing table is
          # the silent-vacuous-pass case this job exists to catch.
          REQUIRED_TABLES = ("graph", "advisories", "licenses", "bans", "sources")

          # (table, key, expected) triples that must hold in BOTH policies. These
          # are the settings whose weakening would quietly reduce coverage.
          SHARED = [
              ("graph", "all-features", True),
              ("advisories", "db-urls", ["https://github.com/rustsec/advisory-db"]),
              ("advisories", "unmaintained", "all"),
              ("advisories", "unsound", "all"),
              ("advisories", "yanked", "deny"),
              ("advisories", "disable-yank-checking", False),
              ("advisories", "maximum-db-staleness", "P7D"),
              ("advisories", "ignore", []),
              ("advisories", "unused-ignored-advisory", "deny"),
              ("licenses", "include-dev", True),
              ("licenses", "include-build", True),
              ("licenses", "unused-allowed-license", "deny"),
              ("bans", "multiple-versions", "deny"),
              ("bans", "multiple-versions-include-dev", True),
              ("bans", "wildcards", "deny"),
              ("bans", "skip-tree", []),
              ("sources", "unknown-registry", "deny"),
              ("sources", "unknown-git", "deny"),
              ("sources", "allow-registry",
               ["https://github.com/rust-lang/crates.io-index"]),
              ("sources", "allow-git", []),
              ("sources", "required-git-spec", "rev"),
              ("sources", "unused-allowed-source", "deny"),
              ("sources", "unused-allowed-org", "deny"),
          ]

          # Settings that legitimately differ between the two graphs. Asserting
          # them per-file is what stops a fuzz-only concession leaking into the
          # published dependency graph.
          PER_FILE = {
              "deny.toml": [
                  # The crate proper must never gain a wildcard-path exemption.
                  ("bans", "allow-wildcard-paths", False),
                  # No per-crate licence carve-out is needed at the root.
                  ("licenses", "exceptions", []),
                  ("licenses", "allow", ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]),
              ],
              "fuzz/deny.toml": [
                  # Forced by `zlib-rs { path = ".." }` with no version.
                  ("bans", "allow-wildcard-paths", True),
                  # The fuzz graph is duplicate-free, so nothing may be skipped.
                  ("bans", "skip", []),
                  ("licenses", "allow", ["Apache-2.0", "MIT", "Zlib"]),
              ],
          }

          # Architectural bans that must be denied by BOTH policies by name. These
          # encode project scope boundaries: no C toolchain in the crate proper, no
          # C zlib linked back in, no competing codec, no TLS stack.
          REQUIRED_DENIES = [
              "cc", "bindgen", "pkg-config",
              "libz-sys", "libz-ng-sys", "cloudflare-zlib-sys",
              "bzip2", "bzip2-sys", "lzma-sys", "xz2",
              "zstd", "zstd-sys", "brotli", "brotli-decompressor",
              "openssl", "openssl-sys",
          ]

          failures = []

          def check(path, table, key, expected, actual_holder):
              if key not in actual_holder:
                  failures.append(f"{path}: [{table}] is missing the key "
                                  f"`{key}` (expected {expected!r})")
                  return
              actual = actual_holder[key]
              if isinstance(expected, list):
                  ok = sorted(map(str, actual)) == sorted(map(str, expected))
              else:
                  ok = actual == expected and type(actual) is type(expected)
              if not ok:
                  failures.append(f"{path}: [{table}] {key} = {actual!r}, "
                                  f"expected {expected!r}")

          for path in ("deny.toml", "fuzz/deny.toml"):
              try:
                  with open(path, "rb") as handle:
                      policy = tomllib.load(handle)
              except FileNotFoundError:
                  failures.append(f"{path}: the policy file is missing entirely")
                  continue
              except tomllib.TOMLDecodeError as exc:
                  failures.append(f"{path}: is not valid TOML: {exc}")
                  continue

              for table in REQUIRED_TABLES:
                  if table not in policy:
                      failures.append(f"{path}: the [{table}] table is absent, so "
                                      f"`cargo deny check {table}` would evaluate "
                                      f"nothing and pass vacuously")

              for table, key, expected in SHARED + PER_FILE[path]:
                  if table in policy:
                      check(path, table, key, expected, policy[table])

              # `[licenses.private] ignore` may exempt unpublished workspace
              # members, so it must stay scoped to that and nothing else.
              private = policy.get("licenses", {}).get("private", {})
              if private.get("registries", None) != []:
                  failures.append(f"{path}: [licenses.private] registries must be "
                                  f"an empty list; got "
                                  f"{private.get('registries')!r}")

              # No organisation-wide git trust on any forge.
              for forge in ("github", "gitlab", "bitbucket"):
                  granted = policy.get("sources", {}).get("allow-org", {}).get(forge, [])
                  if granted != []:
                      failures.append(f"{path}: [sources.allow-org] {forge} must be "
                                      f"empty; got {granted!r}")

              # Architectural bans, by crate name.
              denied = {entry["crate"] for entry in policy.get("bans", {}).get("deny", [])
                        if isinstance(entry, dict) and "crate" in entry}
              for crate in REQUIRED_DENIES:
                  if crate not in denied:
                      failures.append(f"{path}: [bans] deny no longer lists "
                                      f"`{crate}`")

              # Every duplicate-version acknowledgement must be pinned to an
              # exact version, so it expires on the next bump instead of becoming
              # an open-ended exemption.
              for entry in policy.get("bans", {}).get("skip", []):
                  spec = entry.get("crate", "") if isinstance(entry, dict) else str(entry)
                  if "@" not in spec:
                      failures.append(f"{path}: [bans] skip entry `{spec}` is not "
                                      f"pinned to an exact version")
                  if isinstance(entry, dict) and not entry.get("reason"):
                      failures.append(f"{path}: [bans] skip entry `{spec}` carries "
                                      f"no reason")

              # `cc` may exist in the fuzz graph, but ONLY as libfuzzer-sys's build
              # dependency. A blanket allowance there would let any path acquire it.
              if path == "fuzz/deny.toml":
                  for entry in policy.get("bans", {}).get("deny", []):
                      if isinstance(entry, dict) and entry.get("crate") == "cc":
                          if entry.get("wrappers") != ["libfuzzer-sys"]:
                              failures.append(
                                  "fuzz/deny.toml: [bans] the `cc` entry must be "
                                  "scoped with wrappers = [\"libfuzzer-sys\"]; got "
                                  f"{entry.get('wrappers')!r}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              print(f"{len(failures)} policy-integrity assertion(s) failed. Either "
                    "the policy was weakened, or this job's expectations are out of "
                    "date -- update whichever is actually wrong, in the same commit.")
              raise SystemExit(1)

          print("deny.toml and fuzz/deny.toml declare every governed table and "
                "hold every load-bearing key at its reviewed value")
          PY

  # RustSec advisory scan of both lockfiles. This is the only `cargo-audit` run
  # in the repository, and the only place `fuzz/Cargo.lock` is checked for
  # advisories. It carries no `needs:` on any other job, so all four run in
  # parallel and a red build points at one tool without waiting on the others.
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Current stable, not the MSRV floor pinned by `rust-toolchain.toml`. See
    # "TOOLCHAIN SELECTION" in the header: the toolchain FILE outranks the
    # `rustup default` that the action below sets, so this override is what
    # actually selects stable for every step in the job.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. Nothing is built from it: the job reads `Cargo.lock`,
      #    `fuzz/Cargo.lock` and the git index, and nothing else.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install current stable. `cargo-audit` is an ordinary Rust program and
      #    has no reason to be built by this crate's MSRV floor.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Fail loudly if the stable override is ever lost, instead of
      #    discovering it as an opaque compile error part-way through the
      #    `cargo install` below. Deliberately BARE `rustc` and `rustup`: the
      #    point is to observe the AMBIENT resolution, which a `+stable` prefix
      #    would hide and thereby make the assertion vacuous.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install the cargo-audit subcommand, PINNED. `--version` fixes which
      #    version of the tool runs; `--locked` fixes what that version was built
      #    from. Both are needed and they are not interchangeable - see "TOOL
      #    VERSIONS ARE PINNED" in the header for why an unpinned install is a
      #    reproducibility hole in a gate like this. cargo-audit is a CI-installed
      #    tool and must never become a manifest dependency.
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked

      # 5. ASSERT the version, do not merely print it. A pin that is never checked
      #    is a comment: if a runner ever serves a cached or pre-installed binary,
      #    or the pin above is edited without the rest of the gate being
      #    revalidated, this fails loudly instead of silently evaluating the
      #    closure with a different tool. The version still appears in the log,
      #    which is what makes the run - not this file - the record of what ran.
      - name: Assert the pinned cargo-audit version
        run: |
          set -euo pipefail
          expected='0.22.2'
          cargo +stable audit --version
          actual="$(cargo +stable audit --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-audit ${expected} but resolved ${actual}."\
                 " The --version pin on the install step above did not take effect."
            exit 1
          fi
          echo "cargo-audit ${actual} matches the pin"

      # 6. Root closure: the 89 packages in `Cargo.lock`. `--deny warnings`
      #    escalates unmaintained, unsound and yanked notices to failures, which
      #    aligns this step with the posture root `deny.toml` already takes over
      #    the same graph (`unmaintained = "all"`, `unsound = "all"`,
      #    `yanked = "deny"`); leaving it off here would make cargo-audit the
      #    laxer of the two gates for no stated reason. A vulnerability or an
      #    escalated notice exits non-zero and fails the job, which is the
      #    entire purpose of the step.
      #
      #    This step reaches the network: cargo-audit fetches the RustSec
      #    advisory database and consults the registry index for yank status. An
      #    offline run is INCONCLUSIVE rather than passing, and it fails here
      #    rather than reporting a false clean.
      - name: Audit the root dependency graph
        run: cargo +stable audit --deny warnings

      # 7. Fuzz closure: the 13 packages in `fuzz/Cargo.lock`. This step is
      #    MANDATORY and cannot be folded into the one above. `fuzz/` is a
      #    detached workspace, so the root invocation never resolves these
      #    packages; naming the lockfile explicitly is the only way to reach
      #    them, and it is why the governed closure is 89 + 13 = 102 rather than
      #    89. cargo-audit consults no policy file, so the C-compiler driver
      #    chain that legitimately lives in this graph for the libFuzzer runtime
      #    shim (`cc`, `jobserver`, `shlex`, `find-msvc-tools`) is simply scanned
      #    for advisories like any other package - the ban that applies to the
      #    crate proper is a cargo-deny policy matter and does not arise here.
      #
      #    The `if:` guard makes this step run even when the root scan above
      #    failed, so one advisory in the 89 never hides the state of the other
      #    13. It does not weaken this step: a finding here still fails the job.
      #    See "WHY THREE STEPS CARRY AN `if:`" in the header.
      - name: Audit the detached fuzz dependency graph
        if: ${{ !cancelled() }}
        run: cargo +stable audit --deny warnings --file fuzz/Cargo.lock

      # 8. Neither invocation above has any business writing a lockfile, and a
      #    rewritten lock would silently change what every `--locked` gate in
      #    `ci.yml` resolves. This asserts the invariant rather than assuming it.
      #    `fuzz/Cargo.lock` in particular belongs to a detached workspace that
      #    nothing in this file should be modifying at all.
      #
      #    Guarded for the same reason, and here the reason is sharper: the case
      #    where you MOST want to know whether a lockfile moved is the run where
      #    a scan failed. Skipping this on failure would drop the evidence exactly
      #    when it matters.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the advisory scan modified a lockfile, which would silently"\
                 " change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"

  # Policy evaluation against the ROOT `deny.toml`, over the root crate graph.
  # The four checks run as four separately-named steps rather than a single
  # `cargo deny check`, so the job log attributes a failure to one policy
  # section without anyone having to read the output to find out which. The fuzz
  # graph's policy is governed by `fuzz/deny.toml` and enforced by `fuzz.yml`'s
  # `supply-chain` job; see "SCOPE" in the header for why repeating it here,
  # against the root policy, would be wrong rather than merely redundant.
  cargo-deny:
    name: cargo-deny (licenses / advisories / bans / sources)
    runs-on: ubuntu-latest
    # Current stable, not the MSRV floor pinned by `rust-toolchain.toml`. See
    # "TOOLCHAIN SELECTION" in the header; cargo-deny's own MSRV is its
    # business, not this project's.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. `deny.toml`, `Cargo.toml` and `Cargo.lock` are the
      #    inputs. Nothing is compiled: cargo-deny resolves the dependency
      #    graph, which is also why no cross-compilation target needs installing
      #    even though `deny.toml`'s `[graph] targets` names several triples.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install current stable, for the same reason as the audit job above.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. The same ambient-resolution assertion as the audit job, and for the
      #    same reason: a lost override would quietly route this gate onto the
      #    MSRV floor. Bare `rustc`/`rustup` on purpose.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install the cargo-deny subcommand, PINNED to the version both policy
      #    files were authored and probed against. This pin is the one that
      #    matters most in the whole workflow: cargo-deny 0.20 REMOVED
      #    `[advisories] vulnerability`, `notice` and `severity-threshold`, turned
      #    `unsound` and `unmaintained` from lint levels into scope enums, and
      #    dropped an entire generation of `[licenses]` keys. A future major could
      #    do the same again - and the dangerous outcome is not a hard parse
      #    failure but a silently different reading of the same policy text.
      #    `deny.toml`'s SCHEMA VERSION section is the other half of this pin;
      #    keep the two in step. Like cargo-audit, cargo-deny is a CI-installed
      #    tool and must never become a manifest dependency.
      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --version 0.20.2 --locked

      # 5. ASSERT the pinned version, and log it. This is what makes the claim in
      #    `deny.toml` ("every key was probed against 0.20.2") true of the binary
      #    that actually evaluates the file, rather than true of whatever the
      #    author happened to have installed.
      - name: Assert the pinned cargo-deny version
        run: |
          set -euo pipefail
          expected='0.20.2'
          cargo +stable deny --version
          actual="$(cargo +stable deny --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-deny ${expected} but resolved ${actual}."\
                 " deny.toml's SCHEMA VERSION note was validated against ${expected};"\
                 " re-validate the policy before changing the pin."
            exit 1
          fi
          echo "cargo-deny ${actual} matches the pin and deny.toml's SCHEMA VERSION note"

      # 6. The four checks below share two flags, explained once here:
      #
      #      `--locked`  asserts that `Cargo.lock` will not change during graph
      #                  resolution, so a policy run can never itself be the
      #                  thing that moves the lock.
      #      `-L info`   makes cargo-deny print the configuration path it
      #                  resolved ("using config from .../deny.toml"). That
      #                  single line is the evidence that the ROOT policy is in
      #                  force: cargo-deny falls back to built-in defaults when
      #                  it finds no config, and a fallback would otherwise look
      #                  exactly like a pass. No `--config` flag is needed for
      #                  the root graph precisely because the root `deny.toml`
      #                  already sits at the workspace root cargo-deny resolves
      #                  from.
      #
      #    No `-D` / `-W` / `-A` lint override appears on any of them. The policy
      #    lives in `deny.toml` and is reviewed there; a CLI override here would
      #    silently diverge from the file every reviewer reads.
      #
      #    Every step after this one carries `if: ${{ !cancelled() }}`, so all
      #    four policy questions are answered by every run instead of the first
      #    failure silencing the rest. That guard does NOT weaken any step - each
      #    still fails the job on a non-zero exit. Read "WHY THREE STEPS CARRY AN
      #    `if:`" in the header before touching it.
      #
      #    Licences first, because it is the check least likely to depend on
      #    anything outside the tree: it reads `deny.toml`'s allow-list against
      #    the resolved graph. (Order no longer decides what gets reported, but it
      #    still decides what a reader sees first.)
      - name: Check licenses
        run: cargo +stable deny --locked -L info check licenses

      # 7. Advisories. This step reaches the network to fetch the RustSec
      #    database named by `deny.toml`'s `db-urls`, and `maximum-db-staleness`
      #    there means a database too old to trust is an error rather than a
      #    quiet pass. An offline run is INCONCLUSIVE, and fails here instead of
      #    reporting a false clean. Severity comes entirely from the file:
      #    vulnerabilities, unmaintained and unsound advisories are denied there,
      #    and `ignore` is empty.
      #
      #    This is the step the guard was added FOR. A licence rejection above
      #    used to skip it entirely, so a run could go red for a licensing reason
      #    while saying nothing at all about whether the graph was vulnerable.
      - name: Check advisories
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked -L info check advisories

      # 8. Bans. Two distinct policies are enforced by this one step, both from
      #    `deny.toml`: the architectural bans (no C-toolchain build dependency
      #    for the crate proper, no C zlib linked back in, no competing
      #    compression codec) and duplicate-version detection.
      #
      #    The three ACKNOWLEDGED duplicate majors do not fail this step: each has
      #    an exact-version `skip` entry in `deny.toml`, so the dev-only `rand` /
      #    `rand_core` / `getrandom` chains surface as `note[skipped]` lines with
      #    their inclusion paths. Any duplicate those entries do not name IS a
      #    failure, because that policy sets `multiple-versions = "deny"`. This
      #    file adds no flag that changes either outcome - the severity is the
      #    policy's to state.
      - name: Check bans
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked -L info check bans

      # 9. Sources. `deny.toml` denies unknown registries and unknown git
      #    sources and allows only crates.io, so this step is what would catch a
      #    dependency quietly re-pointed at a git revision or a private
      #    registry.
      - name: Check sources
        if: ${{ !cancelled() }}
        run: cargo +stable deny --locked -L info check sources

      # 10. The same lockfile-immutability assertion as the audit job. `--locked`
      #     above already asserts it inside cargo-deny; this re-checks it from
      #     the outside, so a tool that ever stopped honouring the flag cannot
      #     take the invariant down with it. Guarded, because a failed policy run
      #     is precisely when you want to know whether the lockfile also moved.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the policy check modified a lockfile, which would silently"\
                 " change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"

  # Policy evaluation against `fuzz/deny.toml`, over the DETACHED fuzz crate
  # graph. This is the job that closes the trigger-coverage gap: `fuzz.yml`'s
  # `supply-chain` job runs the same command but only on pull_request, weekly
  # cron and manual dispatch, so before this job existed a direct push touching
  # `fuzz/Cargo.toml`, `fuzz/Cargo.lock` or `fuzz/deny.toml` got advisory
  # coverage from the cargo-audit job above and NO licence, ban or source
  # evaluation for up to seven days. Both jobs are kept: this one gives cadence,
  # the one in `fuzz.yml` gates the fuzzing campaign. See "SCOPE" in the header.
  cargo-deny-fuzz:
    name: cargo-deny (fuzz workspace policy)
    runs-on: ubuntu-latest
    # Current stable, for the same reason as every other job here.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      # 1. Fetch the tree. `fuzz/deny.toml`, `fuzz/Cargo.toml` and
      #    `fuzz/Cargo.lock` are the inputs. Nothing is compiled, and in
      #    particular the nightly-only `libfuzzer-sys` is resolved but never
      #    built - cargo-deny reads the graph, it does not build it, which is why
      #    this job runs happily on stable.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install current stable.
      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. The same ambient-resolution assertion as the other jobs. Bare
      #    `rustc`/`rustup` on purpose.
      - name: Verify the resolved toolchain is stable
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version
          active="$(rustup show active-toolchain)"
          echo "active toolchain: $active"
          case "$active" in
            stable-*) ;;
            *) echo "::error::expected the stable toolchain, but resolved '$active'."\
               " The RUSTUP_TOOLCHAIN override was lost and rust-toolchain.toml won."; exit 1 ;;
          esac

      # 4. Install cargo-deny at the same pin as the root policy job. The two
      #    pins must never diverge: the root and fuzz policies are siblings
      #    written against one schema, and evaluating them with different
      #    cargo-deny versions would make "the 102-package closure is governed"
      #    a statement about two different rulebooks.
      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --version 0.20.2 --locked

      # 5. Assert the pin, as above.
      - name: Assert the pinned cargo-deny version
        run: |
          set -euo pipefail
          expected='0.20.2'
          cargo +stable deny --version
          actual="$(cargo +stable deny --version | awk '{ print $NF }')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected cargo-deny ${expected} but resolved ${actual}."\
                 " fuzz/deny.toml's SCHEMA VERSION note was validated against ${expected}."
            exit 1
          fi
          echo "cargo-deny ${actual} matches the pin"

      # 6. All four categories in ONE invocation, and that differs from the root
      #    job on purpose. `cargo deny check` with no category runs advisories,
      #    bans, licenses and sources and prints every verdict even when one of
      #    them fails - measured against a deliberately failing licence fixture:
      #    `advisories ok, bans ok, licenses FAILED, sources ok`, exit 4. For a
      #    13-package graph that single summary line is clearer than four steps.
      #
      #    Three flags, each load-bearing:
      #
      #      `--manifest-path fuzz/Cargo.toml`
      #                  points cargo-deny at the detached workspace. It resolves
      #                  configuration from the TARGET manifest's workspace root,
      #                  so this also selects `fuzz/deny.toml` - NOT the root
      #                  policy, which bans `cc` outright and would therefore
      #                  reject this graph's legitimate libFuzzer runtime shim.
      #                  No `--config` flag is needed or wanted.
      #      `--locked`  MANDATORY. Without it cargo-deny re-resolves and will
      #                  REWRITE `fuzz/Cargo.lock` when manifest and lock have
      #                  drifted, then report `ok` on the graph it just invented
      #                  rather than on the committed pins. Measured: a loose
      #                  `libc = "0.2"` added to `fuzz/Cargo.toml` alone made the
      #                  un-`--locked` command rewrite the lockfile and still
      #                  print all four `ok` lines; with `--locked` the same
      #                  fixture fails and the lockfile is untouched.
      #      `-L info`   prints `using config from fuzz/deny.toml`, which is the
      #                  evidence that the SIBLING policy is in force. cargo-deny
      #                  falls back to built-in defaults when it finds no config,
      #                  and a silent fallback looks exactly like a pass.
      - name: Check the detached fuzz graph against fuzz/deny.toml
        run: cargo +stable deny --locked --manifest-path fuzz/Cargo.toml -L info check

      # 7. Lockfile immutability, from the outside, exactly as the two jobs above
      #    do it. `fuzz/Cargo.lock` is the one this job could plausibly disturb,
      #    and it is a file no job in this workflow has any business writing.
      - name: Assert both lockfiles are unchanged
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain Cargo.lock fuzz/Cargo.lock)"
          if [ -n "$dirty" ]; then
            echo "::error::the fuzz policy check modified a lockfile, which would"\
                 " silently change what every other job resolves: $dirty"
            exit 1
          fi
          echo "Cargo.lock and fuzz/Cargo.lock are unchanged"
