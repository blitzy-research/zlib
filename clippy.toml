# clippy.toml — the lint-configuration contract for the `zlib-rs` crate.
#
# `clippy` reads this file from the crate root on every invocation and uses it to
# PARAMETERISE the lints it runs. It is the companion to `rustfmt.toml`: that
# file freezes FORMATTING behaviour, this one freezes LINT behaviour, and
# together the pair pins the configurable lint and format inputs required by
# migration gap D11 — "lint and format behavior currently depends on unpinned
# tool defaults".
#
# The gate it serves is `cargo clippy --all-targets [--all-features]
# -- -D warnings`, which is BLOCKING: the CI `lint` job runs it as
# `cargo +stable clippy --all-targets -- -D warnings`.
#
#
# WHAT THIS FILE CAN AND CANNOT DO — READ THIS FIRST
# ==================================================
# `clippy.toml` CONFIGURES lints. It cannot ENABLE or DISABLE them. There is no
# `warn = [..]`, `deny = [..]`, or `allow = [..]` key, and clippy rejects any
# such key outright rather than ignoring it (see THE VOCABULARY IS VERSIONED
# below). Lint LEVELS live in exactly two places in this project:
#
#   * the crate-root inner attributes in `src/lib.rs` — `#![warn(missing_docs)]`,
#     `#![warn(clippy::undocumented_unsafe_blocks)]`, and
#     `#![deny(unsafe_code)]`; and
#   * the `-D warnings` on the command line, which promotes each of those
#     warnings to a hard error in CI.
#
# Two consequences follow, and they are the whole reason this section is first.
#
# NOTHING IN THIS FILE CAN WEAKEN `clippy::undocumented_unsafe_blocks`, and it is
# worth being exact about how far that lint reaches. It is declared as a
# crate-root inner attribute in `src/lib.rs`, so it governs the `zlib-rs` library
# crate only, and `#![cfg_attr(test, allow(clippy::undocumented_unsafe_blocks))]`
# on the next line relaxes it to `allow` under `cfg(test)`, so it applies to the
# shipped `rlib`/`cdylib`/`staticlib` rather than to the inline `#[cfg(test)]`
# unit tests. It does not reach the separate crates compiled from `tests/**` and
# `benches/**`, nor the detached `fuzz/` workspace: each is its own crate and
# would need its own attribute. Within the reach it does have, it is what keeps a
# `// SAFETY:` comment mandatory on every executable `unsafe` block.
#
# The containment boundary it assists is enforced primarily by
# `#![deny(unsafe_code)]` and its two narrowly scoped `#[allow(unsafe_code)]`
# carve-outs — `mod no_std_support` (the private freestanding-runtime block) and
# `pub mod ffi` (the C ABI boundary). Executable `unsafe` — an `unsafe` block,
# `unsafe fn`, or `unsafe impl` — therefore exists only in `src/ffi/**` and in
# that crate-root runtime block. `src/stream.rs` is the one file where the
# distinction matters when reading a token count: it names two `unsafe extern
# "C" fn` TYPE ALIASES for the C `zalloc`/`zfree` hook pointers, which is a
# declaration rather than an operation, and it contains no `unsafe` block at all.
# `src/deflate/**`, `src/inflate/**`, `src/checksum/**`, `src/gz/**`,
# `src/util/**`, `src/error.rs`, `src/constants.rs`, and `src/gz_header.rs`
# contain neither form. That boundary is architectural, so the correct response
# to a finding on it is always to RESTRUCTURE, never to configure a lint away.
#
# NOTHING IN THIS FILE CAN WEAKEN `missing_docs` either. Both properties hold
# because clippy simply offers no key that could, and this file must never
# acquire one if a future release does.
#
#
# THE GOVERNING RULE — READ BEFORE ADDING ANYTHING
# ================================================
# A key belongs here only if BOTH of these hold:
#
#   1. you can name the specific lint it configures, AND
#   2. the gate has been OBSERVED — not assumed — to exit 0 with the key
#      present, on every clippy that reads this file.
#
# A key must NEVER be added to make a diagnostic go away. Raising a threshold to
# silence a finding is the same defect as sprinkling `#[allow(..)]` over it,
# only worse: the finding is still there, it is now invisible, and the
# suppression silently covers every FUTURE occurrence too. When clippy is right,
# fix the code. When clippy is wrong about one specific site, put a narrowly
# scoped `#[expect(..)]` or `#[allow(..)]` WITH A REASON at that site, where a
# reviewer can see it — not a project-wide threshold here.
#
# That rule is why this file is one key long: there is no threshold to tune and
# no exception to carve, so anything more would be speculation dressed up as
# policy.
#
#
# AN UNRECOGNISED KEY IS FATAL, AND THE VOCABULARY IS VERSIONED
# ============================================================
# clippy does not ignore a key it fails to recognise — it ABORTS, and it does the
# same for a recognised key given the wrong type:
#
#     error: error reading Clippy's configuration file: unknown field `<key>`,
#            expected one of ...
#
# One stale or misspelled key therefore breaks `cargo clippy` for everyone, the
# CI `lint` job included. The recognised-key vocabulary also changes between
# releases, gaining entries and occasionally retiring deprecated aliases, and
# three different clippy releases read this one file: the floor pinned by
# `rust-toolchain.toml`, current stable (which the CI `lint` job gates on), and
# the nightly `cargo-fuzz` needs — `rustup` discovery walks up from `fuzz/`, so
# this file governs that detached workspace too. Only keys every one of them
# accepts may appear here, and the way to find out what a given release accepts
# is to ask it: hand it a deliberately bogus key and read the "expected one of"
# list in the error.
#
#
# MAINTENANCE RULES
# =================
# * KEEP THIS FILE PACKAGED. `Cargo.toml`'s `exclude` list must never grow an
#   entry that matches `clippy.toml`. The lint contract ships inside the crate,
#   exactly like `rustfmt.toml`, `rust-toolchain.toml`, and `deny.toml`.
# * NEVER ADD A KEY WITHOUT RUNNING THE GATE ON EVERY CLIPPY THAT READS THIS
#   FILE — the pinned floor, current stable, and nightly — and read stderr as
#   well as the exit code, because a configuration error aborts the invocation.
# * `avoid-breaking-exported-api` STAYS OMITTED, at its `true` default. Setting
#   it `false` makes clippy suggest changes to the public API, and this crate's
#   public API is a frozen C ABI: the `zlib.map` `global:` symbols, the
#   `#[repr(C)]` `z_stream_s` and `gz_header_s` layouts, the `gzFile_s
#   { have, next, pos }` prefix that C's `gzgetc` *macro* dereferences, and the
#   five versioned `*Init*_` entry points. Each is a compatibility obligation, so
#   a suggestion to "improve" one is drop-in-breaking at worst and noise at best.
# * `check-private-items` STAYS OMITTED: setting it `true` extends
#   `clippy::missing_safety_doc` and `missing_panics_doc` to private items, which
#   ADDS findings. This file must never be the thing that turns a green gate red.
# * DO NOT ADD LINT LEVELS HERE, in any spelling. Crate-wide levels belong in
#   `src/lib.rs`, next to the prose that justifies them; a one-site exception
#   belongs in a scoped `#[allow(..)]`/`#[expect(..)]` with a reason at that
#   site.
# * THIS FILE IS NOT A PLACE TO WORK AROUND A FINDING IN `src/**`. The fix for a
#   clippy finding is in the code it points at.


# ---------------------------------------------------------------------------
# THE ONE KEY: MSRV
# ---------------------------------------------------------------------------

# The Minimum Supported Rust Version clippy reasons about — the load-bearing
# entry, and the reason this file exists at all.
#
# WHAT IT BUYS. With an MSRV known, clippy stops suggesting APIs newer than it,
# and `clippy::incompatible_msrv` flags any that are already in the code.
# Without one, a contributor on current stable gets suggestions that look
# correct, apply cleanly, and pass their local build — and then fail the CI
# `msrv` job on a compiler they never ran. Pinning the value here is what makes
# the declared MSRV a property the linter enforces rather than an assertion.
#
# WHY IT IS NOT REDUNDANT WITH `Cargo.toml`. Clippy honours `rust-version` from
# `Cargo.toml` only because CARGO forwards it (as `CARGO_PKG_RUST_VERSION`) to
# the compiler process it spawns. Any clippy invocation that does not go through
# cargo therefore has NO MSRV at all: an editor or language-server "check on
# save" wired straight to `clippy-driver`, a pre-commit hook, a one-off
# `clippy-driver src/deflate/slow.rs`. This key is the only MSRV declaration that
# survives a cargo-less invocation.
#
# THE VALUE MUST EQUAL `Cargo.toml`'s `rust-version`. This key OVERRIDES
# `rust-version` when both are present, so a mismatch silently lints against a
# version the crate does not claim to support. clippy reports the disagreement —
#
#     warning: the MSRV in `clippy.toml` and `Cargo.toml` differ;
#              using `<this file's value>` from `clippy.toml`
#
# — but that is a configuration-reader warning, not a rustc lint, so `-D warnings`
# does not promote it to an error. Keeping the two in step is therefore a human
# obligation that CI will not catch.
#
# Kept byte-identical to `Cargo.toml`'s `rust-version` and to
# `rust-toolchain.toml`'s `channel`. Raising the MSRV is a FOUR-place change in
# ONE commit: `rust-version` in `Cargo.toml`, `channel` in
# `rust-toolchain.toml`, the `RUSTUP_TOOLCHAIN` / `@<ref>` / `+<ref>` pins in
# the CI `msrv` job, and this key. They are the same fact stated four times; if
# they drift, three of them are lying.
#
# 1.85.0 specifically because the pairing is forced: `Cargo.toml` declares
# `edition = "2024"`, and 1.85.0 is the release in which edition 2024 became
# available, making it the tightest self-consistent MSRV this crate can declare.
# The full three-component form is used so a mechanical diff against the other
# three declarations is possible.
msrv = "1.85.0"
