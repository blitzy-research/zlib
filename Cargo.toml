# Cargo manifest for `zlib-rs` — a memory-safe, idiomatic Rust rewrite of the
# zlib compression library (`1.3.2.1-motley`) with a C-compatible FFI drop-in
# layer.
#
# This manifest REPLACES the C project's CMake/autotools build. `CMakeLists.txt`
# declared `project(zlib LANGUAGES C VERSION 1.3.2.1)`, built the `zlib` SHARED
# and `zlibstatic` STATIC targets, and linked them with the `zlib.map` version
# script. The crate below emits a Rust library plus `cdylib`/`staticlib`
# artifacts so it can serve both Rust consumers and C consumers requiring a
# drop-in shared or static object.
#
# This file is the single source of truth for the crate identity that
# `src/lib.rs`, every `tests/*.rs`, and every `benches/*.rs` depend on: the
# `[lib] name`, the `crate-type` triple, and the feature-flag names are all
# contractual and must not drift.

[package]
name = "zlib-rs"
# Cargo requires SemVer (MAJOR.MINOR.PATCH). Upstream zlib reports the
# 4-component string `"1.3.2.1-motley"`, which is NOT valid SemVer, so the
# package version is tracked as `1.3.2` here. The C-API `zlibVersion()` shim
# (see `src/util/version.rs`) still returns the full `"1.3.2.1-motley"` string;
# this manifest field is deliberately separate from that runtime version.
version = "1.3.2"
edition = "2024"
# MSRV — Rust 1.85.0 is the release that stabilized the 2024 edition.
rust-version = "1.85.0"
# SPDX identifier for the zlib/libpng license carried forward in `LICENSE`.
license = "Zlib"
description = "A memory-safe, idiomatic Rust rewrite of the zlib 1.3.2.1 compression library with a C-compatible FFI drop-in layer"
readme = "README.md"
repository = "https://github.com/Blitzy-Sandbox/blitzy-zlib"
homepage = "https://zlib.net/"
# Original zlib authorship carried forward, plus the Blitzy C→Rust migration.
authors = [
    "Jean-loup Gailly",
    "Mark Adler",
    "Blitzy <agent@blitzy.com>",
]
# `keywords` is capped at 5 entries by crates.io.
keywords = ["zlib", "deflate", "gzip", "compression", "codec"]
categories = ["compression", "no-std", "encoding", "api-bindings"]
# Explicitly declare the build script (Cargo also auto-detects `build.rs`).
# `build.rs` regenerates the CRC-32 lookup tables into `OUT_DIR` at build time,
# replacing the checked-in `crc32.h` tables from the C baseline.
build = "build.rs"
# The C baseline co-exists in this repository during the migration but must not
# ship inside the published crate. Keep the C sources/headers, the contributed
# subtrees, the legacy platform directories, the C build/packaging files, the
# upstream C documentation, and the migration engagement material out of the
# packaged `.crate`. (`exclude` only affects `cargo package`/`publish`; it never
# affects `cargo build`/`test`/`bench` in the workspace, so the retained C tree
# stays fully available in-repository as the cross-validation oracle.)
#
# GLOB SUBTLETY — do NOT "simplify" the suffix patterns below. Cargo matches
# `exclude` entries with gitignore semantics, so a `*.<suffix>` pattern matches
# only that exact trailing suffix: `*.in` catches `zlib.pc.in`, `zconf.h.in`,
# `zlibConfig.cmake.in`, and `Makefile.in`, but it does NOT catch
# `zlib.pc.cmakein`, because `.cmakein` is a different suffix. That is why
# `*.cmakein` is listed separately. A bare name such as `README` matches a path
# component at any depth, which is why `README.md` (the `readme = ` target) is
# unaffected by it.
#
# ACCEPTANCE GATE for this list: `cargo package --list`. Run it after ANY edit
# here and confirm (a) no `*.c`/`*.h`/`*.map`/`*.in`/`*.cmakein`, no upstream C
# docs, and no engagement material appear, and (b) `src/`, `tests/`, `benches/`,
# `build.rs`, `README.md`, `LICENSE`, `Cargo.toml`, and `Cargo.lock` all still
# do. That check is what keeps this list from silently regressing.
#
# NEVER add to this list — these ARE the crate: `src/**`, `tests/**`,
# `benches/**`, `build.rs`, `Cargo.toml`, `Cargo.lock`, `README.md`, `LICENSE`,
# `deny.toml`, `clippy.toml`, `rustfmt.toml`, `rust-toolchain.toml`.
#
# The same prohibition applies in advance to three artifacts the migration plan
# calls for that DO NOT EXIST in this tree yet: `CHANGELOG.md` (AAP gap D5), and
# `SECURITY.md` and `CONTRIBUTING.md` (gap D6). They are named here so that
# whoever writes them does not have to rediscover the rule: each belongs in the
# published crate, so none of them may ever be added below. Note especially that
# the `test/**`
# entry below is the *C driver* directory (`test/example.c`, `test/infcover.c`,
# `test/minigzip.c`) and is a DIFFERENT path from the Rust integration suite
# `tests/**`, which must remain packaged. Do not conflate the two.
exclude = [
    "*.c",
    "*.h",
    "*.in",
    "*.map",
    "*.pc.in",
    # `*.in` does not match a `.cmakein` suffix — see the GLOB SUBTLETY note
    # above. Without this entry `zlib.pc.cmakein` ships in the `.crate`.
    "*.cmakein",
    "contrib/**",
    "examples/**",
    "test/**",
    "amiga/**",
    "msdos/**",
    "os400/**",
    "qnx/**",
    "watcom/**",
    "win32/**",
    "CMakeLists.txt",
    "Makefile",
    "Makefile.in",
    "configure",
    "make_vms.com",
    "treebuild.xml",
    "BUILD.bazel",
    "MODULE.bazel",
    # CMake's own formatter config — tooling for the retained C build only.
    ".cmake-format.yaml",
    # Upstream C documentation. `README.md` — this crate's `readme = ` target —
    # is deliberately NOT in this group: the bare `README` and `ChangeLog` names
    # below are the *upstream C* files, and a bare name matches a path component
    # without matching a `.md` suffix. The Rust-facing `CHANGELOG.md` that would
    # supersede `ChangeLog` for crate consumers does not exist yet (AAP gap D5);
    # when it is written it must stay out of this group as well.
    "ChangeLog",
    "FAQ",
    "INDEX",
    "README",
    "README-cmake.md",
    "zlib.3",
    "zlib.3.pdf",
    # Normative wire-format references and the heavy binary CRC monograph. These
    # are indispensable in-repository (they are the RFC 1950/1951/1952 sources
    # this port is verified against) but are dead weight in a published crate:
    # no Rust source, test, bench, doctest, or `include_str!`/`include_bytes!`
    # site reads any of them, and `mkdocs.yml` builds only `doc/index.md`,
    # `doc/project-guide.md`, and `doc/technical-specifications.md` — all three
    # of which stay packaged. Excluding this group alone removes ~873 KB,
    # dominated by `doc/crc-doc.1.0.pdf`.
    "doc/algorithm.txt",
    "doc/crc-doc.1.0.pdf",
    "doc/rfc1950.txt",
    "doc/rfc1951.txt",
    "doc/rfc1952.txt",
    "doc/txtvsbin.txt",
    # Migration engagement documentation and presentation assets — process
    # artifacts, not product, and never of use to a crate consumer.
    "blitzy/**",
    "blitzy-deck/**",
]

[lib]
# `zlib_rs` (hyphen → underscore) is the importable crate name and the linked
# artifact stem (`libzlib_rs.{so,a}`). The integration tests and benches import
# as `use zlib_rs::...;`, so this MUST remain `zlib_rs`.
name = "zlib_rs"
# `lib` (rlib) serves Rust consumers; `cdylib` + `staticlib` satisfy the C
# drop-in requirement, mirroring the CMake SHARED + STATIC targets.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Ergonomic multi-branch conditional compilation — replaces the C `#if`/`#ifdef`
# preprocessor nests. Pure Rust; adds no C dependency.
cfg-if = "1.0.4"
# SIMD-accelerated CRC-32 backing the `checksum::crc32` hot path. `optional` so
# it is pulled in only by the `simd` feature; `default-features = false` keeps
# it `no_std`-compatible when the crate's own `std` feature is disabled.
#
# `default-features = false` is NOT the whole story, and getting the rest of it
# wrong silently DE-optimizes the shipped library. `crc32fast`'s only default
# feature is its own `std`, and that feature is what chooses between two
# different bodies of `specialized::…::State::new`:
#
#   * with    `crc32fast/std` -> `is_x86_feature_detected!("pclmulqdq"/"sse2"/
#     "sse4.1")` (or `is_aarch64_feature_detected!("crc")`), a RUN-TIME probe;
#   * without `crc32fast/std` -> `cfg!(target_feature = …)`, a COMPILE-TIME test
#     that is false on a stock `x86_64-unknown-linux-gnu` build (only `sse2` is
#     baseline there), so `State::new` returns `None`, the carry-less-multiply
#     code is compiled but NEVER selected, and execution silently falls back to
#     `crc32fast`'s software table — which is measurably SLOWER than this
#     crate's own braided scalar path.
#
# So the dependency must stay `default-features = false` (for `no_std`) while the
# crate's OWN `std` feature re-enables `crc32fast/std`; that is what the weak
# `crc32fast?/std` entry under `[features] std` below does. Without it, enabling
# the default-on `simd` feature makes CRC-32 slower than omitting it, and
# `cargo bench`/`cargo test` hide the defect because the `flate2`
# dev-dependency pulls in `crc32fast/default` and Cargo feature unification then
# turns `crc32fast/std` on for those builds only.
crc32fast = { version = "1.5.0", optional = true, default-features = false }

[dev-dependencies]
# Statistical benchmarking harness driving `benches/*.rs`.
criterion = "0.5.1"
# Reference DEFLATE implementation for interop / round-trip cross-checks. Its
# DEFAULT features select the pure-Rust `miniz_oxide` backend, so the test suite
# requires NO C toolchain; the `zlib`/`zlib-ng` C backends are intentionally
# left disabled.
flate2 = "1.1.9"
# Property-based round-trip testing.
quickcheck = "1.1.0"
# Randomized test-data generation. Pinned to >= 0.9.4 to stay above the patched
# range for RustSec advisory RUSTSEC-2026-0097 (a dev-dependency-only advisory).
rand = "0.9.4"

[features]
# The default build is a full, std-backed zlib replacement: gzip framing, the
# gzip file-I/O layer, and the SIMD CRC-32 hot path.
default = ["std", "gzip", "gz-io", "simd"]
# Standard-library build: enables `std::io`/`std::fs` for the gz layer and the
# `catch_unwind` panic guards at the FFI boundary. When this feature is OFF the
# crate is `#![no_std]` + `alloc` (built via `--no-default-features`).
#
# It also forwards to `crc32fast/std` — through the WEAK `?` form, which is
# load-bearing in both directions:
#
#   * `crc32fast?/std` enables that feature only if some OTHER entry has already
#     pulled the optional dependency in (i.e. `simd`). It never pulls
#     `crc32fast` into the graph itself, so `--no-default-features --features
#     std` keeps the runtime closure at `cfg-if` alone, exactly as before.
#   * Enabling it is what gives the SHIPPED library `crc32fast`'s run-time CPU
#     probe instead of a compile-time `cfg!(target_feature = …)` test that is
#     false on a stock x86_64 target. Without this forward, `cargo build
#     --release` (the artifact consumers link) silently used `crc32fast`'s
#     software table — slower than this crate's own braided scalar path — while
#     `cargo bench`/`cargo test` measured the accelerated path, because their
#     dev-dependency graph (`flate2` -> `crc32fast/default`) unified the feature
#     on. That divergence is now closed: the effective `crc32fast`
#     configuration is identical in the bench, test, and release builds.
#
# A `no_std` build (`--no-default-features [--features simd]`) still gets
# `crc32fast` WITHOUT its `std` feature, which is the only configuration in
# which it can be linked freestanding; `src/checksum/crc32.rs` detects that the
# accelerated path is unreachable there and keeps its own braid, so the `simd`
# feature can never be slower than omitting it. Features are resolution inputs
# only, so this line cannot alter either lockfile.
std = ["crc32fast?/std"]
# gzip framing within deflate/inflate (maps the C `#ifdef GZIP`).
gzip = []
# gzip file-I/O layer (the `gz*` API; maps the C `#ifndef NO_GZCOMPRESS`).
# Fundamentally needs the filesystem, so it implies `std`; it also implies
# `gzip` since it emits and consumes gzip streams.
gz-io = ["std", "gzip"]
# Bare-metal / core-only mode: compression, decompression, and checksums with no
# gz file I/O (maps the C `Z_SOLO`). Built via `--no-default-features`
# (optionally `--features no-std`). The library's actual `no_std` switch is
# `#![cfg_attr(all(not(feature = "std"), not(test), panic = "abort"), no_std)]`
# in `src/lib.rs`: the crate is genuinely `#![no_std]` for the shipped artifact
# (`cargo build --no-default-features`, which the profiles compile with
# `panic = "abort"`), while `cargo test --no-default-features` keeps `std`
# linked so the libtest harness builds — yet still exercises every
# `not(feature = "std")` code path because the `std` feature gates stay off.
# The full test suite therefore compiles and PASSES under
# `cargo test --no-default-features [--features no-std]`; this flag remains a
# convenience marker documenting intent for a core-only build.
no-std = []
# SIMD-accelerated CRC-32 hot path via the optional `crc32fast` dependency.
#
# Deliberately just `dep:crc32fast`, NOT `["dep:crc32fast", "crc32fast/std"]`:
# spelling the `std` forward here would force `crc32fast`'s `std` feature on in a
# `--no-default-features --features simd` build, i.e. break the freestanding
# build this crate supports. The forward therefore lives on the crate's own `std`
# feature above (as the weak `crc32fast?/std`), which is exactly the
# "gate it as `std` + `simd`" shape: the run-time CPU probe appears precisely
# when both features are active, and `src/checksum/crc32.rs` falls back to its
# braided scalar path whenever the probe is unavailable or negative.
simd = ["dep:crc32fast"]
#
# `inflate_strict` below is an intentional, documented opt-in extra beyond the
# AAP core set (`std`/`gzip`/`gz-io`/`no-std`/`simd`). It defaults to OFF and is
# fully stable-buildable, so `cargo build --all-features` succeeds on the stable
# toolchain (and thus on the pinned MSRV). It is mirrored in the README feature
# table.
#
# The `gzprintf`/`gzvprintf` FFI symbols are always exported for ABI
# completeness, but — because rendering a C `va_list` requires the unstable
# nightly-only `c_variadic` language feature, which would break the crate's
# stable build and its MSRV contract — they are shipped as ABI-compatible
# `Z_STREAM_ERROR` stubs, exactly matching a zlib built without a secure
# `vsnprintf` (`zlibCompileFlags` bit 27 set). There is therefore no
# `c-variadic` cargo feature.
#
# Optional stricter inflate distance validation (maps the C `INFLATE_STRICT`
# compile-time switch). OFF by default so the default build stays byte-exact
# with reference zlib; enable only to reject out-of-window distances early.
# Referenced by `src/inflate/fast.rs`.
inflate_strict = []
#
# Opt-in live C-oracle conformance harness (`tests/c_oracle.rs`), which makes the
# full byte-identity sweep against a locally built reference C zlib reproducible
# inside this repository instead of only in an ad-hoc environment.
#
# It expands to `[]` DELIBERATELY: it adds NO dependency of any kind, so
# `Cargo.lock` and `cargo metadata` are completely unaffected by it and the
# crate keeps its defining "the test suite requires no C toolchain" property.
# The feature's only effect is to unlock the `[[test]]` target declared further
# down, which shells out to whatever system C compiler is present via
# `std::process::Command` — never through the `cc` crate. There is deliberately
# no `cc`/`bindgen`/`pkg-config` dependency, no `[build-dependencies]` table,
# and no `links =` key anywhere in this manifest: `build.rs` is pure `std` with
# no external crates, and that property is load-bearing.
#
# This harness is strictly ADDITIVE. Tier 1 of `tests/interop.rs` — byte-identity
# against deterministic vectors baked from the genuine C encoder — remains the
# always-on, toolchain-free release gate and is never replaced or weakened by
# this feature.
#
# CONTRACT the harness itself must honour (do NOT "simplify" this away): the
# `build-test` matrix in `.github/workflows/ci.yml` includes an `--all-features`
# row, and `--all-features` enables `c-oracle`. The harness must therefore probe
# for a usable C compiler at RUN TIME and, when none is available, print a
# capability notice and PASS. It must not fail, and it must not be `#[ignore]`d —
# the suite's ignored-test count is zero and stays zero.
c-oracle = []

# Three criterion benchmarks. Each disables the built-in libtest harness so that
# criterion supplies its own `main` via `criterion_main!` (AAP §0.3.1 / §0.4.1).
[[bench]]
name = "deflate_bench"
harness = false

[[bench]]
name = "inflate_bench"
harness = false

[[bench]]
name = "checksum_bench"
harness = false

# The live C-oracle conformance harness is declared explicitly ONLY so that
# `required-features` can gate it: without this block Cargo would auto-discover
# `tests/c_oracle.rs` and compile it on every plain `cargo test`, which would
# drag a C-toolchain requirement into the default suite. With the block, the
# target is not even compiled unless `--features c-oracle` (or `--all-features`)
# is passed, so the default `cargo test` run stays C-toolchain-free and the
# `c_oracle` binary never appears in it.
#
# `autotests` is intentionally left at its default (`true`, for edition 2024), so
# the other six integration tests — `checksum`, `gzip_compat`, `inflate_coverage`,
# `interop`, `regression`, `round_trip` — continue to be auto-discovered from
# `tests/`. An explicit `[[test]]` whose `name` matches an auto-discovered target
# simply overrides that target's settings rather than suppressing discovery of
# its siblings, which is exactly the behaviour relied on here.
#
# `path` is REQUIRED to exist, and that is not a formality: with `tests/c_oracle.rs`
# absent, `cargo check --all-targets --all-features` and `cargo test --all-features`
# both abort with "can't find integration-test `c_oracle` at path
# …/tests/c_oracle.rs" — which is the `--all-features` row of the `build-test`
# matrix. So this declaration and that file are a single unit: neither may be
# removed without the other. This manifest owns only the target's gating; the
# harness body documents its own contracts.
[[test]]
name = "c_oracle"
path = "tests/c_oracle.rs"
required-features = ["c-oracle"]

[profile.release]
opt-level = 3
# `codegen-units = 1` is the whole-crate optimization this crate can actually
# have, and it is deliberately NOT accompanied by an `lto` key.
#
# NO `lto` KEY - DO NOT ADD ONE. `[lib] crate-type` above emits `lib` (rlib)
# alongside `cdylib` and `staticlib`, and Cargo builds all three from ONE rustc
# invocation. rustc cannot run LTO for a unit that also emits an rlib, so Cargo
# silently DROPS any LTO-enabling value rather than reporting it. Measured on
# this tree by reading the `--crate-name zlib_rs` command line out of
# `cargo build --release --verbose` while overriding the profile through
# `CARGO_PROFILE_RELEASE_LTO`:
#
#     lto = true / "fat" / "thin" / false  ->  no `-C lto` flag at all
#     lto = "off"                          ->  `-C lto=off`
#
# i.e. only the DISABLING value is ever forwarded. `lto = true` therefore read as
# a request that never happened, and no job noticed - a declared optimization
# that silently does nothing is worse than an honest absence, because it invites
# performance reasoning from a flag that is not there. A control crate with
# `crate-type = ["cdylib", "staticlib"]` (no rlib) and the same setting DOES
# receive `-C lto`, which isolates the cause to the rlib in the triple.
#
# Dropping `lib` to buy LTO back is not available: the three-artifact triple is a
# requirement of the migration (Rust consumers need the rlib; the C drop-in needs
# the other two), and `benches/`, `tests/` and every Rust consumer link the rlib.
# The flags that DO reach rustc here are `-C opt-level=3`, `-C codegen-units=1`
# and `-C panic=abort`, all three verified present on that same command line.
#
# `src/lib.rs`'s `the_release_profile_declares_no_inert_lto_setting` fails the
# build if an `lto` key reappears while `lib` is still in the crate-type list, so
# this cannot silently drift back.
codegen-units = 1
# `panic = "abort"` is REQUIRED (not merely preferred): a `--no-default-features`
# (`no_std`) build emits the `cdylib`/`staticlib` without an unwinding runtime,
# and on a STABLE toolchain the compiler then rejects unwinding panics with
# "unwinding panics are not supported without std". `panic = "abort"` is the only
# stable mechanism that suppresses that requirement (there is no `#![panic_abort]`
# attribute and `eh_personality` is nightly-only), and Cargo cannot scope the
# panic strategy to a single feature or crate-type — so it MUST be set globally,
# here and in `[profile.dev]`, for BOTH the std and no_std builds.
#
# This does NOT weaken the FFI safety contract. The invariant is "a Rust panic
# must never unwind across the C ABI" (unwinding across it is UB); `panic =
# "abort"` upholds that invariant directly. The `catch_unwind` guards in
# `src/ffi/` remain in place (gated on `feature = "std"`) as defense-in-depth,
# and Cargo forces the `unwind` strategy for the `cargo test`/`bench` harness
# regardless of this setting, so those guard tests still exercise `catch_unwind`
# and pass. For every non-panicking call — the entire functional surface —
# behavior is identical; only a genuine internal "cannot happen" panic now
# aborts the process (a sound, non-UB outcome) instead of being caught and
# converted to a `Z_*` error code.
panic = "abort"

[profile.dev]
# The panic strategy MUST match `[profile.release]`. The reproduction command
# for the `no_std` build, `cargo build --no-default-features`, uses THIS profile,
# and its `cdylib`/`staticlib` link step requires `panic = "abort"` on stable
# (see the detailed rationale in `[profile.release]` above). Setting it here
# keeps debug and release builds consistent for both the std and no_std targets.
panic = "abort"
