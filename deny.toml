# cargo-deny supply-chain policy for `zlib-rs`
# =============================================================================
#
# PURPOSE
# -------
# This file is the machine-enforced supply-chain policy for the C -> Rust
# migration of zlib 1.3.2.1-motley. It closes AAP gap D1 ("no `cargo-deny`
# policy exists for licenses, advisories, bans, or sources across the 89 + 13 =
# 102-package closure"), which the plan's authoritative gap register ranks
# HIGH severity -- joint-highest alongside D2, the `cargo-audit` CI job.
#
# It governs four independent questions, one per `cargo deny check` subcommand:
#
#   licenses    -- may we legally ship what we depend on?
#   advisories  -- does anything we depend on have a known security problem?
#   bans        -- are the crate-level architectural boundaries still intact?
#   sources     -- did every crate come from a registry we trust?
#
# CONSUMERS
# ---------
#   * `.github/workflows/audit.yml` (AAP gap D2) runs `cargo deny check all`
#     in CI. That workflow is the blocking gate; this file is its rulebook.
#   * Locally: `cargo deny check all`. See `CONTRIBUTING.md` for the full list
#     of quality gates and how to run them.
#   * To report a vulnerability in THIS crate rather than in a dependency, see
#     `SECURITY.md` -- do not open a public issue.
#
# GOVERNANCE NOTE
# ---------------
# No user-specified rules were provided for this project (`review_rules`
# returns exactly "No user rules provided."). Enterprise-standard best
# practice therefore governs, and the absence of rules is NOT a licence to
# lower the bar. Where the comments below cite a "plan-adopted standard"
# (S1 evidence over assertion, S6 supply-chain hygiene, S10 gates stay green),
# those are the Agent Action Plan's OWN engineering commitments, not
# user-supplied rules, and must never be represented as such.
#
# SCHEMA VERSION
# --------------
# Authored and verified against **cargo-deny 0.20.2**. That version matters:
# `[advisories] vulnerability`, `notice`, and `severity-threshold` have been
# REMOVED (using them is a hard `error[deprecated]`), `unsound` and
# `unmaintained` are now *scope* enums rather than lint levels, and the old
# `[licenses] unlicensed` / `copyleft` / `allow-osi-fsf-free` / `default` /
# `deny` generation is gone. Every key and value in this file was probed
# against 0.20.2 and accepted with zero schema errors and zero deprecation
# diagnostics. If you upgrade cargo-deny, re-run `cargo deny check all` and
# read stderr -- do not assume this file still parses cleanly.
#
# WHAT THE GRAPH ACTUALLY LOOKS LIKE (measured, not assumed)
# ----------------------------------------------------------
# Plan-adopted standard S1 requires evidence over assertion, and S6 requires
# this policy be "authored against the *actual* graph". Everything below was
# measured in this repository rather than recalled:
#
#   * Root `Cargo.lock` pins exactly **89** packages. Every one carries
#     `source = "registry+https://github.com/rust-lang/crates.io-index"`
#     except the single no-source self-entry `zlib-rs 1.3.2`.
#   * `fuzz/Cargo.lock` pins **13** more (total governed closure: 102).
#   * The RUNTIME closure is just two crates: `cfg-if 1.0.4` (required) and
#     `crc32fast 1.5.0` (optional, behind the `simd` feature, with
#     `default-features = false`). Everything else -- 86 of the 89 -- is
#     dev-only, reached through `criterion 0.5.1`, `flate2 1.1.9`,
#     `quickcheck 1.1.0`, and `rand 0.9.4`.
#   * `flate2` uses its default pure-Rust `miniz_oxide` backend, so the test
#     suite requires no C toolchain. Its `zlib` / `zlib-ng` C backends stay
#     disabled -- see the `libz-sys` bans below, which enforce that
#     mechanically rather than by convention.
#
# That 86-of-89 dev-only ratio is the single most important fact about this
# file. cargo-deny EXCLUDES dev-dependencies by default from both the license
# check and duplicate-version detection, so a policy that does not explicitly
# opt them in is very nearly a no-op here. Two measurements make the point:
#
#   * With `[licenses] include-dev` at its default, `cargo deny list` reports
#     3 crates and the license check examines only those 3. With it set,
#     `cargo deny check licenses` reports 89 notes -- one per package.
#   * With `[bans] multiple-versions-include-dev` at its default, even
#     `multiple-versions = "deny"` reports `bans ok`, because all four duplicate
#     majors in this graph are dev-only and therefore invisible.
#
# Do not remove either setting. Without them this file looks like governance
# while enforcing almost nothing.

# -----------------------------------------------------------------------------
# [graph] -- which crates the checks are performed against
# -----------------------------------------------------------------------------
[graph]
# `targets = []` means "do not prune by platform": with zero triples specified,
# cargo-deny evaluates every target, so no target-gated crate can escape
# review. This is DELIBERATE and was chosen over an explicit triple list after
# measuring the consequence of pruning.
#
# The plan's CI matrix expansion (gap D3) plus its bare-metal `no_std` row
# (gap D10) name five platforms, and all five were verified to be triples
# cargo-deny recognises (a bogus triple emits `warning: unknown target ...
# specified`; these five emit nothing):
#
#     x86_64-unknown-linux-gnu      aarch64-unknown-linux-gnu
#     x86_64-pc-windows-msvc        aarch64-apple-darwin
#     thumbv7em-none-eabihf         (bare-metal, exercises the private
#                                    libc-backed allocator in src/lib.rs)
#
# But restricting `targets` to exactly those five PRUNES `r-efi` 5.3.0 and
# 6.0.0 out of the graph -- they are reachable only under `target_os = "uefi"`,
# via `getrandom`. The measured effect was a `warning[unmatched-skip]` plus two
# of the 89 packages silently un-governed, and those two happen to carry the
# only `LGPL-2.1-or-later` disjunct in the whole closure. A supply-chain policy
# that cannot see the one potentially-copyleft expression in the graph is
# worthless, so the unpruned graph wins.
#
# The empty list is a strict SUPERSET of the five triples above, so platform
# coverage is not weakened. Verifying that the crate actually BUILDS and PASSES
# on those five platforms is `.github/workflows/ci.yml`'s job, not this file's.
targets = []
# Collect metadata with `--all-features` so no feature-gated dependency hides
# from the policy. This currently reaches the `simd` feature's `crc32fast`, and
# it keeps `gzip`, `gz-io`, `no-std`, `inflate_strict`, and `c-oracle` in view
# as well. (`c-oracle` expands to `[]` and deliberately adds no dependency --
# the live C-oracle harness shells out to the system compiler via
# `std::process::Command`, never through the `cc` crate -- so it contributes
# nothing to this graph. That is exactly the property the `cc` ban protects.)
all-features = true
# `exclude`, `exclude-dev`, and `exclude-unpublished` are intentionally unset.
# Each of them REMOVES crates from the policy's view, which is the opposite of
# what this file exists to do.

# -----------------------------------------------------------------------------
# [output] -- diagnostic rendering only; no policy content
# -----------------------------------------------------------------------------
[output]
# Depth at which feature edges are added to inclusion graphs in diagnostics.
# 1 keeps failure output readable while still showing which feature pulled a
# crate in -- the first question you ask when a check fails.
feature-depth = 1

# -----------------------------------------------------------------------------
# [advisories] -- `cargo deny check advisories`
# -----------------------------------------------------------------------------
#
# THE FINDING THIS SECTION EXISTS TO CLOSE
# ----------------------------------------
# `Cargo.toml` pins `rand = "0.9.4"` specifically to stay above the patched
# range for RustSec advisory RUSTSEC-2026-0097. But the graph contains TWO
# `rand` majors, and only one of them is governed by that declared floor:
#
#     rand 0.9.4   -- the DIRECT dev-dependency of zlib-rs
#     rand 0.10.2  -- TRANSITIVE, pulled in by quickcheck 1.1.0
#
# (`cargo tree -i rand` refuses to run at all -- "specification `rand` is
# ambiguous" -- which is itself proof both are resolved. Measured aside: the
# plan's prose attributes the second major to `criterion 0.5.1`; the actual
# graph shows `criterion` depends on `oorandom 11.1.5` and not on `rand` at
# all. The provenance recorded here is the measured one.)
#
# The transitive 0.10.2 line is bounded by no floor we declare, and that
# asymmetry is exactly the class of drift a cargo-deny / cargo-audit gate
# exists to catch. Plan-adopted standard S6 puts it bluntly: "A policy written
# against a single assumed `rand` version would be wrong on contact." The
# settings below therefore deliberately expose the WHOLE closure -- both `rand`
# lines, and all 86 dev-only packages -- to the advisory database.
#
# Measured status at the time of authoring, against a freshly fetched
# rustsec/advisory-db (1180 advisories): 17 root-lock crates have advisory
# files and EVERY resolved version already sits inside a patched range, so
# `cargo deny check advisories` reports `0 errors, 0 warnings, 0 notes`.
# RUSTSEC-2026-0097 declares
# `patched = [">= 0.10.1", "< 0.10.0, >= 0.9.3", "< 0.9.0, >= 0.8.6"]`;
# `rand 0.9.4` satisfies the middle range and `rand 0.10.2` satisfies the
# first, so BOTH lines are patched and there is nothing to ignore. Two further
# measurements worth knowing:
#
#   * `crossbeam-epoch 0.9.20` is patched EXACTLY at its advisory boundary
#     (RUSTSEC-2026-0204, `patched = [">= 0.9.20"]`). Any downgrade trips it.
#     This is why `Cargo.lock` is committed and why this gate is blocking.
#   * Our package name collides with an unrelated published crate also called
#     `zlib-rs`, which carries RUSTSEC-2024-0401 with `patched = [">= 0.4.0"]`.
#     Our version is `1.3.2`, comfortably above 0.4.0, so it does not match --
#     but do not be surprised to see the name in the advisory database.
[advisories]
# The canonical RustSec database. Pinned explicitly rather than relying on the
# default so the trust root of this check is visible in review (plan-adopted
# standard S7: reproducible, explicitly pinned tooling).
db-urls = ["https://github.com/rustsec/advisory-db"]
# Scope of `informational = "unmaintained"` advisories. `all` = every crate in
# the graph, including transitive dev-dependencies. Anything narrower would
# leave 86 of our 89 packages ungoverned, which for this project is nearly the
# entire graph. Note these are SCOPE values in cargo-deny 0.20
# (`all` / `workspace` / `transitive` / `none`), not lint levels.
unmaintained = "all"
# Scope of `informational = "unsound"` advisories -- likewise `all`. This one is
# load-bearing rather than theoretical: RUSTSEC-2026-0097, the advisory this
# whole section is built around, is classified `informational = "unsound"` and
# reaches us only through transitive dev-dependencies. A narrower scope could
# hide precisely the finding we care about most.
unsound = "all"
# A yanked crate version means the publisher withdrew it, frequently for a
# security or correctness reason, and it will eventually stop resolving.
# `deny` is chosen over the more common `warn` because the graph is verified
# clean today, so this costs nothing now and hard-fails the moment it matters.
yanked = "deny"
# Yank checking must stay on; stated explicitly so a future edit has to argue
# with an existing line rather than silently rely on a default.
disable-yank-checking = false
# Fail if the local advisory database is older than 7 days. Without a staleness
# bound, a fetch that silently fails degrades this check into a check that
# always passes -- the worst possible failure mode for a security gate. CI
# fetches fresh on every run, so this only bites when the network path is
# broken (which is exactly when you want to know). Locally: `cargo deny fetch`.
# If your environment needs proxy-aware or authenticated fetching, set
# `git-fetch-with-cli = true` rather than raising this bound.
maximum-db-staleness = "P7D"
#
# ADVISORY IGNORE LIST -- INTENTIONALLY EMPTY, AND VERIFIED EMPTY.
#
# The graph is genuinely clean (see the measurements above), so nothing needs
# suppressing. In particular there is deliberately NO entry for
# RUSTSEC-2026-0097: both `rand` lines are already above its patched range, so
# an ignore would be a lie about the state of the tree.
#
# Plan-adopted standard S10 -- "no lint is `allow`-ed to make a change land" --
# applies to advisories with full force. If `cargo deny check advisories`
# reports something, the first response is to FIX the graph (raise a floor,
# update the lock under advisory pressure, or drop the dependency), never to
# add an entry here.
#
# If an ignore genuinely becomes unavoidable, every entry MUST use the object
# form and MUST state all three of:
#   1. the advisory ID,
#   2. why it cannot affect this crate (which code path is unreachable, or why
#      the vulnerable API is never called), and
#   3. explicitly whether it is dev-dependency-only -- 86 of 89 packages here
#      are, so this materially changes the risk assessment.
# A bare `"RUSTSEC-XXXX-YYYY"` string with no reason is not acceptable.
# Shape:
#   { id = "RUSTSEC-XXXX-YYYY", reason = "dev-only, reached solely via
#     <crate>; the affected <api> is never called by this crate" },
ignore = []
# A stale ignore entry is a silent hole in the gate: the advisory it references
# may have been withdrawn, re-scoped, or fixed, and nobody would notice. `deny`
# makes an unmatched ignore a hard error, which mechanically enforces the rule
# above. Because `ignore` is empty this can never fire spuriously -- it can
# only fire on an entry somebody deliberately added and then failed to remove.
unused-ignored-advisory = "deny"

# -----------------------------------------------------------------------------
# [licenses] -- `cargo deny check licenses`
# -----------------------------------------------------------------------------
#
# THE ALLOW LIST BELOW WAS DERIVED, NOT GUESSED.
#
# Plan-adopted standard S1 requires evidence over assertion, so the list is the
# output of `cargo deny list` over the real 89-package graph rather than a
# plausible-looking set of permissive identifiers. The complete measured set of
# SPDX identifiers appearing anywhere in the closure is:
#
#   0BSD                            (1)  adler2 2.0.1
#   Apache-2.0                     (73)
#   Apache-2.0 WITH LLVM-exception  (2)  wasip2, wit-bindgen
#   BSD-2-Clause                    (2)  zerocopy, zerocopy-derive
#   LGPL-2.1-or-later               (2)  r-efi 5.3.0, r-efi 6.0.0
#   MIT                            (85)
#   Unicode-3.0                     (1)  unicode-ident 1.0.24
#   Unlicense                       (6)  aho-corasick, memchr, quickcheck,
#                                        same-file, walkdir, winapi-util
#   Zlib                            (2)  miniz_oxide 0.8.9, zlib-rs 1.3.2
#
# Four identifiers suffice to satisfy every expression in that set, so exactly
# four are allowed. Notably ABSENT from the graph -- and therefore deliberately
# absent from the allow list -- are `MIT-0`, `BSD-3-Clause`, `ISC`, and
# `CC0-1.0`. They are the kind of entry a from-memory allow list would have
# included, and including them would have widened the policy past what the
# graph demands for no benefit.
#
# `0BSD`, `BSD-2-Clause`, `Unlicense`, `Apache-2.0 WITH LLVM-exception`, and
# `LGPL-2.1-or-later` are likewise NOT allowed. Every one of them occurs only as
# an alternative inside an `OR` disjunction that also offers `MIT` or
# `Apache-2.0`, so each expression is satisfied by a permissive option we do
# allow, and the un-allowed alternative is simply never selected.
#
# `r-efi` is the case that needs saying out loud, because it is the only place a
# copyleft identifier appears anywhere in the closure. Its expression is
#
#     MIT OR Apache-2.0 OR LGPL-2.1-or-later
#
# which is a DISJUNCTION: satisfying any single option satisfies the whole
# requirement. Because `MIT` and `Apache-2.0` are allowed, the LGPL option is
# never selected and NO copyleft obligation attaches to this crate or to
# anything that links it. This is verified, not assumed -- `cargo deny check
# licenses` passes with `LGPL-2.1-or-later` absent from the allow list.
# Consequently: do NOT add `LGPL-2.1-or-later`, or any other LGPL/GPL/AGPL
# variant, to the list below. There is no expression in this graph that needs
# it, and adding one would grant a copyleft obligation nobody reviewed.
# (`r-efi` is reachable only under `target_os = "uefi"`; see the `[graph]`
# comment for why the graph is left unpruned so it stays visible at all.)
[licenses]
# CRITICAL -- do not remove either of the next two settings.
#
# cargo-deny 0.20 EXCLUDES dev-dependencies from the license check by default.
# Measured on this repository: with `include-dev` unset, `cargo deny list`
# reports 3 crates (cfg-if, crc32fast, zlib-rs) and the check passes while 86 of
# 89 packages -- the entire benchmark, oracle, and property-testing graph -- go
# completely unexamined. With it set, `cargo deny check licenses` reports 89
# notes: one per package, which is what "a policy over the 102-package closure"
# has to mean.
include-dev = true
# Build-dependencies too. This is future-proofing rather than current coverage:
# the crate has NO `[build-dependencies]` table at all, by design -- `build.rs`
# is pure `std` with no external crates, and that property is load-bearing. If
# anyone ever adds one, its license gets checked from the first commit instead
# of being discovered later.
include-build = true
# How closely a crate's license TEXT must match canonical SPDX text before the
# identifier is accepted. Only consulted for crates that ship a `license-file`
# instead of a machine-readable `license` field; all 89 packages currently
# declare `license`, so this is a guard for future additions. 0.93 is strict
# without rejecting the routine copyright-line substitutions that real license
# files contain.
confidence-threshold = 0.93
# The derived minimal allow list. Each entry is required by a real expression:
allow = [
    # Required outright by ciborium, ciborium-io, ciborium-ll (Apache-2.0 only),
    # and it is the satisfying option for most `OR` expressions in the graph.
    "Apache-2.0",
    # Required outright by 9 crates that are MIT-only -- crunchy, is-terminal,
    # oorandom, the three plotters crates, simd-adler32, slab, and zmij 1.0.21
    # (whose license was verified as plain `MIT`).
    "MIT",
    # Required by `unicode-ident 1.0.24`, whose expression is a CONJUNCTION:
    # `(MIT OR Apache-2.0) AND Unicode-3.0`. Unlike every other non-permissive
    # identifier in the graph this one cannot be satisfied by an alternative --
    # the `AND` makes it mandatory. Removing it fails the check.
    "Unicode-3.0",
    # This crate's own license. `LICENSE` at the repository root is the
    # zlib/libpng 3-clause text, "(C) 1995-2026 Jean-loup Gailly and Mark
    # Adler", carried forward from the C baseline, and `Cargo.toml` declares
    # `license = "Zlib"`. Also the satisfying option offered by
    # `miniz_oxide 0.8.9` (`MIT OR Zlib OR Apache-2.0`), which is a pleasing
    # coincidence for a zlib reimplementation but not the reason it is here.
    "Zlib",
]
# Keep the allow list exactly as wide as the graph requires, forever. If a
# dependency change makes one of the four entries unnecessary, this turns the
# now-redundant entry into a hard error instead of letting it linger as an
# unreviewed standing permission. That mechanically enforces "derive the list,
# do not widen it" rather than leaving it to reviewer discipline. The cost is
# that removing a dependency may require a one-line edit here -- a deliberate,
# reviewable edit, which is the point.
unused-allowed-license = "deny"
# Per-crate license carve-outs. Empty, and it should stay that way: every
# expression in the closure is satisfied by the four global entries above, so
# no crate needs an exception. An entry here is a standing exemption for one
# package and must carry a comment justifying it.
exceptions = []
# No `[[licenses.clarify]]` blocks. A clarification overrides a crate's
# declared licensing with our own reading of its files, and is only defensible
# when a crate has no machine-readable metadata AND its actual license text has
# been read. All 89 packages declare a `license` field, so there is nothing to
# clarify and nothing has been invented.
#
# Note also which keys are ABSENT by design. cargo-deny 0.20 still recognises
# the names `copyleft`, `allow-osi-fsf-free`, `unlicensed`, `default`, and
# `deny` in this table, but they belong to a removed generation of the schema
# and using them is an error. Two of them were escape hatches --
# `copyleft = "allow"` and a blanket `allow-osi-fsf-free` -- that would have
# defeated the entire review purpose of an explicit allow list. Neither is used
# here, and neither should be reintroduced by any future migration of this file.

[licenses.private]
# Skip license checking for workspace crates that are never published.
#
# Be precise about what this does and does not do here. It currently exempts
# NOTHING: the root workspace has exactly one member, `zlib-rs 1.3.2`, and that
# package is publishable, so it is fully checked. It is set as a forward-looking
# guard for the unpublished harness case -- `zlib-rs-fuzz 0.0.0` declares
# `publish = false` and carries no license because it is a local libFuzzer
# harness that is never distributed -- which becomes relevant only if cargo-deny
# is ever pointed at `fuzz/Cargo.toml`, since that detached workspace is not part
# of the root graph.
#
# Crucially, this does NOT excuse `zlib-rs` itself, which is why `Zlib` must
# appear in the allow list above. Verified by deleting `Zlib` from a scratch copy
# of this file: `cargo deny check licenses` then fails with
# `error[rejected]: failed to satisfy license requirements` pointing at
# `Cargo.toml:29:12`, `license = "Zlib"`, on the `zlib-rs v1.3.2` package. That
# experiment doubles as proof that this policy file is actually being read.
ignore = true
# No private registries are used or permitted; every crate resolves from
# crates.io (see `[sources]`).
registries = []

# -----------------------------------------------------------------------------
# [bans] -- `cargo deny check bans`
# -----------------------------------------------------------------------------
#
# This section does double duty. Beyond the usual duplicate-version hygiene, it
# encodes the crate's own ARCHITECTURAL boundaries as mechanical rules, so that
# a constraint documented in prose cannot quietly erode through a dependency
# bump. Two boundaries are enforced here:
#
#   1. The crate proper takes no C-toolchain build dependency. `build.rs` is
#      pure `std` -- no external crates, no `[build-dependencies]` table, no
#      `links =` key -- and that is load-bearing, not incidental: it is what
#      lets a consumer build this library with nothing but a Rust toolchain.
#   2. No competing compression codec enters the graph. "bzip2, lzma, or other
#      compression formats" and "new compression algorithms" are explicitly out
#      of scope for this project, and a `deny` entry states that in a form the
#      build can check.
[bans]
# CRITICAL -- do not remove `multiple-versions-include-dev`.
#
# cargo-deny 0.20 excludes dev-dependencies from duplicate detection by default.
# Measured on this repository: with it unset, even `multiple-versions = "deny"`
# reports `bans ok` -- all four duplications below are INVISIBLE and the four
# `skip` entries are dead configuration that only *looks* like governance. With
# it set, exactly `getrandom`, `r-efi`, `rand`, and `rand_core` surface, which
# is the true state of the graph.
multiple-versions = "warn"
multiple-versions-include-dev = true
#
# `warn` rather than `deny` is deliberate. Duplicate majors here are legitimate,
# entirely dev-only, and outside our control -- they arise because a transitive
# dev-dependency tracks a different major of the `rand` family than we declare
# directly. Duplication is a size and build-time concern, not a security defect,
# so the blocking signal in this policy is reserved for advisories, licenses,
# and sources. A newly appearing duplicate surfaces as a warning for review
# instead of halting the security audit over a dev-graph churn event.
#
# Lint level for a `*` version requirement. `deny` upholds the plan's
# supply-chain standard that no dependency is ever specified as `latest` or with
# a placeholder version. Verified safe before setting: neither `Cargo.toml` nor
# `fuzz/Cargo.toml` contains a wildcard requirement. (`fuzz/Cargo.toml` declares
# `libfuzzer-sys = "0.4"`, which is a caret requirement, not a wildcard, and
# `version = "0.0.0"` there is the harness package's own version rather than a
# requirement on anything.)
wildcards = "deny"
# Path dependencies get no wildcard exemption either. The only path dependency
# anywhere in the project is `fuzz/Cargo.toml`'s `zlib-rs { path = ".." }`, and
# it names no version, so nothing relies on this loophole.
allow-wildcard-paths = false
# Highlight both the lowest-versioned and the simplest path when rendering a
# duplicate-version graph, so a warning is actionable without re-running with
# extra flags.
highlight = "all"
#
# `allow` is intentionally omitted. An allow list here would flip the check into
# an opt-in allowlist for the whole graph, which is a maintenance burden that
# buys nothing on top of the targeted `deny` entries below. `[bans.build]`,
# `[[bans.features]]`, `workspace-dependencies`, and `std-replacements` are
# likewise unset: each is a legitimate cargo-deny capability, but none maps to a
# constraint this project actually has, and unused machinery in a policy file
# rots. (Note that if a build-script allowlist is ever wanted, the modern
# spelling is `[bans.build] allow-build-scripts`; the top-level
# `allow-build-scripts` key is deprecated in 0.20.)
#
# CRATES THAT MUST NEVER ENTER THE GRAPH.
# Every entry below was verified ABSENT from `Cargo.lock` before being denied,
# so this list is enforcement rather than aspiration -- `cargo deny check bans`
# passes today with all of it in place.
deny = [
    # --- Boundary 1: no C toolchain in the crate proper ------------------
    # `cc` compiles C from a build script. Its presence would mean the crate no
    # longer builds with a Rust toolchain alone.
    #
    # IMPORTANT NUANCE, resolved deliberately: `cc 1.2.66` DOES legitimately
    # appear in `fuzz/Cargo.lock`, together with `jobserver`, `shlex`, and
    # `find-msvc-tools`. The fuzz harness is the one and only place a C
    # toolchain enters any dependency graph in this project. That does not
    # conflict with this ban, because `fuzz/` is a DETACHED workspace: it
    # declares its own empty `[workspace]` table, so it is not a member of the
    # root build graph and `cargo deny` run from the repository root never
    # resolves it. Verified: `cc` does not appear in the root `Cargo.lock`, and
    # `cargo deny check bans` passes at the root with this entry active. If you
    # ever want to police the fuzz workspace too, run cargo-deny a second time
    # with `--manifest-path fuzz/Cargo.toml` and a separate config -- do NOT
    # weaken this entry to accommodate it.
    { crate = "cc", reason = "crate proper takes no C-toolchain build dependency; build.rs is pure std (cc is expected only in the detached fuzz workspace)" },
    # An FFI binding generator would mean the C ABI surface is machine-derived.
    # It is hand-written in `src/ffi/types.rs` precisely so that ABI drift is a
    # reviewable diff and is caught by the compile-time fn-pointer coercion
    # guards in `src/ffi/mod.rs`.
    { crate = "bindgen", reason = "the C ABI mirror in src/ffi/types.rs is hand-written and compile-time guarded, never generated" },
    # Probing for a system library implies linking one. This crate replaces the
    # system library; it must not depend on finding one.
    { crate = "pkg-config", reason = "no native library is probed for or linked; the crate has no [build-dependencies]" },

    # --- Boundary 1a: never link the C zlib this crate replaces ----------
    # These are `flate2`'s optional C backends. `flate2` is a dev-only decode
    # oracle and must stay on its default pure-Rust `miniz_oxide` backend: an
    # oracle that linked the very C library under replacement would validate
    # nothing, and it would silently reintroduce a C toolchain requirement into
    # the test suite. Denying the `-sys` crates enforces that far more reliably
    # than relying on nobody enabling a feature.
    { crate = "libz-sys", reason = "would link the C zlib this crate replaces; flate2 must stay on its pure-Rust miniz_oxide backend" },
    { crate = "libz-ng-sys", reason = "as libz-sys, zlib-ng variant" },
    { crate = "cloudflare-zlib-sys", reason = "as libz-sys, cloudflare-zlib variant" },

    # --- Boundary 2: no competing compression formats or algorithms ------
    # Explicitly out of scope for this project. Denying the crates turns a scope
    # boundary into a build-time check. Note carefully that `flate2` and
    # `miniz_oxide` are NOT denied: they are DEFLATE implementations used as
    # dev-only cross-validation oracles, they are load-bearing for the interop
    # test suite, and they never become runtime dependencies.
    { crate = "bzip2", reason = "out of scope: other compression formats" },
    { crate = "bzip2-sys", reason = "out of scope: other compression formats" },
    { crate = "lzma-sys", reason = "out of scope: other compression formats" },
    { crate = "xz2", reason = "out of scope: other compression formats" },
    { crate = "zstd", reason = "out of scope: other compression formats" },
    { crate = "zstd-sys", reason = "out of scope: other compression formats" },
    { crate = "brotli", reason = "out of scope: other compression formats" },
    { crate = "brotli-decompressor", reason = "out of scope: other compression formats" },

    # --- General hygiene for a minimal libz replacement ------------------
    # A library whose entire runtime closure is `cfg-if` plus an optional
    # `crc32fast` has no business acquiring a native TLS stack. Verified absent.
    { crate = "openssl", reason = "no heavyweight native dependency in a minimal libz replacement" },
    { crate = "openssl-sys", reason = "no heavyweight native dependency in a minimal libz replacement" },
]
#
# ACKNOWLEDGED DUPLICATE VERSIONS.
#
# All four duplications below are legitimate, dev-dependency-only, and absent
# from every shipped artifact (`lib`, `cdylib`, `staticlib`), which contain only
# `cfg-if` and optionally `crc32fast`. They are skipped so the `warn` channel
# stays signal rather than four permanent lines of noise -- an unacknowledged
# recurring warning trains reviewers to ignore the check.
#
# Each entry names the TRANSITIVE copy, the one we do not control, rather than
# the version we declare ourselves. That is deliberate on two counts: the
# directly-declared `rand 0.9.4` stays under normal scrutiny, and because a skip
# matches an exact version, a future `quickcheck` bump makes these entries
# unmatched and cargo-deny reports `warning[unmatched-skip]` -- turning
# dependency drift into a visible prompt to re-review instead of a silent
# widening of the exemption.
skip = [
    # rand 0.9.4 is the direct dev-dependency (pinned >= 0.9.4 for
    # RUSTSEC-2026-0097); 0.10.2 arrives transitively through quickcheck 1.1.0.
    { crate = "rand@0.10.2", reason = "dev-only; transitive via quickcheck 1.1.0, while rand 0.9.4 is our direct dev-dependency. Both are above the RUSTSEC-2026-0097 patched range." },
    # rand_core 0.9.5 follows rand 0.9.4 (and rand_chacha 0.9.0).
    { crate = "rand_core@0.10.1", reason = "dev-only; follows rand 0.10.2 down the quickcheck path" },
    # getrandom 0.3.4 follows rand_core 0.9.5.
    { crate = "getrandom@0.4.3", reason = "dev-only; follows rand_core 0.10.1 down the quickcheck path" },
    # r-efi 5.3.0 follows getrandom 0.3.4. Both copies are the UEFI backend and
    # are reachable only under `target_os = "uefi"`; they are in the graph at all
    # only because `[graph] targets` is deliberately left unpruned.
    { crate = "r-efi@6.0.0", reason = "dev-only, UEFI-target-gated; follows getrandom 0.4.3 down the quickcheck path" },
]
# `skip-tree` is intentionally empty. It suppresses duplicate detection for a
# crate AND its entire transitive subtree, which is far broader than anything
# needed here -- the four targeted `skip` entries above cover the real graph
# exactly. Prefer adding a precise `skip` over reaching for `skip-tree`.
skip-tree = []

# -----------------------------------------------------------------------------
# [sources] -- `cargo deny check sources`
# -----------------------------------------------------------------------------
#
# This is the strictest section in the file, and it can afford to be, because the
# graph is uniform: 88 of the 89 root packages carry
# `source = "registry+https://github.com/rust-lang/crates.io-index"`, and the
# 89th is the local `zlib-rs 1.3.2` workspace root itself, which has no `source`
# key at all because it is not fetched from anywhere. The only other
# non-registry entry anywhere in the project is the `zlib-rs { path = ".." }`
# self-reference in `fuzz/Cargo.toml` -- the sole path dependency in the entire
# project, which points at this very crate and lives in a detached workspace the
# root check never resolves. There is no git dependency, no vendored source, and
# no private or mirrored registry. `deny` on both unknown-source classes
# therefore locks in a property the graph already has rather than imposing a new
# constraint, and it was verified to pass before being set.
[sources]
# A crate from any registry other than the allow list below is an error. This is
# the check that would catch a dependency confusion / typosquat attempt routed
# through an unexpected registry.
unknown-registry = "deny"
# A crate pulled directly from a git repository is an error. Git sources bypass
# crates.io's immutability and yanking guarantees, so for a library positioned as
# a memory-safety replacement for a ubiquitous C dependency they are not
# acceptable at any depth.
unknown-git = "deny"
# The one trusted registry.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git source is permitted, so the allow list is empty rather than absent --
# an empty list is an explicit statement, whereas omitting the key relies on a
# default.
allow-git = []
# Defense in depth for a case that cannot currently arise: if a git source is
# ever allowed, it must be pinned to an exact `rev`. Branch and tag specs are
# mutable, so they cannot support a reproducible or auditable build.
required-git-spec = "rev"
# A source allowance that matches nothing is a standing permission nobody is
# using and nobody is reviewing. `deny` forces stale entries to be removed,
# exactly as `unused-allowed-license` and `unused-ignored-advisory` do in their
# own sections. Safe today: the single `allow-registry` entry is matched by all
# 88 registry-sourced packages, and `allow-git` is empty so it cannot be
# unmatched.
unused-allowed-source = "deny"
# Same reasoning for organisation-level git allowances, of which there are none.
unused-allowed-org = "deny"

[sources.allow-org]
# No organisation-wide git trust is granted on any forge. Stated explicitly, as
# empty lists, so that adding one is a visible diff against a deliberate "none"
# rather than an edit to an absent default.
github = []
gitlab = []
bitbucket = []
