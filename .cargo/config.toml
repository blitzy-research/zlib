# `.cargo/config.toml` -- Cargo per-project configuration for the `zlib-rs`
# crate: the documented home for target-specific rustflags and link arguments.
#
# Read this before editing. The file is deliberately almost empty, and every
# table in it is intentionally inert, so the reasoning has to live here or it
# will be lost -- and the most likely way this file causes damage is a
# well-meaning maintainer adding a setting that quietly invalidates one of the
# guarantees documented below.
#
# Section references of the form `AAP 0.10.1` point at section 0.10.1 of the
# Agent Action Plan for the C-to-Rust migration of zlib 1.3.2.1-motley. The
# section sign is spelled out this way so the file stays plain ASCII.
#
#
