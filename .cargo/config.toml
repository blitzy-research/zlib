# ---------------------------------------------------------------------------
# DO NOT ADD
# ---------------------------------------------------------------------------
# Each entry below is here because adding it would break something specific
# and already-measured. None of them is a matter of taste.
#
#  1. No `[build]` table -- no `target`, no `rustflags`, no `rustdocflags`.
#     `[build] target` retargets EVERY invocation in this directory tree and
#     would break every quality gate at once. `[build] rustflags` applies to
#     every target, including ones nobody reviewed for it.
#
#  2. No `[profile.*]` table. Profiles live in `Cargo.toml`, which sets
#     `opt-level = 3`, `lto = true`, and `codegen-units = 1` for release.
#     Cargo lets a config profile OVERRIDE the manifest's, so a table here
#     would quietly win over the reviewed settings next door.
#
#  3. Nothing that touches the panic strategy -- no `-C panic=...`, in any
#     table. `Cargo.toml` sets `panic = "abort"` in BOTH `[profile.release]`
#     and `[profile.dev]` and documents it as required rather than merely
#     preferred, because a stable-toolchain `no_std` `cdylib`/`staticlib`
#     cannot link an unwinding runtime. The library's own `no_std` switch is
#     `#![cfg_attr(all(not(feature = "std"), not(test), panic = "abort"),
#     no_std)]`, so the crate's freestanding mode is literally CONDITIONED on
#     `panic = "abort"`: overriding the strategy here would silently drop
#     `#![no_std]` -- and with it the private libc-backed global allocator and
#     abort panic handler, which are gated on the very same predicate.
#
#  4. No codegen tuning -- no `-C target-cpu=...` (including `native`), no
#     `-C target-feature=...`, no `-C opt-level=...`, no `-C lto=...`, no
#     `-C codegen-units=...`, and no `-Z` flag of any kind. Compressed output
#     is byte-for-byte identical to reference zlib across the measured
#     conformance grid, and that identity -- not throughput -- is the
#     acceptance criterion of this migration. A faster build that emits
#     different bytes is a regression.
#
#  5. Nothing that weakens a diagnostic -- no `-A...`, no `--cap-lints...`,
#     no lint-level downgrade. The lint gate runs
#     `cargo clippy --all-targets --all-features -- -D warnings` and must stay
#     exactly that strict. No warning is downgraded to land a change.
#
#  6. No `[alias]` table. An alias that shadows `fmt`, `clippy`, `build`,
#     `test`, `bench`, or `doc` can silently drop `-D warnings` or
#     `--all-targets` and make a gate look green while checking less.
#
#  7. No `[env]` table at all -- and in particular nothing that sets the
#     version-script opt-in variable that `build.rs` reads (see "SYMBOL
#     VERSIONING" below). `[env]` also applies to build scripts, so a key here
#     can silently change what `build.rs` emits, for this workspace and for
#     the detached `fuzz/` one.
#
#  8. No `[source]`, `[patch]`, or `[registries]` table, and no
#     `[net] offline`. Dependency resolution must not move and `Cargo.lock`
#     must stay byte-identical; `deny.toml`'s `[sources]` section allows only
#     `https://github.com/rust-lang/crates.io-index` and denies unknown
#     registries and git sources outright.
#
#  9. No unstable Cargo configuration key. Unstable keys need `-Z` and a
#     nightly Cargo, which would break the `msrv` job. Use only keys that are
#     valid on BOTH the pinned MSRV (1.85.0, see `rust-toolchain.toml`) and
#     current stable.
#
# 10. No `runner` for the host triple. It would route the entire host test
#     suite through a wrapper. The suite passes 487 tests with 0 failed and 0
#     ignored by default and 363 under `--no-default-features`; the ignored
#     count is zero and stays zero.
#
# 11. Nothing except `linker`, `runner`, `rustflags`, `rustdocflags`, and `ar`
#     inside a `[target.<triple>]` table. Neither kind of mistake is loud
#     here: Cargo reinterprets a `[target.<triple>.<name>]` SUB-table as a
#     build-script LINK OVERRIDE for a crate declaring `links = "<name>"`, and
#     it accepts an unrecognised scalar key without complaint. A wrong name
#     therefore does nothing, or something else, but never errors.
#
# 12. No credentials, tokens, or secrets, here or anywhere in `.cargo/`. No
#     `credentials.toml`, no `credentials`. `Cargo.toml`'s `exclude` list does
#     not exclude `.cargo/**`, so this file SHIPS inside the published
#     `.crate`; it must contain nothing you would not publish. (That is
#     otherwise harmless: Cargo discovers configuration by walking UP from the
#     invocation directory, so a dependency's bundled config never applies to
#     a consumer's build.)
#
# 13. No `.cargo/config` alongside this file. The extensionless form is the
#     legacy spelling; Cargo prefers `config.toml` and warns when both exist.
#
#
# IF YOU EDIT THIS FILE
# =====================
# Any edit here can affect every crate unit, so re-observe the gates rather
# than reasoning about them -- a change is not done because it parses, it is
# done when the gate has been seen to pass:
#
#   cargo fmt --all -- --check
#   cargo clippy --all-targets --all-features -- -D warnings
#   cargo build
#   cargo test                              # expect 487 passed, 0 ignored
#   cargo test --no-default-features        # expect 363 passed
#   cargo doc
#   cargo +1.85.0 build && cargo +1.85.0 check --all-targets
#   cargo build --release                   # rlib + cdylib + staticlib
#   git status --porcelain Cargo.lock       # must stay empty
#
# Note that `cargo build --all-targets` is NOT a usable gate for this crate,
# independently of anything in this file: the profiles set `panic = "abort"`
# while Cargo forces `unwind` for libtest harnesses, so the test targets
# refuse to link against the abort-strategy library. Use `cargo test` and
# `cargo check --all-targets` instead, which is what CI does.


# ---------------------------------------------------------------------------
# HOW CARGO FINDS THIS FILE -- and why nothing global is set in it
# ---------------------------------------------------------------------------
# Cargo does not bind configuration to a package. It walks UP from the
# directory the command was invoked in, reading a `.cargo/config.toml` at every
# level plus `$CARGO_HOME/config.toml`, and merges what it finds with the
# deepest directory winning per key.
#
# Two consequences matter here:
#
#   * This file governs every `cargo` invocation made anywhere at or below the
#     repository root -- not just those run from the root itself.
#   * That INCLUDES the detached fuzz workspace. `fuzz/Cargo.toml` declares its
#     own empty `[workspace]` table (the root manifest declares none), so root
#     `cargo build`/`test`/`clippy`/`fmt` never touch `fuzz/` -- but `fuzz/` is
#     still a subdirectory of this root, so `cargo fuzz build` and
#     `cargo fuzz run` executed there DO discover this file. Those commands run
#     on a nightly toolchain with `-Z` sanitizer and coverage instrumentation,
#     and `fuzz/Cargo.lock` is the only place in the project where a
#     C-toolchain driver chain (`cc`, `jobserver`, `shlex`, `find-msvc-tools`)
#     enters any dependency graph.
#
# A global `[build]` or `[env]` setting here would therefore silently reshape
# an instrumented nightly fuzzing build that no gate in `ci.yml` covers. That
# is the reason this file confines itself to per-triple anchors and sets
# nothing global.


# ---------------------------------------------------------------------------
# RUSTFLAGS PRECEDENCE -- the sources do NOT concatenate
# ---------------------------------------------------------------------------
# This is the single most common way a config file like this one surprises
# people. Cargo takes rustflags from the FIRST of these that is present and
# ignores the rest entirely; it does not append them together:
#
#   1. the `RUSTFLAGS` environment variable
#      (`CARGO_ENCODED_RUSTFLAGS` outranks even that)
#   2. `target.<triple>.rustflags` and `target.<cfg>.rustflags` from config
#      -- these join with EACH OTHER, but as one source they still lose to 1
#   3. `build.rustflags` from config
#
# So a CI step that exports `RUSTFLAGS` for an unrelated reason silently
# discards every `rustflags` entry in this file, and conversely an entry here
# would silently discard a `build.rustflags` default. Whichever source wins,
# wins outright. `rustdocflags` follows the same shape with `RUSTDOCFLAGS`.
#
# Two further properties worth knowing before adding any flag:
#
#   * Rustflags are part of every unit's fingerprint, so changing them
#     invalidates the whole build cache and forces a full recompile -- of the
#     dependency graph as well as this crate.
#   * When cross-compiling, `target.<triple>.rustflags` applies to the TARGET
#     artifacts only. Build scripts and proc macros are compiled for the host
#     and do not receive them, so `build.rs` cannot be configured this way.


# ---------------------------------------------------------------------------
# SYMBOL VERSIONING (gap D8) IS `build.rs`'s JOB, NOT THIS FILE'S
# ---------------------------------------------------------------------------
# It is tempting to reach for a link argument here, so this boundary is stated
# explicitly.
#
# The retained C baseline links `libz.so` through `zlib.map`, a genuine GNU-ld
# version script: 16 version nodes from `ZLIB_1.2.0` to `ZLIB_1.3.2`, 54
# `global:` names, and 10 named `local:` names plus a `_*` wildcard. Only GNU
# `ld` and `lld` understand `--version-script`; Mach-O's `ld64` wants
# `-exported_symbols_list` with a different file format, and MSVC's `link.exe`
# wants a `.def` file. The upstream C build draws the same boundary, applying
# `zlib.map` only on Unix that is not Apple, AIX, or SunOS.
#
# `build.rs` is the designated owner. It emits the required pair of
# `rustc-cdylib-link-arg` values (`-Wl,--undefined-version` followed by
# `-Wl,--version-script=<absolute path to zlib.map>`) but ONLY when its
# explicit opt-in environment variable is set, ONLY for a `target_os` of
# `linux` or `android` outside the `musl` environment, and it skips tolerantly
# when `zlib.map` is absent -- which it is in the published `.crate`, because
# `Cargo.toml`'s `exclude` list contains `*.map`.
#
# It is opt-in for good reason. AAP 0.8.2 ranks D8 LOW, notes it "carries
# linker-portability risk", and states it is "deliberately deferred behind D3"
# -- the cross-platform CI matrix that would be needed to test it. Measured
# behaviour backs that up: whether the link succeeds depends on which linker
# the toolchain defaults to, and with the option on, `rustc`'s
# `linker_messages` lint reports one warning per listed symbol, so a build that
# promotes warnings to errors fails -- and this crate's gates run with
# `-D warnings`.
#
# Therefore: do NOT enable that opt-in from this file (see DO NOT ADD item 7).
# If a maintainer ever needs the documented escape hatch on a toolchain whose
# default linker refuses the combination -- selecting an LLD-flavoured linker
# through a link argument -- the per-triple anchors below are the right home
# for it: one explicit, reviewed entry for one platform, never a global
# default.


# ---------------------------------------------------------------------------
# TARGET-SPECIFIC WIRING
# ---------------------------------------------------------------------------
# Cargo reads a `[target.<triple>]` table ONLY when building for that exact
# triple, so every table below is completely inert for the host build and for
# each other.
#
# NATIVE vs CROSS -- the asymmetry that decides what belongs here:
#
#   * A NATIVE runner (an `os: windows-latest` or `os: macos-latest` row)
#     builds for its own host triple with its own system linker. It needs
#     NOTHING from this file.
#   * A CROSS build (`--target <triple>`) generally needs a `linker`, and needs
#     a `runner` only if its tests are actually EXECUTED rather than merely
#     compiled.
#
# So the Windows and macOS entries below exist as documentation of what those
# rows would first exercise, not because a native row needs configuring.
#
# The five triples are exactly the five platforms `deny.toml` names, in the
# order it names them, as the platform set for the cross-platform CI matrix
# (D3) plus the bare-metal `no_std` row (D10) -- so the supply-chain policy and
# the build configuration describe the same platforms. One nuance: `deny.toml`
# deliberately leaves its own `[graph] targets` list EMPTY so that no
# target-gated crate can escape review (an empty list is a strict superset of
# these five, and pruning to them would hide the only potentially-copyleft
# license expression in the graph). The alignment here is therefore on the
# platform SET, not on a literal key value -- but keep the two files in step.

[target.x86_64-unknown-linux-gnu]
# Host triple of every current CI job and of local development. Intentionally
# EMPTY: the host build must use stock defaults so the gates stay reproducible
# and the compressed output stays byte-identical to reference zlib. Never add
# a `runner` here (DO NOT ADD item 10).

[target.aarch64-unknown-linux-gnu]
# The cross target a future aarch64 CI row (D3) would use, and the first entry
# here that would genuinely need wiring. Uncomment and adjust ONLY when such a
# row exists AND the named tools are installed where it runs -- naming a
# linker that is not present turns every build into a link failure. A `runner`
# is needed only if the tests are to be executed under emulation; a build-only
# row needs just the linker.
# linker = "aarch64-linux-gnu-gcc"
# runner = "qemu-aarch64 -L /usr/aarch64-linux-gnu"

[target.x86_64-pc-windows-msvc]
# Reached NATIVELY by an `os: windows-latest` row, which needs nothing here.
# Listed because it is the row that would first exercise two paths that have
# never run in this repository:
#   * `OS_CODE = 10`, the `#[cfg(windows)]` branch in `src/util/mod.rs`. Only
#     the Unix default of `3` has ever been compiled, yet `OS_CODE` is written
#     into every gzip header.
#   * `gzopen_w` in `src/ffi/gz.rs`, which is `#[cfg(windows)]`-gated and is
#     the single symbol behind the 96 declared `#[unsafe(no_mangle)]`
#     functions versus 95 emitted `T` symbols on Linux.
# Both paths are unexercised today. Note also that `zlib.map` is meaningless
# here: MSVC's `link.exe` uses `.def` files (see SYMBOL VERSIONING above).

[target.aarch64-apple-darwin]
# Reached NATIVELY by a macOS arm64 runner, which needs nothing here. Listed
# because it is the row that would first exercise `OS_CODE = 19`, the
# `#[cfg(all(not(windows), target_vendor = "apple"))]` branch in
# `src/util/mod.rs` -- likewise unexercised today. As with MSVC, `zlib.map`
# does not apply: Mach-O's `ld64` has no `--version-script`.

[target.thumbv7em-none-eabihf]
# Bare-metal Cortex-M4F target for the real-hardware `no_std` validation
# (D10). Build only: there is no host to run libtest on, so no `runner`.
#
# Three things whoever lands that row should expect. First, install the target
# (`rustup target add thumbv7em-none-eabihf`) -- an absent target is a build
# error, not something this file can paper over. Second, Cargo drops the
# unsupported `cdylib` crate type for a bare-metal target and warns about it;
# that is expected and must NOT be compensated for with rustflags. Third, this
# is the row that first exercises the private libc-backed global allocator and
# abort panic handler in `src/lib.rs`, which resolve against `malloc`,
# `calloc`, `realloc`, `free`, and `posix_memalign` -- a freestanding target
# has no hosted libc, so a `linker` supplying one (an `arm-none-eabi` GCC with
# newlib, for instance) is the most likely thing this anchor will need to
# carry.
# linker = "arm-none-eabi-gcc"
# rustflags = []

# BIG-ENDIAN: no big-endian triple appears above, and none appears in the
# platform set `deny.toml` names. If such a row is ever added -- for example
# `s390x-unknown-linux-gnu` or `powerpc64-unknown-linux-gnu` -- add it HERE as
# a sixth anchor and keep `deny.toml` in step, so the build configuration and
# the supply-chain policy continue to describe the same platforms. Be precise
# about what is known when you do: `build.rs` performs no host or target
# detection and deterministically emits both the little-endian and big-endian
# CRC braid tables, so its OUTPUT is byte-identical on every platform, but no
# big-endian target has ever been built or tested here. Treat any endianness
# claim about the runtime as unverified until such a row actually runs.
