# `.cargo/config.toml` -- Cargo per-project configuration for the `zlib-rs`
# crate: the documented home for target-specific rustflags and link arguments
# (migration gap D7).
#
# Every table here is an intentionally EMPTY, documented anchor, so this file
# changes nothing observable today: no codegen, no emitted compressed bytes, no
# exported symbol set, no dependency resolution, no panic strategy, no test
# outcome. It exists so that when a cross-compiled, emulated, or bare-metal row
# does land, its wiring has one obvious home instead of scattering through
# per-job workflow environment variables -- which is the defect D7 describes.
# The consumers are not here yet: CI runs every job on `ubuntu-latest` and its
# `build-test` matrix varies features only. Keep the tables empty until a real
# consumer lands.
#
# Section references of the form `AAP 0.8.1` point at the Agent Action Plan for
# the C-to-Rust migration of zlib 1.3.2.1-motley; the section sign is spelled
# out so the file stays plain ASCII. Where a comment appeals to a preservation
# directive or an engineering standard, that is one of the plan's own
# commitments, never a user-supplied rule.


# ---------------------------------------------------------------------------
# SCOPE -- why nothing global is set here
# ---------------------------------------------------------------------------
# Cargo does not bind configuration to a package: it walks UP from the
# invocation directory, reading a `.cargo/config.toml` at every level plus
# `$CARGO_HOME/config.toml`, deepest directory winning per key. So this file
# governs every `cargo` invocation at or below the repository root -- including
# the detached `fuzz/` workspace, which root `cargo build`/`test`/`clippy` never
# touch but which is still a subdirectory of this root. A global `[build]` or
# `[env]` setting here would therefore silently reshape an instrumented nightly
# `cargo fuzz` build that no CI gate covers. Hence per-triple anchors only.


# ---------------------------------------------------------------------------
# RUSTFLAGS PRECEDENCE -- the sources do NOT concatenate
# ---------------------------------------------------------------------------
# Cargo takes rustflags from the FIRST source present and ignores the rest:
# (1) `RUSTFLAGS` (`CARGO_ENCODED_RUSTFLAGS` outranks even that), then
# (2) `target.<triple>.rustflags` / `target.<cfg>.rustflags` -- which join with
# each other but, as one source, still lose to (1) -- then (3)
# `build.rustflags`. A CI step exporting `RUSTFLAGS` for an unrelated reason
# therefore discards every `rustflags` entry here outright. `rustdocflags`
# behaves the same way with `RUSTDOCFLAGS`.
#
# Also: rustflags are part of every unit's fingerprint, so changing them forces
# a full recompile of the whole graph; and when cross-compiling they apply to
# TARGET artifacts only, so `build.rs` (host-compiled) cannot be configured
# this way.


# ---------------------------------------------------------------------------
# DO NOT ADD -- each item breaks something specific
# ---------------------------------------------------------------------------
#  1. No `[build]` table. `target` retargets every invocation in this tree;
#     `rustflags`/`rustdocflags` apply to every target, reviewed or not.
#  2. No `[profile.*]` table -- a config profile OVERRIDES the manifest's, so
#     it would quietly win over the reviewed settings in `Cargo.toml`.
#  3. Nothing touching the panic strategy, in any table. `Cargo.toml` sets
#     `panic = "abort"` for dev and release because a stable-toolchain `no_std`
#     `cdylib`/`staticlib` cannot link an unwinding runtime, and the library's
#     switch is `#![cfg_attr(all(not(feature = "std"), not(test),
#     panic = "abort"), no_std)]`. Overriding it silently drops `#![no_std]`
#     and, with it, the private allocator and panic handler gated on the same
#     predicate.
#  4. No codegen tuning -- no `-C target-cpu`/`target-feature`/`opt-level`/
#     `lto`/`codegen-units`, no `-Z`. Byte-identical compressed output, not
#     throughput, is this migration's acceptance criterion (AAP 0.8.1 D-1); a
#     faster build emitting different bytes is a regression.
#  5. Nothing weakening a diagnostic -- no `-A`, no `--cap-lints`. The gate is
#     `cargo clippy --all-targets --all-features -- -D warnings` and stays
#     exactly that strict.
#  6. No `[alias]` table -- an alias shadowing `fmt`/`clippy`/`test`/`doc` can
#     drop `-D warnings` or `--all-targets` and make a gate look green.
#  7. No `[env]` table at all. `[env]` applies to build scripts as well as to
#     compilation, here and in `fuzz/`, so a key here can change what a build
#     script sees without appearing on any command line. `build.rs` reads
#     exactly one variable today -- the `OUT_DIR` Cargo sets for it -- and it
#     must stay that way: an environment-gated build-script behaviour is
#     untestable by CI and was already removed once (see SYMBOL VERSIONING).
#  8. No `[source]`, `[patch]`, `[registries]`, or `[net] offline`. Resolution
#     must not move and `Cargo.lock` must stay byte-identical; `deny.toml`
#     allows only the crates.io index.
#  9. No unstable Cargo key -- it needs `-Z` and a nightly Cargo, breaking the
#     `msrv` job. Use only keys valid on both the pinned MSRV
#     (`rust-toolchain.toml`) and current stable.
# 10. No `runner` for the host triple; it routes the whole host test suite
#     through a wrapper.
# 11. Inside `[target.<triple>]`, nothing but `linker`, `runner`, `rustflags`,
#     `rustdocflags`, `ar`. Neither mistake is loud: Cargo reads a
#     `[target.<triple>.<name>]` SUB-table as a build-script LINK OVERRIDE for
#     a crate declaring `links = "<name>"`, and accepts an unrecognised scalar
#     key silently. A wrong name does nothing, or something else, never errors.
# 12. No credentials, tokens, or secrets anywhere in `.cargo/`. `Cargo.toml`'s
#     `exclude` list does not cover `.cargo/**`, so this file SHIPS in the
#     published `.crate`.
# 13. No legacy extensionless `.cargo/config` beside this file; Cargo warns
#     when both exist.
#
# After any edit, re-observe the gates rather than reasoning about them:
#
#   cargo fmt --all -- --check
#   cargo clippy --all-targets --all-features -- -D warnings
#   cargo build && cargo build --release
#   cargo test && cargo test --no-default-features
#   cargo doc
#   cargo +1.85.0 build && cargo +1.85.0 check --all-targets
#   git status --porcelain Cargo.lock       # must stay empty
#
# `cargo build --all-targets` is NOT a usable gate for this crate, independently
# of anything here: the profiles set `panic = "abort"` while Cargo forces
# `unwind` for libtest harnesses, so the test targets refuse to link against the
# abort-strategy library. CI uses `cargo test` and `cargo check --all-targets`.


# ---------------------------------------------------------------------------
# SYMBOL VERSIONING (gap D8) IS NOT WIRED UP -- NOT HERE, AND NOT IN `build.rs`
# ---------------------------------------------------------------------------
# The retained C baseline links `libz.so` through `zlib.map`, a GNU-ld version
# script. Only GNU `ld` and `lld` understand `--version-script`; Mach-O's
# `ld64` wants `-exported_symbols_list` and MSVC's `link.exe` wants a `.def`
# file -- which is why the upstream C build applies `zlib.map` only on Unix
# that is not Apple, AIX, or SunOS.
#
# The retained C baseline links `libz.so` through `zlib.map`, a genuine GNU-ld
# version script: 16 version nodes from `ZLIB_1.2.0` to `ZLIB_1.3.2`, 54
# `global:` names, and 10 named `local:` names plus a `_*` wildcard. Only GNU
# `ld` and `lld` understand `--version-script`; Mach-O's `ld64` wants
# `-exported_symbols_list` with a different file format, and MSVC's `link.exe`
# wants a `.def` file. The upstream C build draws the same boundary, applying
# `zlib.map` only on Unix that is not Apple, AIX, or SunOS.
#
# The Rust build reproduces none of it, deliberately. `build.rs` emits no link
# argument of any kind and reads no environment variable other than `OUT_DIR`;
# the emitted `cdylib` therefore carries an unversioned symbol table. That is
# AAP 0.8.2 Divergence 4, which ranks D8 LOW, notes it "carries
# linker-portability risk", states it is "deliberately deferred behind D3" --
# the cross-platform CI matrix that would be needed to test it -- and instructs
# that the divergence be KEPT rather than "fixed". The symbol SET is already
# exactly right: 95 exported symbols on Linux, all 54 `zlib.map` globals
# present, none of the 10 locals leaked. Only the version tags are absent, and
# a drop-in replacement links, resolves through `pkg-config`, and `LD_PRELOAD`s
# without them.
#
# An environment-gated opt-in for this once existed in `build.rs` and was
# removed after measurement, because it was fatal on one supported toolchain
# and ineffective on the other: on the pinned MSRV (1.85.0, GNU `ld`) the link
# FAILED outright -- "anonymous version tag cannot be combined with other
# version tags", since `rustc` already passes an anonymous-node version script
# of its own -- while on current stable (1.97.1, `rust-lld`) it linked but
# produced ZERO per-symbol tags (`nm -D --defined-only | grep -c @` = 0) and one
# `linker_messages` warning per listed symbol, which fails a `-D warnings` gate.
# The full measurements live in the "No cdylib symbol versioning" section of
# `build.rs`; do not re-add the option from either file (see DO NOT ADD item 7).
#
# If a maintainer ever does re-open D8 -- behind D3, with `.symver` directives,
# because link arguments alone provably do not produce per-symbol tags -- and
# needs an LLD-flavoured linker on a toolchain whose default `ld` refuses the
# combination, the per-triple anchors below are the right home for that one
# link argument: one explicit, reviewed entry for one platform, never a global
# default.


# ---------------------------------------------------------------------------
# TARGET-SPECIFIC WIRING
# ---------------------------------------------------------------------------
# Cargo reads a `[target.<triple>]` table ONLY when building for that exact
# triple, so every table below is inert for the host build and for each other.
# A NATIVE runner (`os: windows-latest`, `os: macos-latest`) builds for its own
# host triple with its own linker and needs NOTHING here; a CROSS build
# (`--target <triple>`) generally needs a `linker`, and a `runner` only if its
# tests are actually EXECUTED rather than merely compiled.
#
# The five triples are the platform set `deny.toml` names for the
# cross-platform CI matrix (D3) plus the bare-metal `no_std` row (D10), so the
# supply-chain policy and the build configuration describe the same platforms.
# `deny.toml` deliberately leaves its own `[graph] targets` list EMPTY so no
# target-gated crate escapes review, so the alignment is on the platform SET,
# not on a literal key value -- but keep the two in step.

[target.x86_64-unknown-linux-gnu]
# Host triple of every current CI job and of local development. Intentionally
# EMPTY: the host build must use stock defaults so the gates stay reproducible
# and the compressed output stays byte-identical to reference zlib. Never add
# a `runner` here (DO NOT ADD item 10).

[target.aarch64-unknown-linux-gnu]
# The cross target a future aarch64 CI row (D3) would use, and the first entry
# here that would genuinely need wiring. Uncomment and adjust ONLY when such a
# row exists AND the named tools are installed where it runs -- naming a
# linker that is not present turns every build into a link failure.
# linker = "aarch64-linux-gnu-gcc"
# runner = "qemu-aarch64 -L /usr/aarch64-linux-gnu"

[target.x86_64-pc-windows-msvc]
# Reached NATIVELY by an `os: windows-latest` row, which needs nothing here.
# Listed because it is the row that would first COMPILE two Windows-only paths
# never built in this repository: `gzopen_w` in `src/ffi/gz.rs`, the single
# `#[cfg(windows)]`-gated symbol behind 96 declared `#[unsafe(no_mangle)]`
# functions versus 95 emitted `T` symbols on Linux; and the `#[cfg(windows)]`
# arm of `src/util/mod.rs`'s `OS_CODE`, which the gzip encoder in
# `src/deflate/mod.rs` genuinely consumes -- `put_byte(s, OS_CODE)`, exactly as
# `deflate.c` does. So this row would be the first to emit an OS byte of `10`
# instead of `3`, and that is CORRECT rather than a byte-identity problem: C's
# `zutil.h` selects the same platform value, so parity with a Windows-built
# reference `libz` requires it. Hard-coding `3` on every target is the thing that
# would break parity, and an earlier revision of the encoder did exactly that
# with a private `const OS_CODE: u8 = 3` shadowing the real constant. Byte
# identity (AAP 0.8.1 D-1) is defined against the reference C library built for
# the SAME target, never across targets. `zlib.map` is meaningless here anyway:
# `link.exe` uses `.def` files.

[target.aarch64-apple-darwin]
# Reached NATIVELY by a macOS arm64 runner, which needs nothing here. Listed
# because it is the row that would first compile the
# `cfg(all(not(windows), target_vendor = "apple"))` arm of `src/util/mod.rs`'s
# `OS_CODE` -- likewise unbuilt today, and likewise consumed by the gzip encoder
# once it is, emitting `19` exactly as a macOS-built reference `libz` does.
# As with MSVC, `zlib.map` does not apply: `ld64` has no `--version-script`.

[target.thumbv7em-none-eabihf]
# Bare-metal Cortex-M4F target for the real-hardware `no_std` validation
# (D10). Build only: there is no host to run libtest on, so no `runner`.
# Whoever lands that row should expect three things. Install the target
# (`rustup target add thumbv7em-none-eabihf`) -- an absent target is a build
# error this file cannot paper over. Cargo drops the unsupported `cdylib` crate
# type for a bare-metal target and warns; that is expected and must NOT be
# compensated for with rustflags. And this is the row that first exercises the
# private libc-backed global allocator and abort panic handler in `src/lib.rs`,
# which resolve against `malloc`, `calloc`, `realloc`, `free`, and
# `posix_memalign` -- a freestanding target has no hosted libc, so a `linker`
# supplying one (an `arm-none-eabi` GCC with newlib) is the most likely thing
# this anchor will need to carry.
# linker = "arm-none-eabi-gcc"
# rustflags = []

# BIG-ENDIAN: no big-endian triple appears above or in the platform set
# `deny.toml` names. If one is ever added -- `s390x-unknown-linux-gnu`,
# `powerpc64-unknown-linux-gnu` -- add it HERE as a sixth anchor and keep
# `deny.toml` in step. Be precise about what is known: `build.rs` performs no
# host or target detection and emits the same tables everywhere, so its OUTPUT
# is byte-identical on every platform, and the checksum runtime consumes only
# the endian-independent byte-wise table. No big-endian target has ever been
# built or tested here; treat any endianness claim about the runtime as
# unverified until such a row actually runs.
