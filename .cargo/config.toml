# WHY IT DELIBERATELY SETS NOTHING TODAY
# ======================================
# Every table below is an empty, documented ANCHOR. That is the design, not an
# omission:
#
#   * `.github/workflows/ci.yml` runs all five of its jobs -- `build-test`,
#     `no-std-tests`, `lint`, `msrv`, `benches` -- on `ubuntu-latest`, and the
#     `build-test` matrix varies FEATURES ONLY: each of its five rows already
#     carries an explicit `os: ubuntu-latest`, and the matrix has no `target:`
#     key at all. No cross-compiled, emulated, or bare-metal build exists yet,
#     so no cross-compilation setting has an observed need.
#   * The consumers that would read such settings have not landed either:
#     there is no cross-platform matrix row (D3), no bare-metal `no_std` row
#     (D10), no `cargo package` verification step (D12), and no `audit.yml`
#     (D2). The workflow directory currently holds exactly `ci.yml` and
#     `fuzz.yml`.
#   * Writing settings for a platform nobody builds would be configuration
#     asserted rather than configuration verified. Anchors cost nothing, and
#     they give that wiring one obvious home instead of letting it scatter
#     through per-job workflow environment variables -- which is precisely the
#     defect D7 describes.
#
# Adding this file therefore changes NOTHING observable: not codegen, not the
# emitted compressed bytes, not the exported symbol set, not dependency
# resolution, not the panic strategy, not a single test outcome. It contains
# zero active configuration keys. Keep it that way until a real consumer
# lands.
#
